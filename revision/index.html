→ Plus de **double saisie**, information **fiabilisée** et disponible en temps réel pour tous les services.`}]},{h:"Le travail collaboratif",blocks:[{t:"p",c:"Le **travail collaboratif** consiste à travailler **ensemble** sur un même objectif grâce à des **outils numériques** partagés : messagerie, **agendas partagés**, **cloud** (documents en ligne), visioconférence, outils de gestion de projet."},{t:"list",c:["on travaille à **plusieurs sur un même document**, en même temps ;","l’information est **centralisée** et accessible partout, à distance ;","la **coordination** est plus rapide (notifications, historique des versions)."]},{t:"p",c:"Ces outils permettent aussi le **télétravail** et le travail entre équipes éloignées géographiquement."}]},{h:"L’intelligence collective",blocks:[{t:"p",c:"L’**intelligence collective** est la capacité d’un groupe à produire, en **partageant** idées et connaissances, un résultat **supérieur à la somme des contributions individuelles**. Le numérique la démultiplie."},{t:"p",c:"Elle repose sur le **partage des connaissances**, la **coopération** et des outils qui gardent la **mémoire** collective (wikis, forums internes, réseaux sociaux d’entreprise)."},{t:"example",h:"Intelligence collective en action",c:`Sur un forum interne, un technicien pose une question ; trois collègues de sites différents répondent, un quatrième complète. 
→ La solution, meilleure que ce que chacun aurait trouvé seul, reste **archivée** et profite à toute l’entreprise plus tard.`}]},{h:"La sécurité du système d’information",blocks:[{t:"p",c:"Concentrer l’information crée des **risques** : panne, piratage, virus, vol ou perte de données, erreur humaine. Protéger le SI, c’est garantir **trois exigences** (le triptyque **DIC**) :"},{t:"table",head:["Exigence","Signification"],rows:[["**Disponibilité**","L’information est accessible **quand on en a besoin**"],["**Intégrité**","L’information est **exacte** et non modifiée par erreur ou malveillance"],["**Confidentialité**","Seules les **personnes autorisées** y ont accès"]]},{t:"p",c:"Moyens de protection : **mots de passe** et droits d’accès, **antivirus** et pare-feu, **sauvegardes** régulières, **chiffrement**, sensibilisation des salariés."}]},{h:"Données personnelles, RGPD et éthique",blocks:[{t:"p",c:"Une **donnée personnelle** est toute information permettant d’identifier une personne (nom, e-mail, adresse IP, photo…). Leur usage est strictement encadré."},{t:"p",c:"Le **RGPD** (Règlement Général sur la Protection des Données, 2018) impose notamment : le **consentement** de la personne, le droit d’**accès**, de **rectification** et à l’**oubli**, la **minimisation** (ne collecter que le nécessaire). En France, la **CNIL** veille à son respect et peut sanctionner."},{t:"warning",c:"Chaque personne laisse une **identité numérique** (traces, publications) qui la suit durablement. Enjeux **éthiques** : respect de la **vie privée**, lutte contre la **surveillance** abusive et contre les usages discriminatoires des données."}]}],essentiel:["**Donnée** (brute) → **information** (mise en sens) → **connaissance** (mobilisable pour agir).","Une information utile est de **qualité** : fiable, pertinente, disponible à temps ; c’est une **ressource** stratégique (big data).","Le **SI** (matériels + logiciels + données + procédures + **personnes**) **collecte, stocke, traite, diffuse** l’information ; il s’appuie sur des **bases de données**.","Le **PGI (ERP)** = logiciel unique à **base de données unique** : une seule saisie, information cohérente (mais coûteux, rigide).","**Travail collaboratif** et **intelligence collective** : produire mieux ensemble grâce aux outils partagés (cloud, agendas, réseaux).","Sécurité = **Disponibilité, Intégrité, Confidentialité** (DIC) ; **données personnelles** protégées par le **RGPD** (CNIL, consentement, droit à l’oubli)."],resources:[{kind:"video",label:"Donnée, information, connaissance",note:"Vidéos — recherche YouTube",url:T("donnée information connaissance système information PGI première STMG")}],games:[{id:"p1-sgn-t2-qcm",type:"qcm",title:"QCM — Numérique et données",icon:"❓",questions:[{q:"Un élément brut, isolé et sans interprétation est…",choices:["une donnée","une information","une connaissance","une décision"],answer:0,explain:"La donnée est brute ; mise en contexte, elle devient information."},{q:"Le PGI (ERP) repose sur…",choices:["une base de données unique partagée","plusieurs logiciels indépendants","des fichiers papier","un tableur isolé"],answer:0,explain:"La base unique évite les doubles saisies et fiabilise l’information."},{q:"Produire ensemble mieux que la somme des individus isolés, c’est…",choices:["l’intelligence collective","la double saisie","la coutume","l’oligopole"],answer:0,explain:"L’intelligence collective naît du partage via les outils collaboratifs."},{q:"Protéger la vie privée et les données personnelles renvoie notamment au…",choices:["RGPD","PIB","SWOT","CDI"],answer:0,explain:"Le RGPD encadre la protection des données personnelles."}]},{id:"p1-sgn-t2-ordre",type:"ordre",title:"Remise en ordre — De la donnée à la décision",icon:"🔢",instruction:"Remets la transformation de l’information dans l’ordre.",steps:["Donnée (brute)","Information (mise en contexte)","Connaissance (mobilisable)","Décision"],explain:"La donnée devient information, puis connaissance, pour éclairer la décision."},{id:"p1-sgn-t2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Une information est une donnée mise en contexte.",answer:!0,explain:"Vrai : elle a du sens, contrairement à la donnée brute."},{statement:"Le PGI oblige à saisir plusieurs fois la même information.",answer:!1,explain:"Faux : la base unique évite justement les doubles saisies."},{statement:"La confidentialité est un enjeu de sécurité du SI.",answer:!0,explain:"Vrai : avec la disponibilité et l’intégrité."}]},{id:"p1-sgn-t2-tri",type:"tri",title:"Tri — Donnée, information ou connaissance ?",icon:"🗂️",instruction:"Classe chaque élément.",categories:[{id:"d",label:"Donnée"},{id:"i",label:"Information"},{id:"c",label:"Connaissance"}],items:[{text:"« 35 »",cat:"d"},{text:"« Le projet X a nécessité 35 heures »",cat:"i"},{text:"« Nos projets de ce type prennent ~35 h, facturons en conséquence »",cat:"c"},{text:"Une température : « 8 »",cat:"d"},{text:"« Il fait 8 °C ce matin à l’entrepôt »",cat:"i"}]},{id:"p1-sgn-t2-assoc",type:"association",title:"Association — Notion ↔ définition",icon:"🔗",pairs:[{left:"Système d’information",right:"Collecte, stocke, traite et diffuse l’information"},{left:"Base de données",right:"Données structurées, saisies une seule fois"},{left:"PGI / ERP",right:"Logiciel unique à base de données unique"},{left:"RGPD",right:"Protège les données personnelles"},{left:"Intelligence collective",right:"Produire mieux ensemble en partageant"}]},{id:"p1-sgn-t2-trou",type:"trou",title:"Texte à trous — Sécurité & données",icon:"✏️",questions:[{text:"La sécurité du SI protège la disponibilité, l’intégrité et la ____.",answer:"confidentialité",explain:"Le triptyque DIC : Disponibilité, Intégrité, Confidentialité."},{text:"Le ____ encadre l’usage des données personnelles depuis 2018.",answer:"RGPD",explain:"Règlement Général sur la Protection des Données ; la CNIL veille à son respect."},{text:"Le PGI repose sur une base de données ____.",answer:"unique",explain:"Une base unique évite les doubles saisies et fiabilise l’information."}]},{id:"p1-sgn-t2-flash",type:"flashcard",title:"Flashcards — Numérique",icon:"🃏",cards:[{front:"Système d’information (SI)",back:"Collecte, stocke, traite et diffuse l’information ; structure l’organisation."},{front:"PGI / ERP",back:"Logiciel unique à base de données unique."},{front:"Intelligence collective",back:"Produire mieux ensemble grâce au partage et aux outils collaboratifs."},{front:"RGPD",back:"Cadre de protection des données personnelles."}]}]},{id:"p1-sgn-t3",name:"Thème 3 — Création de valeur et performance",short:"Valeur & performance",keywords:"valeur marchande perçue partenariale prix coût marge charges efficacité efficience indicateurs tableau de bord",intro:"Toute organisation cherche à **créer de la valeur** et à mesurer sa **performance**, c’est-à-dire à vérifier qu’elle atteint bien ses objectifs.",cours:[{h:"Qu’est-ce que la valeur ?",blocks:[{t:"p",c:"Toute organisation existe pour **créer de la valeur** : produire quelque chose d’**utile** pour lequel quelqu’un est prêt à payer ou qui rend un service. Mais « la valeur » n’a pas un seul sens — elle se regarde sous plusieurs angles."},{t:"p",c:"On distingue notamment la valeur **du point de vue du marché** (le prix), **du point de vue du client** (ce qu’il ressent) et **du point de vue de tous les acteurs** (la valeur partagée). Les trois se complètent."}]},{h:"La valeur marchande et le prix",blocks:[{t:"p",c:"La **valeur marchande** est le **prix** qu’un client accepte de payer pour un bien ou un service. Sur un marché, ce prix résulte de la rencontre entre l’**offre** et la **demande**."},{t:"p",c:"Le prix envoie un signal : trop élevé, il fait fuir les clients ; trop bas, il réduit la marge et peut faire douter de la qualité. Le fixer est un **arbitrage** stratégique."}]},{h:"La valeur perçue par le client",blocks:[{t:"p",c:"La **valeur perçue** est la valeur que le client **croit** obtenir : elle dépend de l’**image**, de la **marque**, de la **qualité ressentie**, du service, de l’expérience d’achat. Elle est **subjective** et peut être très supérieure au coût réel."},{t:"example",h:"La force de la valeur perçue",c:`Deux tee-shirts de qualité identique : l’un sans marque à 8 €, l’autre floqué d’un logo réputé à 45 €. 
→ La différence de prix ne vient pas du coût de production mais de la **valeur perçue** (image, statut). Travailler cette valeur perçue permet de vendre plus cher.`}]},{h:"La valeur ajoutée",blocks:[{t:"p",c:"La **valeur ajoutée** mesure la **richesse réellement créée** par l’organisation : c’est la différence entre ce qu’elle produit et ce qu’elle a dû acheter à d’autres pour le produire (les consommations intermédiaires)."},{t:"formula",c:"Valeur ajoutée = production − consommations intermédiaires"},{t:"p",c:"Cette valeur ajoutée est ensuite **répartie** entre ceux qui ont contribué : salariés (salaires), État (impôts), banques (intérêts), propriétaires (bénéfices), et l’entreprise elle-même (autofinancement)."}]},{h:"La valeur partenariale et les parties prenantes",blocks:[{t:"p",c:"La **valeur partenariale** est la valeur créée puis **partagée** entre toutes les **parties prenantes** de l’organisation, et pas seulement les propriétaires."},{t:"p",c:"Une **partie prenante** est tout acteur concerné par l’activité de l’organisation :"},{t:"table",head:["Parties prenantes internes","Parties prenantes externes"],rows:[["Salariés, dirigeants, actionnaires","Clients, fournisseurs, banques"],["","État, collectivités, associations, riverains"]]},{t:"p",c:"Chaque partie prenante attend sa part : salaire, dividende, impôt, produit de qualité… Créer de la valeur **partenariale**, c’est chercher à satisfaire durablement cet ensemble d’acteurs."}]},{h:"Coût, prix et marge",blocks:[{t:"p",c:"Le **coût** est ce que l’organisation **dépense** pour produire (l’ensemble des **charges** : matières, salaires, énergie…). Le **prix** est ce que **paie le client**, largement fixé par le marché."},{t:"formula",c:"Marge = prix de vente − coût"},{t:"example",h:"L’arbitrage prix / marge",c:`Un site vitrine vendu 900 € qui coûte 560 € dégage une marge de **340 €**. 
→ Baisser le prix à 750 € pour être plus compétitif réduit la marge à **190 €**. 
C’est un **arbitrage** permanent entre compétitivité (attirer le client) et rentabilité (gagner de l’argent).`}]},{h:"La performance : efficacité et efficience",blocks:[{t:"p",c:"La **performance**, c’est atteindre ses **objectifs**. Mais bien piloter suppose de distinguer deux notions souvent confondues :"},{t:"table",head:["Efficacité","Efficience"],rows:[["**Atteindre l’objectif** fixé","Atteindre l’objectif **au moindre coût** (moins de moyens)"],["« Ai-je réussi ? »","« À quel prix / avec quels moyens ai-je réussi ? »"]]},{t:"p",c:"Une organisation **performante** est à la fois **efficace** ET **efficiente** : elle atteint ses buts en utilisant au mieux ses ressources."},{t:"warning",c:"On peut être **efficace sans être efficient** : livrer à temps (efficace) mais en gaspillant énormément de moyens (peu efficient). La vraie performance combine les deux."}]},{h:"Mesurer la performance : indicateurs et tableau de bord",blocks:[{t:"p",c:"Pour piloter, on utilise des **indicateurs** : des mesures chiffrées (**quantitatifs** : CA, part de marché) ou d’appréciation (**qualitatifs** : satisfaction). On compare le **réalisé** à l’**objectif**."},{t:"p",c:"Ces indicateurs sont réunis dans un **tableau de bord** : un outil de **pilotage** synthétique qui permet, d’un coup d’œil, de voir si l’organisation va dans la bonne direction et de **réagir** vite."},{t:"tip",c:"Un bon indicateur est **utile** (lié à un objectif), **fiable** et **disponible à temps**. Trop d’indicateurs noient l’information : mieux vaut quelques indicateurs bien choisis."}]},{h:"Les dimensions de la performance (dont la RSE)",blocks:[{t:"p",c:"La performance n’est pas que financière : elle est **globale** et se mesure sur plusieurs dimensions."},{t:"table",head:["Dimension","Exemples d’indicateurs"],rows:[["Commerciale","Clients, part de marché, satisfaction, fidélité"],["Financière","Résultat, marge, chiffre d’affaires, rentabilité"],["Sociale","Satisfaction des salariés, turnover, formation, climat"],["Environnementale","Énergie, déchets, empreinte carbone"]]},{t:"p",c:"Prendre en compte les dimensions **sociale** et **environnementale** relève de la **RSE** (Responsabilité Sociétale des Entreprises) : l’organisation intègre volontairement des préoccupations sociales et écologiques, au-delà du seul profit. C’est un axe de **valeur partenariale** durable."}]}],essentiel:["La **valeur** se regarde sous plusieurs angles : **marchande** (prix payé), **perçue** (crue par le client : image, marque), **ajoutée** (richesse créée), **partenariale** (partagée entre parties prenantes).","**Valeur ajoutée = production − consommations intermédiaires** ; elle est répartie entre salariés, État, banques, propriétaires.","**Parties prenantes** : internes (salariés, actionnaires) et externes (clients, fournisseurs, État…).","**Marge = prix de vente − coût** ; le prix est largement fixé par le marché (arbitrage compétitivité / rentabilité).","**Efficacité** (atteindre l’objectif) vs **efficience** (au moindre coût) : la performance combine les deux.","On pilote avec des **indicateurs** (quantitatifs / qualitatifs) réunis dans un **tableau de bord** ; performance **globale** : commerciale, financière, **sociale**, **environnementale** (**RSE**)."],resources:[{kind:"video",label:"Création de valeur et performance",note:"Vidéos — recherche YouTube",url:T("création de valeur performance efficacité efficience première STMG")}],games:[{id:"p1-sgn-t3-qcm",type:"qcm",title:"QCM — Valeur et performance",icon:"❓",questions:[{q:"La valeur partagée entre toutes les parties prenantes est la valeur…",choices:["partenariale","marchande","perçue","boursière"],answer:0,explain:"La valeur partenariale est redistribuée aux salariés, actionnaires, État…"},{q:"Un produit vendu 50 € qui coûte 30 € dégage une marge de…",choices:["20 €","30 €","50 €","80 €"],answer:0,explain:"Marge = prix − coût = 50 − 30 = 20 €."},{q:"Atteindre son objectif au moindre coût, c’est être…",choices:["efficient","efficace seulement","partenarial","marchand"],answer:0,explain:"Efficience = objectif atteint au moindre coût ; efficacité = objectif atteint."},{q:"Le turnover est un indicateur de performance…",choices:["sociale","commerciale","financière","environnementale"],answer:0,explain:"Il mesure la performance sociale (climat, fidélisation)."},{q:"L’outil qui réunit les indicateurs pour piloter est…",choices:["le tableau de bord","le RGPD","le PIB","la coutume"],answer:0,explain:"Le tableau de bord permet de suivre l’organisation d’un coup d’œil."}]},{id:"p1-sgn-t3-tri",type:"tri",title:"Tri — Dimension de la performance",icon:"🗂️",instruction:"Classe chaque indicateur.",categories:[{id:"com",label:"Commerciale"},{id:"fin",label:"Financière"},{id:"soc",label:"Sociale"}],items:[{text:"Part de marché",cat:"com"},{text:"Chiffre d’affaires",cat:"fin"},{text:"Turnover",cat:"soc"},{text:"Satisfaction client",cat:"com"},{text:"Marge",cat:"fin"},{text:"Nombre de formations suivies",cat:"soc"}]},{id:"p1-sgn-t3-flash",type:"flashcard",title:"Flashcards — Valeur & performance",icon:"🃏",cards:[{front:"Valeur perçue",back:"Valeur que le client croit obtenir (image, qualité ressentie)."},{front:"Marge",back:"Prix de vente − coût."},{front:"Efficacité / efficience",back:"Atteindre l’objectif / l’atteindre au moindre coût."},{front:"Tableau de bord",back:"Outil de pilotage réunissant les indicateurs."}]}]},{id:"p1-sgn-t4",name:"Thème 4 — Temps et risque",short:"Temps & risque",keywords:"temps ressource contrainte délais cycles échéances risque financier commercial humain numérique anticiper",intro:"Gérer, c’est agir dans un monde incertain. Deux contraintes s’imposent toujours : le **temps** et le **risque**. Les ignorer, c’est s’exposer à l’échec.",cours:[{h:"Le temps, ressource et contrainte",blocks:[{t:"p",c:"Gérer, c’est agir **dans le temps**. Le temps a une double nature :"},{t:"table",head:["Le temps comme RESSOURCE","Le temps comme CONTRAINTE"],rows:[["On peut l’**organiser** et le **planifier**","Les **délais** s’imposent à nous"],["« De combien de temps je dispose ? »","« La commande doit partir vendredi »"]]},{t:"p",c:"Le temps intervient partout : **délais** de réaction et de livraison, **cycles** (production, vie d’un produit), **échéances** (paiement, déclaration). Bien le gérer, c’est un **avantage concurrentiel** (livrer plus vite, réagir avant les autres)."}]},{h:"Les horizons de décision : court, moyen, long terme",blocks:[{t:"p",c:"Une décision ne se raisonne pas sur la même durée selon son importance. On distingue trois **horizons** :"},{t:"table",head:["Horizon","Durée","Exemple de décision"],rows:[["Court terme","Jours à un an","Gérer les stocks, planifier la semaine"],["Moyen terme","De 1 à ~3 ans","Recruter, lancer un produit"],["Long terme","Plusieurs années","Ouvrir une usine, changer de stratégie"]]},{t:"p",c:"Plus l’horizon est **lointain**, plus l’avenir est **incertain** — donc plus la décision comporte de **risque**. C’est le lien entre les deux notions du thème."}]},{h:"Planifier et organiser le temps",blocks:[{t:"p",c:"La **planification** consiste à **prévoir** les actions dans le temps : quoi faire, quand, avec quels moyens. Elle évite l’improvisation et les retards."},{t:"p",c:"Des outils aident à visualiser le temps : le **planning**, le **rétroplanning** (partir de la date finale et remonter), le **diagramme de Gantt** (les tâches sur une frise), les **agendas partagés**."},{t:"tip",c:"Anticiper, c’est planifier les commandes pour ne **jamais être en rupture**, et étaler les paiements pour préserver la **trésorerie**. « Un bon gestionnaire ne subit pas le temps, il l’organise. »"}]},{h:"Les cycles et le cycle de vie",blocks:[{t:"p",c:"Beaucoup de phénomènes se répètent dans le temps : ce sont des **cycles**. En gestion, on suit notamment le **cycle d’exploitation** (acheter → produire → vendre → encaisser) et le **cycle de vie d’un produit**."},{t:"table",head:["Phase du cycle de vie","Enjeu"],rows:[["Lancement","Faire connaître, investir"],["Croissance","Augmenter les ventes, la capacité"],["Maturité","Défendre sa position, optimiser"],["Déclin","Retirer ou relancer le produit"]]},{t:"p",c:"Connaître la phase permet d’**anticiper** : préparer un nouveau produit **avant** que l’actuel ne décline."}]},{h:"Qu’est-ce qu’un risque ?",blocks:[{t:"p",c:"Un **risque** est un **événement incertain aux conséquences négatives possibles**. Il combine une **probabilité** (chances qu’il survienne) et un **impact** (gravité s’il survient)."},{t:"p",c:"Le risque naît de l’**incertitude** : comme on décide pour l’avenir, on ne connaît jamais toutes les conséquences. **Gérer, c’est nécessairement prendre des risques** — ne rien risquer, c’est aussi renoncer à toute opportunité."},{t:"warning",c:"Ne confonds pas **risque** et **incertitude subie** : le risque peut être **identifié, évalué et géré**. Le nier ne le fait pas disparaître ; l’anticiper permet de le maîtriser."}]},{h:"Les types de risques",blocks:[{t:"p",c:"Une organisation est exposée à de nombreux risques, qu’on classe par nature :"},{t:"table",head:["Type de risque","Exemples"],rows:[["Financier","Client qui ne paie pas (impayé), manque de trésorerie"],["Commercial","Produit qui ne se vend pas, perte d’un gros client"],["Humain / social","Accident du travail, départ d’un salarié clé, conflit, grève"],["Numérique","Perte de données, cyberattaque, panne informatique"],["Environnemental / juridique","Pollution, procès, changement de réglementation"]]}]},{h:"Risque et opportunité",blocks:[{t:"p",c:"Le risque n’a pas qu’une face négative. Toute prise de risque maîtrisée est aussi une **opportunité** : lancer un nouveau produit, c’est risqué, mais c’est aussi la chance de **gagner un marché**."},{t:"p",c:"La question n’est donc pas « faut-il prendre des risques ? » (il le faut) mais « **quels risques**, pour **quelle espérance de gain**, et **suis-je prêt à les assumer** ? ». C’est l’arbitrage **risque / rendement**."},{t:"example",h:"Prendre un risque calculé",c:`Une entreprise hésite à ouvrir une boutique en ligne : investissement, risque d’échec. 
→ Mais ne rien faire est aussi un risque (être dépassé par les concurrents). 
Elle décide d’un **test à petite échelle** : elle prend un **risque calculé** pour saisir une **opportunité** de croissance.`}]},{h:"Anticiper et prévenir les risques",blocks:[{t:"p",c:"On ne **supprime** jamais totalement un risque, mais on peut le **réduire** en agissant **avant** qu’il ne survienne. La démarche : **identifier** les risques → les **évaluer** (probabilité × impact) → décider comment les **traiter**."},{t:"list",c:["**Prévenir / réduire** : sauvegardes informatiques, contrôles qualité, sécurité au travail ;","**Éviter** : renoncer à une activité trop dangereuse ;","**Réduire l’exposition** : demander un **acompte**, **diversifier** ses clients et fournisseurs."]}]},{h:"Transférer et couvrir le risque",blocks:[{t:"p",c:"Certains risques ne peuvent qu’être **transférés** ou **couverts** financièrement :"},{t:"list",c:["**l’assurance** : contre un accident, un incendie, un impayé (assurance-crédit) ;","**la diversification** : ne pas dépendre d’un seul client, produit ou marché ;","**la constitution de réserves** (trésorerie de précaution) pour absorber un coup dur."]},{t:"tip",c:"À retenir : la bonne gestion du risque, c’est **prévoir** l’imprévisible autant que possible et **préparer des réponses à l’avance** — comme on installe un détecteur de fumée avant l’incendie, pas après."}]}],essentiel:["Le **temps** est une **ressource** (à planifier) et une **contrainte** (délais, cycles, échéances) ; il s’organise (planning, rétroplanning, Gantt).","Trois **horizons** de décision : **court, moyen, long terme** ; plus c’est lointain, plus c’est **incertain** (donc risqué).","Le **cycle de vie** d’un produit (lancement, croissance, maturité, déclin) s’anticipe.","Un **risque** = événement **incertain** aux conséquences négatives (probabilité × impact) : financier, commercial, humain, numérique, juridique.","Le risque est aussi une **opportunité** : arbitrage **risque / rendement**.","On **anticipe** : prévention, **acompte**, **diversification**, **sauvegardes**, **assurances**, planification."],resources:[{kind:"video",label:"Temps et risque en gestion",note:"Vidéos — recherche YouTube",url:T("sciences de gestion temps et risque première STMG")}],games:[{id:"p1-sgn-t4-qcm",type:"qcm",title:"QCM — Temps et risque",icon:"❓",questions:[{q:"Le risque d’un client qui ne paie pas est un risque…",choices:["financier","humain","numérique","commercial"],answer:0,explain:"Un impayé/manque de trésorerie est un risque financier."},{q:"Une cyberattaque relève du risque…",choices:["numérique","financier","commercial","humain"],answer:0,explain:"Perte de données, panne, cyberattaque = risque numérique."},{q:"Pour limiter le risque d’impayé, on peut…",choices:["demander un acompte","ignorer le client","supprimer les factures","baisser la qualité"],answer:0,explain:"L’acompte réduit le risque financier ; on peut aussi suivre les règlements."},{q:"Dépendre d’un seul gros client est un risque…",choices:["commercial","numérique","humain","nul"],answer:0,explain:"La perte de ce client menacerait l’activité : risque commercial, réduit par la diversification."}]},{id:"p1-sgn-t4-tri",type:"tri",title:"Tri — Type de risque",icon:"🗂️",instruction:"Classe chaque risque.",categories:[{id:"fin",label:"Financier"},{id:"com",label:"Commercial"},{id:"num",label:"Numérique"}],items:[{text:"Un client insolvable",cat:"fin"},{text:"Une panne informatique",cat:"num"},{text:"La perte d’un gros client",cat:"com"},{text:"Un manque de trésorerie",cat:"fin"},{text:"Une fuite de données",cat:"num"}]},{id:"p1-sgn-t4-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"On peut supprimer totalement le risque d’une décision.",answer:!1,explain:"Faux : on peut le réduire, pas le supprimer."},{statement:"Le temps est à la fois une ressource et une contrainte.",answer:!0,explain:"Vrai : on l’organise mais les délais s’imposent."},{statement:"Diversifier ses clients réduit un risque commercial.",answer:!0,explain:"Vrai : on ne dépend plus d’un seul client."}]},{id:"p1-sgn-t4-flash",type:"flashcard",title:"Flashcards — Temps & risque",icon:"🃏",cards:[{front:"Risque",back:"Événement incertain aux conséquences négatives possibles."},{front:"Types de risques",back:"Financier, commercial, humain, numérique."},{front:"Anticiper",back:"Acompte, diversification, sauvegardes, assurances, planification."},{front:"Échéance",back:"Date imposée (livraison, paiement)."}]}]}]},Nh={id:"p1-management",name:"Management",short:"Management",icon:"🏢",color:"#4f46e5",niveau:"premiere",tagline:"Conduire une organisation : diagnostiquer, décider, piloter.",chapters:[{id:"p1-mgmt-t1",name:"Thème 1 — À la rencontre du management des organisations",short:"Management & organisations",keywords:"organisation groupe individus ressources structure hiérarchie statut juridique but commun pérennité management performance stratégique opérationnel entreprise privée organisation publique société civile finalité lucrative intérêt général non lucrative parties prenantes RSE",intro:"Une **organisation** naît du besoin de **structurer une action collective**. Le **management** est l’art de la **conduire** pour qu’elle atteigne ses buts et **dure**. On découvre aussi les grandes **formes** d’organisations et leurs **finalités**.",cours:[{h:"Qu’est-ce qu’une organisation ?",blocks:[{t:"p",c:"Une organisation est un **groupe d’individus** qui met en commun et **pilote des ressources**, autour d’un **but commun**, et qui est **voué à durer** dans le temps. On la reconnaît à plusieurs caractéristiques :"},{t:"list",c:["un **but commun** (le projet collectif qui réunit les membres),","des **ressources pilotées** (humaines, matérielles, financières, immatérielles),","une **structure hiérarchisée** (répartition des rôles, des pouvoirs et des responsabilités),","un **statut juridique** (entreprise, association, administration…),","la volonté de **durer** dans le temps (la **pérennité**)."]},{t:"tip",c:"À retenir : une organisation, ce sont des **individus** qui **coordonnent des ressources** vers un **but commun**, dans une **structure** dotée d’un **statut juridique**."}]},{h:"Qu’est-ce que le management ?",blocks:[{t:"p",c:"Le management est la **conduite de l’action collective** dans un environnement en perpétuel changement (numérique, écologie, attentes sociales). Manager, c’est **fixer des objectifs**, **organiser les ressources**, **animer les équipes** et **contrôler les résultats**, pour assurer :"},{t:"list",c:["la **performance** : atteindre les objectifs fixés (efficacité + efficience) ;","la **pérennité** : permettre à l’organisation de durer."]}]},{h:"Deux niveaux de management",blocks:[{t:"table",head:["Management stratégique","Management opérationnel"],rows:[["Long terme","Court terme"],["Direction générale","Encadrement intermédiaire"],["Ouvrir une filiale, lancer une activité","Organiser les plannings, gérer un stock"]]},{t:"tip",c:"Les deux sont complémentaires : la **stratégie fixe le cap**, l’**opérationnel le met en pratique**."}]},{h:"Les différentes formes d’organisations",blocks:[{t:"p",c:"Les organisations se distinguent surtout par leur **finalité** (leur raison d’être). On en distingue **trois grandes formes** :"},{t:"table",head:["Type","Finalité","Exemples"],rows:[["Entreprise privée","Lucrative (profit) + dimension sociétale (RSE)","Boulangerie, start-up, multinationale"],["Organisation publique","Intérêt général (service public, non marchand)","Mairie, hôpital, lycée, police"],["Organisation de la société civile","Non lucrative (objet social)","Association, ONG, syndicat, mutuelle"]]},{t:"p",c:"Les **entreprises privées** cherchent le **profit** tout en intégrant des enjeux sociaux et environnementaux (**RSE**). Les **organisations publiques** rendent un **service public** financé par l’**impôt**. Les **organisations de la société civile** poursuivent un **objet social** sans but de profit ; leur enjeu est de **pérenniser leurs ressources** (bénévoles, cotisations, subventions, dons)."},{t:"list",c:["**Parties prenantes** : tous ceux qui ont un intérêt dans l’organisation (salariés, clients, actionnaires, État, fournisseurs, riverains…).","**Champ d’action** : local, national ou international ; **marchand** ou **non marchand**.","La **performance** se mesure selon la **finalité** : un profit pour l’entreprise, un service rendu pour l’organisation publique."]}]}],essentiel:["Une **organisation** = des **individus** + des **ressources pilotées** + une **structure hiérarchisée** + un **statut juridique** + un **but commun**, **vouée à durer**.","Le **management** conduit l’action collective pour assurer **performance** et **pérennité**.","Management **stratégique** (long terme, direction) vs **opérationnel** (court terme, encadrement).","Trois formes : **entreprise privée** (lucrative + RSE), **organisation publique** (intérêt général), **société civile** (non lucrative)."],resources:[{kind:"video",label:"À la rencontre du management des organisations",note:"Vidéos — recherche YouTube",url:T("à la rencontre du management des organisations première STMG")},{kind:"video",label:"Types et finalités des organisations",note:"Vidéos — recherche YouTube",url:T("finalités organisations entreprise publique association première STMG management")}],games:[{id:"p1-mgmt-t1-qcm",type:"qcm",title:"QCM — Management et organisations",icon:"❓",questions:[{q:"Une organisation se définit comme…",choices:["un groupe d’individus pilotant des ressources vers un but commun, voué à durer","un logo, un slogan et une couleur","un impôt, une TVA et une marge","un juge, une loi et une preuve"],answer:0,explain:"Des individus coordonnent des ressources, dans une structure dotée d’un statut juridique, vers un but commun et dans la durée."},{q:"Le management vise deux grands objectifs :",choices:["la performance et la pérennité","le profit et l’impôt","la publicité et la vente","le risque et le temps"],answer:0,explain:"Atteindre les objectifs (performance) et durer (pérennité)."},{q:"Ouvrir une filiale à l’étranger est une décision de management…",choices:["stratégique","opérationnel","quotidien","comptable"],answer:0,explain:"Décision de long terme prise par la direction générale."},{q:"La finalité d’une organisation publique est…",choices:["l’intérêt général (service public)","le profit","la spéculation","la publicité"],answer:0,explain:"Les organisations publiques rendent un service public, financé par l’impôt."},{q:"Une association relève des organisations…",choices:["de la société civile (non lucratives)","privées lucratives","publiques","multinationales"],answer:0,explain:"Associations, ONG, syndicats, mutuelles = société civile, non lucratives."},{q:"Salariés, clients, actionnaires et État sont des…",choices:["parties prenantes","concurrents","indicateurs","ressources matérielles"],answer:0,explain:"Ce sont les parties prenantes de l’organisation."}]},{id:"p1-mgmt-t1-tri",type:"tri",title:"Tri — Type d’organisation",icon:"🗂️",instruction:"Classe chaque organisation selon sa forme.",categories:[{id:"priv",label:"Entreprise privée"},{id:"pub",label:"Organisation publique"},{id:"civ",label:"Société civile"}],items:[{text:"Une start-up",cat:"priv"},{text:"Un hôpital public",cat:"pub"},{text:"Une ONG humanitaire",cat:"civ"},{text:"Une multinationale",cat:"priv"},{text:"Un syndicat",cat:"civ"},{text:"Une mairie",cat:"pub"}]},{id:"p1-mgmt-t1-tri2",type:"tri",title:"Tri — Stratégique ou opérationnel ?",icon:"🎯",instruction:"Classe chaque décision.",categories:[{id:"str",label:"Stratégique"},{id:"ope",label:"Opérationnel"}],items:[{text:"Racheter un concurrent",cat:"str"},{text:"Gérer un stock cette semaine",cat:"ope"},{text:"Lancer une nouvelle activité",cat:"str"},{text:"Résoudre un problème client",cat:"ope"},{text:"S’implanter à l’international",cat:"str"}]},{id:"p1-mgmt-t1-flash",type:"flashcard",title:"Flashcards — Management & organisations",icon:"🃏",cards:[{front:"Organisation",back:"Groupe d’individus pilotant des ressources vers un but commun, structuré, doté d’un statut juridique, voué à durer."},{front:"Management",back:"Conduire l’action collective (performance + pérennité)."},{front:"Stratégique / opérationnel",back:"Long terme (direction) / court terme (encadrement)."},{front:"Entreprise privée",back:"Finalité lucrative (profit) + dimension sociétale (RSE)."},{front:"Organisation publique",back:"Finalité d’intérêt général (service public)."},{front:"Société civile",back:"Non lucrative (association, ONG, syndicat, mutuelle)."}]}]},{id:"p1-mgmt-t2",name:"Thème 2 — Le management stratégique, du diagnostic à la fixation des objectifs",short:"Diagnostic stratégique",keywords:"stratégie diagnostic externe interne PESTEL macro-environnement micro-environnement opportunités menaces ressources compétences distinctives forces faiblesses SWOT finalité objectifs stratégiques",intro:"Pour atteindre ses finalités, une organisation met en place une **stratégie**. Avant de décider, elle réalise un **diagnostic stratégique** : se connaître (interne) et connaître son environnement (externe). Ce diagnostic débouche sur la **fixation des objectifs**.",cours:[{h:"La démarche stratégique",blocks:[{t:"p",c:"La démarche stratégique enchaîne plusieurs étapes : (1) **diagnostic stratégique** (interne + externe), (2) **fixation des objectifs** en cohérence avec les **finalités**, (3) **mise en œuvre**, (4) **contrôle** des résultats et **ajustement**. C’est un processus permanent."}]},{h:"Le diagnostic externe : l’environnement de l’organisation",blocks:[{t:"p",c:"Le **macro-environnement** regroupe les grandes forces générales qui s’imposent à **toutes** les organisations et sur lesquelles une entreprise seule **n’a pas de prise**. On l’analyse avec la méthode **PESTEL** :"},{t:"figure",name:"pestel"},{t:"list",c:["**P** olitique · **E** conomique · **S** ocioculturel · **T** echnologique · **E** cologique · **L** égal."]},{t:"p",c:"Le **micro-environnement** regroupe les **acteurs proches** en relation directe avec l’organisation : les **concurrents** actuels, les **clients**, les **fournisseurs**, les **nouveaux entrants** potentiels et les **produits de substitution**. Le diagnostic externe fait ressortir des **opportunités** (favorables) et des **menaces** (défavorables)."}]},{h:"Le diagnostic interne",blocks:[{t:"p",c:"Le **diagnostic interne** analyse ce que l’organisation possède et sait faire :"},{t:"list",c:["ses **ressources** : financières, humaines, matérielles et immatérielles (marque, savoir-faire, brevets…) ;","ses **compétences distinctives** : ce qu’elle sait faire **mieux** que ses concurrents."]},{t:"p",c:"Il révèle les **forces** (atouts) et les **faiblesses** (points faibles) de l’organisation."}]},{h:"La synthèse : la matrice SWOT",blocks:[{t:"p",c:"On réunit les résultats des deux diagnostics dans une matrice **SWOT** : **Forces / Faiblesses** (issues du diagnostic **interne**) et **Opportunités / Menaces** (issues du diagnostic **externe**)."},{t:"figure",name:"swot"}]},{h:"Des finalités aux objectifs stratégiques",blocks:[{t:"p",c:"Le diagnostic permet de fixer des **objectifs stratégiques** cohérents avec la **finalité** de l’organisation (ex. conquérir un nouveau marché, améliorer un service public, développer l’action d’une association). Ces objectifs guideront ensuite les **choix stratégiques** (thème 3)."},{t:"tip",c:"Un bon objectif s’appuie sur les **forces** de l’organisation pour saisir une **opportunité**, ou pour réduire une **faiblesse** face à une **menace**."}]}],essentiel:["Démarche : **diagnostic → objectifs → mise en œuvre → contrôle** (ajustement permanent).","Diagnostic **externe** : **PESTEL** (macro) + acteurs du **micro-environnement** → **opportunités / menaces**.","Diagnostic **interne** : **ressources** + **compétences distinctives** → **forces / faiblesses**.","Synthèse = **SWOT** ; le diagnostic débouche sur les **objectifs stratégiques** liés à la **finalité**."],resources:[{kind:"video",label:"Le diagnostic stratégique : PESTEL et SWOT",note:"Vidéos — recherche YouTube",url:T("diagnostic stratégique PESTEL SWOT interne externe première STMG")}],games:[{id:"p1-mgmt-t2-qcm",type:"qcm",title:"QCM — Diagnostic stratégique",icon:"❓",questions:[{q:"La méthode PESTEL analyse…",choices:["le macro-environnement","les ressources internes","la comptabilité","les salariés"],answer:0,explain:"PESTEL = Politique, Économique, Socioculturel, Technologique, Écologique, Légal (macro-environnement)."},{q:"Le « L » de PESTEL correspond à la dimension…",choices:["Légale","Logistique","Locale","Libérale"],answer:0,explain:"L = Légal (lois, réglementations, RGPD)."},{q:"Une compétence distinctive est ce que l’organisation sait faire…",choices:["mieux que ses concurrents","comme tout le monde","sans ressources","à perte"],answer:0,explain:"C’est une force du diagnostic interne, source d’avantage concurrentiel."},{q:"Les forces et les faiblesses relèvent du diagnostic…",choices:["interne","externe","macro-économique","légal"],answer:0,explain:"Interne = forces/faiblesses ; externe = opportunités/menaces."},{q:"Une nouvelle réglementation favorable est, pour l’organisation, une…",choices:["opportunité","faiblesse","ressource","compétence"],answer:0,explain:"C’est un élément externe favorable : une opportunité."},{q:"La matrice SWOT réunit…",choices:["forces/faiblesses (interne) et opportunités/menaces (externe)","seulement les forces","les seules données comptables","les concurrents uniquement"],answer:0,explain:"SWOT = synthèse du diagnostic interne et externe."}]},{id:"p1-mgmt-t2-tri",type:"tri",title:"Tri — Diagnostic interne ou externe ?",icon:"🗂️",instruction:"Classe chaque élément du diagnostic.",categories:[{id:"int",label:"Interne (forces/faiblesses)"},{id:"ext",label:"Externe (opportunités/menaces)"}],items:[{text:"Un savoir-faire unique",cat:"int"},{text:"Une nouvelle réglementation",cat:"ext"},{text:"Une trésorerie fragile",cat:"int"},{text:"Un marché en croissance",cat:"ext"},{text:"L’arrivée d’un concurrent",cat:"ext"},{text:"Une équipe très compétente",cat:"int"}]},{id:"p1-mgmt-t2-ordre",type:"ordre",title:"Remise en ordre — La démarche stratégique",icon:"🔢",instruction:"Remets les étapes dans l’ordre.",steps:["Diagnostic stratégique (interne + externe)","Fixation des objectifs","Mise en œuvre","Contrôle et ajustement"],explain:"On diagnostique, on fixe des objectifs, on met en œuvre, puis on contrôle et on ajuste."},{id:"p1-mgmt-t2-flash",type:"flashcard",title:"Flashcards — Diagnostic",icon:"🃏",cards:[{front:"PESTEL",back:"Diagnostic du macro-environnement (P, E, S, T, E, L)."},{front:"Micro-environnement",back:"Acteurs proches : concurrents, clients, fournisseurs, entrants, substituts."},{front:"Diagnostic interne",back:"Ressources + compétences distinctives → forces/faiblesses."},{front:"SWOT",back:"Forces/Faiblesses (interne) + Opportunités/Menaces (externe)."},{front:"Compétence distinctive",back:"Ce que l’organisation sait faire mieux que les concurrents."}]}]},{id:"p1-mgmt-t3",name:"Thème 3 — Les choix stratégiques des organisations",short:"Choix stratégiques",keywords:"avantage concurrentiel stratégie domination par les coûts différenciation spécialisation diversification intégration externalisation sous-traitance DAS domaine d’activité stratégique organisation publique société civile",intro:"Une fois le diagnostic posé et les objectifs fixés, l’organisation doit faire des **choix stratégiques** pour se donner un **avantage concurrentiel** durable. Ces choix diffèrent selon la **finalité** de l’organisation.",cours:[{h:"Rechercher un avantage concurrentiel",blocks:[{t:"p",c:"L’objectif d’une stratégie est d’obtenir un **avantage concurrentiel** : un atout qui permet à l’organisation de se distinguer **durablement** de ses concurrents et d’être préférée par les clients. Il repose souvent sur une **compétence distinctive** identifiée lors du diagnostic interne."}]},{h:"Les stratégies de domaine : coûts ou différenciation",blocks:[{t:"p",c:"Pour un domaine d’activité donné, l’organisation choisit **comment** affronter la concurrence :"},{t:"table",head:["Domination par les coûts","Différenciation"],rows:[["Prix plus bas que les concurrents","Offre perçue comme unique"],["Économies d’échelle, productivité","Qualité, image, innovation, service"],["Ex. enseigne discount","Ex. marque de luxe / haut de gamme"]]},{t:"warning",c:"On choisit son terrain : il est difficile d’être à la fois **le moins cher** et **le plus différencié**."}]},{h:"Les stratégies globales : spécialisation ou diversification",blocks:[{t:"p",c:"À l’échelle de toute l’organisation, deux grandes orientations :"},{t:"list",c:["**Spécialisation** : se concentrer sur **un seul métier / marché** pour y devenir performant.","**Diversification** : se développer sur **de nouveaux métiers ou marchés** pour répartir les risques et saisir des opportunités."]},{t:"p",c:"Un **DAS** (Domaine d’Activité Stratégique) est un sous-ensemble homogène d’activités pour lequel on peut définir une stratégie propre."}]},{h:"Faire seul ou avec d’autres : intégration ou externalisation",blocks:[{t:"list",c:["**Intégration** : réaliser soi-même une activité (la « faire »), pour la maîtriser.","**Externalisation** : confier une activité à un partenaire extérieur (la « faire faire », ex. **sous-traitance**), pour se recentrer sur son cœur de métier."]}]},{h:"Les choix des organisations publiques et de la société civile",blocks:[{t:"p",c:"Les **organisations publiques** et de la **société civile** font elles aussi des choix stratégiques, mais tournés vers leur **finalité** (intérêt général, objet social) : développer de **nouveaux services**, **mutualiser** des moyens, nouer des **partenariats**, moderniser leur fonctionnement. La logique n’est pas le profit mais le **service rendu**."}]}],essentiel:["But d’une stratégie : obtenir un **avantage concurrentiel** durable.","Stratégies de domaine : **domination par les coûts** OU **différenciation**.","Stratégies globales : **spécialisation** OU **diversification** (+ notion de **DAS**).","Modalités : **intégration** (faire) vs **externalisation** (faire faire, sous-traitance).","Les organisations publiques et de la société civile choisissent selon leur **finalité** (service rendu)."],resources:[{kind:"video",label:"Les choix stratégiques : coûts, différenciation, diversification",note:"Vidéos — recherche YouTube",url:T("choix stratégiques domination coûts différenciation spécialisation diversification première STMG")}],games:[{id:"p1-mgmt-t3-qcm",type:"qcm",title:"QCM — Choix stratégiques",icon:"❓",questions:[{q:"Un avantage concurrentiel est un atout qui permet…",choices:["de se distinguer durablement des concurrents","de payer moins d’impôts","d’éviter tout contrat","de fixer la loi"],answer:0,explain:"Il rend l’organisation préférable aux yeux des clients, dans la durée."},{q:"Proposer une offre unique justifiant un prix élevé, c’est une stratégie de…",choices:["différenciation","domination par les coûts","diversification","externalisation"],answer:0,explain:"Différenciation : qualité, image, innovation, service."},{q:"Vendre moins cher que les concurrents grâce à des économies d’échelle, c’est…",choices:["la domination par les coûts","la différenciation","la spécialisation","l’intégration"],answer:0,explain:"On mise sur la productivité et les volumes pour baisser les prix."},{q:"Se développer sur de nouveaux métiers ou marchés, c’est une stratégie de…",choices:["diversification","spécialisation","domination par les coûts","externalisation"],answer:0,explain:"Diversification : on répartit les risques sur plusieurs activités."},{q:"Confier une activité à un partenaire extérieur (sous-traitance), c’est…",choices:["l’externalisation","l’intégration","la spécialisation","la différenciation"],answer:0,explain:"Externaliser = « faire faire » pour se recentrer sur son cœur de métier."},{q:"Un DAS (Domaine d’Activité Stratégique) est…",choices:["un sous-ensemble homogène d’activités avec une stratégie propre","un impôt sur les sociétés","un service public","un type de contrat"],answer:0,explain:"On peut définir une stratégie spécifique pour chaque DAS."}]},{id:"p1-mgmt-t3-tri",type:"tri",title:"Tri — Coûts ou différenciation ?",icon:"🗂️",instruction:"Classe chaque situation selon la stratégie de domaine.",categories:[{id:"cout",label:"Domination par les coûts"},{id:"diff",label:"Différenciation"}],items:[{text:"Une enseigne discount aux prix cassés",cat:"cout"},{text:"Une marque de luxe haut de gamme",cat:"diff"},{text:"Produire en très grande quantité pour baisser le coût unitaire",cat:"cout"},{text:"Un produit innovant à l’image forte",cat:"diff"},{text:"Un service client très personnalisé",cat:"diff"}]},{id:"p1-mgmt-t3-flash",type:"flashcard",title:"Flashcards — Choix stratégiques",icon:"🃏",cards:[{front:"Avantage concurrentiel",back:"Atout qui permet de se distinguer durablement des concurrents."},{front:"Domination par les coûts",back:"Prix plus bas grâce aux économies d’échelle et à la productivité."},{front:"Différenciation",back:"Offre unique (qualité, image, innovation) justifiant un prix plus élevé."},{front:"Spécialisation / diversification",back:"Un seul métier / plusieurs métiers et marchés."},{front:"Intégration / externalisation",back:"Faire soi-même / faire faire (sous-traitance)."}]}]}]},Th={id:"p1-droit",name:"Droit",short:"Droit",icon:"⚖️",color:"#d97706",niveau:"premiere",tagline:"Les fondamentaux : la règle, le litige, les personnes, les droits.",chapters:[{id:"p1-droit-t1",name:"Thème 1 — Qu’est-ce que le droit ?",short:"Qu’est-ce que le droit ?",keywords:"droit fonctions État de droit laïcité ordre public règle de droit générale impersonnelle obligatoire coercitive contrainte sanction étatique règle morale religieuse sources hiérarchie des normes Constitution traités UE lois règlements jurisprudence coutume Cour de cassation Conseil constitutionnel QPC contrôle de constitutionnalité droit privé public",intro:"Le droit, ce sont les **règles qui organisent la vie en société** et que l’État fait respecter. Sans droit, ce serait la loi du plus fort. On découvre ses **fonctions**, les **caractères** de la règle et les **sources** qui la produisent.",cours:[{h:"Les fonctions du droit et l’État de droit",blocks:[{t:"p",c:"Le droit est l’ensemble des **règles générales et obligatoires** qui régissent les rapports entre les personnes, dont le respect est **garanti par la puissance publique** (l’État). Ses **fonctions** :"},{t:"list",c:["**organiser** la société et l’activité économique,","**pacifier** et **sécuriser** les relations (éviter la loi du plus fort),","**protéger** les personnes et leurs droits,","**arbitrer** les conflits et **sanctionner** les manquements."]},{t:"p",c:"Dans un **État de droit**, la puissance publique elle-même est **soumise au droit** : personne n’est au-dessus de la loi. Deux principes structurants s’y rattachent :"},{t:"list",c:["la **laïcité** : l’État est neutre en matière religieuse et garantit la liberté de conscience ;","l’**ordre public** : l’ensemble des règles essentielles (sécurité, salubrité, tranquillité, dignité) auxquelles on ne peut pas déroger par contrat."]}]},{h:"Les caractères de la règle de droit",blocks:[{t:"p",c:"Une règle de droit est **générale** (elle s’applique à tous), **impersonnelle** (elle ne vise personne nommément), **obligatoire** et **coercitive** (assortie de la **contrainte / sanction de l’État** en cas de non-respect)."},{t:"warning",c:"C’est ce caractère **coercitif** (la **contrainte étatique**) qui la distingue d’une **règle morale** (qui relève de la conscience) ou **religieuse** (qui relève de la croyance) : celles-ci ne sont pas sanctionnées par l’État."}]},{h:"Les sources du droit et la hiérarchie des normes",blocks:[{t:"p",c:"Les règles proviennent de plusieurs **sources**, hiérarchisées : une norme inférieure doit **respecter** les normes supérieures."},{t:"table",head:["Niveau","Source"],rows:[["1","Bloc de constitutionnalité (la Constitution, la DDHC…)"],["2","Traités internationaux et droit de l’Union européenne"],["3","La loi (votée par le Parlement)"],["4","Les règlements (décrets, arrêtés)"]]},{t:"p",c:"Le **droit de l’Union européenne** occupe une place importante : ses **règlements** et **directives** s’imposent aux États membres. S’ajoutent des sources **non écrites** : la **jurisprudence** (décisions des tribunaux qui interprètent la règle) et la **coutume** (usages anciens et acceptés)."},{t:"p",c:"Le respect de la hiérarchie est contrôlé : le **Conseil constitutionnel** vérifie qu’une loi est conforme à la Constitution. Depuis 2010, tout justiciable peut soulever une **QPC** (Question Prioritaire de Constitutionnalité) pour contester une loi déjà en vigueur. Au sommet de l’ordre judiciaire, la **Cour de cassation** unifie l’interprétation du droit."},{t:"example",h:"Un maire face à la hiérarchie des normes",c:`Un maire prend un **arrêté** (un règlement) interdisant totalement de manifester dans sa commune. Un habitant le conteste. 
→ L’arrêté est une **norme inférieure** : il doit respecter la **loi** et la **Constitution**, qui garantissent la liberté de manifester. Une interdiction générale et absolue est donc **illégale** : le juge administratif peut l’annuler. La **hiérarchie des normes** protège ainsi les libertés.`}]},{h:"Droit privé et droit public",blocks:[{t:"p",c:"Grande distinction : le **droit privé** régit les rapports entre **particuliers** (droit civil, commercial, du travail) ; le **droit public** régit l’**État** et ses rapports avec les citoyens (droit constitutionnel, administratif)."}]}],essentiel:["Fonctions du droit : **organiser, pacifier, protéger, sanctionner** ; dans l’**État de droit**, l’État est soumis au droit (+ **laïcité**, **ordre public**).","Règle de droit = **générale, impersonnelle, obligatoire, coercitive** (contrainte / sanction de l’État) (≠ règle morale/religieuse).","Sources : **Constitution > traités/UE > lois > règlements** (+ jurisprudence, coutume) ; contrôle par le **Conseil constitutionnel** et la **QPC**.","**Droit privé** (particuliers) vs **droit public** (État)."],resources:[{kind:"video",label:"Qu’est-ce que le droit ? Fonctions et sources",note:"Vidéos — recherche YouTube",url:T("qu est ce que le droit fonctions règle sources hiérarchie des normes première STMG")},{kind:"video",label:"État de droit, hiérarchie des normes, QPC",note:"Vidéos — recherche YouTube",url:T("État de droit hiérarchie des normes QPC Conseil constitutionnel première STMG")}],games:[{id:"p1-droit-t1-qcm",type:"qcm",title:"QCM — La règle de droit",icon:"❓",questions:[{q:"La règle de droit est générale, impersonnelle, obligatoire et…",choices:["coercitive","facultative","religieuse","secrète"],answer:0,explain:"Coercitive : elle est assortie de la contrainte / sanction de l’État en cas de non-respect. C’est le 4ᵉ caractère."},{q:"Ce qui distingue une règle de droit d’une règle morale, c’est…",choices:["son caractère coercitif (la sanction de l’État)","sa longueur","son ancienneté","sa langue"],answer:0,explain:"La règle morale relève de la conscience : elle n’est pas assortie de la contrainte étatique."},{q:"Dans un État de droit…",choices:["l’État lui-même est soumis au droit","l’État est au-dessus des lois","seuls les citoyens obéissent au droit","le droit n’existe pas"],answer:0,explain:"Personne n’est au-dessus de la loi, pas même la puissance publique."},{q:"La neutralité de l’État en matière religieuse s’appelle…",choices:["la laïcité","l’ordre public","la jurisprudence","la coutume"],answer:0,explain:"La laïcité garantit la liberté de conscience et la neutralité de l’État."},{q:"Au sommet de la hiérarchie des normes :",choices:["la Constitution","un arrêté municipal","un contrat","un règlement intérieur"],answer:0,explain:"La Constitution (bloc de constitutionnalité) prime sur toutes les autres normes."},{q:"La QPC permet à un justiciable de…",choices:["contester une loi qu’il juge contraire à la Constitution","écrire une nouvelle loi","juger un crime","signer un contrat"],answer:0,explain:"La Question Prioritaire de Constitutionnalité conduit au Conseil constitutionnel."},{q:"L’ensemble des décisions des tribunaux qui interprètent la règle s’appelle…",choices:["la jurisprudence","la coutume","la doctrine","la loi"],answer:0,explain:"La jurisprudence précise et interprète la règle de droit."},{q:"Le droit du travail relève du droit…",choices:["privé","public","constitutionnel","international"],answer:0,explain:"Le droit privé régit les rapports entre particuliers (dont employeur/salarié)."}]},{id:"p1-droit-t1-ordre",type:"ordre",title:"Remise en ordre — Hiérarchie des normes",icon:"🔢",instruction:"Classe les sources **écrites** de la plus élevée à la plus basse.",steps:["Constitution","Traités et droit de l’UE","Lois","Règlements (décrets, arrêtés)"],explain:"Constitution > traités/UE > lois > règlements. La **jurisprudence** et la **coutume** sont aussi des sources du droit, mais **non écrites** : elles n’apparaissent pas dans cette hiérarchie des normes écrites (d’où leur absence ici), ce qui n’enlève rien à leur valeur de source."},{id:"p1-droit-t1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Une règle de droit vise une personne en particulier.",answer:!1,explain:"Faux : elle est générale et impersonnelle."},{statement:"Dans un État de droit, l’État est soumis au droit.",answer:!0,explain:"Vrai : nul n’est au-dessus de la loi."},{statement:"La jurisprudence est une source du droit.",answer:!0,explain:"Vrai : les décisions des tribunaux interprètent la règle. C’est une source **non écrite** (comme la coutume) : elle ne figure pas dans la hiérarchie des normes écrites, mais reste bien une source du droit."},{statement:"Une loi peut être contraire à la Constitution.",answer:!1,explain:"Faux : elle doit respecter la norme supérieure (contrôle du Conseil constitutionnel)."}]},{id:"p1-droit-t1-flash",type:"flashcard",title:"Flashcards — La règle de droit",icon:"🃏",cards:[{front:"Fonctions du droit",back:"Organiser, pacifier/sécuriser, protéger, arbitrer et sanctionner."},{front:"État de droit",back:"La puissance publique est elle-même soumise au droit."},{front:"Laïcité / ordre public",back:"Neutralité religieuse de l’État / règles essentielles auxquelles on ne peut déroger."},{front:"Caractères de la règle de droit",back:"Générale, impersonnelle, obligatoire, coercitive (contrainte / sanction de l’État)."},{front:"Hiérarchie des normes",back:"Constitution > traités/UE > lois > règlements."},{front:"QPC",back:"Question Prioritaire de Constitutionnalité : contester une loi en vigueur."}]}]},{id:"p1-droit-t2",name:"Thème 2 — Comment le droit permet-il de régler un litige ?",short:"Le litige",keywords:"litige demandeur défendeur prétentions acte juridique fait juridique preuve charge de la preuve objet preuve parfaite imparfaite acte authentique acte sous signature privée aveu serment témoignage présomption preuve électronique organisation judiciaire ordre judiciaire administratif juridictions civiles pénales procès civil pénal instance assignation audience délibéré jugement arrêt mise en examen partie civile premier degré appel pourvoi cassation accord amiable CJUE CEDH",intro:"Quand un désaccord dégénère, il devient un **litige**. Le droit offre des moyens de le résoudre : d’abord en **prouvant** son droit, puis, si besoin, en **saisissant le juge** — dont les décisions peuvent faire l’objet de **voies de recours**.",cours:[{h:"Le litige et les parties",blocks:[{t:"p",c:"Un **litige** est un **désaccord juridique** entre deux parties aux **prétentions** opposées. Devant le juge, celui qui saisit la justice pour réclamer un droit est le **demandeur** ; celui contre qui l’action est dirigée est le **défendeur**."},{t:"p",c:"À l’origine des droits et obligations, on distingue :"},{t:"table",head:["Acte juridique","Fait juridique"],rows:[["Volonté de produire des effets de droit","Événement qui produit des effets de droit sans les avoir voulus"],["Ex. un contrat, un testament","Ex. un accident, un dommage, une naissance"]]}]},{h:"La preuve : charge, objet et modes",blocks:[{t:"p",c:"Pour faire valoir un droit, il faut le **prouver**. La **charge de la preuve** pèse sur le **demandeur** : c’est à celui qui réclame l’exécution d’une obligation d’en apporter la preuve. La preuve doit porter sur l’**objet** du litige et être obtenue **loyalement**."},{t:"p",c:"On classe les modes de preuve en deux catégories selon leur **force probante** :"},{t:"table",head:["Preuves parfaites","Preuves imparfaites"],rows:[["Valeur fixée par la loi : elles s’imposent au juge, qui doit les admettre","Laissées à la libre appréciation du juge (intime conviction)"],["Acte authentique, acte sous signature privée, aveu judiciaire, serment","Témoignage, indice, présomption"]]},{t:"warning",c:"Attention : une preuve parfaite n’est pas « n’importe quel écrit ». C’est un mode de preuve dont la **valeur est déterminée par la loi**. L’**acte authentique** est reçu par un **officier public** (ex. un notaire) ; l’**acte sous signature privée** est un écrit **signé par les parties**. La **preuve électronique** est admise si l’on peut identifier son auteur et en garantir l’intégrité."},{t:"tip",c:"D’où l’importance de conserver des **écrits** (contrats, reçus, factures), surtout pour les engagements importants."}]},{h:"Le recours au juge : l’organisation judiciaire",blocks:[{t:"p",c:"La justice est organisée en **deux ordres** :"},{t:"list",c:["**Ordre judiciaire** : litiges entre particuliers (**juridictions civiles**) et infractions (**juridictions pénales**).","**Ordre administratif** : litiges impliquant l’**administration**."]},{t:"p",c:"Il faut distinguer le **procès civil** (il oppose des particuliers et vise à **réparer** : dommages et intérêts) du **procès pénal** (il vise à **sanctionner** une infraction au nom de la société)."}]},{h:"Le déroulement d’une instance",blocks:[{t:"p",c:"Une fois le tribunal saisi, l’affaire suit une **instance** (la procédure en cours). En matière civile, le procès débute souvent par une **assignation** : l’acte par lequel le demandeur informe le défendeur qu’un procès est engagé et le convoque devant le juge. L’affaire est examinée lors d’une **audience** (où les parties, souvent par leurs avocats, présentent leurs arguments), puis les juges se retirent en **délibéré** pour rendre leur décision."},{t:"p",c:"La décision s’appelle un **jugement** (rendu par un tribunal) ou un **arrêt** (rendu par une cour d’appel ou la Cour de cassation). En matière pénale, une personne soupçonnée peut être **mise en examen** lorsqu’il existe contre elle des indices graves ou concordants ; la victime peut se constituer **partie civile** pour demander, au cours du procès pénal, la réparation de son préjudice."},{t:"example",h:"Un litige de voisinage",c:"Léa (la **demanderesse**) reproche à son voisin (le **défendeur**) un dégât des eaux. Elle le fait **assigner** devant le tribunal judiciaire : l’**instance** est ouverte. Lors de l’**audience**, chacun présente ses **preuves**. Après le **délibéré**, le tribunal rend un **jugement** condamnant le voisin à l’indemniser. Mécontent, celui-ci fait **appel** : la cour d’appel rejugera l’affaire et rendra un **arrêt**."}]},{h:"Les voies de recours et l’accord amiable",blocks:[{t:"p",c:"Une décision de justice peut être contestée par les **voies de recours** :"},{t:"list",c:["**premier degré** : le tribunal juge l’affaire (les faits et le droit) ;","**appel** : une **cour d’appel** rejuge entièrement l’affaire (faits + droit) ;","**pourvoi en cassation** : la **Cour de cassation** vérifie seulement la **bonne application du droit**, sans rejuger les faits."]},{t:"p",c:"Un litige peut aussi se terminer par un **accord amiable** entre les parties, sans aller jusqu’au jugement. Enfin, deux **juridictions européennes** peuvent intervenir : la **CJUE** (Cour de justice de l’Union européenne, respect du droit de l’UE) et la **CEDH** (Cour européenne des droits de l’homme, respect des libertés fondamentales)."}]}],essentiel:["**Litige** = désaccord aux prétentions opposées ; **demandeur** (qui réclame) vs **défendeur**.","**Acte juridique** (volonté, ex. contrat) vs **fait juridique** (événement non voulu, ex. accident).","**Charge de la preuve** sur le **demandeur** ; **preuves parfaites** (valeur fixée par la loi : acte authentique, acte sous signature privée, aveu, serment) vs **imparfaites** (témoignage, indice, présomption).","Deux ordres (**judiciaire** civil/pénal, **administratif**) ; voies de recours : **1er degré → appel → pourvoi en cassation** (+ CJUE, CEDH)."],resources:[{kind:"video",label:"Le litige et la preuve",note:"Vidéos — recherche YouTube",url:T("litige charge de la preuve preuve parfaite imparfaite première STMG droit")},{kind:"video",label:"Organisation judiciaire et voies de recours",note:"Vidéos — recherche YouTube",url:T("organisation judiciaire ordre judiciaire administratif appel cassation première STMG")}],games:[{id:"p1-droit-t2-qcm",type:"qcm",title:"QCM — Le litige",icon:"❓",questions:[{q:"La charge de la preuve pèse en principe sur…",choices:["le demandeur","le juge","le témoin","le défendeur"],answer:0,explain:"C’est au demandeur, celui qui réclame l’exécution d’une obligation, de prouver."},{q:"Un contrat, conclu volontairement pour produire des effets de droit, est un…",choices:["acte juridique","fait juridique","témoignage","pourvoi"],answer:0,explain:"Acte juridique = manifestation de volonté ; le fait juridique (ex. accident) n’est pas voulu."},{q:"Une preuve parfaite se définit par le fait que…",choices:["sa valeur est fixée par la loi et s’impose au juge","c’est n’importe quel écrit","c’est un simple témoignage","le juge peut l’ignorer"],answer:0,explain:"Acte authentique, acte sous signature privée, aveu, serment : le juge doit les admettre."},{q:"Un témoignage ou un indice est une preuve…",choices:["imparfaite (libre appréciation du juge)","parfaite","interdite","authentique"],answer:0,explain:"Les preuves imparfaites sont appréciées librement par le juge (intime conviction)."},{q:"Un litige avec l’administration relève de l’ordre…",choices:["administratif","judiciaire","pénal","européen"],answer:0,explain:"L’ordre administratif juge les litiges impliquant l’administration."},{q:"La Cour de cassation…",choices:["vérifie la bonne application du droit (sans rejuger les faits)","rejuge entièrement l’affaire","écrit les lois","gère l’administration"],answer:0,explain:"Elle contrôle le droit ; l’appel, lui, rejuge les faits."},{q:"Le procès pénal vise à…",choices:["sanctionner une infraction au nom de la société","réparer un dommage entre particuliers","signer un contrat","écrire une loi"],answer:0,explain:"Le procès civil répare ; le procès pénal sanctionne."}]},{id:"p1-droit-t2-tri",type:"tri",title:"Tri — Preuve parfaite ou imparfaite ?",icon:"🗂️",instruction:"Classe chaque mode de preuve.",categories:[{id:"parf",label:"Preuve parfaite"},{id:"imp",label:"Preuve imparfaite"}],items:[{text:"Un acte notarié (acte authentique)",cat:"parf"},{text:"Un contrat écrit signé par les parties",cat:"parf"},{text:"Le témoignage d’un voisin",cat:"imp"},{text:"Un aveu fait devant le juge",cat:"parf"},{text:"Un simple indice",cat:"imp"}]},{id:"p1-droit-t2-flash",type:"flashcard",title:"Flashcards — Le litige",icon:"🃏",cards:[{front:"Demandeur / défendeur",back:"Celui qui réclame en justice / celui contre qui l’action est dirigée."},{front:"Acte / fait juridique",back:"Manifestation de volonté (contrat) / événement non voulu (accident)."},{front:"Charge de la preuve",back:"Elle pèse sur le demandeur."},{front:"Preuve parfaite",back:"Valeur fixée par la loi (acte authentique, acte sous signature privée, aveu, serment) : s’impose au juge."},{front:"Preuve imparfaite",back:"Témoignage, indice, présomption : libre appréciation du juge."},{front:"Déroulement (civil)",back:"Assignation → instance → audience → délibéré → jugement (ou arrêt en appel)."},{front:"Mise en examen / partie civile",back:"Indices graves contre une personne (pénal) / victime qui demande réparation au procès pénal."},{front:"Voies de recours",back:"1er degré → appel (rejuge) → pourvoi en cassation (droit seulement)."}]}]},{id:"p1-droit-t3",name:"Thème 3 — Qui peut faire valoir ses droits ?",short:"Les personnes",keywords:"personnalité juridique personne physique morale nom domicile statut de l’animal capacité jouissance exercice incapacité mineur majeur protégé tutelle curatelle sauvegarde de justice représentation acte de disposition administration patrimoine actif passif unicité universalité indivisibilité incessibilité patrimoine d’affectation droits patrimoniaux extrapatrimoniaux",intro:"Pour avoir des droits, il faut être un **sujet de droit**, c’est-à-dire disposer de la **personnalité juridique**. On étudie qui la possède, dans quelle mesure on peut agir seul (la **capacité**), et ce qu’est le **patrimoine**.",cours:[{h:"La personnalité juridique",blocks:[{t:"p",c:"C’est l’**aptitude à être titulaire de droits et d’obligations**. Elle est reconnue à deux catégories :"},{t:"table",head:["Personne physique","Personne morale"],rows:[["Un être humain","Un groupement (société, association déclarée, État)"],["De la naissance à la mort","Créée par l’immatriculation / la déclaration"],["Identifiée par un nom et un domicile","Identifiée par une dénomination et un siège"]]},{t:"p",c:"Toute personne est identifiée par des **éléments d’état civil** : notamment un **nom** et un **domicile** (le lieu de son principal établissement). Une personne morale a un **patrimoine distinct** de celui de ses membres et peut agir en justice."},{t:"tip",c:"Le **statut de l’animal** : depuis 2015, la loi reconnaît l’animal comme un **être vivant doué de sensibilité** ; il reste toutefois soumis, pour l’essentiel, au **régime des biens**."}]},{h:"La capacité juridique",blocks:[{t:"p",c:"On distingue la **capacité de jouissance** (avoir des droits) et la **capacité d’exercice** (pouvoir les exercer soi-même). Certaines personnes sont **incapables** et doivent être **représentées** ou **assistées** :"},{t:"list",c:["les **mineurs** non émancipés (représentés par leurs parents, titulaires de l’autorité parentale) ;","les **majeurs protégés**, selon la gravité : **sauvegarde de justice** (protection légère et temporaire), **curatelle** (le majeur est **assisté**), **tutelle** (le majeur est **représenté**)."]},{t:"p",c:"On distingue aussi les **actes d’administration** (gestion courante, ex. encaisser un loyer) des **actes de disposition** (qui engagent le patrimoine, ex. vendre un bien), pour lesquels la protection est plus forte."},{t:"example",h:"Le scooter de Tom, 16 ans",c:`Tom, **mineur**, achète seul un scooter d’occasion à 1 500 €. 
→ Tom a la **capacité de jouissance** (il peut être propriétaire) mais pas la pleine **capacité d’exercice** : cet **acte de disposition** dépasse la gestion courante d’un mineur. Ses **parents** (ses représentants) peuvent demander l’**annulation** de la vente. En revanche, acheter une place de cinéma (acte de la vie courante) resterait valable.`}]},{h:"Le patrimoine",blocks:[{t:"p",c:"Le **patrimoine** est l’ensemble des **droits et obligations** d’une personne **évaluables en argent** : un **actif** (les biens) et un **passif** (les dettes). Il obéit à des **principes** :"},{t:"list",c:["**unicité** : toute personne a un patrimoine et un seul ;","**universalité** : l’actif répond du passif (les biens garantissent les dettes) ;","**indivisibilité** : le patrimoine forme un tout ;","**incessibilité** : on ne peut céder son patrimoine de son vivant (il se transmet à la mort)."]},{t:"p",c:"Par exception, la loi admet un **patrimoine d’affectation** : une personne peut isoler certains biens pour une activité (ex. l’entrepreneur individuel), afin de **protéger son patrimoine personnel**. Enfin, on distingue les droits **patrimoniaux** des droits **extrapatrimoniaux** :"},{t:"table",head:["Droits patrimoniaux","Droits extrapatrimoniaux"],rows:[["Valeur monétaire, cessibles, saisissables","Hors commerce, attachés à la personne, non cessibles"],["Ex. droit de propriété, créances","Ex. vie privée, image, nom"]]}]}],essentiel:["**Personnalité juridique** = aptitude à être titulaire de droits et d’obligations ; **personne physique** (naissance→mort, nom, domicile) vs **personne morale** (patrimoine propre).","Animal = **être vivant doué de sensibilité**, mais soumis au régime des biens.","**Capacité de jouissance** vs **d’exercice** ; incapables : mineurs, majeurs protégés (**sauvegarde / curatelle / tutelle**).","**Patrimoine** = actif + passif ; principes **unicité, universalité, indivisibilité, incessibilité** (+ **patrimoine d’affectation**)."],resources:[{kind:"video",label:"La personnalité juridique et la capacité",note:"Vidéos — recherche YouTube",url:T("personnalité juridique personne physique morale capacité mineur majeur protégé première STMG")},{kind:"video",label:"Le patrimoine et ses principes",note:"Vidéos — recherche YouTube",url:T("patrimoine actif passif unicité patrimoine d’affectation première STMG droit")}],games:[{id:"p1-droit-t3-qcm",type:"qcm",title:"QCM — Les personnes",icon:"❓",questions:[{q:"La personnalité juridique est l’aptitude à…",choices:["être titulaire de droits et d’obligations","voter une loi","juger un litige","produire des biens"],answer:0,explain:"Elle fait de l’être un sujet de droit."},{q:"Une association déclarée est une personne…",choices:["morale","physique","publique par nature","sans patrimoine"],answer:0,explain:"Elle a un patrimoine propre, distinct de celui de ses membres."},{q:"Un majeur placé sous tutelle est…",choices:["représenté par son tuteur","totalement libre de tout acte","privé de personnalité juridique","un mineur"],answer:0,explain:"La tutelle représente le majeur ; la curatelle, elle, l’assiste."},{q:"Vendre un bien important est un acte…",choices:["de disposition","d’administration","de jouissance","de procédure"],answer:0,explain:"Les actes de disposition engagent le patrimoine ; les actes d’administration sont la gestion courante."},{q:"Depuis 2015, l’animal est reconnu comme…",choices:["un être vivant doué de sensibilité","une personne morale","une personne physique","un majeur protégé"],answer:0,explain:"Il reste néanmoins soumis pour l’essentiel au régime des biens."},{q:"Le principe selon lequel chaque personne n’a qu’un seul patrimoine est…",choices:["l’unicité","l’universalité","l’indivisibilité","l’incessibilité"],answer:0,explain:"Unicité = un seul patrimoine par personne (sauf patrimoine d’affectation)."},{q:"Le patrimoine comprend…",choices:["les droits et obligations évaluables en argent (actif et passif)","seulement les revenus","les opinions","la nationalité"],answer:0,explain:"Actif (biens) + passif (dettes), évaluables en argent."}]},{id:"p1-droit-t3-tri",type:"tri",title:"Tri — Patrimonial ou extrapatrimonial ?",icon:"🗂️",instruction:"Classe chaque droit.",categories:[{id:"pat",label:"Patrimonial"},{id:"ext",label:"Extrapatrimonial"}],items:[{text:"Le droit de propriété",cat:"pat"},{text:"Le droit à la vie privée",cat:"ext"},{text:"Une créance (somme due)",cat:"pat"},{text:"Le droit à l’image",cat:"ext"},{text:"Le droit au nom",cat:"ext"}]},{id:"p1-droit-t3-flash",type:"flashcard",title:"Flashcards — Les personnes",icon:"🃏",cards:[{front:"Personnalité juridique",back:"Aptitude à être titulaire de droits et d’obligations."},{front:"Personne morale",back:"Groupement au patrimoine propre distinct de ses membres."},{front:"Capacité de jouissance / d’exercice",back:"Avoir des droits / pouvoir les exercer soi-même."},{front:"Majeurs protégés",back:"Sauvegarde de justice, curatelle (assistance), tutelle (représentation)."},{front:"Patrimoine (principes)",back:"Unicité, universalité, indivisibilité, incessibilité (+ patrimoine d’affectation)."}]}]},{id:"p1-droit-t4",name:"Thème 4 — Quels sont les droits reconnus aux personnes ?",short:"Les droits des personnes",keywords:"droit de propriété usus fructus abusus caractères absolu exclusif perpétuel bien corporel incorporel trouble anormal du voisinage propriété intellectuelle industrielle marque brevet monopole d’exploitation action en contrefaçon droit d’auteur droit moral patrimonial droits de la personnalité vie privée image dignité protection des données RGPD CNIL inaliénable insaisissable imprescriptible",intro:"Les personnes disposent de **droits**. On étudie ici le **droit de propriété** (y compris la **propriété intellectuelle**) et les **droits de la personnalité**, essentiels à l’ère numérique (**données personnelles**).",cours:[{h:"Le droit de propriété",blocks:[{t:"p",c:"Le droit de propriété est le droit le plus complet sur un **bien** (qui peut être **corporel** — une maison, une voiture — ou **incorporel** — une créance, une marque). Il comporte **trois attributs** :"},{t:"list",c:["**Usus** : le droit d’**utiliser** le bien.","**Fructus** : le droit d’en **percevoir les revenus** (ex. un loyer).","**Abusus** : le droit d’en **disposer** (vendre, détruire)."]},{t:"p",c:"On lui reconnaît trois **caractères** : **absolu** (le plus large possible), **exclusif** (le propriétaire est seul à en jouir) et **perpétuel** (il dure tant que le bien existe)."},{t:"warning",c:"Ces caractères connaissent des **limites** : respect de l’**intérêt général** (expropriation, urbanisme) et du voisinage. Ainsi, un **trouble anormal du voisinage** (bruit, nuisances excessives) engage la responsabilité de son auteur."}]},{h:"La propriété intellectuelle",blocks:[{t:"p",c:"Les **créations de l’esprit** sont protégées. On distingue deux ensembles :"},{t:"table",head:["Propriété industrielle","Droit d’auteur"],rows:[["Protège les créations utiles à l’activité économique","Protège les œuvres de l’esprit (livre, musique, logiciel)"],["Marque (signe distinctif), brevet (invention)","Naît sans formalité, dès la création"],["Confère un monopole d’exploitation","Droit moral (perpétuel) + droits patrimoniaux (limités dans le temps)"]]},{t:"p",c:"La **marque** et le **brevet** confèrent à leur titulaire un **monopole d’exploitation**. Toute atteinte (copie, reproduction sans autorisation) constitue une **contrefaçon**, sanctionnée par une **action en contrefaçon**. Le **droit d’auteur** comprend un **droit moral** (respect du nom et de l’œuvre, inaliénable et perpétuel) et des **droits patrimoniaux** (exploiter l’œuvre et en tirer des revenus)."},{t:"example",h:"Le faux sac de marque",c:`Une boutique vend des sacs imitant le **logo** et le **nom** d’une grande marque. 
→ La marque est protégée par un **monopole d’exploitation** : reproduire son signe distinctif sans autorisation est une **contrefaçon**. Le titulaire peut engager une **action en contrefaçon** pour faire cesser la vente et obtenir des dommages et intérêts.`}]},{h:"Les droits de la personnalité et la protection des données",blocks:[{t:"p",c:"Les **droits de la personnalité** protègent la personne elle-même : droit au respect de la **vie privée**, droit à l’**image**, droit à la **dignité** et au **nom**. Ce sont des droits **extrapatrimoniaux**, aux caractères particuliers : **inaliénables** (on ne peut les vendre), **insaisissables** et **imprescriptibles**."},{t:"p",c:"À l’ère numérique, la **protection des données personnelles** est renforcée. Le **RGPD** (règlement européen) encadre la collecte et l’usage des données ; en France, la **CNIL** veille à leur respect et peut sanctionner les manquements."},{t:"example",h:"La photo publiée sans accord",c:`Un ami publie sur un réseau social une photo de Sarah, prise en soirée, sans lui demander. 
→ Le **droit à l’image** (droit de la personnalité, **inaliénable**) suppose l’**accord** de la personne. Sarah peut exiger le **retrait** de la photo et, en cas de préjudice, une réparation. Si le site conserve ses données, le **RGPD** lui donne aussi un droit d’**effacement**, dont la **CNIL** garantit le respect.`}]}],essentiel:["Droit de propriété = **usus** + **fructus** + **abusus** ; caractères **absolu, exclusif, perpétuel** (avec des **limites** : trouble anormal du voisinage, intérêt général).","Biens **corporels** vs **incorporels**.","Propriété intellectuelle : **marque / brevet** (propriété industrielle, monopole d’exploitation, **action en contrefaçon**) et **droit d’auteur** (droit **moral** + droits **patrimoniaux**).","**Droits de la personnalité** (vie privée, image, dignité) = extrapatrimoniaux, **inaliénables, insaisissables, imprescriptibles** ; données protégées par le **RGPD** et la **CNIL**."],resources:[{kind:"video",label:"Le droit de propriété (usus, fructus, abusus)",note:"Vidéos — recherche YouTube",url:T("droit de propriété usus fructus abusus caractères absolu exclusif perpétuel première STMG")},{kind:"video",label:"Propriété intellectuelle, RGPD et données personnelles",note:"Vidéos — recherche YouTube",url:T("propriété intellectuelle marque brevet contrefaçon RGPD CNIL première STMG droit")}],games:[{id:"p1-droit-t4-qcm",type:"qcm",title:"QCM — Les droits des personnes",icon:"❓",questions:[{q:"Le droit de percevoir les revenus d’un bien (ex. un loyer) est…",choices:["le fructus","l’usus","l’abusus","l’usufruit du voisin"],answer:0,explain:"Usus = utiliser ; fructus = revenus ; abusus = disposer."},{q:"Vendre ou détruire un bien correspond à…",choices:["l’abusus","l’usus","le fructus","la médiation"],answer:0,explain:"L’abusus est le droit de disposer du bien."},{q:"Les caractères du droit de propriété sont…",choices:["absolu, exclusif, perpétuel","général, impersonnel, obligatoire","certain, direct, personnel","oral, écrit, tacite"],
