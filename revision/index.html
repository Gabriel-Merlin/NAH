],answer:0,explain:"Extrapoler = prévoir hors de l’intervalle des données ; interpoler = à l’intérieur."}]},{id:"math-c4-flash",type:"flashcard",title:"Flashcards — Ajustement",icon:"🃏",cards:[{front:"Point moyen G",back:"Point de coordonnées (moyenne des x, moyenne des y)."},{front:"Moindres carrés",back:"Méthode qui minimise les écarts pour trouver y = ax + b."},{front:"Interpoler / extrapoler",back:"Prévoir à l’intérieur / au-delà de l’intervalle des données."}]},{id:"math-c4-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La droite des moindres carrés passe par le point moyen G.",answer:!0,explain:"Vrai : la droite d’ajustement passe par G."},{statement:"Interpoler, c’est prévoir en dehors des données connues.",answer:!1,explain:"Faux : c’est extrapoler ; interpoler reste à l’intérieur."}]}]},{id:"math-c5",name:"Chapitre 5 — Probabilités conditionnelles",short:"Probabilités conditionnelles",keywords:"probabilité conditionnelle arbre pondéré probabilités totales indépendance",cours:[{h:"Conditionnelles et arbres",points:["P_A(B) = P(A ∩ B) / P(A).","Arbre pondéré : somme des branches issues d’un nœud = 1 ; on multiplie le long des branches.","Formule des probabilités totales.","Indépendance : P(A ∩ B) = P(A) × P(B)."]}],formulas:["P_A(B) = P(A ∩ B) / P(A)","Indépendance : P(A ∩ B) = P(A) × P(B)"],essentiel:["**Probabilité conditionnelle** : P_A(B) = P(A ∩ B) / P(A).","**Arbre pondéré** : on **multiplie** le long des branches ; les branches d’un même nœud **somment à 1**.","**Formule des probabilités totales** ; **indépendance** : P(A ∩ B) = P(A) × P(B)."],games:[{id:"math-c5-calc",type:"calcul",title:"Calcul express — Probabilités totales",icon:"⚡",gen:"proba_totale",count:5},{id:"math-c5-qcm",type:"qcm",title:"QCM — Probabilités conditionnelles",icon:"❓",questions:[{q:"A : 60 % (2 % défauts) ; B : 40 % (5 % défauts). P(défectueuse) ?",choices:["0,032","0,07","0,02","0,05"],answer:0,explain:"P(D) = 0,60×0,02 + 0,40×0,05 = 0,012 + 0,020 = 0,032."},{q:"P(D) = 0,032 et P(B ∩ D) = 0,020. P_D(B) ?",choices:["0,625","0,320","0,400","0,050"],answer:0,explain:"P_D(B) = P(B ∩ D)/P(D) = 0,020/0,032 = 0,625."},{q:"La somme des probabilités des branches issues d’un nœud vaut…",choices:["1","0","0,5","variable"],answer:0,explain:"Sur un arbre pondéré, les branches issues d’un même nœud somment à 1."},{q:"A et B sont indépendants si…",choices:["P(A ∩ B) = P(A) × P(B)","P(A) = P(B)","P(A ∩ B) = 0","P(A) + P(B) = 1"],answer:0,explain:"Indépendance : P(A ∩ B) = P(A) × P(B)."}]},{id:"math-c5-flash",type:"flashcard",title:"Flashcards — Probabilités",icon:"🃏",cards:[{front:"Probabilité conditionnelle",back:"P_A(B) = P(A ∩ B) / P(A)."},{front:"Arbre pondéré",back:"On multiplie le long des branches ; les branches d’un nœud somment à 1."},{front:"Indépendance",back:"P(A ∩ B) = P(A) × P(B)."}]}]},{id:"math-c6",name:"Chapitre 6 — Loi binomiale",short:"Loi binomiale",keywords:"épreuve de Bernoulli succès échec loi binomiale espérance n p",cours:[{h:"L’épreuve de Bernoulli",points:["Une **épreuve de Bernoulli** n’a que **deux issues** : le **succès** (probabilité p) et l’**échec** (probabilité 1 − p).","On répète cette même épreuve **n fois**, de façon **identique** et **indépendante** : c’est un **schéma de Bernoulli**.","Exemple : lancer une pièce truquée qui tombe sur pile (succès) avec p = 0,6, répété 10 fois."]},{h:"La loi binomiale B(n ; p) et son espérance",points:["Si X compte le **nombre de succès** sur les n épreuves du schéma, X suit la **loi binomiale B(n ; p)**.","On calcule P(X = k), P(X ⩽ k) directement à la **calculatrice** (menu loi binomiale).","L’**espérance** est **E(X) = n × p** : c’est le nombre moyen de succès attendu."]}],formulas:["E(X) = n × p pour X suivant B(n ; p)"],essentiel:["**Épreuve de Bernoulli** : deux issues seulement, **succès (p)** / **échec (1 − p)**.","**Loi binomiale B(n ; p)** : nombre de succès sur n épreuves **identiques et indépendantes**.","**Espérance : E(X) = n × p**."],games:[{id:"math-c6-calc",type:"calcul",title:"Calcul express — Espérance E(X)",icon:"⚡",gen:"esperance_binomiale",count:5},{id:"math-c6-qcm",type:"qcm",title:"QCM — Loi binomiale",icon:"❓",questions:[{q:"Pour X ~ B(n ; p), l’espérance vaut…",choices:["n × p","n + p","p / n","n − p"],answer:0,explain:"E(X) = n × p."},{q:"Une épreuve de Bernoulli a…",choices:["deux issues : succès ou échec","trois issues","une infinité d’issues","aucune issue"],answer:0,explain:"Bernoulli : succès (p) ou échec (1 − p)."},{q:"La loi binomiale suppose des épreuves…",choices:["identiques et indépendantes","dépendantes","toutes différentes","sans hasard"],answer:0,explain:"B(n ; p) répète n épreuves de Bernoulli identiques et indépendantes."},{q:"X ~ B(20 ; 0,3). E(X) ?",choices:["6","3","20","0,3"],answer:0,explain:"E(X) = 20 × 0,3 = 6."}]},{id:"math-c6-flash",type:"flashcard",title:"Flashcards — Binomiale",icon:"🃏",cards:[{front:"Épreuve de Bernoulli",back:"Expérience à deux issues : succès (p) / échec (1 − p)."},{front:"Loi binomiale B(n ; p)",back:"Nombre de succès sur n épreuves identiques et indépendantes."},{front:"Espérance E(X)",back:"E(X) = n × p."}]}]},{id:"math-c7",name:"Chapitre 7 — Loi normale et estimation",short:"Loi normale",keywords:"loi normale courbe en cloche moyenne écart-type intervalle de confiance estimation sondage",cours:[{h:"Loi normale et estimation",points:["Loi normale : courbe en cloche symétrique autour de μ, dispersion réglée par σ.","Intervalle de confiance d’une proportion (niveau ~95 %). Applications : sondages, qualité."]}],formulas:["Courbe en cloche : symétrique autour de la moyenne μ, dispersion σ"],essentiel:["**Loi normale** : courbe **en cloche** symétrique autour de la moyenne **μ**.","**σ** (écart-type) règle la **dispersion** autour de μ.","**Intervalle de confiance** : estime une **proportion** (niveau ~95 %) — sondages, contrôle qualité."],games:[{id:"math-c7-qcm",type:"qcm",title:"QCM — Loi normale",icon:"❓",questions:[{q:"La courbe de la loi normale est…",choices:["une cloche symétrique autour de μ","une droite","en escalier","décroissante partout"],answer:0,explain:"C’est la courbe en cloche, symétrique autour de la moyenne μ."},{q:"σ (sigma) mesure…",choices:["la dispersion","la moyenne","le maximum","la médiane"],answer:0,explain:"σ (écart-type) règle la dispersion autour de μ."},{q:"Un intervalle de confiance sert à…",choices:["estimer une proportion (ex. sondage)","calculer la TVA","trier des données","dériver une fonction"],answer:0,explain:"Il encadre une proportion inconnue avec un niveau de confiance (~95 %)."}]},{id:"math-c7-flash",type:"flashcard",title:"Flashcards — Loi normale",icon:"🃏",cards:[{front:"Loi normale",back:"Courbe en cloche symétrique autour de la moyenne μ."},{front:"μ et σ",back:"μ = moyenne (centre) ; σ = écart-type (dispersion)."},{front:"Intervalle de confiance",back:"Encadre une proportion estimée avec un niveau (~95 %)."}]},{id:"math-c7-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La loi normale est symétrique autour de sa moyenne.",answer:!0,explain:"Vrai : la cloche est symétrique autour de μ."},{statement:"Un intervalle de confiance donne une valeur exacte et certaine.",answer:!1,explain:"Faux : il fournit une estimation avec un niveau de confiance."}]}]}]},jh={id:"philosophie",name:"Philosophie",short:"Philo",icon:"🦉",color:"#9333ea",tagline:"Réflexion structurée : définir, problématiser, argumenter.",chapters:[{id:"philo-notions",name:"Les 7 notions & les repères",short:"Notions & repères",keywords:"art justice liberté nature religion technique vérité repères absolu relatif légal légitime",cours:[{h:"Les 7 notions (pistes de problématisation)",points:["**L'art** : imitation ou création ? À quoi sert l'art ? Le beau est-il subjectif ?","**La justice** : se réduit-elle à la loi ? Peut-il être juste de désobéir ?","**La liberté** : sommes-nous libres ? Liberté et déterminisme.","**La nature** : l’homme fait-il partie de la nature ? Nature/culture.","**La religion** : foi et raison sont-elles opposées ?","**La technique** : nous libère-t-elle ou nous asservit-elle ?","**La vérité** : peut-on tout démontrer ? Vérité et opinion."]},{h:"Les repères (distinctions à mobiliser)",points:["absolu / relatif — objectif / subjectif — universel / particulier.","cause / fin — légal / légitime — en théorie / en pratique.","croire / savoir — contingent / nécessaire — essentiel / accidentel."]}],formulas:["3 perspectives : l’existence humaine et la culture · la morale et la politique · la connaissance"],essentiel:["**7 notions** au programme : art, justice, liberté, nature, religion, technique, vérité.","Chaque notion se traite par une **problématisation** (une question, un paradoxe), jamais par une simple définition.","**Repères** à mobiliser : absolu/relatif, objectif/subjectif, **légal/légitime**, croire/savoir, universel/particulier, cause/fin."],games:[{id:"philo-notions-flash",type:"flashcard",title:"Flashcards — Les 7 notions",icon:"🃏",cards:[{front:"L’art",back:"Imitation ou création ? À quoi sert l’art ? Le beau est-il subjectif ?"},{front:"La justice",back:"Se réduit-elle à la loi ? Peut-il être juste de désobéir ? Justice = égalité ?"},{front:"La liberté",back:"Sommes-nous libres ? Liberté et déterminisme ; liberté et loi."},{front:"La nature",back:"L’homme fait-il partie de la nature ? Faut-il la respecter ? Nature/culture."},{front:"La religion",back:"Foi et raison sont-elles opposées ? La foi exclut-elle le doute ?"},{front:"La technique",back:"Nous libère-t-elle ou nous asservit-elle ? Progrès technique = progrès humain ?"},{front:"La vérité",back:"Peut-on tout démontrer ? Vérité et opinion ; rôle du doute."}]},{id:"philo-notions-assoc",type:"association",title:"Association — Repère ↔ son opposé",icon:"🔗",pairs:[{left:"Absolu",right:"Relatif"},{left:"Objectif",right:"Subjectif"},{left:"Légal",right:"Légitime"},{left:"Croire",right:"Savoir"},{left:"Contingent",right:"Nécessaire"},{left:"Universel",right:"Particulier"}]},{id:"philo-notions-qcm",type:"qcm",title:"QCM — Notions & repères",icon:"❓",questions:[{q:"La distinction « légal / légitime » oppose…",choices:["ce qui est conforme à la loi / ce qui est juste","le vrai / le faux","le beau / le laid","la cause / la fin"],answer:0,explain:"Légal = conforme à la loi ; légitime = conforme à la justice/au droit moral."},{q:"La question « la technique nous libère-t-elle ou nous asservit-elle ? » porte sur la notion de…",choices:["la technique","la justice","la religion","l’art"],answer:0,explain:"C’est une problématisation classique de la notion de technique."},{q:"Distinguer « croire » et « savoir » est utile pour la notion de…",choices:["la vérité (et la religion)","la nature","l’art","la liberté"],answer:0,explain:"Croire/savoir éclaire les rapports entre foi, opinion et vérité."},{q:"Combien de notions au programme de la voie technologique ?",choices:["7","5","10","12"],answer:0,explain:"Le programme de philosophie techno comporte 7 notions."}]},{id:"philo-notions-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le programme de philo techno compte 7 notions.",answer:!0,explain:"Vrai : art, justice, liberté, nature, religion, technique, vérité."},{statement:"« Légal » et « légitime » sont exactement synonymes.",answer:!1,explain:"Faux : une loi peut être légale sans être jugée légitime."},{statement:"La liberté peut être interrogée face au déterminisme.",answer:!0,explain:"Vrai : « sommes-nous libres ? » liberté et déterminisme."}]}]},{id:"philo-methode",name:"Auteurs & méthode",short:"Auteurs & méthode",keywords:"dissertation explication de texte problématiser thèse antithèse dépassement Platon Descartes Kant Sartre Arendt",cours:[{h:"La méthode",points:["**Dissertation** : analyser le sujet → définir les termes → **problématiser** → plan progressif (souvent thèse / antithèse / dépassement) → argumenter → conclure.","**Explication de texte** : dégager la thèse, suivre les mouvements du texte, expliquer le raisonnement, en discuter la portée."]},{h:"Les auteurs (3 périodes)",points:["Antiquité / Moyen Âge : Platon, Aristote, Épicure.","Moderne : Descartes, Pascal, Rousseau, Kant.","Contemporaine : Nietzsche, Freud, Bergson, Arendt, Sartre, Beauvoir, Foucault."]}],formulas:["Plan type : thèse → antithèse → dépassement"],essentiel:["**Dissertation** : analyser le sujet → définir les termes → **problématiser** → plan progressif (thèse / antithèse / dépassement) → argumenter → conclure.","**Explication de texte** : dégager la **thèse**, suivre les mouvements du texte, expliquer le raisonnement, en discuter la portée.","**Auteurs** en 3 périodes : Antiquité/Moyen Âge (Platon, Aristote) · Moderne (Descartes, Kant) · Contemporaine (Sartre, Arendt)."],games:[{id:"philo-methode-ordre",type:"ordre",title:"Remise en ordre — Méthode de la dissertation",icon:"🔢",instruction:"Remets les étapes de la dissertation dans l’ordre.",steps:["Analyser le sujet","Définir les termes","Problématiser (dégager le paradoxe)","Construire un plan progressif","Argumenter (notions, repères, auteurs, exemples)","Conclure"],explain:"On analyse, on définit, on problématise, on planifie, on argumente, puis on conclut."},{id:"philo-methode-tri",type:"tri",title:"Tri — Auteurs par période",icon:"🗂️",instruction:"Classe chaque auteur dans sa période.",categories:[{id:"ant",label:"Antiquité / Moyen Âge"},{id:"mod",label:"Moderne"},{id:"con",label:"Contemporaine"}],items:[{text:"Platon",cat:"ant"},{text:"Aristote",cat:"ant"},{text:"Descartes",cat:"mod"},{text:"Kant",cat:"mod"},{text:"Sartre",cat:"con"},{text:"Arendt",cat:"con"}]},{id:"philo-methode-qcm",type:"qcm",title:"QCM — Méthode & auteurs",icon:"❓",questions:[{q:"Le cœur de l’introduction d’une dissertation, c’est…",choices:["problématiser (dégager le paradoxe)","donner la conclusion","réciter le cours","citer dix auteurs"],answer:0,explain:"Après avoir défini les termes, on problématise pour dégager le problème."},{q:"Un plan classique de dissertation est…",choices:["thèse / antithèse / dépassement","intro / développement seulement","liste de définitions","résumé du texte"],answer:0,explain:"Le plan progressif suit souvent thèse / antithèse / dépassement."},{q:"Descartes appartient à la période…",choices:["moderne","antique","contemporaine","médiévale"],answer:0,explain:"Descartes est un auteur moderne (aux côtés de Pascal, Rousseau, Kant)."},{q:"Pour l’explication de texte, on commence par…",choices:["dégager la thèse du texte","donner son avis personnel","résumer le programme","compter les lignes"],answer:0,explain:"On dégage la thèse, puis on suit les mouvements du texte."}]},{id:"philo-methode-flash",type:"flashcard",title:"Flashcards — Méthode",icon:"🃏",cards:[{front:"Problématiser",back:"Dégager le paradoxe/le problème que soulève le sujet."},{front:"Plan progressif",back:"Souvent thèse / antithèse / dépassement."},{front:"Explication de texte",back:"Dégager la thèse, suivre les mouvements, expliquer, discuter."},{front:"Argumenter",back:"Mobiliser notions, repères, auteurs et exemples concrets."}]}]}]},Sh={id:"histoire-geo",name:"Histoire-Géographie",short:"Histoire-Géo",icon:"🗺️",color:"#0891b2",tagline:"Repères, analyse de documents, réponses organisées.",chapters:[{id:"hg-h1",name:"Histoire — Totalitarismes et Seconde Guerre mondiale",short:"Totalitarismes & 2de GM",keywords:"totalitarisme nazisme stalinisme guerre d’anéantissement Shoah génocide Vichy Résistance 1939 1945",cours:[{h:"Une guerre d’anéantissement (1939-1945)",points:["Idéologies totalitaires : nazisme, stalinisme.","**Guerre d’anéantissement** : violence de masse visant aussi les civils (bombardements, famines).","**Génocide des Juifs et des Tsiganes (Shoah)** : extermination planifiée et industrialisée.","La France dans la guerre : Vichy, Résistance, Libération.","Bilan humain sans précédent (~50-60 millions de morts) ; usage de l’arme nucléaire (Hiroshima, Nagasaki)."]}],formulas:["Repère : 1939-1945 · Shoah = génocide planifié et industrialisé"],essentiel:["Repère : **Seconde Guerre mondiale, 1939-1945** ; idéologies totalitaires (**nazisme, stalinisme**).","**Guerre d’anéantissement** : violence de masse visant aussi les **civils**.","**Shoah** : génocide des Juifs et des Tsiganes, **planifié et industrialisé**.","La France : **Vichy collabore**, la **Résistance** combat ; bilan humain sans précédent + arme nucléaire (1945)."],games:[{id:"hg-h1-qcm",type:"qcm",title:"QCM — Totalitarismes & 2de GM",icon:"❓",questions:[{q:"La Seconde Guerre mondiale se déroule…",choices:["de 1939 à 1945","de 1914 à 1918","de 1945 à 1991","de 1929 à 1939"],answer:0,explain:"La Seconde Guerre mondiale : 1939-1945."},{q:"La Shoah désigne…",choices:["le génocide des Juifs (et des Tsiganes)","une bataille navale","un traité de paix","une crise économique"],answer:0,explain:"La Shoah est le génocide des Juifs et des Tsiganes, planifié et industrialisé."},{q:"Une « guerre d’anéantissement » vise…",choices:["à détruire des populations entières, pas seulement des armées","uniquement les soldats ennemis","à conclure vite un armistice","à protéger les civils"],answer:0,explain:"Elle confond front et arrière et prend pour cible les civils (violence de masse)."},{q:"En France, le régime qui collabore est…",choices:["le régime de Vichy","la IIIe République restaurée","la Résistance","la Commune"],answer:0,explain:"Le régime de Vichy collabore ; la Résistance combat l’occupant."}]},{id:"hg-h1-flash",type:"flashcard",title:"Flashcards — Repères",icon:"🃏",cards:[{front:"Totalitarisme",back:"Régime qui contrôle tous les aspects de la société (nazisme, stalinisme)."},{front:"Guerre d’anéantissement",back:"Guerre visant la destruction de populations entières."},{front:"Shoah",back:"Génocide des Juifs (et des Tsiganes) planifié et industrialisé."},{front:"Vichy / Résistance",back:"Vichy collabore ; la Résistance lutte contre l’occupant."}]},{id:"hg-h1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:" ","**Modaux** + base verbale ; **conditionnels** : type 1 (present → will), type 2 (preterit → would), type 3 (past perfect → would have).","**Passif** = be + participe passé ; **comparatifs** (cheaper / more expensive ; good → better → best)."],games:[{id:"lng-en-gram-trou",type:"trou",title:"Texte à trous — Conjugaison",icon:"✏️",questions:[{text:"I ____ (live) in this city since 2015.",answer:"have lived",explain:"Present perfect + since : « I have lived »."},{text:"Yesterday, they ____ (go) to the cinema.",answer:"went",explain:"Preterit (action datée) : « went »."},{text:"If she ____ (study) more, she would pass.",answer:"studied",explain:"Conditionnel type 2 : if + preterit → « studied »."},{text:"The email ____ (send) by the assistant this morning.",answer:"was sent",explain:"Passif au preterit : « was sent »."}]},{id:"lng-en-gram-qcm",type:"qcm",title:"QCM — Grammaire anglaise",icon:"❓",questions:[{q:'Which tense: "I ___ London." (bilan / expérience, avec already)',choices:["have already visited","visited","am visiting","will visit"],answer:0,explain:"Le present perfect (have + PP) exprime un bilan/une expérience (already, ever, yet)."},{q:'Conditionnel type 2 : "If I ___ rich, I would travel."',choices:["were","am","will be","had been"],answer:0,explain:"Type 2 (irréel du présent) : If + preterit → « were »."},{q:'Passif : "The report ___ by the manager."',choices:["was written","wrote","has write","is writing"],answer:0,explain:"Passif = be + participe passé : « was written »."},{q:"Discours rapporté de « I will call you tomorrow » :",choices:["He said he would call me the following day","He said he will call me tomorrow","He says he calls me tomorrow","He told will call tomorrow"],answer:0,explain:"Recul d’un temps : will → would ; tomorrow → the following/next day."},{q:'Comparatif irrégulier de "good" :',choices:["better","gooder","more good","best"],answer:0,explain:"good → better → the best."}]},{id:"lng-en-gram-assoc",type:"association",title:"Association — Temps ↔ emploi",icon:"🔗",pairs:[{left:"Present perfect",right:"Lien passé-présent (for, since, already)"},{left:"Preterit",right:"Action passée datée et terminée"},{left:"Past perfect",right:"Antériorité dans le passé (had + PP)"},{left:"Be going to",right:"Intention, projet"}]},{id:"lng-en-gram-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Après un modal, on met la base verbale (sans « to »).",answer:!0,explain:"Vrai : can go, must go… (pas de « to », pas de « -s »)."},{statement:"Le present perfect se forme avec « had + participe passé ».",answer:!1,explain:"Faux : c’est « have/has + participe passé » (had = past perfect)."},{statement:"Le passif se construit avec « be + participe passé ».",answer:!0,explain:"Vrai : The report was written…"}]}]},{id:"lng-en-voc",name:"Anglais — Vocabulaire (axes & ETLV / management)",short:"Anglais · vocabulaire",keywords:"vocabulaire axes ETLV management turnover balance sheet cash flow break-even shareholders CSR",cours:[{h:"Vocabulaire ETLV / management",points:["turnover = chiffre d’affaires ; balance sheet = bilan ; cash flow = trésorerie.","break-even point = seuil de rentabilité ; shareholders = actionnaires ; loan = emprunt.","stakeholders = parties prenantes ; CSR = RSE ; carbon footprint = empreinte carbone."]},{h:"Vocabulaire par axes",points:["Identités & échanges : migration, border, diversity, discrimination, equality.","Innovations & responsabilité : technology, data, privacy, sustainability, ethics.","Citoyenneté & mondes virtuels : social media, fake news, surveillance, digital footprint."]}],formulas:["Astuce : ficher le vocabulaire par axe et le réviser en flashcards."],essentiel:["Vocabulaire **management / ETLV** : turnover = CA, balance sheet = bilan, cash flow = trésorerie, break-even = seuil de rentabilité, shareholders = actionnaires, CSR = RSE.","Vocabulaire **par axe** : identités & échanges, innovations & responsabilité, citoyenneté & mondes virtuels.","**Méthode ,explain:"la empresa = l’entreprise."},{q:"« el medio ambiente » désigne…",choices:["l'environnement","le milieu social","la moitié","le climat froid"],answer:0,explain:"el medio ambiente = l’environnement."},{q:"« la memoria » se rapporte à l’axe…",choices:["Territoire et mémoire","Innovations scientifiques","Art et pouvoir","Sport"],answer:0,explain:"Vocabulaire de l’axe « Territoire et mémoire » (memoria, dictadura, patrimonio)."}]},{id:"lng-es-voc-assoc",type:"association",title:"Association — ES ↔ FR",icon:"🔗",pairs:[{left:"el trabajo",right:"le travail"},{left:"la dictadura",right:"la dictature"},{left:"el patrimonio",right:"le patrimoine"},{left:"la integración",right:"l'intégration"},{left:"las energías renovables",right:"les énergies renouvelables"}]}]},{id:"lng-axes",name:"Les 8 axes culturels",short:"8 axes culturels",keywords:"axes culturels identités échanges espace privé public art pouvoir citoyenneté fictions innovations diversité mémoire",cours:[{h:"Programme « Gestes fondateurs et mondes en mouvement »",points:["1. Identités et échanges — 2. Espace privé et espace public.","3. Art et pouvoir — 4. Citoyenneté et mondes virtuels.","5. Fictions et réalités — 6. Innovations scientifiques et responsabilité.","7. Diversité et inclusion — 8. Territoire et mémoire."]},{h:"Oral & activités langagières",points:["6 activités : CO, CE, EO en continu, EO en interaction, EE, et médiation.","Oral (référence) : 20 min dont 10 de préparation ; choix entre 3 axes."]}],formulas:["Session 2026 : le programme à 8 axes fait foi."],essentiel:["**8 axes culturels** : identités & échanges · espace privé/public · art & pouvoir · citoyenneté & mondes virtuels · fictions & réalités · innovations & responsabilité · diversité & inclusion · territoire & mémoire.","**6 activités langagières** : CO, CE, EO en continu, EO en interaction, EE, médiation.","**Oral** : 20 min dont 10 de préparation ; choix entre 3 axes."],games:[{id:"lng-axes-qcm",type:"qcm",title:"QCM — Les 8 axes",icon:"❓",questions:[{q:"Combien d’axes culturels pour la session 2026 ?",choices:["8","6","4","10"],answer:0,explain:"Le programme en vigueur pour 2026 compte 8 axes culturels."},{q:"La « médiation » consiste à…",choices:["reformuler / traduire / expliquer un document à quelqu’un","écrire une dissertation","apprendre une liste par cœur","passer un test de grammaire"],answer:0,explain:"La médiation = reformuler, traduire ou expliquer un document à autrui."},{q:"« Fake news » et « surveillance » relèvent surtout de l’axe…",choices:["Citoyenneté et mondes virtuels","Art et pouvoir","Territoire et mémoire","Espace privé et public"],answer:0,explain:"Ces notions relèvent de « Citoyenneté et mondes virtuels »."},{q:"L’ETLV en STMG se fait en…",choices:["anglais (LVA)","espagnol (LVB)","français","allemand uniquement"],answer:0,explain:"L’ETLV se déroule en LVA (anglais), à partir d’une organisation."}]},{id:"lng-axes-flash",type:"flashcard",title:"Flashcards — Les 8 axes",icon:"🃏",cards:[{front:"Axe 1",back:"Identités et échanges"},{front:"Axe 3",back:"Art et pouvoir"},{front:"Axe 4",back:"Citoyenneté et mondes virtuels"},{front:"Axe 6",back:"Innovations scientifiques et responsabilité"},{front:"Axe 7",back:"Diversité et inclusion"},{front:"Axe 8",back:"Territoire et mémoire"}]},{id:"lng-axes-ordre",type:"ordre",title:"Remise en ordre — Les 4 premiers axes",icon:"🔢",instruction:"Remets les quatre premiers axes dans l’ordre du programme.",steps:["Identités et échanges","Espace privé et espace public","Art et pouvoir","Citoyenneté et mondes virtuels"],explain:"Les axes 1 à 4 dans l’ordre officiel."}]}]},T=e=>"https://www.youtube.com/results?search_query="+encodeURIComponent(e),Ph={id:"p1-sgn",name:"Sciences de gestion et numérique",short:"Sciences de gestion",icon:"💡",color:"#0d9488",niveau:"premiere",tagline:"Comment une organisation fonctionne concrètement au quotidien.",chapters:[{id:"p1-sgn-t1",name:"Thème 1 — De l’individu à l’acteur",short:"De l’individu à l’acteur",keywords:"individu acteur personnalité perception sélective stéréotype émotion attitude comportement statut rôle socialisation communication interpersonnelle verbale non verbale para-verbale schéma émetteur récepteur canal message feedback code référent bruit écoute active formelle informelle réseau activité de travail travail prescrit réel compétence savoir savoir-faire savoir-être qualification classification expérience potentiel compétence collective rémunération salaire prime périphériques rétribution reconnaissance ressource charge coût du travail investissement immatériel capital humain formation GPEC motivation Maslow besoins Herzberg facteurs hygiène satisfaction implication QVT groupe formel informel dynamique cohésion norme conflit coopération décision leadership styles Lewin autoritaire démocratique",intro:"C’est **le thème le plus important de l’année** en sciences de gestion. Une organisation n’est pas qu’un organigramme : c’est avant tout un **collectif humain**. On y étudie comment un **individu** — avec sa personnalité, ses perceptions, ses émotions et ses compétences — **devient un acteur** qui communique, agit et interagit, jusqu’à influencer l’organisation autant qu’il en est influencé. Trois grandes questions de gestion structurent le thème : **① Comment un individu devient-il acteur ? ② L’activité humaine est-elle une ressource ou une charge ? ③ Le groupe et les relations font-ils la force de l’organisation ?**",cours:[{h:"L’organisation, un collectif humain",blocks:[{t:"p",c:"Une **organisation** (entreprise, association, administration) n’est pas seulement un organigramme, des machines ou des capitaux : c’est d’abord un **ensemble d’êtres humains** qui coopèrent pour atteindre un **but commun**. Sans les femmes et les hommes qui la composent, une organisation ne produit rien."},{t:"p",c:"Or, chaque être humain est **unique** et **complexe** : il arrive avec une histoire, une personnalité, des émotions, des compétences et des attentes. Le management doit donc **connaître et comprendre l’individu** pour transformer ce potentiel en **performance collective**."},{t:"p",c:"Tout le thème répond à trois grandes **questions de gestion** :"},{t:"list",c:["**① Comment un individu devient-il acteur** au sein d’une organisation ? (personnalité, perception, communication, statut et rôle)","**② L’activité humaine est-elle une ressource ou une charge** pour l’organisation ? (compétences, qualification, rémunération, coût, motivation)","**③ Comment les relations et le groupe** contribuent-ils à la dynamique de l’organisation ? (cohésion, conflits, coopération, leadership)"]},{t:"tip",c:"Fil directeur à garder en tête tout le thème : on part de l’**individu** (ce qu’il est), on le voit devenir **acteur** (ce qu’il fait et les relations qu’il noue), pour comprendre comment il crée de la **valeur** au sein d’un **collectif**."}]},{h:"La personnalité de l’individu",blocks:[{t:"p",c:"La **personnalité** est l’ensemble **stable et propre** des manières de penser, de ressentir et d’agir qui caractérisent un individu et le distinguent des autres. Elle explique pourquoi, face à une même situation, deux personnes réagissent différemment."},{t:"p",c:"Elle se compose de plusieurs éléments :"},{t:"table",head:["Élément","Définition","Exemple"],rows:[["Traits de caractère","Des dispositions durables","Être calme, sociable, rigoureux, anxieux"],["Tempérament","La part liée au « naturel », à la sensibilité","Être plutôt réservé ou plutôt expansif"],["Valeurs","Ce qui compte pour la personne, ses priorités","L’honnêteté, la réussite, la solidarité, la sécurité"],["Besoins","Ce que la personne cherche à satisfaire","Être reconnu, être autonome, appartenir à un groupe"]]},{t:"p",c:"La personnalité **se construit tout au long de la vie** par la **socialisation** : la **socialisation primaire** (famille, école, dans l’enfance) puis la **socialisation secondaire** (travail, groupes fréquentés, expériences à l’âge adulte). On n’a donc pas une personnalité « figée » : le milieu professionnel lui-même façonne l’individu."},{t:"warning",c:"Connaître la personnalité des collaborateurs n’est **pas** un moyen de les « ranger dans des cases » définitives. C’est un outil pour mieux **communiquer**, **confier les bonnes missions** et **anticiper les tensions**. Réduire quelqu’un à une étiquette est une erreur de management."},{t:"example",h:"Personnalité et poste de travail",c:`Pour un poste d’accueil, un manager recherche une personnalité **sociable, patiente et à l’écoute**. Pour un poste de contrôle qualité, il privilégie la **rigueur** et le sens du détail. 
→ Le même individu très sociable mais peu minutieux sera excellent à l’accueil et en difficulté au contrôle : il n’y a pas de « bonne » ou de « mauvaise » personnalité en soi, mais une adéquation avec le poste.`}]},{h:"La perception : un filtre subjectif",blocks:[{t:"p",c:"La **perception** est le processus par lequel un individu **sélectionne, organise et interprète** les informations qu’il reçoit de son environnement pour lui donner un sens. C’est notre « fenêtre » sur la réalité — mais une fenêtre **déformante**."},{t:"p",c:"La perception se déroule en trois étapes :"},{t:"list",c:["**Sélection** : on ne retient qu’une **partie** des informations (on ne peut pas tout traiter) ;","**Organisation** : le cerveau **classe** et relie ces informations entre elles ;","**Interprétation** : on leur donne un **sens**, en fonction de qui l’on est."]},{t:"p",c:"La perception est donc **subjective** : elle dépend de facteurs propres à la personne (**expériences passées, valeurs, humeur, attentes**), au message (**intensité, nouveauté**) et au **contexte**. Deux individus vivant exactement la même scène en gardent des souvenirs différents."},{t:"example",h:"Même fait, deux perceptions",c:`Un manager réunit son équipe un vendredi soir sans prévenir. 
→ Un salarié le **perçoit** comme une marque de considération (« il nous fait confiance pour régler un problème important »). 
→ Un autre le **perçoit** comme un manque de respect (« il empiète sur ma vie personnelle »). 
Le fait est identique ; la **perception** — donc la réaction — diffère selon les valeurs de chacun.`}]},{h:"Les biais de perception",blocks:[{t:"p",c:"Parce qu’elle est subjective, la perception produit des **biais** : des **erreurs de jugement** systématiques dont il faut se méfier, surtout en management (recrutement, évaluation, relation client)."},{t:"table",head:["Biais","Mécanisme"],rows:[["Stéréotype","Attribuer à une personne les caractéristiques supposées de son groupe (âge, origine, sexe…)"],["Effet de halo","Se fier à un seul trait (une bonne présentation) pour juger toute la personne"],["Première impression","Se forger un avis dès les premières secondes et ne plus en changer"],["Projection","Prêter à l’autre ses propres pensées ou intentions"],["Effet de contexte","Juger différemment selon l’ambiance ou l’ordre des informations"]]},{t:"p",c:"Ces biais peuvent conduire à des **discriminations** (à l’embauche par exemple) et à des **injustices**. Les connaître permet de **prendre du recul** et d’objectiver ses décisions (grilles d’évaluation, plusieurs évaluateurs, faits plutôt qu’impressions)."},{t:"warning",c:"Un stéréotype n’est pas neutre : « les jeunes ne sont pas fiables », « les seniors ne savent pas utiliser le numérique »… sont des jugements **faux et discriminatoires** qui privent l’organisation de talents et sont **interdits par la loi**."}]},{h:"Les émotions et le stress au travail",blocks:[{t:"p",c:"Une **émotion** est une réaction **courte et intense** face à un événement (joie, peur, colère, tristesse, surprise, dégoût). Contrairement à ce qu’on pense parfois, les émotions ne s’arrêtent pas à la porte de l’entreprise : elles **influencent directement** la concentration, les relations et les décisions."},{t:"list",c:["Des émotions **positives** (satisfaction, enthousiasme) favorisent l’engagement, la créativité et la coopération ;","des émotions **négatives** (stress, colère, peur) peuvent dégrader la communication, augmenter les erreurs et l’absentéisme."]},{t:"p",c:"Le **stress** est une réaction de l’organisme face à une pression perçue. Un stress **ponctuel** peut être mobilisateur ; un stress **chronique** (surcharge, manque de reconnaissance, conflits) nuit à la santé et à la performance : on parle de **risques psychosociaux (RPS)**."},{t:"p",c:"L’**intelligence émotionnelle** est la capacité à **identifier et gérer** ses propres émotions et celles des autres. C’est aujourd’hui une compétence très recherchée, en particulier chez les managers."},{t:"example",h:"Le coût des émotions négatives",c:`Un salarié régulièrement stressé par des délais intenables communique mal, s’isole et fait des erreurs. 
→ Résultat : baisse de qualité, tensions dans l’équipe, arrêt maladie. 
Comprendre et **réguler les émotions** (charge réaliste, écoute, reconnaissance) n’est donc pas « du confort » : c’est un enjeu de **performance**.`}]},{h:"Attitudes et comportements",blocks:[{t:"p",c:"L’**attitude** est une **disposition intérieure** stable : une manière de penser, de juger ou de se préparer à agir face à quelque chose ou quelqu’un (« je trouve cette tâche intéressante »). Elle ne se voit pas directement."},{t:"p",c:"Le **comportement** est l’**action observable** qui découle de l’attitude (« je m’implique dans la tâche, j’arrive en avance »). C’est ce que l’on peut réellement **constater**."},{t:"table",head:["","Attitude","Comportement"],rows:[["Nature","Intérieure, cachée","Extérieure, observable"],["Exemple","Aimer le travail en équipe","Proposer son aide à un collègue"],["Se mesure par","Ce que la personne ressent / pense","Ce que la personne fait"]]},{t:"p",c:"Attitude et comportement sont **liés** mais pas identiques : une même attitude peut donner des comportements différents selon la situation (on peut aimer une tâche mais mal la réaliser un jour de fatigue). Parfois, il y a même une **contradiction** entre ce que l’on pense et ce que l’on fait."},{t:"warning",c:"Erreur classique en devoir : écrire « attitude » à la place de « comportement ». Retiens : **attitude = intérieur** (opinion, intention) ; **comportement = extérieur** (action visible)."}]},{h:"De l’individu à l’acteur : statut et rôle",blocks:[{t:"p",c:"Un individu ne reste pas passif : dès qu’il **agit, communique et interagit** dans l’organisation, il en devient un **acteur** — une personne qui **influence** le fonctionnement de l’organisation autant qu’elle en est influencée. On passe ainsi « de l’individu à l’acteur »."},{t:"table",head:["Notion","Définition","Exemple"],rows:[["Statut","La **position** occupée dans l’organisation (fonction, place hiérarchique, reconnaissance)","Chef de rayon, comptable, apprenti, délégué du personnel"],["Rôle","L’ensemble des **comportements attendus** de celui qui occupe ce statut","On attend d’un chef de rayon qu’il anime, organise et contrôle son équipe"]]},{t:"p",c:"À chaque **statut** correspondent un ou plusieurs **rôles**. Un même individu occupe souvent **plusieurs statuts** en même temps (salarié, tuteur d’un apprenti, représentant syndical, membre d’un club sportif de l’entreprise…) et joue donc **plusieurs rôles**."},{t:"p",c:"Ces rôles peuvent entrer en **conflit** : un chef d’équipe apprécié de ses collègues (rôle de « copain ») doit aussi les évaluer et parfois les sanctionner (rôle de « responsable »). C’est un **conflit de rôles**, source de tension pour l’individu."},{t:"tip",c:"L’individu devient acteur par les **compétences** qu’il mobilise et par les **relations** (formelles et informelles) qu’il noue. La performance de l’organisation dépend donc largement de la **qualité des relations humaines**, pas seulement des procédures écrites."}]},{h:"La communication interpersonnelle : le schéma",blocks:[{t:"p",c:"La **communication** est l’**échange d’informations** entre des personnes. C’est elle qui fait « tenir » le collectif : sans communication, pas de coordination ni de relations. La **communication interpersonnelle** (entre deux individus) obéit à un **schéma** que l’on doit savoir décrire et repérer sur un cas."},{t:"table",head:["Élément","Rôle"],rows:[["Émetteur","Celui qui **envoie** le message (l’expéditeur)"],["Récepteur","Celui qui **reçoit** le message (le destinataire)"],["Message","L’**information** transmise (le contenu)"],["Code","Le système de signes commun : langue, symboles, jargon"],["Canal","Le **support** : voix, téléphone, mail, affichage, visioconférence"],["Feedback","La **rétroaction** : la réponse du récepteur, qui devient à son tour émetteur"],["Référent","Le **sujet**, le contexte de l’échange"],["Bruit","Tout ce qui **gêne** ou déforme le message (bruit réel, stress, malentendu)"]]},{t:"p",c:"Le **feedback** est essentiel : sans retour du récepteur, l’émetteur ne sait pas si son message a été **compris**. Une communication réussie est une communication où le message **reçu** correspond au message **voulu**."},{t:"warning",c:"Communiquer ≠ informer. **Informer**, c’est envoyer un message dans un seul sens (une note de service). **Communiquer**, c’est un **échange** avec du feedback : le récepteur réagit et l’émetteur ajuste."}]},{h:"Les registres : verbal, non verbal, para-verbal",blocks:[{t:"p",c:"Quand on communique, on utilise **trois registres en même temps**, et le message perçu dépend surtout de leur **cohérence**."},{t:"table",head:["Registre","De quoi s’agit-il ?","Exemples"],rows:[["Verbal","Les **mots**, ce que l’on dit ou écrit","Le vocabulaire, les phrases, le message écrit"],["Non verbal","Le **corps**","Gestes, regard, posture, expressions du visage, tenue, distance"],["Para-verbal","La **voix**","Ton, débit, volume, intonation, silences"]]},{t:"p",c:"La **proxémie** (la distance physique que l’on met entre soi et l’autre) fait partie du non-verbal : trop proche, on met mal à l’aise ; trop loin, on paraît distant."},{t:"p",c:"Le non-verbal et le para-verbal représentent une **très grande part** du message perçu. Quand les mots disent une chose et le corps une autre, c’est le **non-verbal** qui l’emporte dans la perception du récepteur."},{t:"example",h:"Quand le non-verbal contredit les mots",c:`Un manager dit « je vous fais totalement confiance » (verbal), mais regarde sa montre, croise les bras (non-verbal) et parle d’un ton sec (para-verbal). 
→ Le récepteur retient surtout le **non-verbal** et le **para-verbal** : il perçoit de la méfiance. Le message réellement reçu est l’inverse du message voulu.`}]},{h:"Les obstacles à la communication et l’écoute active",blocks:[{t:"p",c:"De nombreux **obstacles (« bruits »)** peuvent perturber la communication et créer des **malentendus** :"},{t:"list",c:["des bruits **matériels** : un environnement bruyant, une mauvaise connexion ;","des bruits **liés au code** : un jargon incompris, une langue mal maîtrisée ;","des bruits **psychologiques** : le stress, les émotions, les préjugés, la fatigue ;","des bruits **liés au canal** : un mail ambigu, sans le ton de la voix ni le visage."]},{t:"p",c:"Pour communiquer efficacement, on pratique l’**écoute active** : montrer de l’attention, **reformuler** (« si je comprends bien, tu veux dire que… »), **questionner**, ne pas couper la parole, tenir compte du non-verbal de l’autre. L’écoute active **réduit les malentendus** et renforce la relation."},{t:"tip",c:"Méthode pour limiter les bruits : choisir le **bon canal** (un sujet sensible se traite en face-à-face, pas par mail), un **code partagé** (éviter le jargon), un **moment adapté**, et **vérifier la compréhension** par le feedback."}]},{h:"Communication formelle, informelle et réseaux",blocks:[{t:"p",c:"Dans une organisation, la communication circule de deux façons **complémentaires** :"},{t:"table",head:["Communication formelle","Communication informelle"],rows:[["Officielle, **organisée** par l’entreprise","Spontanée, **non prévue**"],["Réunions, notes de service, mails pros, affichage","Discussions à la pause, messages entre collègues, « bruits de couloir »"],["Suit les **canaux hiérarchiques**","Suit les **affinités** et les réseaux personnels"],["Assure la **coordination** et la traçabilité","Crée du **lien**, fait circuler vite l’information, renforce la cohésion"]]},{t:"p",c:"La communication formelle a plusieurs **sens** : **descendante** (de la direction vers les salariés : consignes), **ascendante** (des salariés vers la direction : remontées, propositions) et **transversale** (entre services de même niveau)."},{t:"p",c:"On classe aussi la communication selon le **nombre de personnes** : **interpersonnelle** (2 personnes), de **groupe** (une équipe, une réunion) ou de **masse** (vers un large public, ex. une campagne interne)."},{t:"p",c:"Enfin, les échanges dessinent des **réseaux de communication** : **centralisés** (tout passe par un chef — rapide mais dépendant d’une seule personne, peu motivant) ou **décentralisés** (chacun échange avec chacun — plus lent mais plus riche, plus motivant)."},{t:"warning",c:"La communication informelle n’est **pas inutile** : elle fait circuler énormément d’informations et soude le groupe. Mais mal maîtrisée, elle diffuse aussi des **rumeurs** qui déforment les messages : le manager a intérêt à bien informer pour éviter que la rumeur ne remplace l’information officielle."}]},{h:"L’activité de travail : prescrit et réel",blocks:[{t:"p",c:"L’**activité de travail** est l’ensemble des **tâches** réalisées par un individu pour l’organisation, en mobilisant ses compétences. On distingue deux niveaux essentiels :"},{t:"table",head:["Travail prescrit","Travail réel"],rows:[["Ce qui est **demandé** : la consigne, la procédure officielle, la fiche de poste","Ce que la personne **fait vraiment** pour atteindre le résultat"],["Défini à l’avance par l’organisation","S’adapte aux imprévus, aux clients, aux pannes"],["« Ce qu’il faudrait faire »","« Ce qu’on fait réellement »"]]},{t:"p",c:"Il existe presque toujours un **écart** entre le prescrit et le réel : la réalité ne se laisse pas enfermer dans une procédure. Cet écart n’est pas un défaut — au contraire, il révèle l’**intelligence**, l’**expérience** et les **compétences** du salarié, qui bricole, ajuste et invente des solutions."},{t:"example",h:"L’écart prescrit / réel",c:`La procédure prescrit à un vendeur de suivre un script de vente précis. 
→ Face à un client pressé, le vendeur **raccourcit** le script et va à l’essentiel ; face à un client hésitant, il **développe** et rassure. 
Ce **travail réel**, adapté à chaque situation, fait la différence — et n’apparaît nulle part dans la fiche de poste.`}]},{h:"Les compétences : savoirs, savoir-faire, savoir-être",blocks:[{t:"p",c:"Une **compétence** est la capacité à **combiner et mobiliser des ressources** (connaissances, expérience, moyens) pour réaliser une tâche **avec succès** dans une situation donnée. Elle ne se voit vraiment qu’**en action**."},{t:"p",c:"On la décompose classiquement en **trois savoirs** :"},{t:"table",head:["Composante","Signification","Exemple (un vendeur)"],rows:[["**Savoirs**","Les **connaissances** théoriques","Connaître les produits, les prix, la réglementation"],["**Savoir-faire**","La **pratique**, les gestes techniques, la méthode","Utiliser le logiciel de caisse, présenter un produit, encaisser"],["**Savoir-être**","Le **comportement**, les attitudes relationnelles","Être souriant, patient, à l’écoute, ponctuel"]]},{t:"p",c:"À ces trois savoirs on ajoute souvent le **potentiel** (les compétences qu’un individu **pourrait** développer) et l’**expérience** (les compétences acquises par la pratique et le temps)."},{t:"p",c:"Les compétences **se construisent** : par la **formation** (initiale et continue), par l’**expérience** de terrain, et par l’**organisation elle-même** (tutorat, échanges entre collègues, missions confiées). Elles peuvent aussi se **perdre** si elles ne sont pas entretenues."},{t:"warning",c:"Une compétence n’est pas une simple connaissance : **connaître** le code de la route (savoir) ne rend pas **capable de conduire** en ville (savoir-faire + savoir-être). C’est la **mise en action** qui fait la compétence."}]},{h:"De la compétence individuelle à la compétence collective",blocks:[{t:"p",c:"Une organisation ne se contente pas d’additionner des compétences individuelles. Quand des individus **travaillent ensemble**, échangent et se coordonnent, il émerge une **compétence collective** : l’équipe devient capable de réaliser ce qu’aucun de ses membres ne pourrait faire seul."},{t:"p",c:"La compétence collective repose sur :"},{t:"list",c:["un **langage commun** et une bonne **communication** ;","la **coordination** et l’**entraide** entre les membres ;","le **partage des connaissances** (chacun apprend des autres) ;","une **mémoire collective** (les façons de faire de l’équipe)."]},{t:"p",c:"On dit que « **le tout est supérieur à la somme des parties** » : c’est l’effet de **synergie**. Développer la compétence collective est un enjeu majeur pour l’organisation, car elle est **difficile à copier** par les concurrents."},{t:"example",h:"La compétence collective",c:`Dans un restaurant, le cuisinier, le serveur et le responsable de salle ont chacun leurs compétences individuelles. 
→ C’est leur **coordination** (communication, anticipation, coup de feu géré ensemble) qui crée la **compétence collective** : servir 80 couverts en une heure sans erreur. 
Retirez la coordination et chacun, pris isolément, n’y arriverait pas.`}]},{h:"La qualification et sa reconnaissance",blocks:[{t:"p",c:"La **qualification** est la **reconnaissance officielle** du niveau de compétences d’un individu. Alors que la compétence est ce que l’on **sait faire** (réel), la qualification est la **reconnaissance** de ce niveau par l’organisation et la société."},{t:"p",c:"Elle repose sur plusieurs éléments :"},{t:"list",c:["les **diplômes** et **certifications** obtenus ;","l’**expérience professionnelle** acquise ;","la **classification** prévue par la **convention collective** (grille qui situe chaque poste et fixe un **salaire minimum**)."]},{t:"p",c:"La qualification **situe l’individu dans l’organigramme** (sa place dans la hiérarchie) et sert de base à sa **rémunération**. La **VAE** (validation des acquis de l’expérience) permet même de faire reconnaître par un diplôme des compétences acquises sans formation initiale."},{t:"warning",c:"Ne confonds pas **compétence** et **qualification** : on peut être très **compétent sans être qualifié** (un autodidacte doué mais sans diplôme), ou **qualifié sans être compétent** dans une situation précise (un diplômé qui débute et manque de pratique). Compétence = réel ; qualification = reconnaissance."}]},{h:"La rémunération et la rétribution globale",blocks:[{t:"p",c:"En échange de son activité, l’individu reçoit une **contrepartie**. La **rémunération** en est la partie **financière**, mais la **rétribution** est bien plus large."},{t:"p",c:"La **rémunération** se compose de plusieurs éléments :"},{t:"table",head:["Élément","Description"],rows:[["Salaire de base","La partie **fixe**, prévue au contrat (souvent liée à la qualification)"],["Primes / part variable","Liées à la **performance**, aux résultats, à l’ancienneté"],["Périphériques","Mutuelle, tickets restaurant, **intéressement**, participation, avantages en nature"]]},{t:"p",c:"La **rétribution** (ou rétribution globale) est **tout ce que l’individu retire de son travail** : la rémunération **plus** des éléments **non financiers** — la **reconnaissance**, les **perspectives de carrière**, la **formation**, l’**autonomie**, l’**ambiance** et les **conditions de travail**."},{t:"p",c:"Un salarié compare en permanence sa **rétribution** (ce qu’il reçoit) à sa **contribution** (ce qu’il apporte) : c’est le **sentiment d’équité**. S’il se sent traité **équitablement** (par rapport à ses efforts et aux autres), il s’implique davantage ; sinon, il se démotive."},{t:"example",h:"Rétribution et équité",c:`Deux salariés font le même travail avec les mêmes résultats, mais l’un est mieux payé sans raison apparente. 
→ Le second ressent un **sentiment d’injustice** (iniquité) : sa motivation baisse, même si son salaire n’a pas changé. 
La **perception d’équité** compte parfois autant que le montant lui-même.`}]},{h:"L’activité humaine : ressource ou charge ?",blocks:[{t:"p",c:"C’est la **deuxième grande question** du thème. L’activité humaine peut être vue de deux façons opposées… qui sont en réalité **complémentaires**."},{t:"table",head:["Le travail vu comme une CHARGE","Le travail vu comme une RESSOURCE"],rows:[["Une **charge de personnel** à payer (coût du travail)","Un **capital humain**, source de valeur et de performance"],["Vision **comptable**, à court terme","Vision **stratégique**, à long terme"],["On cherche à **réduire** le coût","On cherche à **développer** et à fidéliser"]]},{t:"p",c:"Le **coût du travail** ne se limite pas au salaire net : il comprend le salaire brut **plus** les **cotisations sociales** (part salariale et **part patronale**). C’est une **charge** importante et bien réelle pour l’organisation."},{t:"p",c:"Mais dépenser pour les salariés est aussi un **investissement immatériel** : la **formation**, l’amélioration des **conditions de travail** et la **fidélisation** développent les compétences et la motivation, donc la **performance future**. La **GPEC** (gestion prévisionnelle des emplois et des compétences) sert à **anticiper** les besoins futurs en compétences."},{t:"example",h:"Charge ou investissement ?",c:`Une entreprise dépense 3 000 € pour former un salarié à un nouveau logiciel. 
→ **À court terme**, c’est une **charge** (coût de la formation + temps non travaillé). 
→ **À long terme**, c’est un **investissement** : le salarié est plus efficace, fait moins d’erreurs, forme ses collègues et reste dans l’entreprise. 
Considérer l’humain comme une simple charge à réduire est souvent **contre-productif**.`}]},{h:"La motivation et ses théories (Maslow, Herzberg)",blocks:[{t:"p",c:"La **motivation** est ce qui **pousse un individu à agir et à s’investir** dans son travail, et à y **persévérer**. Un salarié motivé est plus **performant**, plus **fidèle** et de meilleure humeur. Deux grandes théories sont au programme."},{t:"p",c:"**Abraham Maslow** classe les besoins humains dans une **pyramide** : on ne cherche à satisfaire un besoin **supérieur** qu’une fois les besoins **inférieurs** globalement comblés."},{t:"table",head:["Niveau (de la base au sommet)","Besoin","Au travail"],rows:[["1. Physiologiques","Manger, dormir, vivre","Salaire suffisant, pauses, cantine"],["2. Sécurité","Se protéger","CDI, sécurité de l’emploi, conditions sûres"],["3. Appartenance","Faire partie d’un groupe","Bonne ambiance, esprit d’équipe, intégration"],["4. Estime","Être reconnu, respecté","Reconnaissance, responsabilités, statut, titres"],["5. Accomplissement","Se réaliser, se dépasser","Autonomie, projets, développement personnel"]]},{t:"p",c:"**Frederick Herzberg** distingue deux catégories de facteurs, ce qui complète Maslow :"},{t:"list",c:["les **facteurs d’hygiène** (salaire, conditions de travail, relations, sécurité) : s’ils sont **mauvais**, ils créent de l’**insatisfaction** ; mais s’ils sont bons, ils ne motivent pas vraiment — ils **évitent seulement le mécontentement** ;","les **facteurs de motivation** (intérêt du travail, reconnaissance, responsabilités, évolution, accomplissement) : ce sont eux qui **motivent réellement** et durablement."]},{t:"p",c:"On distingue aussi la motivation **intrinsèque** (le plaisir de l’activité elle-même, l’intérêt de la tâche) et la motivation **extrinsèque** (les récompenses externes : salaire, prime, statut)."},{t:"warning",c:"Conséquence de Herzberg à bien comprendre : **augmenter le salaire** supprime l’insatisfaction mais **ne motive pas durablement**. La vraie motivation vient surtout de l’**intérêt du travail** et de la **reconnaissance**."}]},{h:"Reconnaissance, implication et qualité de vie au travail",blocks:[{t:"p",c:"Au-delà des théories, plusieurs **leviers concrets** entretiennent la motivation au quotidien."},{t:"table",head:["Notion","Définition"],rows:[["Reconnaissance","Le fait de **valoriser** l’individu et son travail (remerciements, feedback positif, promotion)"],["Implication","Le **degré d’attachement** et d’engagement du salarié envers son organisation"],["Satisfaction","Le sentiment de **contentement** tiré du travail et de ses conditions"],["QVT","La **qualité de vie au travail** : conditions, ambiance, équilibre vie pro / perso, sens"]]},{t:"p",c:"Un salarié **reconnu** et **impliqué** est plus productif, plus créatif et **reste** dans l’entreprise (moins de turnover). À l’inverse, le manque de reconnaissance est l’une des premières causes de **démotivation** et de **départ**."},{t:"p",c:"Améliorer la **QVT** (télétravail, aménagement des horaires, écoute, prévention des risques psychosociaux, sens donné au travail) est devenu un enjeu stratégique : c’est bon pour les salariés **et** pour la performance."},{t:"tip",c:"La reconnaissance ne coûte pas forcément de l’argent : un **merci sincère**, un **feedback constructif**, de l’**autonomie** ou une **responsabilité** confiée sont des marques de reconnaissance puissantes (facteurs de motivation au sens de Herzberg)."}]},{h:"Le groupe et sa dynamique",blocks:[{t:"p",c:"Un **groupe** est un ensemble d’individus **en interaction**, qui poursuivent un **but commun** et partagent un **sentiment d’appartenance**. On travaille rarement seul : l’organisation est faite de multiples groupes."},{t:"table",head:["Groupe formel","Groupe informel"],rows:[["**Créé par l’organisation**","Né **spontanément** des affinités"],["Un service, une équipe projet, un comité","Des collègues qui déjeunent ensemble, un groupe d’amis au travail"],["A un objectif officiel et des règles écrites","A des règles implicites, fondées sur la sympathie"]]},{t:"p",c:"La vie du groupe crée une **dynamique de groupe** : des **relations**, des **rôles** (le meneur, le médiateur, l’expert…), des **normes** (règles de fonctionnement, souvent implicites) et une **cohésion** — le **sentiment d’appartenance** qui **soude** l’équipe."},{t:"p",c:"Une forte **cohésion** améliore en général la **performance**, l’entraide et le bien-être. Mais une cohésion trop forte peut aussi pousser au **conformisme** (ne plus oser exprimer un avis différent)."},{t:"example",h:"La force du groupe",c:`Une équipe soudée où chacun connaît son rôle et se fait confiance encaisse mieux les coups durs (surcharge, imprévu) qu’un ensemble d’individus talentueux mais isolés. 
→ La **cohésion** transforme un groupe en véritable **équipe** : c’est un atout que le management cherche à construire (intégration, projets communs, moments d’échange).`}]},{h:"Conflits, coopération et décision de groupe",blocks:[{t:"p",c:"La vie de groupe fait naître des **conflits**. Un conflit est une **opposition** entre des personnes ou des groupes. Il peut porter sur les **objectifs**, les **méthodes**, les **personnes**, les **ressources** ou les **valeurs**."},{t:"p",c:"Le conflit **n’est pas forcément négatif** :"},{t:"table",head:["Conflit mal géré","Conflit bien géré"],rows:[["Dégrade l’ambiance et la performance","Fait **émerger des idées**, clarifie les désaccords"],["Blocage, démotivation, départs","Débouche sur une **solution nouvelle** ou un compromis"]]},{t:"p",c:"Il existe plusieurs **modes de résolution** :"},{t:"list",c:["**l’évitement** : on ignore le conflit (il ressurgit souvent plus tard) ;","**l’imposition** (rapport de force) : l’un gagne, l’autre perd ;","**le compromis** : chacun fait une concession ;","**la coopération** : on cherche **ensemble** une solution qui satisfait tout le monde — la plus **constructive** (gagnant-gagnant) ;","**le recours à un tiers** : médiation, arbitrage."]},{t:"p",c:"Le groupe doit aussi **décider**. La **décision de groupe** est souvent **plus riche** qu’une décision individuelle (plusieurs points de vue, meilleure adhésion), mais elle est plus **lente** et exposée au **conformisme** (chacun se rallie à l’avis dominant, on n’ose plus contredire)."},{t:"tip",c:"Un bon manager ne cherche pas à **supprimer** tous les conflits (impossible et parfois nuisible), mais à les **réguler** et à favoriser la **coopération** pour en tirer du positif."}]},{h:"Le leadership et les styles de direction",blocks:[{t:"p",c:"Un groupe est souvent animé par un **leadership** : l’**influence** exercée par une personne sur le groupe. Le **leader** est celui dont l’influence est **reconnue** par les membres — ce n’est **pas toujours le chef officiel** ! On peut être chef sans être leader, et leader sans être chef."},{t:"p",c:"Le psychologue **Kurt Lewin** distingue **trois styles** de leadership :"},{t:"table",head:["Style","Fonctionnement","Effets"],rows:[["Autoritaire (directif)","Le leader **décide seul** et donne des ordres","Efficace dans l’urgence, mais **démotivant** sur la durée"],["Démocratique (participatif)","Le leader **associe** le groupe aux décisions","Le plus favorable à la **motivation** et à la **cohésion**"],["Laisser-faire (délégatif)","Le leader laisse une **grande autonomie**","Efficace avec une équipe **experte**, risqué (flou) sinon"]]},{t:"p",c:"Il n’y a pas **un** bon style dans l’absolu : le style efficace dépend de la **situation**, de l’**urgence** et de la **maturité** de l’équipe. Un bon manager sait **adapter** son style (on parle de **management situationnel**)."},{t:"tip",c:"Bilan du thème : l’**individu** (personnalité, perception, émotions) **devient acteur** en communiquant, en mobilisant ses **compétences** et en nouant des **relations** au sein d’un **groupe**. Bien managée (motivation, reconnaissance, cohésion, gestion des conflits, leadership adapté), l’activité humaine est la **première ressource** de l’organisation."}]}],essentiel:["**Individu** = personnalité + **perception** (subjective, sélective) + **émotions** ; l’**attitude** (intérieure) ≠ le **comportement** (observable).","L’individu devient **acteur** : il agit, communique, interagit. **Statut** = position occupée ; **rôle** = comportements attendus.","**Communication interpersonnelle** : émetteur, message, code, canal, récepteur, **feedback**, bruits ; registres **verbal / non verbal / para-verbal** ; **écoute active**.","Communication **formelle** (officielle, coordination) vs **informelle** (spontanée, lien) ; interpersonnelle / de groupe / de masse ; **réseaux**.","**Compétence** = **savoirs** + **savoir-faire** + **savoir-être** ; travail **prescrit** ≠ **réel** ; les compétences partagées créent une **compétence collective**.","**Qualification** = reconnaissance officielle (diplôme, expérience, classification) ≠ compétence (savoir-faire réel).","**Rétribution** = **rémunération** (salaire + primes + périphériques) **+** reconnaissance, carrière, conditions ; l’**équité** motive.","Le travail est à la fois une **charge** (coût du travail : salaires + cotisations) et une **ressource** (capital humain, **investissement** en formation, GPEC).","**Motivation** : **Maslow** (pyramide des besoins), **Herzberg** (facteurs d’hygiène ≠ facteurs de motivation) ; reconnaissance, implication, QVT.","**Groupe** (formel/informel) : **dynamique**, **cohésion**, **normes** ; **conflit** (constructif si bien géré), **coopération**, **décision de groupe** ; **leadership** (Lewin : autoritaire / démocratique / laisser-faire)."],resources:[{kind:"video",label:"De l’individu à l’acteur — le thème en entier",note:"Vidéos — recherche YouTube",url:T("sciences de gestion de l individu à l acteur première STMG")},{kind:"video",label:"Compétences, qualification, motivation",note:"Vidéos — recherche YouTube",url:T("compétence qualification motivation Maslow Herzberg première STMG sciences de gestion")},{kind:"video",label:"Communication & dynamique de groupe",note:"Vidéos — recherche YouTube",url:T("communication formelle informelle dynamique de groupe cohésion conflit première STMG")}],games:[{id:"p1-sgn-t1-qcm",type:"qcm",title:"QCM — De l’individu à l’acteur",icon:"❓",questions:[{q:"La **perception** d’une situation est…",choices:["subjective et sélective (propre à chacun)","toujours identique pour tous","une donnée comptable","un contrat"],answer:0,explain:"La perception sélectionne et interprète : deux personnes perçoivent différemment un même événement."},{q:"Une **attitude** se distingue d’un **comportement** car…",choices:["l’attitude est intérieure, le comportement est observable","ce sont des synonymes","l’attitude est une action, le comportement une opinion","seul le comportement existe"],answer:0,explain:"L’attitude est une disposition intérieure ; le comportement est l’action visible qui en découle."},{q:"Le **statut** d’un individu désigne…",choices:["la position qu’il occupe dans l’organisation","les comportements attendus de lui","son salaire","sa personnalité"],answer:0,explain:"Statut = position occupée ; le rôle = comportements attendus de celui qui occupe ce statut."},{q:"Dans le schéma de la communication, la réponse du récepteur s’appelle…",choices:["le feedback (rétroaction)","le canal","le code","le bruit"],answer:0,explain:"Le feedback est la rétroaction : le récepteur devient à son tour émetteur."},{q:"Le ton, le débit et le volume de la voix relèvent de la communication…",choices:["para-verbale","verbale","non verbale","écrite"],answer:0,explain:"Para-verbal = la voix ; verbal = les mots ; non verbal = le corps (gestes, regard)."},{q:"Une réunion hebdomadaire officielle relève de la communication…",choices:["formelle","informelle","de masse","publicitaire"],answer:0,explain:"La communication formelle est officielle et organisée ; l’informelle est spontanée."},{q:"La **compétence** d’un individu combine…",choices:["savoirs, savoir-faire et savoir-être","salaire, prime et statut","perception, émotion et humeur","offre, demande et prix"],answer:0,explain:"Compétence = connaissances (savoirs) + pratique (savoir-faire) + comportement (savoir-être)."},{q:"Le **travail réel** désigne…",choices:["ce que le salarié fait vraiment, en s’adaptant","la consigne officielle donnée","le salaire versé","l’organigramme"],answer:0,explain:"Travail prescrit = ce qui est demandé ; travail réel = ce qui est réellement fait."},{q:"La **qualification** se distingue de la compétence car elle est…",choices:["la reconnaissance officielle (diplôme, classification)","le savoir-faire réel","une émotion","un canal de communication"],answer:0,explain:"On peut être compétent sans être qualifié : la qualification reconnaît officiellement le niveau."},{q:"La **rétribution** est plus large que la rémunération car elle inclut…",choices:["la reconnaissance et les conditions de travail","seulement le salaire de base","uniquement les primes","les cotisations sociales"],answer:0,explain:"Rétribution = rémunération (argent) + éléments non financiers (reconnaissance, carrière, ambiance)."},{q:"Considérer la formation comme un **investissement** signifie…",choices:["qu’elle développe des compétences utiles à long terme","qu’il faut la supprimer pour réduire les coûts","qu’elle ne sert à rien","qu’elle est une cotisation"],answer:0,explain:"À court terme c’est une charge, mais à long terme un investissement immatériel (capital humain)."},{q:"Selon **Herzberg**, augmenter le salaire…",choices:["évite l’insatisfaction mais ne motive pas durablement","suffit toujours à motiver","démotive systématiquement","n’a aucun effet"],answer:0,explain:"Le salaire est un facteur d’hygiène ; la vraie motivation vient de l’intérêt du travail et de la reconnaissance."},{q:"À la base de la **pyramide de Maslow** se trouvent les besoins…",choices:["physiologiques","d’estime","d’accomplissement","d’appartenance"],answer:0,explain:"Ordre : physiologiques → sécurité → appartenance → estime → accomplissement."},{q:"Le **sentiment d’appartenance** qui soude une équipe s’appelle…",choices:["la cohésion","la qualification","la perception","la marge"],answer:0,explain:"La cohésion renforce la coopération et la performance du groupe."},{q:"Le mode de résolution de conflit le plus **constructif** est…",choices:["la coopération (solution qui satisfait tout le monde)","l’évitement","l’imposition par la force","le silence"],answer:0,explain:"La coopération cherche ensemble une solution gagnant-gagnant."},{q:"Selon **Lewin**, le style de leadership le plus favorable à la motivation est…",choices:["démocratique (participatif)","autoritaire","laisser-faire","aucun"],answer:0,explain:"Le style démocratique associe le groupe aux décisions : meilleur pour la cohésion et la motivation."}]},{id:"p1-sgn-t1-tri-comm",type:"tri",title:"Tri — Communication formelle ou informelle ?",icon:"🗂️",instruction:"Classe chaque situation.",categories:[{id:"form",label:"Formelle"},{id:"inf",label:"Informelle"}],items:[{text:"Une note de service affichée",cat:"form"},{text:"Une discussion à la machine à café",cat:"inf"},{text:"Un mail professionnel de la direction",cat:"form"},{text:"Un « bruit de couloir » entre collègues",cat:"inf"},{text:"Une réunion d’équipe planifiée",cat:"form"},{text:"Un entretien annuel d’évaluation",cat:"form"},{text:"Un déjeuner improvisé entre services",cat:"inf"}]},{id:"p1-sgn-t1-tri-comp",type:"tri",title:"Tri — Savoir, savoir-faire ou savoir-être ?",icon:"🗂️",instruction:"Classe chaque élément de compétence.",categories:[{id:"sav",label:"Savoir"},{id:"sf",label:"Savoir-faire"},{id:"se",label:"Savoir-être"}],items:[{text:"Connaître la réglementation d’hygiène",cat:"sav"},{text:"Savoir utiliser le logiciel de caisse",cat:"sf"},{text:"Être souriant et à l’écoute du client",cat:"se"},{text:"Maîtriser les tables de conjugaison comptable (débit/crédit)",cat:"sav"},{text:"Rédiger une facture sans erreur",cat:"sf"},{text:"Rester calme face à un client mécontent",cat:"se"}]},{id:"p1-sgn-t1-tri-rc",type:"tri",title:"Tri — Le travail : ressource ou charge ?",icon:"🗂️",instruction:"Classe chaque affirmation selon la vision du travail.",categories:[{id:"res",label:"Ressource"},{id:"cha",label:"Charge"}],items:[{text:"Le capital humain, source de performance",cat:"res"},{text:"Les salaires et cotisations à payer",cat:"cha"},{text:"Un investissement en formation",cat:"res"},{text:"Un coût du travail à réduire",cat:"cha"},{text:"Des compétences à développer et fidéliser",cat:"res"}]},{id:"p1-sgn-t1-ordre",type:"ordre",title:"Remise en ordre — La pyramide de Maslow",icon:"🔢",instruction:"Classe les besoins de la base de la pyramide vers le sommet.",steps:["Besoins physiologiques","Besoin de sécurité","Besoin d’appartenance","Besoin d’estime","Besoin d’accomplissement"],explain:"Maslow : on cherche à satisfaire un besoin supérieur une fois les besoins inférieurs comblés."},{id:"p1-sgn-t1-assoc",type:"association",title:"Association — Notion ↔ définition",icon:"🔗",pairs:[{left:"Statut",right:"La position occupée dans l’organisation"},{left:"Rôle",right:"Les comportements attendus d’une personne"},{left:"Feedback",right:"La réponse du récepteur dans la communication"},{left:"Qualification",right:"La reconnaissance officielle des compétences"},{left:"Compétence collective",right:"Ce que l’équipe sait faire ensemble, au-delà des individus"},{left:"Leadership",right:"L’influence reconnue par le groupe"}]},{id:"p1-sgn-t1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La perception est objective : tout le monde voit la même chose.",answer:!1,explain:"Faux : la perception est subjective et sélective, filtrée par nos expériences."},{statement:"Le savoir-être fait partie des compétences.",answer:!0,explain:"Vrai : savoirs + savoir-faire + savoir-être."},{statement:"La communication informelle est inutile à l’organisation.",answer:!1,explain:"Faux : elle crée du lien et fait circuler des informations utiles (mais peut diffuser des rumeurs)."},{statement:"On peut être compétent sans être qualifié.",answer:!0,explain:"Vrai : la qualification est la reconnaissance officielle, distincte du savoir-faire réel."},{statement:"Pour Herzberg, le salaire est le principal facteur de motivation durable.",answer:!1,explain:"Faux : c’est un facteur d’hygiène ; la motivation vient de l’intérêt du travail et de la reconnaissance."},{statement:"Un conflit bien géré peut être constructif pour le groupe.",answer:!0,explain:"Vrai : il peut clarifier les désaccords et faire émerger des solutions nouvelles."},{statement:"Le leader d’un groupe est toujours le chef officiel.",answer:!1,explain:"Faux : le leadership est une influence reconnue par le groupe, pas forcément le statut hiérarchique."}]},{id:"p1-sgn-t1-trou",type:"trou",title:"Texte à trous — Vocabulaire du thème",icon:"✏️",questions:[{text:"La ____ est le processus subjectif par lequel on interprète l’information.",answer:"perception",explain:"La perception est sélective et propre à chacun."},{text:"Le ____ est la position occupée dans l’organisation ; le rôle en est le comportement attendu.",answer:"statut",explain:"Statut = position ; rôle = comportements attendus."},{text:"Dans la communication, la réponse du récepteur s’appelle le ____.",answer:"feedback",alt:["retour","rétroaction"],explain:"Le feedback (rétroaction) referme la boucle de communication."},{text:"La compétence combine savoirs, ____ et savoir-être.",answer:"savoir-faire",explain:"Savoirs (connaissances) + savoir-faire (pratique) + savoir-être (comportement)."},{text:"La ____ est la reconnaissance officielle des compétences (diplôme, classification).",answer:"qualification",explain:"À distinguer de la compétence, qui est le savoir-faire réel."},{text:"Pour Herzberg, le salaire est un facteur d’____ : il évite l’insatisfaction sans motiver durablement.",answer:"hygiène",explain:"Les facteurs de motivation sont l’intérêt du travail et la reconnaissance."}]},{id:"p1-sgn-t1-flash",type:"flashcard",title:"Flashcards — Toutes les notions",icon:"🃏",cards:[{front:"Perception",back:"Processus subjectif et sélectif par lequel on interprète l’information."},{front:"Attitude vs comportement",back:"Attitude = disposition intérieure ; comportement = action observable."},{front:"Statut / rôle",back:"Statut = position occupée ; rôle = comportements attendus."},{front:"Schéma de communication",back:"Émetteur, message, code, canal, récepteur, feedback, bruits."},{front:"Verbal / non verbal / para-verbal",back:"Les mots / le corps (gestes, regard) / la voix (ton, débit)."},{front:"Communication formelle / informelle",back:"Officielle et organisée / spontanée et non prévue."},{front:"Compétence",back:"Savoirs + savoir-faire + savoir-être mobilisés au travail."},{front:"Travail prescrit / réel",back:"Ce qui est demandé / ce qui est réellement fait en s’adaptant."},{front:"Qualification",back:"Reconnaissance officielle des compétences (diplôme, expérience, classification)."},{front:"Rétribution",back:"Rémunération (salaire + primes + périphériques) + reconnaissance et conditions."},{front:"Ressource ou charge ?",back:"Charge = coût du travail ; ressource = capital humain, investissement en formation."},{front:"Maslow",back:"Pyramide : physiologiques → sécurité → appartenance → estime → accomplissement."},{front:"Herzberg",back:"Facteurs d’hygiène (évitent l’insatisfaction) ≠ facteurs de motivation."},{front:"Cohésion",back:"Sentiment d’appartenance qui soude le groupe."},{front:"Leadership (Lewin)",back:"Autoritaire / démocratique / laisser-faire."}]}]},{id:"p1-sgn-t2",name:"Thème 2 — Numérique et intelligence collective",short:"Numérique & données",keywords:"donnée information connaissance système d’information PGI ERP collaboratif intelligence collective sécurité RGPD",intro:"Les technologies numériques transforment l’**information** en véritable **ressource** stratégique et permettent de travailler collectivement mieux et plus vite.",cours:[{h:"De la donnée à la connaissance",blocks:[{t:"p",c:"Le numérique manipule d’abord des **données**, qui deviennent utiles lorsqu’elles sont mises en sens. Trois niveaux à bien distinguer :"},{t:"table",head:["Niveau","Définition","Exemple"],rows:[["**Donnée**","Élément **brut**, isolé, sans interprétation","« 35 »"],["**Information**","Donnée **mise en contexte**, qui a du sens","« Le projet X a nécessité 35 heures »"],["**Connaissance**","Information **assimilée et mobilisable** pour agir","« Nos projets de ce type prennent ~35 h : il faut les facturer au moins tel montant »"]]},{t:"p",c:"La **connaissance** appartient aux personnes et à l’organisation : c’est elle qui permet de **décider** et d’**agir**. Tout l’enjeu du numérique est de faire circuler la donnée jusqu’à la connaissance."}]},{h:"Les caractéristiques et la qualité de l’information",blocks:[{t:"p",c:"Une information n’a de valeur que si elle est de **qualité**. On juge sa qualité selon plusieurs critères :"},{t:"list",c:["**exacte / fiable** : elle correspond à la réalité ;","**pertinente** : elle est utile à la décision à prendre ;","**disponible à temps** : une information juste mais trop tardive est inutile ;","**complète** et **compréhensible** par son destinataire."]},{t:"p",c:"On distingue aussi l’information selon son **origine** (interne / externe) et sa **nature** (formelle, écrite / informelle, orale)."},{t:"warning",c:"Une information de **mauvaise qualité** (fausse, incomplète, en retard) conduit à de **mauvaises décisions**. « Garbage in, garbage out » : des données pourries en entrée donnent des résultats pourris en sortie."}]},{h:"L’information, une ressource stratégique",blocks:[{t:"p",c:"Aujourd’hui, l’**information** est une **ressource** au même titre que les hommes, les machines ou le capital. Bien exploitée, elle procure un **avantage** : mieux connaître ses clients, anticiper le marché, piloter l’activité."},{t:"p",c:"Les organisations collectent d’énormes volumes de données (**big data**) qu’elles analysent pour aider la décision. La donnée est parfois qualifiée d’« **or noir** » du XXIᵉ siècle."},{t:"example",h:"La donnée qui crée de la valeur",c:`Un site e-commerce enregistre les achats et la navigation de ses clients. 
→ En **analysant** ces données, il recommande des produits pertinents, ajuste ses stocks et ses prix : l’information brute est transformée en **valeur** et en performance commerciale.`}]},{h:"Le système d’information (SI) : définition et rôles",blocks:[{t:"p",c:"Le **système d’information (SI)** est l’ensemble **organisé** des ressources — **matériels, logiciels, données, procédures et personnes** — qui gère l’information dans l’organisation. Attention : le SI ne se réduit **pas** à l’informatique ; il inclut les humains et les procédures."},{t:"p",c:"Le SI remplit **quatre fonctions** principales :"},{t:"table",head:["Fonction","Rôle"],rows:[["**Collecter**","Saisir / acquérir les données (ventes, stocks…)"],["**Stocker**","Conserver durablement et en sécurité (bases de données)"],["**Traiter**","Trier, calculer, croiser les données"],["**Diffuser**","Mettre l’information à disposition des bonnes personnes"]]},{t:"p",c:"Le SI **structure** l’organisation, **relie les services** entre eux et sert de support à la **prise de décision** à tous les niveaux."}]},{h:"Les bases de données",blocks:[{t:"p",c:"Le cœur d’un SI est souvent une **base de données** : un ensemble de données **organisées** et **structurées**, stockées de façon à être facilement **recherchées** et **mises à jour**."},{t:"p",c:"Elle évite la **redondance** (une même information stockée en double, source d’erreurs) et garantit la **cohérence** : l’information est saisie **une seule fois** et partagée."},{t:"tip",c:"Une base de données bien conçue, c’est comme un classeur parfaitement rangé : chaque information a **une place unique**, on la retrouve vite et on est sûr qu’elle est à jour partout."}]},{h:"Le PGI (ERP) : un système intégré",blocks:[{t:"p",c:"Le **PGI** (Progiciel de Gestion Intégré, en anglais **ERP**) est un **logiciel unique** qui gère toutes les fonctions de l’entreprise (ventes, achats, stocks, comptabilité, paie…) en s’appuyant sur une **base de données unique** partagée."},{t:"table",head:["Avantages du PGI","Limites du PGI"],rows:[["Une **seule saisie** (pas de double saisie)","Coût d’achat et d’installation élevé"],["Information **cohérente** et à jour partout","Projet long et complexe à déployer"],["Meilleure **coordination** entre services","Rigidité, forte dépendance au logiciel"]]},{t:"example",h:"L’effet d’un PGI",c:`Une vente saisie en caisse met **automatiquement** à jour le stock, déclenche la facturation et l’écriture comptable.
