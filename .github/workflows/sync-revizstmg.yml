name: Sync revizstmg.github.io

# Publie automatiquement le site sur le dépôt de l'organisation revizstmg
# (https://revizstmg.github.io) à chaque mise à jour du dossier revision/ sur
# main : index.html + fichiers PWA (manifest, service worker, icônes).
# Nécessite le secret REVIZSTMG_DEPLOY_TOKEN : un fine-grained token ayant la
# permission "Contents: Read and write" sur revizstmg/revizstmg.github.io.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'revision/**'
      - '.github/workflows/sync-revizstmg.yml'

permissions:
  contents: read

concurrency:
  group: sync-revizstmg
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site depuis NAH
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            revision
          sparse-checkout-cone-mode: true

      - name: Cloner le dépôt de l'organisation revizstmg
        env:
          DEPLOY_TOKEN: ${{ secrets.REVIZSTMG_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Le secret REVIZSTMG_DEPLOY_TOKEN est absent."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/revizstmg/revizstmg.github.io.git" \
            target

      - name: Copier le site et publier si modifié
        env:
          DEPLOY_TOKEN: ${{ secrets.REVIZSTMG_DEPLOY_TOKEN }}
        run: |
          # Copie tous les fichiers publiables (index.html + PWA) à la racine du site.
          cp -f revision/* target/
          cd target
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement : revizstmg.github.io est déjà à jour."
            exit 0
          fi
          git config user.name "revizstmg-bot"
          git config user.email "revizstmg@users.noreply.github.com"
          echo "Fichiers publiés :"
          git diff --cached --name-only
          git commit -m "Sync site depuis NAH ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Publié sur revizstmg.github.io."
              exit 0
            fi
            echo "Échec du push (tentative $i), nouvelle tentative..."
            sleep $((2 ** i))
          done
          echo "::error::Impossible de publier sur revizstmg.github.io après 4 tentatives."
          exit 1
