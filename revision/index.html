answer:0,explain:"Absolu (le plus large), exclusif (seul à en jouir), perpétuel (dure tant que le bien existe)."},{q:"Une marque protège…",choices:["un signe distinctif, avec un monopole d’exploitation","une invention technique uniquement","une œuvre littéraire","un salaire"],answer:0,explain:"La marque (propriété industrielle) donne un monopole d’exploitation ; le brevet protège l’invention."},{q:"Reproduire une œuvre sans autorisation constitue…",choices:["une contrefaçon","un acte authentique","un trouble du voisinage","une preuve parfaite"],answer:0,explain:"La contrefaçon est sanctionnée par une action en contrefaçon."},{q:"Le droit d’auteur comprend…",choices:["un droit moral et des droits patrimoniaux","seulement un droit à réparation","un monopole d’État","une preuve imparfaite"],answer:0,explain:"Droit moral (respect de l’œuvre, perpétuel) + droits patrimoniaux (exploiter, tirer des revenus)."},{q:"En France, l’organisme qui veille à la protection des données personnelles est…",choices:["la CNIL","la Cour de cassation","l’INSEE","l’Autorité de la concurrence"],answer:0,explain:"La CNIL applique le RGPD et peut sanctionner les manquements."}]},{id:"p1-droit-t4-assoc",type:"association",title:"Association — Notion ↔ sens",icon:"🔗",pairs:[{left:"Usus",right:"Utiliser le bien"},{left:"Fructus",right:"Percevoir les revenus (loyer)"},{left:"Abusus",right:"Disposer (vendre, détruire)"},{left:"Brevet",right:"Protège une invention (monopole d’exploitation)"},{left:"RGPD / CNIL",right:"Protection des données personnelles"}]},{id:"p1-droit-t4-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le droit de propriété autorise à causer un trouble anormal du voisinage.",answer:!1,explain:"Faux : c’est une limite au droit de propriété."},{statement:"La marque et le brevet confèrent un monopole d’exploitation.",answer:!0,explain:"Vrai : leur titulaire est seul à pouvoir les exploiter."},{statement:"Le droit à la vie privée est un droit de la personnalité, inaliénable.",answer:!0,explain:"Vrai : extrapatrimonial, inaliénable, insaisissable, imprescriptible."},{statement:"Une donnée personnelle peut être collectée et utilisée sans aucune règle.",answer:!1,explain:"Faux : le RGPD encadre la collecte et l’usage ; la CNIL veille."}]},{id:"p1-droit-t4-flash",type:"flashcard",title:"Flashcards — Les droits",icon:"🃏",cards:[{front:"Usus / fructus / abusus",back:"Utiliser / percevoir les revenus / disposer."},{front:"Caractères de la propriété",back:"Absolu, exclusif, perpétuel (avec des limites)."},{front:"Propriété industrielle",back:"Marque et brevet : monopole d’exploitation, protégé par l’action en contrefaçon."},{front:"Droit d’auteur",back:"Droit moral (perpétuel) + droits patrimoniaux (exploitation)."},{front:"Droits de la personnalité",back:"Vie privée, image, dignité : inaliénables, insaisissables, imprescriptibles."},{front:"RGPD / CNIL",back:"Cadre européen des données / autorité française de contrôle."}]}]}]},Rh={id:"p1-economie",name:"Économie",short:"Économie",icon:"📈",color:"#dc2626",niveau:"premiere",tagline:"Produire, mesurer, répartir et financer la richesse.",chapters:[{id:"p1-eco-t1",name:"Thème 1 — Les grandes questions économiques",short:"Grandes questions",keywords:"besoin rareté choix coût agents économiques ménages entreprises administrations bien service utilité décroissante",intro:"Les **besoins** sont quasi illimités mais les **ressources** sont **rares** : la rareté oblige à faire des **choix**. C’est le cœur de la science économique.",cours:[{h:"Les besoins, les biens et les services",blocks:[{t:"p",c:"Un **besoin** est une sensation de manque que l’on cherche à satisfaire. On distingue les besoins **primaires** (vitaux : manger, se loger) et **secondaires** (loisirs, culture). Les besoins sont **quasi illimités** et se renouvellent sans cesse."},{t:"p",c:"Pour les satisfaire, on utilise des **biens** et des **services** :"},{t:"table",head:["Bien","Service"],rows:[["**Matériel**, on peut le toucher, le stocker","**Immatériel**, consommé au moment où il est produit"],["Un pain, un ordinateur, une voiture","Une coupe de cheveux, un cours, un trajet en bus"]]},{t:"p",c:"Un bien peut être **libre** (gratuit et abondant, comme l’air) ou **économique** (rare, il a un prix). L’économie ne s’intéresse qu’aux biens **économiques**."}]},{h:"La rareté et les choix",blocks:[{t:"p",c:"Le **problème économique** fondamental : les besoins sont **illimités** mais les **ressources** (temps, argent, matières) sont **rares**. La **rareté** est le point de départ de toute la science économique."},{t:"p",c:"Parce que les ressources sont rares, chaque agent doit **choisir** : un ménage avec un budget limité, une entreprise avec des moyens limités, l’État avec un budget contraint. **Faire de l’économie, c’est arbitrer.**"},{t:"tip",c:"Retiens la formule : « des besoins illimités, des ressources limitées → il faut **choisir** ». C’est la définition même de l’économie."}]},{h:"Le coût d’opportunité",blocks:[{t:"p",c:"Tout choix a un **coût** : le **coût d’opportunité** est la valeur de **ce à quoi on renonce** en choisissant autre chose. Choisir, c’est toujours renoncer."},{t:"example",h:"Le coût d’opportunité",c:`Avec 1 000 € d’économies, tu peux partir en voyage **ou** acheter un ordinateur. 
→ Si tu choisis le voyage, le **coût d’opportunité** est l’ordinateur auquel tu renonces. 
De même, une heure passée à travailler est une heure qu’on ne passe pas à se reposer : le temps aussi a un coût d’opportunité.`}]},{h:"L’utilité et le comportement du consommateur",blocks:[{t:"p",c:"Le **consommateur** cherche à maximiser son **utilité** : la **satisfaction** que lui procure la consommation, compte tenu de son **budget**. Il compare l’utilité qu’il retire d’un bien à son **prix**."},{t:"p",c:"L’utilité est **décroissante** : chaque unité supplémentaire d’un même bien procure **moins** de satisfaction que la précédente. Le premier verre d’eau dans le désert procure une énorme satisfaction, le dixième beaucoup moins."},{t:"warning",c:"C’est ce qui explique qu’on ne consomme pas une quantité infinie d’un même bien, même s’il est bon marché : passé un certain point, l’utilité supplémentaire devient trop faible."}]},{h:"Le producteur et le profit",blocks:[{t:"p",c:"Le **producteur** (l’entreprise) décide **quoi produire**, **comment** et **en quelle quantité**. Son objectif principal est de dégager un **profit** = recettes − coûts."},{t:"p",c:"Il combine des **facteurs de production** : le **travail** (les salariés) et le **capital** (machines, locaux). Il cherche la combinaison la plus **efficiente** (le meilleur résultat au moindre coût)."}]},{h:"Les agents économiques",blocks:[{t:"p",c:"Un **agent économique** est un acteur qui prend des décisions économiques. On les regroupe en grandes catégories selon leur **fonction principale** :"},{t:"table",head:["Agent","Rôle principal"],rows:[["Ménages","Consomment, fournissent du travail, épargnent"],["Entreprises","Produisent des biens et services marchands"],["Institutions financières (banques)","Financent l’économie (crédits, placements)"],["Administrations publiques","Produisent des services non marchands, redistribuent"],["Reste du monde","Réalise les échanges avec l’étranger (import/export)"]]}]},{h:"Le circuit économique",blocks:[{t:"p",c:"Les agents sont **interdépendants** : ils échangent en permanence des **flux**. Le **circuit économique** représente ces échanges. Par exemple, entre ménages et entreprises :"},{t:"list",c:["les ménages fournissent du **travail** aux entreprises et reçoivent des **revenus** (salaires) ;","avec ces revenus, ils **consomment** les biens et services produits par les entreprises ;","les entreprises reçoivent ainsi des **recettes**, qui financent la production… et le cycle recommence."]},{t:"p",c:"À chaque **flux réel** (bien, service, travail) correspond un **flux monétaire** de sens inverse (paiement). Le circuit montre que l’économie est un **système** où tout est lié."}]}],essentiel:["Un **besoin** (primaire/secondaire) se satisfait par des **biens** (matériels) ou **services** (immatériels) ; un bien économique est **rare** (≠ bien libre).","Le problème économique : besoins **illimités** / ressources **rares** → il faut **choisir**.","**Coût d’opportunité** = valeur de ce à quoi on renonce en choisissant.","Le **consommateur** maximise son **utilité** (décroissante) sous contrainte de **budget** ; le **producteur** vise le **profit** (recettes − coûts) en combinant travail et capital.","Agents : **ménages, entreprises, institutions financières, administrations, reste du monde**.","Le **circuit économique** relie les agents par des **flux réels** et **monétaires** (de sens inverse)."],resources:[{kind:"video",label:"Les grandes questions économiques",note:"Vidéos — recherche YouTube",url:T("grandes questions économiques rareté agents économiques première STMG")}],games:[{id:"p1-eco-t1-qcm",type:"qcm",title:"QCM — Grandes questions",icon:"❓",questions:[{q:"Le problème économique de base vient de ce que les besoins sont illimités et les ressources…",choices:["rares","infinies","gratuites","interdites"],answer:0,explain:"La rareté oblige à faire des choix."},{q:"L’utilité procurée par la consommation est…",choices:["décroissante","toujours croissante","constante","nulle"],answer:0,explain:"Chaque unité supplémentaire procure moins de satisfaction."},{q:"Les ménages, dans le circuit économique…",choices:["consomment et fournissent du travail","produisent tous les biens","votent les lois","fixent les taux"],answer:0,explain:"Rôle des ménages : consommation et offre de travail."},{q:"Un service se distingue d’un bien car il est…",choices:["immatériel","toujours gratuit","toujours importé","stockable"],answer:0,explain:"Le service est immatériel, le bien est matériel."}]},{id:"p1-eco-t1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Tout choix économique implique un coût (renoncement).",answer:!0,explain:"Vrai : choisir, c’est renoncer."},{statement:"Les banques sont des agents qui financent l’économie.",answer:!0,explain:"Vrai : ce sont les institutions financières."},{statement:"L’utilité d’un bien augmente à chaque unité consommée.",answer:!1,explain:"Faux : l’utilité est décroissante."}]},{id:"p1-eco-t1-flash",type:"flashcard",title:"Flashcards — Bases",icon:"🃏",cards:[{front:"Rareté",back:"Ressources limitées face à des besoins illimités."},{front:"Coût (d’un choix)",back:"Ce à quoi on renonce en choisissant."},{front:"Utilité décroissante",back:"Chaque unité supplémentaire procure moins de satisfaction."},{front:"Agents économiques",back:"Ménages, entreprises, banques, administrations, reste du monde."}]}]},{id:"p1-eco-t2",name:"Thème 2 — Comment crée-t-on des richesses et comment les mesure-t-on ?",short:"Créer & mesurer la richesse",keywords:"production valeur ajoutée consommations intermédiaires PIB croissance limites facteurs travail capital productivité",intro:"Produire, c’est créer des biens et services. Pour mesurer la richesse **réellement créée**, on utilise la **valeur ajoutée**, puis le **PIB**.",cours:[{h:"Produire : production marchande et non marchande",blocks:[{t:"p",c:"**Produire**, c’est créer des **biens** et des **services** pour satisfaire des besoins. On distingue deux types de production :"},{t:"table",head:["Production marchande","Production non marchande"],rows:[["Vendue sur un **marché** à un prix","Fournie **gratuitement** ou quasi gratuitement"],["Couvre ses coûts par les recettes","Financée par les **impôts** et cotisations"],["Une baguette, une place de cinéma","L’école publique, la justice, l’éclairage public"]]},{t:"p",c:"La production non marchande (assurée surtout par les **administrations publiques**) est essentielle mais ne se vend pas : on la mesure par son **coût** de production."}]},{h:"Les facteurs de production",blocks:[{t:"p",c:"Pour produire, on combine deux **facteurs de production** :"},{t:"table",head:["Facteur travail","Facteur capital"],rows:[["La **main-d’œuvre** (les salariés)","Les moyens matériels durables"],["Heures travaillées, qualification","Machines, bâtiments, outils, logiciels"]]},{t:"p",c:"On distingue le **capital fixe** (machines, bâtiments, qui durent plusieurs cycles) du **capital circulant** (matières premières, consommées dans la production). Augmenter le stock de capital, c’est **investir**."}]},{h:"La productivité et le progrès technique",blocks:[{t:"p",c:"La **productivité** mesure l’**efficacité** de la production : c’est le rapport entre ce qui est produit et les moyens utilisés."},{t:"formula",c:"Productivité du travail = production / nombre d’heures (ou de travailleurs)"},{t:"p",c:"Gagner en productivité, c’est produire **plus avec autant** (ou autant avec moins). Les gains de productivité viennent surtout du **progrès technique** (nouvelles machines, automatisation, numérique) et de la **qualification** de la main-d’œuvre. C’est un moteur essentiel de la **croissance**."}]},{h:"La valeur ajoutée",blocks:[{t:"p",c:"Pour mesurer la richesse **réellement créée** par un producteur, on ne prend pas toute sa production : il faut retirer ce qu’il a acheté à d’autres pour produire (les **consommations intermédiaires** : matières, énergie, transformées ou détruites dans la production)."},{t:"formula",c:"Valeur ajoutée = valeur de la production − consommations intermédiaires"},{t:"example",h:"Calcul de la valeur ajoutée",c:`Un menuisier vend **100 €** de meubles en utilisant **30 €** de bois. 
→ VA = 100 − 30 = **70 €**. 
C’est cette VA de 70 € qui représente la richesse qu’il a vraiment créée (pas les 100 €, car 30 € existaient déjà).`}]},{h:"La répartition de la valeur ajoutée",blocks:[{t:"p",c:"La valeur ajoutée est ensuite **partagée** (répartie) entre ceux qui ont contribué à la production :"},{t:"list",c:["les **salariés** reçoivent les **salaires** (rémunération du travail) ;","l’**État** perçoit les **impôts** et cotisations ;","les **banques** perçoivent les **intérêts** (sur les prêts) ;","les **propriétaires** reçoivent les **bénéfices** ; une partie reste dans l’entreprise (**autofinancement**)."]},{t:"warning",c:"Le **partage de la valeur ajoutée** entre salaires et profits est un enjeu majeur : c’est un arbitrage sensible, source de débats sociaux (« qui doit toucher quelle part ? »)."}]},{h:"Le PIB : mesurer la richesse d’un pays",blocks:[{t:"p",c:"Le **PIB** (Produit Intérieur Brut) mesure la richesse créée dans un **pays** pendant un **an**. C’est la **somme de toutes les valeurs ajoutées** produites sur le territoire."},{t:"formula",c:"PIB = somme des valeurs ajoutées (produites sur un territoire, sur un an)"},{t:"p",c:"On additionne les VA plutôt que les productions pour **éviter de compter deux fois** la même richesse (le bois du menuisier serait compté à la fois chez le scieur et chez le menuisier)."}]},{h:"La croissance économique",blocks:[{t:"p",c:"La **croissance économique** est l’**augmentation du PIB** dans le temps. On la mesure par le **taux de croissance** (variation du PIB en %)."},{t:"p",c:"Ses moteurs : les **gains de productivité**, le **progrès technique**, l’**investissement**, l’augmentation de la population active. La croissance permet de créer des emplois et d’améliorer le niveau de vie… mais pas automatiquement de façon **équitable** ni **durable**."}]},{h:"Les limites du PIB",blocks:[{t:"p",c:"Le PIB est utile mais **imparfait** comme indicateur de richesse et de bien-être :"},{t:"list",c:["il ignore le **travail non rémunéré** (bénévolat, tâches domestiques) et l’**économie souterraine** ;","il ne dit rien des **inégalités** de répartition (un PIB élevé peut cacher de fortes inégalités) ;","il ne mesure pas le **bien-être** ni la qualité de vie ;","il **ignore les dégâts environnementaux** (une marée noire peut même faire monter le PIB via les dépenses de nettoyage !)."]},{t:"p",c:"D’autres indicateurs complètent le PIB : l’**IDH** (Indice de Développement Humain : santé, éducation, niveau de vie) et des indicateurs de **développement durable**."}]}],essentiel:["Produire = créer biens/services ; production **marchande** (vendue) vs **non marchande** (gratuite, financée par l’impôt).","Deux **facteurs de production** : **travail** + **capital** (fixe / circulant) ; investir = augmenter le capital.","La **productivité** (production / moyens) et le **progrès technique** sont les moteurs de la croissance.","**Valeur ajoutée = production − consommations intermédiaires** ; elle est **répartie** entre salariés, État, banques, propriétaires.","**PIB = somme des valeurs ajoutées** d’un territoire sur un an ; la **croissance** = hausse du PIB.","Le PIB est **limité** : ni bien-être, ni inégalités, ni environnement, ni travail non rémunéré → **IDH**, développement durable."],resources:[{kind:"video",label:"Valeur ajoutée, PIB, croissance",note:"Vidéos — recherche YouTube",url:T("valeur ajoutée PIB croissance facteurs de production première STMG économie")}],games:[{id:"p1-eco-t2-qcm",type:"qcm",title:"QCM — Créer et mesurer la richesse",icon:"❓",questions:[{q:"La valeur ajoutée se calcule…",choices:["production − consommations intermédiaires","production + impôts","salaires + profit","CA − TVA"],answer:0,explain:"VA = valeur de la production − consommations intermédiaires."},{q:"Une boulangerie produit 300 000 € en consommant 90 000 €. Sa VA est…",choices:["210 000 €","390 000 €","90 000 €","300 000 €"],answer:0,explain:"VA = 300 000 − 90 000 = 210 000 €."},{q:"Le PIB est…",choices:["la somme des valeurs ajoutées d’un territoire sur un an","le total des salaires","le montant des impôts","le chiffre d’affaires mondial"],answer:0,explain:"Le PIB agrège les VA produites sur un territoire."},{q:"Une limite du PIB est qu’il ne mesure pas…",choices:["le bien-être ni les inégalités","la production","la croissance","les échanges"],answer:0,explain:"Il ignore bien-être, inégalités, environnement, travail non rémunéré."},{q:"Les deux facteurs de production sont…",choices:["le travail et le capital","l’offre et la demande","le prix et la quantité","l’actif et le passif"],answer:0,explain:"On combine travail (main-d’œuvre) et capital (équipements)."}]},{id:"p1-eco-t2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le PIB est la somme des valeurs ajoutées.",answer:!0,explain:"Vrai, sur un territoire et une année."},{statement:"Le PIB mesure parfaitement le bien-être.",answer:!1,explain:"Faux : c’est un indicateur limité."},{statement:"Gagner en productivité peut être source de croissance.",answer:!0,explain:"Vrai : produire plus avec autant de facteurs."}]},{id:"p1-eco-t2-flash",type:"flashcard",title:"Flashcards — Richesse",icon:"🃏",cards:[{front:"Valeur ajoutée",back:"Production − consommations intermédiaires."},{front:"PIB",back:"Somme des valeurs ajoutées d’un territoire sur un an."},{front:"Limites du PIB",back:"N’intègre ni bien-être, ni inégalités, ni environnement."},{front:"Productivité",back:"Efficacité de la production (source de croissance)."}]}]},{id:"p1-eco-t3",name:"Thème 3 — Comment répartir les revenus et la richesse ?",short:"Répartition des revenus",keywords:"répartition primaire revenus travail capital mixtes redistribution prélèvements prestations revenu disponible consommation épargne taux d’épargne pouvoir d’achat patrimoine",intro:"La richesse créée (la VA) est **répartie**, d’abord entre ceux qui ont produit, puis **corrigée** par l’État pour réduire les inégalités.",cours:[{h:"La répartition primaire des revenus",blocks:[{t:"p",c:"La richesse créée (la **valeur ajoutée**) est d’abord partagée entre ceux qui ont **participé à la production** : c’est la **répartition primaire**, qui donne les **revenus primaires**."},{t:"p",c:"Ces revenus rémunèrent la contribution de chacun à la production, **avant** toute intervention de l’État."}]},{h:"Les types de revenus primaires",blocks:[{t:"table",head:["Type de revenu","Rémunère…","Exemples"],rows:[["Revenus du **travail**","Le facteur travail","Salaires, traitements"],["Revenus du **capital**","Le facteur capital / propriété","Intérêts, loyers, dividendes"],["Revenus **mixtes**","Travail **et** capital ensemble","Bénéfices des indépendants (artisan, médecin)"]]},{t:"p",c:"Les revenus **mixtes** concernent les **indépendants** : leur bénéfice rémunère à la fois leur travail et le capital qu’ils ont investi — impossible de séparer les deux."}]},{h:"La redistribution et le rôle de l’État",blocks:[{t:"p",c:"La répartition primaire laisse de fortes **inégalités**. L’État intervient donc pour les **corriger** : c’est la **redistribution**. Elle fonctionne en deux temps :"},{t:"list",c:["il **prélève** : les **prélèvements obligatoires** (impôts + cotisations sociales) ;","il **verse** : les **revenus de transfert** (prestations sociales : allocations familiales, retraites, aides au logement, minima sociaux)."]},{t:"p",c:"La redistribution finance aussi la **protection sociale** (maladie, chômage, vieillesse) : c’est la **solidarité** organisée entre les citoyens."}]},{h:"Le revenu disponible",blocks:[{t:"p",c:"Après la redistribution, le ménage obtient son **revenu disponible** : ce qui lui reste réellement pour **consommer** ou **épargner**."},{t:"formula",c:"Revenu disponible = Revenus primaires − Prélèvements obligatoires + Revenus de transfert"},{t:"example",h:"Calcul du revenu disponible",c:`Un ménage a 3 000 € de revenus primaires, paie 800 € de prélèvements et reçoit 200 € de prestations. 
→ Revenu disponible = 3 000 − 800 + 200 = **2 400 €**.`}]},{h:"Consommer ou épargner",blocks:[{t:"p",c:"Avec son revenu disponible, le ménage **arbitre** : **consommer** (dépenser maintenant) ou **épargner** (mettre de côté pour plus tard)."},{t:"formula",c:"Taux d’épargne = épargne / revenu disponible"},{t:"example",h:"Calcul du taux d’épargne",c:"Revenu disponible **2 500 €**, consommation **2 100 €** → épargne = 400 € → taux d’épargne = 400 / 2 500 = **16 %**."},{t:"p",c:"Le partage consommation / épargne dépend du revenu, de l’âge, de la confiance dans l’avenir : plus le revenu est élevé, plus la part épargnée tend à être grande."}]},{h:"Pouvoir d’achat et patrimoine",blocks:[{t:"p",c:"Le **pouvoir d’achat** est ce que le revenu permet **réellement d’acheter**, compte tenu des **prix**. Si les prix (inflation) augmentent plus vite que le revenu, le pouvoir d’achat **baisse**, même si le revenu en euros augmente."},{t:"p",c:"Le **patrimoine** est l’ensemble de ce que possède un ménage (logement, épargne, placements) : c’est un **stock** accumulé, à distinguer du **revenu** qui est un **flux** (ce qu’on gagne sur une période)."},{t:"warning",c:"Ne confonds pas **revenu** (un flux, ce qu’on gagne chaque mois) et **patrimoine** (un stock, ce qu’on possède). On peut avoir un gros patrimoine et un faible revenu, et inversement."}]},{h:"Inégalités et justice sociale",blocks:[{t:"p",c:"Les revenus et les patrimoines sont **inégalement répartis**. La **justice sociale** cherche à rendre cette répartition plus **équitable**, mais il existe plusieurs conceptions de ce qui est « juste »."},{t:"p",c:"La redistribution vise à réduire ces inégalités. Mais elle fait débat : trop de prélèvements peut **décourager** l’effort et l’investissement ; trop peu laisse se creuser les inégalités. C’est un **arbitrage** politique permanent entre **efficacité** et **équité**."}]}],essentiel:["Répartition **primaire** : **revenus primaires** = revenus du **travail** (salaires) + du **capital** (intérêts, loyers, dividendes) + **mixtes** (indépendants).","**Redistribution** de l’État : **prélèvements obligatoires** (impôts, cotisations) → **revenus de transfert** (prestations) ; finance la **protection sociale**.","**Revenu disponible = revenus primaires − prélèvements obligatoires + revenus de transfert**.","**Taux d’épargne = épargne / revenu disponible** ; arbitrage consommer / épargner.","**Pouvoir d’achat** = ce que le revenu permet d’acheter (selon les prix) ; **patrimoine** (stock) ≠ **revenu** (flux).","La **redistribution** réduit les **inégalités** : arbitrage entre **équité** et **efficacité** (justice sociale)."],resources:[{kind:"video",label:"Répartition et redistribution des revenus",note:"Vidéos — recherche YouTube",url:T("répartition primaire redistribution revenu disponible taux épargne première STMG")}],games:[{id:"p1-eco-t3-qcm",type:"qcm",title:"QCM — Répartition des revenus",icon:"❓",questions:[{q:"Les salaires sont des revenus…",choices:["du travail","du capital","mixtes","de transfert"],answer:0,explain:"Travail = salaires ; capital = intérêts, loyers, dividendes ; mixtes = indépendants."},{q:"La redistribution consiste à…",choices:["prélever des prélèvements obligatoires et verser des revenus de transfert","produire des biens","fixer les prix","créer de la monnaie"],answer:0,explain:"Elle corrige la répartition primaire pour réduire les inégalités."},{q:"La formule du revenu disponible est…",choices:["revenus primaires − prélèvements obligatoires + revenus de transfert","revenus primaires + prélèvements obligatoires","salaires − TVA","consommation + épargne − impôts"],answer:0,explain:"Revenu disponible = revenus primaires − prélèvements obligatoires (impôts, cotisations) + revenus de transfert (prestations)."},{q:"Revenu disponible 2 500 €, consommation 2 100 €. Taux d’épargne ?",choices:["16 %","84 %","40 %","4 %"],answer:0,explain:"Épargne = 400 ; 400/2 500 = 0,16 = 16 %."}]},{id:"p1-eco-t3-tri",type:"tri",title:"Tri — Type de revenu",icon:"🗂️",instruction:"Classe chaque revenu.",categories:[{id:"trav",label:"Revenu du travail"},{id:"cap",label:"Revenu du capital"}],items:[{text:"Un salaire",cat:"trav"},{text:"Un loyer perçu",cat:"cap"},{text:"Des dividendes",cat:"cap"},{text:"Un traitement de fonctionnaire",cat:"trav"},{text:"Des intérêts d’un placement",cat:"cap"}]},{id:"p1-eco-t3-flash",type:"flashcard",title:"Flashcards — Revenus",icon:"🃏",cards:[{front:"Répartition primaire",back:"Partage de la VA en revenus primaires : travail, capital, mixtes."},{front:"Redistribution",back:"Prélèvements obligatoires + revenus de transfert pour réduire les inégalités."},{front:"Revenu disponible",back:"Revenus primaires − prélèvements obligatoires + revenus de transfert."},{front:"Pouvoir d’achat",back:"Ce que le revenu permet réellement d’acheter."}]}]},{id:"p1-eco-t4",name:"Thème 4 — Comment les agents économiques se financent-ils ?",short:"Le financement",keywords:"besoin capacité de financement direct indirect marché financier actions obligations banque crédit banque centrale taux directeurs",intro:"Certains agents dépensent plus qu’ils ne gagnent (**besoin de financement**), d’autres épargnent (**capacité de financement**). Le système financier met les deux en relation.",cours:[{h:"Besoin et capacité de financement",blocks:[{t:"p",c:"Sur une période, un agent économique peut être dans deux situations opposées selon que ses **dépenses** dépassent ou non ses **ressources** :"},{t:"table",head:["Besoin de financement","Capacité de financement"],rows:[["Dépenses **>** ressources","Ressources **>** dépenses"],["Il faut **trouver** des fonds","Il reste de l’**épargne** à placer"],["Souvent : entreprises, État","Souvent : ménages"]]},{t:"p",c:"Le **système financier** a pour rôle de **mettre en relation** ceux qui ont un besoin de financement avec ceux qui ont une capacité de financement (les épargnants)."}]},{h:"Financement interne et externe",blocks:[{t:"p",c:"Pour se financer, un agent (surtout une entreprise) a d’abord un choix de base :"},{t:"list",c:["le **financement interne** (**autofinancement**) : utiliser sa **propre épargne**, ses bénéfices mis en réserve — pas de dette, mais des moyens limités ;","le **financement externe** : trouver des fonds **à l’extérieur**, soit sur le **marché financier** (direct), soit auprès d’une **banque** (indirect)."]}]},{h:"Le financement direct (le marché financier)",blocks:[{t:"p",c:"Dans le financement **direct** (ou désintermédié), l’agent obtient des fonds **directement** des épargnants, sur le **marché financier** (la **Bourse**), en **émettant des titres**. Il n’y a pas d’intermédiaire qui prête son propre argent."},{t:"p",c:"La **Bourse** est le lieu (aujourd’hui électronique) où s’échangent ces titres : elle permet aux entreprises de lever des fonds et aux épargnants de placer leur argent."}]},{h:"Actions et obligations",blocks:[{t:"p",c:"Sur le marché financier, on émet deux grands types de titres, très différents :"},{t:"table",head:["Action","Obligation"],rows:[["Titre de **propriété** (part de l’entreprise)","Titre de **dette** (un prêt)"],["Rapporte un **dividende** (variable)","Rapporte un **intérêt** (fixé d’avance)"],["L’actionnaire est **copropriétaire**","L’obligataire est **créancier**"],["Risqué (pas de garantie)","Plus sûr (remboursement prévu)"]]},{t:"warning",c:"Piège classique : **action = propriété**, **obligation = dette**. Acheter une action, c’est devenir **copropriétaire** ; acheter une obligation, c’est **prêter** de l’argent."}]},{h:"Le financement indirect (les banques)",blocks:[{t:"p",c:"Dans le financement **indirect** (ou intermédié), l’agent passe par un **intermédiaire** : la **banque**. Elle **collecte** l’épargne des uns et accorde des **crédits** aux autres, remboursés **avec intérêts**."},{t:"p",c:"C’est le mode de financement le plus courant pour les **ménages** (crédit immobilier, crédit conso) et les **petites entreprises**, qui n’ont pas accès facilement à la Bourse."}]},{h:"La création monétaire",blocks:[{t:"p",c:"Fait surprenant : quand une banque accorde un **crédit**, elle **crée de la monnaie**. Elle n’a pas besoin de posséder au préalable tout l’argent prêté : elle inscrit simplement la somme sur le compte de l’emprunteur. « **Les crédits font les dépôts.** »"},{t:"p",c:"Quand le crédit est **remboursé**, cette monnaie est **détruite**. La création monétaire soutient l’activité, mais si elle est excessive, elle peut alimenter l’**inflation** (hausse des prix)."}]},{h:"La banque centrale et les taux directeurs",blocks:[{t:"p",c:"La **banque centrale** (la **BCE**, Banque Centrale Européenne, pour la zone euro) supervise les banques et pilote la **politique monétaire**. Son principal outil : les **taux directeurs**, le taux auquel les banques se refinancent auprès d’elle."},{t:"table",head:["La BCE baisse ses taux","La BCE augmente ses taux"],rows:[["Le crédit devient **moins cher**","Le crédit devient **plus cher**"],["On emprunte plus → activité **stimulée**","On emprunte moins → activité **freinée**"],["Objectif : relancer l’économie","Objectif : **freiner l’inflation**"]]},{t:"p",c:"La mission principale de la BCE est de **maintenir la stabilité des prix** (une inflation faible et maîtrisée)."}]}],essentiel:["**Besoin** de financement (dépenses > ressources) vs **capacité** de financement (épargne) ; le système financier les met en relation.","Financement **interne** (autofinancement) vs **externe** ; externe = **direct** (marché) ou **indirect** (banque).","Financement **direct** sur le **marché financier** (Bourse) : **actions** (propriété, dividende) vs **obligations** (dette, intérêt).","Financement **indirect** = **crédit bancaire** (avec intérêts), le plus courant pour ménages et petites entreprises.","Les banques **créent de la monnaie** par le crédit (« les crédits font les dépôts ») ; excès → **inflation**.","La **BCE** pilote la politique monétaire via ses **taux directeurs** (baisse = relance, hausse = freine l’inflation) ; objectif : **stabilité des prix**."],resources:[{kind:"video",label:"Le financement de l’économie",note:"Vidéos — recherche YouTube",url:T("financement direct indirect actions obligations banque première STMG économie")}],games:[{id:"p1-eco-t4-qcm",type:"qcm",title:"QCM — Le financement",icon:"❓",questions:[{q:"Un agent qui épargne a une…",choices:["capacité de financement","besoin de financement","dette obligatoire","obligation légale"],answer:0,explain:"Capacité de financement = épargne disponible ; besoin = dépenses > ressources."},{q:"Emprunter auprès d’une banque est un financement…",choices:["indirect (intermédié)","direct","interne","gratuit"],answer:0,explain:"La banque est l’intermédiaire ; le marché financier = direct."},{q:"Une action est…",choices:["un titre de propriété d’une entreprise","un titre de dette","un crédit bancaire","un impôt"],answer:0,explain:"Action = part de propriété ; obligation = titre de dette."},{q:"La BCE agit sur l’économie via…",choices:["ses taux directeurs","la TVA","le SWOT","les cotisations"],answer:0,explain:"Baisser les taux stimule le crédit ; les monter freine l’inflation."}]},{id:"p1-eco-t4-tri",type:"tri",title:"Tri — Financement direct ou indirect ?",icon:"🗂️",instruction:"Classe chaque mode de financement.",categories:[{id:"dir",label:"Direct (marché)"},{id:"ind",label:"Indirect (banque)"}],items:[{text:"Émettre des actions en Bourse",cat:"dir"},{text:"Un crédit bancaire",cat:"ind"},{text:"Émettre des obligations",cat:"dir"},{text:"Un emprunt auprès de sa banque",cat:"ind"}]},{id:"p1-eco-t4-flash",type:"flashcard",title:"Flashcards — Financement",icon:"🃏",cards:[{front:"Besoin / capacité de financement",back:"Dépenser plus que gagner / épargner."},{front:"Financement direct",back:"Marché financier : actions et obligations."},{front:"Financement indirect",back:"Crédit accordé par une banque."},{front:"Taux directeurs (BCE)",back:"Outil pour stimuler l’économie ou freiner l’inflation."}]}]},{id:"p1-eco-t5",name:"Thème 5 — Les marchés sont-ils concurrentiels ?",short:"Le marché",keywords:"marché offre demande prix d’équilibre élasticité-prix coût marginal concurrence parfaite imparfaite monopole oligopole barrières à l’entrée",intro:"Un **marché** est le lieu de rencontre de l’**offre** et de la **demande**. De leur confrontation naît le **prix d’équilibre**. Mais la concurrence est souvent **imparfaite**.",cours:[{h:"Qu’est-ce qu’un marché ?",blocks:[{t:"p",c:"Un **marché** est le lieu (physique ou non) de **rencontre** entre une **offre** et une **demande**, où s’échange un bien ou un service à un **prix**. Il peut être très concret (un marché de fruits) ou totalement dématérialisé (le marché des actions, une plateforme en ligne)."},{t:"p",c:"Il existe des marchés de **biens et services**, du **travail**, des **capitaux**… Sur chacun, c’est la confrontation offre/demande qui détermine le **prix** et les **quantités** échangées."}]},{h:"L’offre et la demande",blocks:[{t:"p",c:"L’**offre** et la **demande** réagissent au **prix**, mais en sens **opposé** :"},{t:"table",head:["Quand le prix augmente…","Effet"],rows:[["La **demande**","diminue (les acheteurs renoncent)"],["L’**offre**","augmente (produire devient plus rentable)"]]},{t:"p",c:"C’est la **loi de l’offre et de la demande** : la demande est **décroissante** avec le prix, l’offre est **croissante** avec le prix."}]},{h:"Le prix d’équilibre",blocks:[{t:"p",c:"Le **prix d’équilibre** est le prix pour lequel la **quantité offerte = la quantité demandée**. Le marché tend naturellement vers ce prix :"},{t:"list",c:["si le prix est **trop haut** : l’offre dépasse la demande → **surplus** → les prix baissent ;","si le prix est **trop bas** : la demande dépasse l’offre → **pénurie** → les prix montent."]},{t:"example",h:"Rareté et prix",c:`Une gelée détruit une partie de la récolte de fraises. 
→ L’**offre** chute alors que la **demande** reste forte : le **prix d’équilibre augmente**. Le prix joue son rôle de signal (la rareté se paie plus cher).`}]},{h:"L’élasticité-prix de la demande",blocks:[{t:"p",c:"L’**élasticité-prix de la demande** mesure la **sensibilité de la demande à une variation de prix** : « de combien la demande baisse-t-elle quand le prix augmente ? »"},{t:"table",head:["Demande élastique","Demande peu élastique"],rows:[["**Très sensible** au prix","Peu sensible au prix"],["Une hausse fait **beaucoup** baisser la demande","La demande change peu"],["Produits non essentiels, avec substituts","Produits de **première nécessité** (pain, essence, médicaments)"]]},{t:"p",c:"C’est une notion clé pour fixer les prix : sur un produit à demande **peu élastique**, une hausse de prix fait peu fuir les clients."}]},{h:"Le coût marginal et la décision du producteur",blocks:[{t:"p",c:"Le **coût marginal** est le coût de production d’**une unité supplémentaire**. C’est un repère essentiel de la décision de produire."},{t:"p",c:"Le producteur a intérêt à produire **une unité de plus tant que son prix de vente couvre le coût marginal**. Au-delà, produire davantage lui coûterait plus que ça ne lui rapporte."}]},{h:"La concurrence pure et parfaite",blocks:[{t:"p",c:"La **concurrence pure et parfaite** est un **modèle théorique** qui suppose **cinq conditions** réunies :"},{t:"list",c:["**atomicité** : de très nombreux vendeurs et acheteurs, aucun assez gros pour influencer le prix ;","**homogénéité** : les produits sont **identiques** ;","**libre entrée et sortie** du marché ;","**transparence** : information parfaite de tous ;","**libre circulation** des facteurs de production."]},{t:"p",c:"Dans ce modèle, aucun acteur n’a de **pouvoir de marché** : tous « subissent » le prix. C’est un idéal théorique, rarement observé en réalité."}]},{h:"La concurrence imparfaite : monopole et oligopole",blocks:[{t:"p",c:"En pratique, la concurrence est souvent **imparfaite** : certains acteurs ont un **pouvoir de marché** (capacité à influencer le prix)."},{t:"table",head:["Structure","Nombre de vendeurs","Exemple"],rows:[["**Monopole**","Un **seul** vendeur","La distribution d’eau d’une commune"],["**Oligopole**","**Quelques** vendeurs","Téléphonie mobile, carburants"],["Concurrence monopolistique","Beaucoup, mais produits **différenciés**","Restaurants, vêtements de marque"]]},{t:"p",c:"Moins il y a de vendeurs, plus ils ont de **pouvoir sur les prix** — au détriment, souvent, du consommateur."}]},{h:"Barrières à l’entrée et asymétries d’information",blocks:[{t:"p",c:"Deux phénomènes expliquent que la concurrence reste imparfaite :"},{t:"list",c:["les **barrières à l’entrée** : obstacles qui empêchent de nouveaux concurrents d’arriver (coûts d’investissement très élevés, **brevets**, réglementation, notoriété d’une marque) — elles **protègent** les acteurs en place ;","les **asymétries d’information** : une partie en sait plus que l’autre (le vendeur d’une voiture d’occasion connaît mieux ses défauts que l’acheteur), ce qui fausse l’échange."]},{t:"p",c:"Pour préserver une concurrence saine, l’**État** (et l’**Autorité de la concurrence**) surveille et sanctionne les abus (ententes, abus de position dominante)."}]}],essentiel:["Un **marché** = rencontre d’une **offre** et d’une **demande** ; loi de l’offre et de la demande (demande décroissante, offre croissante avec le prix).","Le **prix d’équilibre** égalise quantité offerte et demandée (trop haut → surplus ; trop bas → pénurie).","**Élasticité-prix** = sensibilité de la demande au prix (élastique / peu élastique pour les biens de première nécessité).","**Coût marginal** = coût d’une unité supplémentaire ; on produit tant que le prix le couvre.","**Concurrence pure et parfaite** = 5 conditions (atomicité, homogénéité, libre entrée/sortie, transparence, mobilité) : un modèle théorique.","Concurrence **imparfaite** : **monopole**, **oligopole**, **barrières à l’entrée**, **asymétries d’information** → pouvoir de marché."],resources:[{kind:"video",label:"Marché, offre, demande, concurrence",note:"Vidéos — recherche YouTube",url:T("marché offre demande prix équilibre concurrence imparfaite première STMG")}],games:[{id:"p1-eco-t5-qcm",type:"qcm",title:"QCM — Le marché",icon:"❓",questions:[{q:"Le prix d’équilibre est celui pour lequel…",choices:["la quantité offerte = la quantité demandée","l’offre est nulle","la demande est infinie","le vendeur perd de l’argent"],answer:0,explain:"À l’équilibre, offre et demande s’égalisent."},{q:"Si un produit devient rare, son prix a tendance à…",choices:["augmenter","baisser","rester identique","disparaître"],answer:0,explain:"L’offre baisse alors que la demande reste forte → hausse du prix."},{q:"L’élasticité-prix de la demande mesure…",choices:["la sensibilité de la demande au prix","le coût d’une unité","le nombre de vendeurs","la marge"],answer:0,explain:"Forte sensibilité = demande élastique ; faible = peu élastique."},{q:"Un marché avec un seul vendeur est un…",choices:["monopole","oligopole","marché parfait","marché libre"],answer:0,explain:"Monopole = un vendeur ; oligopole = quelques-uns."},{q:"Les barrières à l’entrée…",choices:["freinent l’arrivée de nouveaux concurrents","garantissent la concurrence parfaite","baissent les prix","suppriment les monopoles"],answer:0,explain:"Coûts, brevets, réglementation protègent les acteurs en place."}]},{id:"p1-eco-t5-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"En concurrence pure et parfaite, les produits sont identiques.",answer:!0,explain:"Vrai : c’est l’une des hypothèses (homogénéité)."},{statement:"Un produit de première nécessité a une demande très élastique.",answer:!1,explain:"Faux : elle est peu élastique (on l’achète quel que soit le prix)."},{statement:"Le coût marginal est le coût d’une unité supplémentaire.",answer:!0,explain:"Vrai : on produit tant que le prix le couvre."}]},{id:"p1-eco-t5-flash",type:"flashcard",title:"Flashcards — Le marché",icon:"🃏",cards:[{front:"Prix d’équilibre",back:"Prix où quantité offerte = quantité demandée."},{front:"Élasticité-prix",back:"Sensibilité de la demande à une variation de prix."},{front:"Coût marginal",back:"Coût de production d’une unité supplémentaire."},{front:"Monopole / oligopole",back:"Un seul / quelques vendeurs (concurrence imparfaite)."}]}]}]},Mh={id:"p1-maths",name:"Mathématiques",short:"Maths",icon:"🧮",color:"#2563eb",niveau:"premiere",tagline:"Maths appliquées à la gestion (contrôle continu).",chapters:[{id:"p1-math-c1",name:"Chapitre 1 — Information chiffrée",short:"Information chiffrée",keywords:"proportion pourcentage taux d’évolution coefficient multiplicateur évolutions successives réciproque",intro:"Proportions et évolutions sont partout en gestion. Ce chapitre apprend à les manier sans se tromper.",cours:[{h:"Proportion et taux d’évolution",blocks:[{t:"p",c:"Une **proportion** = partie / tout (× 100 pour un pourcentage). Ex. 15 filles sur 30 → 50 %."},{t:"formula",c:"t = (Valeur d’arrivée − Valeur de départ) / Valeur de départ · CM = 1 + t"},{t:"example",h:"Exemple",c:"Un prix passe de 200 € à 250 € → t = 50/200 = **+25 %** (CM = 1,25)."}]},{h:"Évolutions successives et réciproque",blocks:[{t:"p",c:"Pour enchaîner des évolutions, on **multiplie les CM** (jamais additionner les taux !). Ex. +20 % puis −10 % → 1,20 × 0,90 = 1,08 = **+8 %**."},{t:"warning",c:"Évolution réciproque : après +25 % (×1,25), pour revenir il faut ×(1/1,25) = 0,80, soit **−20 %** (et non −25 %)."}]}],essentiel:["t = (arrivée − départ) / départ ; **CM = 1 + t**.","Évolutions successives : on **multiplie les CM** (on n’additionne pas les taux).","Réciproque : CM réciproque = 1 / CM."],resources:[{kind:"video",label:"Taux d’évolution et coefficient multiplicateur",note:"Vidéos — recherche YouTube",url:T("taux évolution coefficient multiplicateur première STMG maths")}],games:[{id:"p1-math-c1-calc",type:"calcul",title:"Calcul express — Taux d’évolution",icon:"⚡",gen:"taux_evolution",count:5},{id:"p1-math-c1-calc2",type:"calcul",title:"Calcul express — Évolutions successives",icon:"⚡",gen:"cm_successif",count:5},{id:"p1-math-c1-qcm",type:"qcm",title:"QCM — Information chiffrée",icon:"❓",questions:[{q:"Un prix passe de 200 € à 250 €. Taux d’évolution ?",choices:["+25 %","+50 %","+20 %","+5 %"],answer:0,explain:"t = 50/200 = 0,25 = +25 %."},{q:"Le CM d’une baisse de 10 % est…",choices:["0,90","1,10","0,10","10"],answer:0,explain:"CM = 1 − 0,10 = 0,90."},{q:"+20 % puis −10 % donne au total…",choices:["+8 %","+10 %","−8 %","+30 %"],answer:0,explain:"1,20 × 0,90 = 1,08 → +8 %."}]}]},{id:"p1-math-c2",name:"Chapitre 2 — Suites numériques",short:"Suites",keywords:"suite arithmétique géométrique raison linéaire exponentielle",intro:"Une **suite** est une liste ordonnée de nombres. Deux modèles clés en gestion : arithmétique et géométrique.",cours:[{h:"La suite arithmétique",blocks:[{t:"p",c:"Dans une suite **arithmétique**, on passe d’un terme au suivant en **ajoutant** toujours le même nombre, la **raison r** : u_{n+1} = u_n + r."},{t:"formula",c:"Terme général : u_n = u_0 + n × r — croissance **linéaire**."},{t:"example",h:"Exemple",c:"Un salaire de 1 500 € augmente de 50 €/an : c’est arithmétique (r = 50). Au bout de 4 ans : u_4 = 1 500 + 4 × 50 = **1 700 €**."}]},{h:"La suite géométrique",blocks:[{t:"p",c:"Dans une suite **géométrique**, on passe d’un terme au suivant en **multipliant** toujours par le même nombre, la **raison q** : u_{n+1} = u_n × q."},{t:"formula",c:"Terme général : u_n = u_0 × q^n — croissance **exponentielle**."},{t:"example",h:"Exemple",c:"Capital de 1 000 € placé à 3 %/an → q = 1,03 : u_5 = 1 000 × 1,03⁵ ≈ **1 159 €**. Astuce : toute évolution en **% fixe** donne une suite **géométrique** (q = 1 + t)."}]}],essentiel:["Arithmétique : **u_n = u_0 + n·r** (linéaire).","Géométrique : **u_n = u_0 × q^n** (exponentielle).","Évolution en % constant → suite **géométrique** (q = 1 + t)."],resources:[{kind:"video",label:"Suites arithmétiques et géométriques",note:"Vidéos — recherche YouTube",url:T("suites arithmétiques géométriques première STMG maths")}],games:[{id:"p1-math-c2-calc",type:"calcul",title:"Calcul express — Suite géométrique",icon:"⚡",gen:"suite_geo",count:5},{id:"p1-math-c2-qcm",type:"qcm",title:"QCM — Suites",icon:"❓",questions:[{q:"Un capital placé à taux fixe forme une suite…",choices:["géométrique","arithmétique","constante","aléatoire"],answer:0,explain:"Évolution en % constant → géométrique (q = 1 + t)."},{q:"Pour une suite arithmétique, u_n = …",choices:["u_0 + n·r","u_0 × q^n","u_0 − r","n × q"],answer:0,explain:"Suite arithmétique : on ajoute la raison r."},{q:"Un salaire de 1 500 € + 50 €/an au bout de 4 ans :",choices:["1 700 €","1 650 €","2 000 €","1 550 €"],answer:0,explain:"u_4 = 1 500 + 4×50 = 1 700 €."}]},{id:"p1-math-c2-flash",type:"flashcard",title:"Flashcards — Suites",icon:"🃏",cards:[{front:"Suite arithmétique",back:"On ajoute la raison r : u_n = u_0 + n·r."},{front:"Suite géométrique",back:"On multiplie par la raison q : u_n = u_0 × q^n."},{front:"Placement à t %",back:"Suite géométrique de raison q = 1 + t."}]}]},{id:"p1-math-c3",name:"Chapitre 3 — Second degré et fonctions",short:"Second degré",keywords:"polynôme second degré parabole sommet maximum minimum fonction inverse hyperbole",intro:"La fonction du **second degré** modélise beaucoup de situations d’optimisation (bénéfice max, coût min).",cours:[{h:"La parabole et le sens de la concavité",blocks:[{t:"p",c:"La fonction du **second degré** s’écrit f(x) = ax² + bx + c (avec a ≠ 0) et sa courbe est une **parabole**."},{t:"list",c:["Si **a > 0** : parabole tournée vers le haut (∪), la fonction admet un **minimum**.","Si **a < 0** : parabole tournée vers le bas (∩), la fonction admet un **maximum**."]},{t:"p",c:"La courbe est **symétrique** par rapport à l’axe vertical qui passe par le sommet."}]},{h:"Le sommet et l’optimisation",blocks:[{t:"p",c:"Le **sommet** de la parabole est le point où la fonction atteint son **extremum** (maximum si a < 0, minimum si a > 0)."},{t:"p",c:"C’est ce qui rend le second degré très utile en gestion : il modélise un **bénéfice à maximiser** ou un **coût à minimiser**."},{t:"example",h:"Exemple",c:"Un bénéfice B(x) = −2x² + 12x (en centaines d’€) est maximal au sommet, en x = 3 : B(3) = **18** → 1 800 € pour 3 unités."}]}],essentiel:["f(x) = ax² + bx + c → **parabole**.","**a > 0** : minimum (∪) ; **a < 0** : maximum (∩).","Le **sommet** donne l’extremum ; sert à l’**optimisation**."],resources:[{kind:"video",label:"Fonctions du second degré",note:"Vidéos — recherche YouTube",url:T("fonction second degré parabole sommet première STMG maths")}],games:[{id:"p1-math-c3-qcm",type:"qcm",title:"QCM — Second degré",icon:"❓",questions:[{q:"La courbe de f(x) = ax² + bx + c est…",choices:["une parabole","une droite","un cercle","une hyperbole"],answer:0,explain:"Le second degré donne une parabole."},{q:"Si a < 0, la fonction du second degré a un…",choices:["maximum","minimum","ni max ni min","point d’inflexion"],answer:0,explain:"a < 0 : parabole vers le bas (∩) → maximum."},{q:"Le point qui donne l’extremum de la parabole est…",choices:["le sommet","l’origine","l’axe des x","le foyer"],answer:0,explain:"Le sommet donne le minimum ou le maximum."}]},{id:"p1-math-c3-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Si a > 0, la parabole est tournée vers le haut.",answer:!0,explain:"Vrai : ∪, la fonction a un minimum."},{statement:"La parabole n’a aucun axe de symétrie.",answer:!1,explain:"Faux : elle est symétrique par rapport à la verticale passant par le sommet."}]},{id:"p1-math-c3-flash",type:"flashcard",title:"Flashcards — Second degré",icon:"🃏",cards:[{front:"f(x) = ax² + bx + c",back:"Sa courbe est une parabole."},{front:"Signe de a",back:"a > 0 : minimum (∪) ; a < 0 : maximum (∩)."},{front:"Sommet",back:"Donne l’extremum ; axe de symétrie vertical passant par lui."}]}]},{id:"p1-math-c4",name:"Chapitre 4 — Dérivation",short:"Dérivation",keywords:"nombre dérivé tangente dérivées signe variations extremum optimisation",intro:"La **dérivée** mesure comment une fonction varie. C’est l’outil de l’**optimisation**.",cours:[{h:"Le nombre dérivé et la tangente",blocks:[{t:"p",c:"Le **nombre dérivé** f’(a) est le **coefficient directeur de la tangente** à la courbe au point d’abscisse a : il mesure la « pente » de la courbe en ce point."},{t:"formula",c:"Équation de la tangente en a : y = f’(a)(x − a) + f(a)."},{t:"p",c:"Dérivées à connaître : (constante)’ = 0 ; (x²)’ = 2x ; **(ax² + bx + c)’ = 2ax + b**."},{t:"figure",name:"derivee"}]},{h:"Signe de la dérivée, variations et extremum",blocks:[{t:"list",c:["f’(x) > 0 sur un intervalle → f est **croissante** ;","f’(x) < 0 sur un intervalle → f est **décroissante** ;","f’(x) = 0 en **changeant de signe** → la fonction atteint un **extremum** (max ou min)."]},{t:"p",c:"C’est l’outil de l’**optimisation** : on cherche où la dérivée s’annule pour trouver un maximum (bénéfice) ou un minimum (coût)."},{t:"example",h:"Exemple",c:"f(x) = −2x² + 12x → f’(x) = −4x + 12, qui s’annule en x = 3. La dérivée passe du + au −, donc **maximum** : f(3) = **18**."}]}],essentiel:["f’(a) = pente de la **tangente** en a ; tangente : y = f’(a)(x − a) + f(a).","(ax² + bx + c)’ = **2ax + b**.","f’ > 0 croissante · f’ < 0 décroissante · f’ = 0 (change de signe) → extremum."],resources:[{kind:"video",label:"Dérivation et variations",note:"Vidéos — recherche YouTube",url:T("dérivation nombre dérivé signe variations première STMG maths")}],games:[{id:"p1-math-c4-calc",type:"calcul",title:"Calcul express — Nombre dérivé",icon:"⚡",gen:"derivee_affine",count:5},{id:"p1-math-c4-qcm",type:"qcm",title:"QCM — Dérivation",icon:"❓",questions:[{q:"La dérivée de ax² + bx + c est…",choices:["2ax + b","ax + b","2ax","a x² + b"],answer:0,explain:"(ax² + bx + c)’ = 2ax + b."},{q:"Si f’(x) > 0 sur un intervalle, alors f est…",choices:["croissante","décroissante","constante","négative"],answer:0,explain:"f’ > 0 ⇒ f croissante."},{q:"f(x) = −2x² + 12x. f’(x) s’annule en…",choices:["x = 3","x = 6","x = 12","x = 0"],answer:0,explain:"−4x + 12 = 0 ⇔ x = 3 (maximum)."}]},{id:"p1-math-c4-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La dérivée de ax² + bx + c est 2ax + b.",answer:!0,explain:"Vrai."},{statement:"Si f’(x) < 0, la fonction est croissante.",answer:!1,explain:"Faux : f’ < 0 ⇒ décroissante."},{statement:"Un extremum est atteint là où f’ s’annule en changeant de signe.",answer:!0,explain:"Vrai : max ou min."}]}]},{id:"p1-math-c5",name:"Chapitre 5 — Statistiques à une variable",short:"Statistiques",keywords:"moyenne médiane quartiles étendue écart interquartile écart-type boîte à moustaches dispersion",intro:"On résume une série de données par des **indicateurs** de position et de dispersion.",cours:[{h:"Les indicateurs de position",blocks:[{t:"p",c:"Les indicateurs de **position** résument « où se situe » la série :"},{t:"list",c:["la **moyenne** = somme des valeurs / effectif ;","la **médiane** partage la série ordonnée en **deux moitiés** (50 % en dessous, 50 % au-dessus) ;","les **quartiles** Q1 et Q3 délimitent les 25 % les plus bas et les 25 % les plus hauts."]}]},{h:"Les indicateurs de dispersion et la boîte à moustaches",blocks:[{t:"p",c:"Les indicateurs de **dispersion** mesurent à quel point les valeurs sont **étalées** :"},{t:"list",c:["l’**étendue** = max − min ;","l’**écart interquartile** = Q3 − Q1 (dispersion des 50 % centraux) ;","l’**écart-type** mesure la dispersion autour de la moyenne."]},{t:"p",c:"Le **diagramme en boîte** (boîte à moustaches) visualise min, Q1, médiane, Q3, max. Deux séries de même moyenne mais d’écarts-types différents n’ont pas la même **homogénéité**."}]}],essentiel:["Position : **moyenne**, **médiane**, **quartiles** Q1/Q3.","Dispersion : **étendue**, **écart interquartile** (Q3 − Q1), **écart-type**.","La **boîte à moustaches** visualise min, Q1, médiane, Q3, max."],resources:[{kind:"video",label:"Statistiques : médiane, quartiles, écart-type",note:"Vidéos — recherche YouTube",url:T("statistiques médiane quartiles écart type boîte à moustaches première STMG")}],games:[{id:"p1-math-c5-qcm",type:"qcm",title:"QCM — Statistiques",icon:"❓",questions:[{q:"La valeur qui partage une série en deux moitiés est…",choices:["la médiane","la moyenne","l’étendue","le maximum"],answer:0,explain:"50 % des valeurs sont en dessous de la médiane."},{q:"L’écart interquartile est…",choices:["Q3 − Q1","max − min","la moyenne","Q1 + Q3"],answer:0,explain:"Il mesure la dispersion des 50 % centraux."},{q:"Plus l’écart-type est grand, plus les valeurs sont…",choices:["dispersées","égales","proches","nulles"],answer:0,explain:"L’écart-type mesure la dispersion autour de la moyenne."},{q:"La boîte à moustaches visualise…",choices:["min, Q1, médiane, Q3, max","seulement la moyenne","l’écart-type seul","la somme"],answer:0,explain:"Ce sont ses cinq repères."}]},{id:"p1-math-c5-flash",type:"flashcard",title:"Flashcards — Statistiques",icon:"🃏",cards:[{front:"Médiane",back:"Valeur qui partage la série en deux moitiés."},{front:"Écart interquartile",back:"Q3 − Q1 (dispersion des 50 % centraux)."},{front:"Écart-type",back:"Mesure la dispersion autour de la moyenne."}]},{id:"p1-math-c5-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La médiane partage la série en deux moitiés.",answer:!0,explain:"Vrai : 50 % de part et d’autre."},{statement:"L’étendue vaut Q3 − Q1.",answer:!1,explain:"Faux : étendue = max − min ; Q3 − Q1 = écart interquartile."},{statement:"Un écart-type plus grand signifie des valeurs plus dispersées.",answer:!0,explain:"Vrai."}]}]},{id:"p1-math-c6",name:"Chapitre 6 — Probabilités",short:"Probabilités",keywords:"probabilité conditionnelle arbre pondéré indépendance variable aléatoire espérance",intro:"Les probabilités mesurent le **hasard**. Outils clés : la probabilité conditionnelle et l’espérance.",cours:[{h:"Probabilité conditionnelle et arbre pondéré",blocks:[{t:"formula",c:"Probabilité de B sachant A : P_A(B) = P(A ∩ B) / P(A)."},{t:"p",c:"On visualise la situation avec un **arbre pondéré** : on **multiplie** les probabilités le long des branches, et la **somme** des branches partant d’un même nœud vaut **1**."},{t:"example",h:"Exemple",c:"60 % des élèves font anglais ; parmi eux, 30 % font aussi espagnol → P(anglais ∩ espagnol) = 0,60 × 0,30 = **0,18**."}]},{h:"Indépendance et espérance",blocks:[{t:"formula",c:"A et B indépendants ⇔ P(A ∩ B) = P(A) × P(B)."},{t:"p",c:"Deux événements sont **indépendants** quand la réalisation de l’un ne change pas la probabilité de l’autre. Une **variable aléatoire** prend des valeurs selon le hasard ; son **espérance** E(X) = somme des (valeur × probabilité) est la « moyenne » attendue sur un grand nombre de répétitions."}]}],essentiel:["**P_A(B) = P(A ∩ B) / P(A)** ; sur un arbre, on multiplie le long des branches.","Indépendance : **P(A ∩ B) = P(A) × P(B)**.","**E(X)** = somme des (valeur × probabilité) : la moyenne attendue."],resources:[{kind:"video",label:"Probabilités conditionnelles",note:"Vidéos — recherche YouTube",url:T("probabilités conditionnelles arbre espérance première STMG")}],games:[{id:"p1-math-c6-calc",type:"calcul",title:"Calcul express — Probabilités totales",icon:"⚡",gen:"proba_totale",count:5},{id:"p1-math-c6-qcm",type:"qcm",title:"QCM — Probabilités",icon:"❓",questions:[{q:"La probabilité conditionnelle P_A(B) vaut…",choices:["P(A ∩ B) / P(A)","P(A) × P(B)","P(A) + P(B)","P(B) − P(A)"],answer:0,explain:"Probabilité de B sachant A."},{q:"60 % font anglais, dont 30 % font espagnol. P(anglais et espagnol) ?",choices:["0,18","0,90","0,30","0,50"],answer:0,explain:"0,60 × 0,30 = 0,18."},{q:"A et B sont indépendants si…",choices:["P(A ∩ B) = P(A) × P(B)","P(A) = P(B)","P(A ∩ B) = 0","P(A) + P(B) = 1"],answer:0,explain:"Définition de l’indépendance."}]},{id:"p1-math-c6-flash",type:"flashcard",title:"Flashcards — Probabilités",icon:"🃏",cards:[{front:"Probabilité conditionnelle",back:"P_A(B) = P(A ∩ B) / P(A)."},{front:"Indépendance",back:"P(A ∩ B) = P(A) × P(B)."},{front:"Espérance E(X)",back:"Somme des (valeur × probabilité) : la moyenne attendue."}]}]},{id:"p1-math-c7",name:"Chapitre 7 — Algorithmique et Python",short:"Python",keywords:"algorithme Python variable condition if else boucle for while fonction liste",intro:"On consolide les bases de la **programmation** en Python, pour automatiser des calculs et simuler le hasard.",cours:[{h:"Variables, conditions et boucles",blocks:[{t:"list",c:["Les **variables** stockent une valeur (`x = 5`) ;","les **conditions** (`if / else`) permettent de faire un **choix** selon qu’une condition est vraie ou fausse ;","les **boucles** répètent des instructions : `for` (nombre de répétitions **connu**), `while` (tant qu’une condition reste vraie)."]}]},{h:"Fonctions, listes et applications",blocks:[{t:"list",c:["les **fonctions** (`def`) regroupent des instructions réutilisables ;","les **listes** stockent plusieurs valeurs dans une seule variable."]},{t:"p",c:"Applications concrètes : **simuler** une expérience aléatoire, calculer les termes d’une **suite**, automatiser un **calcul répétitif**."}]}],essentiel:["**Variables**, **conditions** (if/else), **boucles** (for/while), **fonctions**, **listes**.","Applications : simuler le hasard, calculer des suites, automatiser."],resources:[{kind:"video",label:"Python : bases (variables, boucles, conditions)",note:"Vidéos — recherche YouTube",url:T("python bases variables boucles conditions première STMG maths")}],games:[{id:"p1-math-c7-qcm",type:"qcm",title:"QCM — Python",icon:"❓",questions:[{q:"Pour répéter des instructions un nombre connu de fois, on utilise…",choices:["une boucle for","un if","une variable","une liste"],answer:0,explain:"La boucle for répète ; while répète tant qu’une condition est vraie."},{q:"`if / else` sert à…",choices:["faire un choix selon une condition","répéter à l’infini","stocker plusieurs valeurs","afficher une image"],answer:0,explain:"C’est l’instruction conditionnelle."},{q:"Une **liste** permet de…",choices:["stocker plusieurs valeurs","faire un seul calcul","créer une condition","arrêter le programme"],answer:0,explain:"La liste regroupe plusieurs valeurs."}]},{id:"p1-math-c7-flash",type:"flashcard",title:"Flashcards — Python",icon:"🃏",cards:[{front:"Variable",back:"Stocke une valeur."},{front:"Boucle (for / while)",back:"Répète des instructions."},{front:"Condition (if / else)",back:"Fait un choix selon une condition."},{front:"Liste",back:"Stocke plusieurs valeurs."}]},{id:"p1-math-c7-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La boucle for sert à répéter des instructions.",answer:!0,explain:"Vrai (nombre de répétitions connu)."},{statement:"if / else sert à répéter à l’infini.",answer:!1,explain:"Faux : if/else fait un choix ; c’est la boucle qui répète."},{statement:"Une liste peut stocker plusieurs valeurs.",answer:!0,explain:"Vrai."}]}]}]},Ah={id:"p1-francais",name:"Français (EAF)",short:"Français",icon:"📚",color:"#7c3aed",niveau:"premiere",tagline:"La seule épreuve du bac dès la première (écrit + oral).",chapters:[{id:"p1-fr-1",name:"Méthode — Le commentaire littéraire",short:"Le commentaire",keywords:"commentaire littéraire méthode analyse procédé effet problématique plan axe paragraphe introduction conclusion citation transition rédaction paraphrase interprétation brouillon",intro:"Le **commentaire littéraire** est l’un des deux sujets possibles à l’écrit. Objectif : montrer, de façon **organisée**, **comment** un texte produit du sens et des effets sur le lecteur. Ce n’est **ni un résumé, ni une paraphrase** : on **analyse** (le « comment ») et on **interprète** (le « pourquoi »).",cours:[{h:"Comprendre l’épreuve du commentaire",blocks:[{t:"p",c:"Le commentaire porte sur un **texte littéraire** court, accompagné d’une **consigne** (parfois un axe imposé). On dispose d’environ **4 heures** ; le commentaire vaut la note de l’écrit (**coef. 5**)."},{t:"p",c:"On attend une **analyse organisée** : un devoir en **plusieurs parties** (souvent 2 ou 3 **axes**), chaque partie prouvant une idée par des **citations** du texte et l’analyse de **procédés**."},{t:"warning",c:"Le piège n°1 est la **paraphrase** : redire le texte avec d’autres mots (« l’auteur dit que… »). Ce n’est pas commenter. Commenter, c’est expliquer **comment** c’est écrit et **quel effet** cela produit."}]},{h:"Étape 1 — Analyser le texte au brouillon",blocks:[{t:"p",c:"Avant de rédiger, on passe du temps à **lire et annoter** le texte. On repère et on **surligne** :"},{t:"list",c:["le **thème** et le **ton** général (registre : lyrique, tragique, comique, polémique…) ;","les **procédés d’écriture** : figures de style, champs lexicaux, ponctuation, rythme, temps verbaux ;","la **construction** du texte (mouvements, progression) et le **point de vue**."]},{t:"tip",c:"Méthode efficace : trace un **tableau à deux colonnes** — à gauche le **procédé relevé + la citation**, à droite son **effet / interprétation**. C’est la matière première de tout le commentaire."}]},{h:"Étape 2 — Problématique et plan",blocks:[{t:"p",c:"La **problématique** est la **question centrale** à laquelle tout le commentaire répond (ex. : « En quoi ce poème transforme-t-il la douleur en beauté ? »). Elle donne une **direction** au devoir."},{t:"p",c:"Le **plan** regroupe tes remarques en **2 ou 3 axes** (grandes parties), chacun divisé en **sous-parties**. Un axe = une **grande idée** qui répond à la problématique."},{t:"table",head:["Bon axe","Mauvais axe"],rows:[["Une **idée d’interprétation** (« un éloge paradoxal »)","Un simple thème (« la nature »)"],["Se prouve par des procédés variés","Se contente de lister le texte"]]},{t:"warning",c:"Évite le plan « procédés / puis effets » ou « forme / puis fond » : mélange toujours **le fond et la forme** dans chaque partie."}]},{h:"Étape 3 — L’introduction et la conclusion",blocks:[{t:"p",c:"L’**introduction** (un paragraphe) suit 4 mouvements :"},{t:"list",c:["**amorce** : une phrase de contexte (auteur, époque, mouvement, genre) ;","**présentation** du texte (titre, situation dans l’œuvre) ;","**problématique** clairement formulée ;","**annonce du plan** (les axes, dans l’ordre)."]},{t:"p",c:"La **conclusion** fait le **bilan** (réponse à la problématique en reprenant les axes) puis propose une **ouverture** (rapprochement avec une autre œuvre, un autre texte, une portée plus large)."}]},{h:"Étape 4 — Rédiger les paragraphes",blocks:[{t:"p",c:"Chaque **paragraphe** de développement suit la structure **AIE** :"},{t:"table",head:["Étape","Contenu"],rows:[["**A — Affirmation**","L’idée que je vais prouver (phrase claire)"],["**I — Illustration**","La **citation** exacte du texte (entre guillemets)"],["**E — Explication**","Le **procédé** repéré + l’**effet** produit / l’interprétation"]]},{t:"p",c:"On soigne les **transitions** entre les parties (une phrase qui relie l’axe qui s’achève à celui qui commence) et on **saute des lignes** entre les grandes parties."},{t:"tip",c:"Cite **court et exact** : quelques mots entre guillemets suffisent. Toute citation doit être **analysée** (jamais posée seule)."}]},{h:"Exemple guidé + erreurs à éviter",blocks:[{t:"example",h:"Un paragraphe modèle (structure AIE)",c:`Idée : le poète rend la ville menaçante. 
→ « La rue assourdissante autour de moi hurlait » : la **personnification** (« la rue… hurlait ») et l’**hyperbole** sonore transforment la ville en monstre agressif, traduisant l’angoisse du poète face à la modernité. 
(Affirmation → citation → procédé + effet.)`},{t:"warning",c:"Les erreurs les plus sanctionnées : **paraphraser** (redire le texte), citer **sans analyser**, faire un plan **forme/fond**, oublier la **problématique**, employer le **« je »** (on préfère « on », « le lecteur », « le texte »)."}]}],essentiel:["Le **commentaire** = analyse **organisée** de **comment** un texte fait sens (≠ résumé, ≠ **paraphrase**).","Au brouillon : repérer **procédé + effet** (tableau 2 colonnes), le **ton**, la construction.","**Problématique** (question centrale) + **plan** en 2-3 **axes** (idées, pas de simples thèmes ; mêler fond et forme).","Intro = amorce + présentation + problématique + annonce ; conclusion = bilan + **ouverture**.","Chaque paragraphe suit **AIE** : Affirmation → Illustration (citation) → Explication (procédé + effet) ; soigner les **transitions**."],resources:[{kind:"video",label:"Méthode du commentaire littéraire",note:"Vidéos — recherche YouTube",url:T("méthode commentaire littéraire première français problématique plan")}],games:[{id:"p1-fr-1-qcm",type:"qcm",title:"QCM — Le commentaire",icon:"❓",questions:[{q:"Commenter un texte, ce n’est pas…",choices:["le paraphraser (le redire)","analyser les procédés","expliquer les effets","l’interpréter"],answer:0,explain:"La paraphrase (redire le texte) est l’erreur n°1 à éviter."},{q:"La problématique du commentaire est…",choices:["la question centrale à laquelle il répond","le résumé du texte","la biographie de l’auteur","la liste des figures"],answer:0,explain:"Elle donne une direction à tout le devoir."},{q:"Un bon axe de commentaire est…",choices:["une idée d’interprétation","un simple thème","une citation","un procédé isolé"],answer:0,explain:"Un axe est une grande idée qui répond à la problématique."},{q:"La structure d’un paragraphe (AIE) est…",choices:["Affirmation, Illustration, Explication","Analyse, Introduction, Exemple","Amorce, Idée, Écriture","Argument, Image, Effet"],answer:0,explain:"Idée → citation → procédé + effet."},{q:"Dans un commentaire, on évite d’écrire…",choices:["« je »","« on »","« le texte »","« le lecteur »"],answer:0,explain:"On préfère « on », « le lecteur », « le texte »."}]},{id:"p1-fr-1-ordre",type:"ordre",title:"Remise en ordre — Les étapes du commentaire",icon:"🔢",instruction:"Remets les étapes dans l’ordre.",steps:["Lire et analyser le texte au brouillon","Dégager une problématique","Bâtir un plan en axes","Rédiger l’introduction","Rédiger les paragraphes (AIE)","Rédiger la conclusion et l’ouverture"],explain:"On analyse, on problématise, on planifie, puis on rédige (intro → développement → conclusion)."},{id:"p1-fr-1-ordre-intro",type:"ordre",title:"Remise en ordre — L’introduction",icon:"🔢",instruction:"Remets les 4 mouvements de l’introduction.",steps:["Amorce (contexte)","Présentation du texte","Problématique","Annonce du plan"],explain:"Amorce → présentation → problématique → annonce du plan."},{id:"p1-fr-1-flash",type:"flashcard",title:"Flashcards — Méthode du commentaire",icon:"🃏",cards:[{front:"Paraphrase",back:"Redire le texte avec d’autres mots : l’erreur à éviter absolument."},{front:"Problématique",back:"La question centrale à laquelle répond tout le commentaire."},{front:"Axe",back:"Une grande partie = une idée d’interprétation à prouver."},{front:"AIE",back:"Affirmation → Illustration (citation) → Explication (procédé + effet)."},{front:"Ouverture",back:"Élargissement en fin de conclusion (autre œuvre, portée plus large)."}]}]},{id:"p1-fr-2",name:"Méthode — Contraction de texte & essai",short:"Contraction & essai",keywords:"contraction de texte résumé quart fidélité reformulation essai argumentation thèse arguments exemples plan dialectique introduction conclusion connecteurs EAF écrit",intro:"Le deuxième sujet possible à l’écrit associe une **contraction de texte** (résumer fidèlement au **quart**) et un **essai** (une réflexion **argumentée** sur une question liée au texte). Deux exercices très **codifiés** : la note récompense la **méthode** et la **rigueur**.",cours:[{h:"La contraction de texte : principe et règles",blocks:[{t:"p",c:"La **contraction** consiste à **réduire un texte au quart** (¼) de sa longueur, **sans le trahir**. On garde **les idées essentielles** et leur **enchaînement**, on supprime les exemples, les répétitions et les détails."},{t:"table",head:["On GARDE","On SUPPRIME"],rows:[["La **thèse** et les idées principales","Les exemples et illustrations"],["L’**ordre** et la logique du texte","Les répétitions, les digressions"],["Le système de **l’auteur** (le « je » de l’auteur)","Ses propres commentaires / avis"]]},{t:"warning",c:"Règles d’or : rester **fidèle** (ne rien ajouter, ne rien commenter), **reformuler avec ses propres mots** (pas de copié-collé de phrases), respecter le **nombre de mots** imposé (± 10 %) et l’**indiquer** à la fin."}]},{h:"La contraction : méthode pas à pas",blocks:[{t:"p",c:"Une démarche efficace en plusieurs temps :"},{t:"list",c:["**Lire** le texte deux fois pour saisir la **thèse** et le **plan** de l’auteur ;","**découper** le texte en **paragraphes / mouvements** et donner à chacun un titre (l’idée) ;","pour chaque partie, **reformuler l’idée essentielle** en une ou deux phrases ;","**relier** ces idées avec des **connecteurs logiques** (donc, cependant, en effet…)."]},{t:"tip",c:"Astuce : compte tes mots par tranches (barre tous les 20 mots). Vise le quart : un texte de 800 mots se contracte en **~200 mots** (± 20)."}]},{h:"La contraction : rédiger et respecter le quart",blocks:[{t:"p",c:"On rédige un texte **suivi et cohérent** (pas une liste), qui « sonne » comme un mini-texte autonome. On **respecte le point de vue de l’auteur** : s’il écrit « je pense que », on garde ce « je » (celui de l’auteur, pas le tien)."},{t:"example",h:"Contracter une phrase",c:`Texte : « De nos jours, force est de constater que les écrans, qu’il s’agisse des téléphones, des tablettes ou des ordinateurs, occupent une place absolument démesurée dans le quotidien des adolescents. » (30 mots) 
→ Contraction : « Aujourd’hui, les écrans envahissent le quotidien des adolescents. » (8 mots) — on garde l’idée, on supprime l’énumération et l’insistance.`}]},{h:"L’essai : analyser le sujet",blocks:[{t:"p",c:"L’**essai** est une **réflexion argumentée** qui répond à une **question** en lien avec le thème du texte contracté. Ce n’est pas un avis « au fil de la plume » : c’est un devoir **organisé** avec une **thèse** défendue et **nuancée**."},{t:"p",c:"Premier réflexe : **analyser la question**. Repère les **mots-clés**, le type de question (« Pensez-vous que… ? » appelle une réponse **nuancée**), et **reformule-la** pour être sûr de la comprendre."},{t:"warning",c:"Ne réponds pas seulement « oui » ou « non » : la plupart des sujets attendent une réflexion **nuancée** (des arguments pour, des arguments contre, puis un dépassement)."}]},{h:"L’essai : bâtir l’argumentation",blocks:[{t:"p",c:"On construit un **plan** (souvent en **2 parties**, parfois dialectique). Chaque partie contient des **arguments**, et chaque argument est **appuyé par un exemple** précis :"},{t:"table",head:["Élément","Rôle"],rows:[["**Thèse**","L’idée générale que tu défends"],["**Argument**","Une raison qui soutient la thèse"],["**Exemple**","Un fait précis : œuvre, actualité, expérience, histoire"]]},{t:"p",c:"Les **exemples** peuvent venir de la **littérature**, de l’**actualité**, de l’**histoire**, de ta **culture personnelle**. Plus ils sont précis, plus l’argument est convaincant."}]},{h:"L’essai : rédiger + erreurs à éviter",blocks:[{t:"p",c:"L’**introduction** amène le sujet, **reformule la question** et **annonce le plan**. Le **développement** enchaîne les paragraphes argumentés (un argument + un exemple par paragraphe), reliés par des **connecteurs**. La **conclusion** répond clairement à la question, de façon **nuancée**, et peut ouvrir."},{t:"warning",c:"Erreurs fréquentes : rédiger un essai **désorganisé** (idées en vrac), **sans exemples** (arguments abstraits), oublier de **reformuler la question**, ou faire une contraction qui **commente** au lieu de résumer. Soigne aussi l’**orthographe** et les **connecteurs logiques**."}]}],essentiel:["**Contraction** = réduire le texte au **quart**, **fidèlement**, avec ses **propres mots**, en gardant l’**ordre** et le « je » de **l’auteur** (jamais de commentaire) ; indiquer le **nombre de mots**.","Méthode contraction : repérer la **thèse** et le **plan**, reformuler l’idée de chaque partie, relier par des **connecteurs**.","**Essai** = réflexion **argumentée** et **nuancée** sur une question ; d’abord **analyser** et **reformuler** le sujet.","Argumenter = **thèse** → **arguments** → **exemples** précis (littérature, actualité, histoire, expérience).","Essai : intro (reformuler + annoncer) → développement (argument + exemple par § + connecteurs) → conclusion nuancée."],resources:[{kind:"video",label:"Méthode de la contraction et de l’essai",note:"Vidéos — recherche YouTube",url:T("méthode contraction de texte essai EAF première voie technologique")}],games:[{id:"p1-fr-2-qcm",type:"qcm",title:"QCM — Contraction & essai",icon:"❓",questions:[{q:"La contraction réduit le texte à environ…",choices:["un quart","la moitié","un dixième","trois quarts"],answer:0,explain:"Environ ¼, fidèlement, avec ses propres mots."},{q:"Dans une contraction, on doit…",choices:["garder l’ordre et le « je » de l’auteur","donner son avis","ajouter des exemples","commenter le texte"],answer:0,explain:"Fidélité totale : on ne commente pas, on reformule."},{q:"Un texte de 800 mots se contracte en environ…",choices:["200 mots","400 mots","80 mots","600 mots"],answer:0,explain:"¼ de 800 = 200 mots (± 10 %)."},{q:"L’essai est…",choices:["une réflexion argumentée et nuancée","un résumé","une dictée","une biographie"],answer:0,explain:"On défend une thèse avec arguments et exemples."},{q:"Dans l’essai, chaque argument doit être…",choices:["appuyé par un exemple précis","laissé abstrait","répété","illustré par le texte seulement"],answer:0,explain:"Argument + exemple (littérature, actualité, histoire…)."}]},{id:"p1-fr-2-ordre",type:"ordre",title:"Remise en ordre — Méthode de la contraction",icon:"🔢",instruction:"Remets les étapes de la contraction.",steps:["Lire le texte et saisir la thèse","Découper en parties (une idée par partie)","Reformuler l’idée de chaque partie","Relier avec des connecteurs","Vérifier le nombre de mots (¼)"],explain:"On repère la thèse et le plan, on reformule, on relie, on compte les mots."},{id:"p1-fr-2-tri",type:"tri",title:"Tri — Contraction : garder ou supprimer ?",icon:"🗂️",instruction:"Dans une contraction, faut-il le garder ou le supprimer ?",categories:[{id:"g",label:"Garder"},{id:"s",label:"Supprimer"}],items:[{text:"La thèse de l’auteur",cat:"g"},{text:"Un exemple qui illustre une idée",cat:"s"},{text:"L’enchaînement logique des idées",cat:"g"},{text:"Une répétition",cat:"s"},{text:"Ton avis personnel",cat:"s"},{text:"Le point de vue de l’auteur (« je »)",cat:"g"}]},{id:"p1-fr-2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La contraction consiste à donner son avis sur le texte.",answer:!1,explain:"Faux : on résume fidèlement au quart, sans commenter."},{statement:"L’essai attend souvent une réponse nuancée.",answer:!0,explain:"Vrai : arguments pour, contre, puis dépassement."},{statement:"Dans la contraction, on peut recopier des phrases entières du texte.",answer:!1,explain:"Faux : on reformule avec ses propres mots."},{statement:"Un bon argument d’essai s’appuie sur un exemple précis.",answer:!0,explain:"Vrai : littérature, actualité, histoire, expérience."}]},{id:"p1-fr-2-flash",type:"flashcard",title:"Flashcards — Contraction & essai",icon:"🃏",cards:[{front:"Contraction",back:"Résumer au ¼, fidèlement, avec ses mots, sans commenter."},{front:"Fidélité",back:"Garder les idées, l’ordre et le point de vue de l’auteur."},{front:"Essai",back:"Réflexion argumentée et nuancée répondant à une question."},{front:"Argument / exemple",back:"Une raison + un fait précis qui la prouve."},{front:"Connecteurs logiques",back:"Donc, cependant, en effet, or… : ils structurent le propos."}]}]},{id:"p1-fr-3",name:"Les genres & leur vocabulaire",short:"Genres & vocabulaire",keywords:"roman récit narrateur point de vue focalisation théâtre réplique tirade monologue didascalie stichomythie poésie vers strophe rime mètre alexandrin sonnet allitération assonance littérature d’idées argumentation apologue essai humanisme Lumières figures de style registres",intro:"Les **4 objets d’étude** (roman, théâtre, poésie, littérature d’idées) ont chacun leur **vocabulaire technique**. Le connaître est indispensable pour **analyser** un texte au commentaire comme à l’oral. Voici la « boîte à outils » complète, genre par genre.",cours:[{h:"Le roman et le récit : le vocabulaire de la narration",blocks:[{t:"p",c:"Le **roman** (et plus largement le **récit**, du Moyen Âge au XXIᵉ) est l’art de **raconter une histoire**. Vocabulaire de base :"},{t:"table",head:["Terme","Définition"],rows:[["Narrateur","Celui qui **raconte** (≠ l’auteur !)"],["Intrigue","L’enchaînement des événements de l’histoire"],["Péripétie","Un rebondissement de l’action"],["Incipit","Le **début** du roman"],["Dénouement","La **fin**, la résolution"],["Récit cadre / enchâssé","Une histoire racontée à l’intérieur d’une autre"]]},{t:"warning",c:"Ne confonds jamais l’**auteur** (la personne réelle qui écrit) et le **narrateur** (la voix qui raconte, qui peut être un personnage inventé)."}]},{h:"Le roman : narrateur, points de vue et rythme",blocks:[{t:"p",c:"Le **point de vue** (ou **focalisation**) désigne « par quels yeux » on voit l’histoire :"},{t:"table",head:["Point de vue","Ce qu’on sait"],rows:[["Focalisation **interne**","On suit **un personnage**, on connaît ses pensées"],["Focalisation **externe**","On voit de l’extérieur, comme une caméra (pas les pensées)"],["Focalisation **zéro** (omnisciente)","Le narrateur **sait tout** de tous les per
