","**Dématérialisation** (factures électroniques) → automatisation ; l’humain contrôle et valide.","Sécurité du SI : **disponibilité, intégrité, confidentialité, traçabilité**.","Cadre normatif : **ANC** (Autorité des Normes Comptables) et **PCG** (Plan Comptable Général)."]},{h:"La chaîne comptable et la partie double",points:["Chaîne : **pièce justificative → journal → grand livre → balance → documents de synthèse** (bilan, compte de résultat, annexe).","**Partie double** : tout enregistrement respecte **débit = crédit**.","Couples à distinguer : flux/stock, créance/dette, actif/passif, charge/produit.","Comptes usuels : achats (6), ventes (7), TVA, clients (411), fournisseurs (401), banque (512).","Contrôles : **lettrage** (facture ↔ règlement), **rapprochement bancaire** (compte banque ↔ relevé)."]},{h:"La TVA : l’entreprise, simple collecteur",points:["Factures « de doit » (réductions : rabais, remises, ristournes ; frais de transport) et **factures d’avoir**.","L’entreprise collecte la TVA pour l’État puis la reverse.","Si TVA déductible > TVA collectée → **crédit de TVA** (créance sur l’État)."],formula:"TVA à décaisser = TVA collectée (ventes) − TVA déductible (achats + immobilisations)"},{h:"Investir & amortir",points:["**Immobilisation** (actif durable, classe 2) vs **charge** (consommée sur l’exercice, classe 6).","Coût d’acquisition = prix d’achat HT − réductions + frais accessoires (transport, installation…).","**Amortissement** = constatation de la perte de valeur (usure, temps).","Taux linéaire = 1 / durée ; annuité = base × taux (**prorata temporis** la 1re année).","À la revente : prix de cession comparé à la VNC → plus ou moins-value."],formula:"VNC = valeur d’origine − amortissements cumulés"},{h:"Communiquer une information fidèle",points:["Exercice comptable = 12 mois → résultat + situation à la clôture.","**Inventaire** → écritures d’ajustement (stocks, amortissements, dépréciations, cessions).","**Dépréciation** = perte **réversible** (l’amortissement, lui, est définitif).","L’**annexe** explicite le bilan et le compte de résultat."],formula:"4 principes : prudence · indépendance des exercices · continuité de l’exploitation · permanence des méthodes"}],formulas:["TVA à décaisser = TVA collectée − TVA déductible","VNC = valeur d’origine − amortissements cumulés","Taux linéaire = 1 / durée d’utilisation"],games:[{id:"gf-t1-qcm",type:"qcm",title:"QCM — Comptabilité & TVA",icon:"❓",questions:[{q:"Que produit le système d’information comptable (SIC) ?",choices:["Une image fidèle du patrimoine, de la situation financière et du résultat","Uniquement la fiche de paie des salariés","Le plan marketing de l’entreprise","La liste des clients mécontents"],answer:0,explain:"Le SIC produit une image fidèle du patrimoine, de la situation financière et du résultat (art. 120-1 du PCG)."},{q:"Que signifie un PGI (ou ERP) ?",choices:["Un logiciel unique reposant sur une base de données unique","Un impôt sur les sociétés","Une norme européenne de TVA","Un type de facture d’avoir"],answer:0,explain:"Le PGI/ERP est un logiciel unique à base de données unique, ce qui fiabilise l’information."},{q:"Ventes HT = 90 000 €, achats HT = 40 000 €, machine HT = 15 000 €, TVA 20 %. TVA à décaisser ?",choices:["7 000 €","18 000 €","11 000 €","10 000 €"],answer:0,explain:"Collectée = 18 000 ; déductible = 8 000 (ABS) + 3 000 (immo) = 11 000. À décaisser = 18 000 − 11 000 = 7 000 €."},{q:"La TVA déductible dépasse la TVA collectée. L’entreprise a…",choices:["Un crédit de TVA (créance sur l’État)","Une dette de TVA à reverser","Une amende fiscale","Un bénéfice exceptionnel"],answer:0,explain:"Si TVA déductible > TVA collectée, l’entreprise dispose d’un crédit de TVA."},{q:"Quel élément est une immobilisation (et non une charge) ?",choices:["Une machine-outil utilisée plusieurs années","L’achat de fournitures de bureau consommées","La facture d’électricité du mois","Le salaire versé aux ouvriers"],answer:0,explain:"Une immobilisation est un actif durable (classe 2) ; les charges (classe 6) sont consommées sur l’exercice."},{q:"Le contrôle qui compare le compte « banque » de l’entreprise au relevé bancaire s’appelle…",choices:["Le rapprochement bancaire","Le lettrage","L’inventaire","L’amortissement"],answer:0,explain:"Le rapprochement bancaire compare le compte banque au relevé ; le lettrage relie une facture à son règlement."}]},{id:"gf-t1-flash",type:"flashcard",title:"Flashcards — Définitions clés",icon:"🃏",cards:[{front:"Partie double",back:"Principe : tout enregistrement respecte débit = crédit."},{front:"PGI / ERP",back:"Logiciel unique à base de données unique → fiabilité de l’information."},{front:"Amortissement",back:"Constatation de la perte de valeur d’une immobilisation (usure, temps)."},{front:"Dépréciation",back:"Perte de valeur réversible (contrairement à l’amortissement, définitif)."},{front:"VNC",back:"Valeur nette comptable = valeur d’origine − amortissements cumulés."},{front:"Crédit de TVA",back:"Situation où la TVA déductible dépasse la TVA collectée (créance sur l’État)."},{front:"Lettrage",back:"Contrôle reliant une facture à son règlement."},{front:"Annexe",back:"Document de synthèse qui explicite le bilan et le compte de résultat."}]},{id:"gf-t1-assoc",type:"association",title:"Association — Notion ↔ définition",icon:"🔗",pairs:[{left:"ANC",right:"Autorité des Normes Comptables"},{left:"PCG",right:"Plan Comptable Général"},{left:"Compte 411",right:"Clients"},{left:"Compte 401",right:"Fournisseurs"},{left:"Compte 512",right:"Banque"},{left:"Facture d’avoir",right:"Facture qui corrige/annule un doit (retour, avoir)"}]},{id:"gf-t1-tri",type:"tri",title:"Tri — TVA collectée ou déductible ?",icon:"🗂️",instruction:"Classe chaque opération selon la TVA qu’elle génère.",categories:[{id:"col",label:"TVA collectée (ventes)"},{id:"ded",label:"TVA déductible (achats/immo)"}],items:[{text:"Vente de meubles à un client",cat:"col"},{text:"Prestation de pose facturée au client",cat:"col"},{text:"Achat de bois (matière première)",cat:"ded"},{text:"Achat d’une machine (immobilisation)",cat:"ded"},{text:"Achat de fournitures de bureau",cat:"ded"},{text:"Facturation d’une table sur mesure",cat:"col"}]},{id:"gf-t1-ordre",type:"ordre",title:"Remise en ordre — La chaîne comptable",icon:"🔢",instruction:"Remets les étapes de l’enregistrement comptable dans l’ordre.",steps:["Pièce justificative","Journal","Grand livre","Balance","Documents de synthèse (bilan, compte de résultat, annexe)"],explain:"La chaîne va de la pièce justificative jusqu’aux documents de synthèse."},{id:"gf-t1-trou",type:"trou",title:"Texte à trous — Formules & principes",icon:"✏️",questions:[{text:"TVA à décaisser = TVA collectée − TVA ___.",answer:"déductible",explain:"TVA à décaisser = TVA collectée − TVA déductible."},{text:"VNC = valeur d’origine − amortissements ___.",answer:"cumulés",alt:["cumules"],explain:"VNC = valeur d’origine − amortissements cumulés."},{text:"Le taux d’amortissement linéaire est égal à 1 divisé par la ___ d’utilisation.",answer:"durée",alt:["duree"],explain:"Taux linéaire = 1 / durée d’utilisation."},{text:"Le principe de ___ interdit de surévaluer l’actif de l’entreprise.",answer:"prudence",explain:"Le principe de prudence : ne pas surévaluer l’actif."}]},{id:"gf-t1-calc-tva",type:"calcul",title:"Calcul express — TVA",icon:"⚡",gen:"tva",count:5},{id:"gf-t1-calc-amo",type:"calcul",title:"Calcul express — Amortissement",icon:"⚡",gen:"amortissement",count:5},{id:"gf-t1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"L’entreprise est un simple collecteur de TVA pour l’État.",answer:!0,explain:"Exact : elle collecte puis reverse la TVA."},{statement:"L’amortissement constate une perte de valeur réversible.",answer:!1,explain:"Faux : c’est la dépréciation qui est réversible ; l’amortissement est définitif."},{statement:"Une immobilisation est enregistrée en classe 2.",answer:!0,explain:"Vrai : les immobilisations sont en classe 2 (actif durable)."},{statement:"La partie double signifie que débit = crédit.",answer:!0,explain:"Vrai, c’est le principe fondateur de l’enregistrement."},{statement:"Le rapprochement bancaire relie une facture à son règlement.",answer:!1,explain:"Faux : c’est le lettrage. Le rapprochement compare banque et relevé."}]}]},{id:"gf-t2",name:"Thème 2 — Analyser la situation de l’entreprise",short:"Analyse financière",keywords:"SIG EBE CAF profitabilité rentabilité effet de levier bilan fonctionnel FRNG BFR trésorerie ratios",cours:[{h:"Les Soldes Intermédiaires de Gestion (SIG)",points:["Marge commerciale = ventes de marchandises − coût d’achat des marchandises vendues.","**Valeur ajoutée (VA)** = marge commerciale + production − consommations en provenance des tiers.","**EBE** = VA + subventions d’exploitation − impôts et taxes − charges de personnel.","Résultat d’exploitation = EBE + autres produits − dotations − autres charges.","RCAI = résultat d’exploitation + résultat financier.","**Résultat net** = RCAI + résultat exceptionnel − participation − impôt sur les bénéfices."],formula:"Cascade : Marge → VA → EBE → Résultat d’exploitation → RCAI → Résultat net"},{h:"La CAF (capacité d’autofinancement)",points:["Ressource dégagée par l’activité pour investir, rembourser, distribuer.","Méthode soustractive : à partir de l’EBE (+ produits encaissables − charges décaissables).","Méthode additive : résultat net + dotations − reprises + VNC des éléments cédés − produits de cession."]},{h:"Profitabilité, rentabilité, effet de levier",points:["**Profitabilité** = résultat / chiffre d’affaires.","Rentabilité **économique** = résultat d’exploitation (ou EBE) / capitaux investis (vision du dirigeant).","Rentabilité **financière** = résultat net / capitaux propres (vision de l’associé).","**Effet de levier** : si rentabilité économique > coût de la dette, l’endettement **augmente** la rentabilité financière (sinon effet de massue)."]},{h:"Le bilan fonctionnel",points:["Ressources stables = capitaux propres + amortissements/dépréciations + provisions + dettes financières.","Emplois stables = actif immobilisé **brut**.","BFR = (stocks + créances clients) − (dettes fournisseurs, fiscales, sociales).","FRNG > BFR → trésorerie nette positive (sain) ; FRNG < BFR → trésorerie négative (découvert)."],formula:"FRNG = Ressources stables − Emplois stables · BFR = Actif circ. d’exploit. − Passif circ. d’exploit. · TN = FRNG − BFR"},{h:"Les ratios",points:["Rotation des stocks = (stock moyen / coût d’achat des marchandises vendues) × 360.","Délai clients = (créances clients TTC / CA TTC) × 360.","Délai fournisseurs = (dettes fournisseurs TTC / achats TTC) × 360.","Indépendance financière = dettes financières / capitaux propres.","Capacité de remboursement = dettes financières / CAF (idéalement < 3-4 ans).","Limites : analyse statique, sensible aux choix comptables → comparer dans le temps et l’espace."]}],formulas:["VA = marge commerciale + production − consommations en provenance des tiers","EBE = VA + subventions d’exploitation − impôts et taxes − charges de personnel","FRNG = Ressources stables − Emplois stables","BFR = Actif circulant d’exploitation − Passif circulant d’exploitation","Trésorerie nette = FRNG − BFR"],games:[{id:"gf-t2-qcm",type:"qcm",title:"QCM — SIG, bilan fonctionnel & rentabilité",icon:"❓",questions:[{q:"Comment calcule-t-on la valeur ajoutée (VA) ?",choices:["Marge commerciale + production − consommations en provenance des tiers","Chiffre d’affaires − impôt sur les bénéfices","EBE + dotations aux amortissements","Résultat net + dividendes"],answer:0,explain:"VA = marge commerciale + production − consommations en provenance des tiers."},{q:"Production vendue 520 000 €, consommations 210 000 €, subventions 5 000 €, impôts et taxes 8 000 €, charges de personnel 190 000 €. EBE ?",choices:["117 000 €","310 000 €","127 000 €","107 000 €"],answer:0,explain:"VA = 520 000 − 210 000 = 310 000. EBE = 310 000 + 5 000 − 8 000 − 190 000 = 117 000 €."},{q:"La rentabilité financière se calcule…",choices:["Résultat net / capitaux propres","Résultat d’exploitation / capitaux investis","Résultat / chiffre d’affaires","CAF / dettes financières"],answer:0,explain:"Rentabilité financière = résultat net / capitaux propres (vision de l’associé)."},{q:"FRNG = 80 000 €, BFR = 90 000 €. Quelle est la trésorerie nette ?",choices:["− 10 000 €","+ 10 000 €","+ 170 000 €","0 €"],answer:0,explain:"TN = FRNG − BFR = 80 000 − 90 000 = − 10 000 € (trésorerie négative)."},{q:"L’effet de levier est FAVORABLE lorsque…",choices:["La rentabilité économique est supérieure au coût de la dette","La rentabilité économique est inférieure au taux d’intérêt","L’entreprise n’a aucune dette","Le résultat net est négatif"],answer:0,explain:"Si la rentabilité économique dépasse le coût de la dette, l’endettement amplifie la rentabilité financière."},{q:"Que représente la CAF ?",choices:["La ressource dégagée par l’activité (pour investir, rembourser, distribuer)","Le montant de la TVA à reverser","Le total des dettes fournisseurs","Le chiffre d’affaires hors taxes"],answer:0,explain:"La CAF est la ressource interne dégagée par l’activité."}]},{id:"gf-t2-ordre",type:"ordre",title:"Remise en ordre — La cascade des SIG",icon:"🔢",instruction:"Reconstitue la cascade des soldes intermédiaires de gestion.",steps:["Marge commerciale","Valeur ajoutée (VA)","Excédent brut d’exploitation (EBE)","Résultat d’exploitation","Résultat courant avant impôt (RCAI)","Résultat net"],explain:"On descend la cascade : Marge → VA → EBE → Résultat d’exploitation → RCAI → Résultat net."},{id:"gf-t2-assoc",type:"association",title:"Association — Solde ↔ calcul",icon:"🔗",pairs:[{left:"FRNG",right:"Ressources stables − emplois stables"},{left:"BFR",right:"Actif circulant d’exploit. − passif circulant d’exploit."},{left:"Trésorerie nette",right:"FRNG − BFR"},{left:"Profitabilité",right:"Résultat / chiffre d’affaires"},{left:"Rentabilité économique",right:"Résultat d’exploitation / capitaux investis"},{left:"Rentabilité financière",right:"Résultat net / capitaux propres"}]},{id:"gf-t2-flash",type:"flashcard",title:"Flashcards — Analyse financière",icon:"🃏",cards:[{front:"EBE",back:"VA + subventions d’exploitation − impôts et taxes − charges de personnel."},{front:"CAF (méthode additive)",back:"Résultat net + dotations − reprises + VNC cédées − produits de cession."},{front:"Ressources stables",back:"Capitaux propres + amortissements/dépréciations + provisions + dettes financières."},{front:"Emplois stables",back:"Actif immobilisé brut."},{front:"Effet de massue",back:"Quand la rentabilité économique passe sous le coût de la dette : l’endettement dégrade la rentabilité financière."},{front:"Indépendance financière",back:"Ratio = dettes financières / capitaux propres."},{front:"Capacité de remboursement",back:"Dettes financières / CAF (idéalement < 3-4 ans)."}]},{id:"gf-t2-tri",type:"tri",title:"Tri — Ressources stables ou circulantes ?",icon:"🗂️",instruction:"Classe chaque élément du bilan fonctionnel.",categories:[{id:"stable",label:"Ressources / emplois stables"},{id:"exploit",label:"Cycle d’exploitation"}],items:[{text:"Capitaux propres",cat:"stable"},{text:"Dettes financières (emprunts)",cat:"stable"},{text:"Actif immobilisé brut",cat:"stable"},{text:"Stocks",cat:"exploit"},{text:"Créances clients",cat:"exploit"},{text:"Dettes fournisseurs",cat:"exploit"}]},{id:"gf-t2-calc-frng",type:"calcul",title:"Calcul express — FRNG",icon:"⚡",gen:"frng",count:5},{id:"gf-t2-calc-caf",type:"calcul",title:"Calcul express — CAF",icon:"⚡",gen:"caf",count:5},{id:"gf-t2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La rentabilité économique se calcule avec les capitaux propres.",answer:!1,explain:"Faux : économique = résultat d’exploitation / capitaux investis ; c’est la financière qui utilise les capitaux propres."},{statement:"Si FRNG > BFR, la trésorerie nette est positive.",answer:!0,explain:"Vrai : TN = FRNG − BFR > 0."},{statement:"L’EBE tient compte des dotations aux amortissements.",answer:!1,explain:"Faux : les dotations n’interviennent qu’à partir du résultat d’exploitation."},{statement:"La CAF sert notamment à rembourser les emprunts et à investir.",answer:!0,explain:"Vrai : c’est la ressource interne de l’activité."},{statement:"Les emplois stables correspondent à l’actif immobilisé brut.",answer:!0,explain:"Vrai, dans le bilan fonctionnel on retient les valeurs brutes."}]}]},{id:"gf-t3",name:"Thème 3 — Accompagner la prise de décision",short:"Décision & coûts",keywords:"financement trésorerie budget affectation résultat réserve légale dividendes coûts seuil de rentabilité point mort marge sur coût variable",cours:[{h:"Les modalités de financement",points:["Financements **internes** : autofinancement (CAF), apports en compte courant d’associés.","Financements **externes** : emprunt bancaire, augmentation de capital, crowdfunding, subventions.","Critères d’arbitrage : performances, endettement, coût, pouvoir des associés, attractivité du projet."]},{h:"Optimiser la trésorerie",points:["**Budget de trésorerie** : prévision mensuelle des encaissements/décaissements.","Réduire le BFR, recourir au découvert / compte courant, placer les excédents."]},{h:"Affectation du résultat",points:["**Réserve légale** : 5 % du bénéfice jusqu’à 10 % du capital.","Réserves statutaires/facultatives, **dividendes**, **report à nouveau**.","Arbitrage : autofinancement (réserves) vs rémunération des associés (dividendes)."]},{h:"Analyse des coûts",points:["Coûts **complets** : charges directes (affectables) + indirectes (réparties par clés).","Coûts **partiels (variables)** : MCV = CA − charges variables ; taux de MCV = MCV / CA.","**Point mort** = date d’atteinte du seuil de rentabilité.","**Coût marginal** : coût de la dernière unité → décider d’accepter une commande supplémentaire."],formula:"Seuil de rentabilité = charges fixes / taux de MCV"}],formulas:["MCV = CA − charges variables","Taux de MCV = MCV / CA","Seuil de rentabilité = charges fixes / taux de MCV","Marge de sécurité = CA − seuil de rentabilité"],games:[{id:"gf-t3-qcm",type:"qcm",title:"QCM — Financement, résultat & coûts",icon:"❓",questions:[{q:"Lequel est un financement INTERNE ?",choices:["L’autofinancement (CAF)","L’emprunt bancaire","L’augmentation de capital","Le crowdfunding"],answer:0,explain:"L’autofinancement (CAF) et les apports en compte courant sont internes ; emprunt, augmentation de capital et crowdfunding sont externes."},{q:"CA = 300 000 €, charges variables = 180 000 €. Quel est le taux de MCV ?",choices:["0,40 (40 %)","0,60 (60 %)","0,20 (20 %)","1,20"],answer:0,explain:"MCV = 300 000 − 180 000 = 120 000 ; taux = 120 000 / 300 000 = 0,40."},{q:"Charges fixes = 96 000 €, taux de MCV = 0,40. Seuil de rentabilité ?",choices:["240 000 €","384 000 €","38 400 €","156 000 €"],answer:0,explain:"Seuil = charges fixes / taux de MCV = 96 000 / 0,40 = 240 000 € de CA."},{q:"La réserve légale correspond à…",choices:["5 % du bénéfice jusqu’à 10 % du capital","10 % du bénéfice sans limite","5 % du chiffre d’affaires","La totalité des dividendes"],answer:0,explain:"Réserve légale : 5 % du bénéfice jusqu’à atteindre 10 % du capital."},{q:"Le « point mort » désigne…",choices:["La date à laquelle le seuil de rentabilité est atteint","Le montant des charges fixes","La perte maximale supportable","Le coût de la dernière unité produite"],answer:0,explain:"Le point mort est la date d’atteinte du seuil de rentabilité."}]},{id:"gf-t3-calc-seuil",type:"calcul",title:"Calcul express — Seuil de rentabilité",icon:"⚡",gen:"seuil",count:5},{id:"gf-t3-tri",type:"tri",title:"Tri — Charges fixes ou variables ?",icon:"🗂️",instruction:"Classe chaque charge selon qu’elle varie ou non avec l’activité.",categories:[{id:"fixe",label:"Charges fixes"},{id:"var",label:"Charges variables"}],items:[{text:"Loyer de l’atelier",cat:"fixe"},{text:"Matières premières (bois)",cat:"var"},{text:"Assurance annuelle",cat:"fixe"},{text:"Commissions sur ventes",cat:"var"},{text:"Salaire fixe de l’administratif",cat:"fixe"},{text:"Énergie de la production",cat:"var"}]},{id:"gf-t3-assoc",type:"association",title:"Association — Financement & coûts",icon:"🔗",pairs:[{left:"Financement interne",right:"Autofinancement (CAF)"},{left:"Financement externe",right:"Emprunt bancaire"},{left:"Seuil de rentabilité",right:"Charges fixes / taux de MCV"},{left:"Marge de sécurité",right:"CA − seuil de rentabilité"},{left:"Coût marginal",right:"Coût de la dernière unité produite"},{left:"Report à nouveau",right:"Résultat non affecté reporté sur l’exercice suivant"}]},{id:"gf-t3-flash",type:"flashcard",title:"Flashcards — Décision de gestion",icon:"🃏",cards:[{front:"MCV",back:"Marge sur coût variable = CA − charges variables."},{front:"Taux de MCV",back:"MCV / CA."},{front:"Budget de trésorerie",back:"Prévision mensuelle des encaissements et décaissements."},{front:"Charges directes",back:"Charges affectables directement à un produit."},{front:"Charges indirectes",back:"Charges réparties par des clés de répartition."},{front:"Dividendes",back:"Part du résultat distribuée aux associés."}]},{id:"gf-t3-trou",type:"trou",title:"Texte à trous — Coûts & seuil",icon:"✏️",questions:[{text:"Seuil de rentabilité = charges fixes / taux de ___.",answer:"MCV",alt:["mcv","marge sur coût variable"],explain:"Seuil = charges fixes / taux de MCV."},{text:"Marge de sécurité = CA − seuil de ___.",answer:"rentabilité",explain:"Marge de sécurité = CA − seuil de rentabilité."},{text:"La réserve légale représente 5 % du bénéfice jusqu’à 10 % du ___.",answer:"capital",explain:"Réserve légale : 5 % du bénéfice jusqu’à 10 % du capital."}]},{id:"gf-t3-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"L’augmentation de capital est un financement externe.",answer:!0,explain:"Vrai : c’est une ressource externe (apports de nouveaux capitaux propres)."},{statement:"Au seuil de rentabilité, l’entreprise réalise un bénéfice.",answer:!1,explain:"Faux : au seuil, le résultat est nul (ni perte ni bénéfice)."},{statement:"Les charges variables évoluent avec le niveau d’activité.",answer:!0,explain:"Vrai : elles augmentent/diminuent avec la production ou les ventes."},{statement:"Le budget de trésorerie est une prévision mensuelle.",answer:!0,explain:"Vrai : encaissements et décaissements prévus mois par mois."}]}]}]},yh={id:"management",name:"Management (MSGN)",short:"Management",icon:"🏢",color:"#4f46e5",tagline:"Étude de cas : notion → document → conséquence.",chapters:[{id:"mgmt-t1",name:"Thème 1 — Les organisations et l’activité de production",short:"Organisations & production",keywords:"types organisations finalité performance efficacité efficience ressources chaîne de valeur compétitivité prix hors-prix",cours:[{h:"Types et finalités",points:["Types : entreprises privées ; organisations publiques (État, collectivités) ; organisations de la société civile (associations, ONG, syndicats).","Finalités : lucrative (profit), non lucrative (intérêt général, service public), sociétale (**RSE**)."]},{h:"Performance et ressources",points:["**Efficacité** = atteindre l’objectif ; **efficience** = l’atteindre au moindre coût.","Ressources : financières, humaines, matérielles, immatérielles (compétences, savoir-faire, marque, image, brevets).","Chaîne de valeur et création de valeur ; performance financière."]},{h:"Compétitivité",points:["Compétitivité-**prix** (proposer un prix plus bas).","Compétitivité **hors-prix** (qualité, innovation, image, délais)."]}],formulas:["Efficacité = atteindre l’objectif · Efficience = l’atteindre au moindre coût"],games:[{id:"mgmt-t1-qcm",type:"qcm",title:"QCM — Organisations & performance",icon:"❓",questions:[{q:"Une association loi 1901 relève des organisations…",choices:["de la société civile","privées lucratives","publiques","multinationales"],answer:0,explain:"Les associations, ONG et syndicats sont des organisations de la société civile."},{q:"L’efficience, c’est…",choices:["atteindre l’objectif au moindre coût","atteindre l’objectif quel qu’en soit le coût","augmenter le chiffre d’affaires","embaucher davantage"],answer:0,explain:"Efficacité = atteindre l’objectif ; efficience = l’atteindre au moindre coût."},{q:"La marque et l’image d’une entreprise sont des ressources…",choices:["immatérielles","financières","matérielles","humaines"],answer:0,explain:"La marque, l’image, les brevets, le savoir-faire sont des ressources immatérielles."},{q:"Baisser ses prix pour être plus attractif relève de la compétitivité…",choices:["prix","hors-prix","sociale","juridique"],answer:0,explain:"La compétitivité-prix joue sur le prix ; la hors-prix sur qualité, innovation, image, délais."},{q:"La finalité d’un service public est plutôt…",choices:["non lucrative (intérêt général)","lucrative","spéculative","concurrentielle"],answer:0,explain:"Les organisations publiques ont une finalité non lucrative d’intérêt général."}]},{id:"mgmt-t1-tri",type:"tri",title:"Tri — Type d’organisation",icon:"🗂️",instruction:"Classe chaque organisation dans la bonne catégorie.",categories:[{id:"priv",label:"Entreprise privée"},{id:"pub",label:"Organisation publique"},{id:"civ",label:"Société civile"}],items:[{text:"Une PME de meubles",cat:"priv"},{text:"Une mairie",cat:"pub"},{text:"Une association caritative",cat:"civ"},{text:"Un hôpital public",cat:"pub"},{text:"Une multinationale du numérique",cat:"priv"},{text:"Une ONG humanitaire",cat:"civ"}]},{id:"mgmt-t1-assoc",type:"association",title:"Association — Ressource ↔ exemple",icon:"🔗",pairs:[{left:"Ressource humaine",right:"Les 45 salariés"},{left:"Ressource matérielle",right:"L’atelier de production"},{left:"Ressource financière",right:"Les capitaux disponibles"},{left:"Ressource immatérielle",right:"L’image « haut de gamme »"}]},{id:"mgmt-t1-flash",type:"flashcard",title:"Flashcards — Notions clés",icon:"🃏",cards:[{front:"Efficacité",back:"Capacité à atteindre l’objectif fixé."},{front:"Efficience",back:"Atteindre l’objectif au moindre coût (bon usage des ressources)."},{front:"Compétitivité hors-prix",back:"Se démarquer par la qualité, l’innovation, l’image, les délais."},{front:"Finalité sociétale",back:"Prise en compte des enjeux sociaux et environnementaux (RSE)."},{front:"Chaîne de valeur",back:"Enchaînement des activités qui créent de la valeur pour le client."}]},{id:"mgmt-t1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Une entreprise privée a toujours une finalité lucrative.",answer:!1,explain:"Souvent, mais elle peut aussi intégrer une dimension sociétale (RSE)."},{statement:"Un brevet est une ressource immatérielle.",answer:!0,explain:"Vrai : brevets, marque, savoir-faire sont immatériels."},{statement:"Efficacité et efficience sont synonymes.",answer:!1,explain:"Faux : l’efficience ajoute la notion de coût minimal."}]}]},{id:"mgmt-t2",name:"Thème 2 — Les organisations et les acteurs",short:"Acteurs & stratégie",keywords:"management stratégique opérationnel SWOT Likert styles de direction motivation Maslow Herzberg spécialisation diversification Porter parties prenantes",cours:[{h:"Diagnostic et décision",points:["Management **stratégique** (long terme, direction générale) vs **opérationnel** (court terme, encadrement).","Diagnostic stratégique : **SWOT** (forces/faiblesses internes ; opportunités/menaces externes).","Styles de direction (**Likert**) : autoritaire, paternaliste, consultatif, participatif ; centralisation/décentralisation."]},{h:"Choix stratégiques",points:["Spécialisation vs diversification ; croissance **interne** vs **externe**.","Domination par les coûts vs différenciation (**Porter**)."]},{h:"Mobiliser les acteurs",points:["Parties prenantes (internes/externes) aux intérêts parfois divergents → coopération et gestion des conflits.","Motivation : **Maslow** (pyramide des besoins) ; **Herzberg** (facteurs d’hygiène / de motivation).","Implication, culture d’entreprise → cohésion et performance sociale."]}],formulas:["SWOT : Forces / Faiblesses (interne) — Opportunités / Menaces (externe)"],games:[{id:"mgmt-t2-qcm",type:"qcm",title:"QCM — Stratégie & motivation",icon:"❓",questions:[{q:"Dans le SWOT, les opportunités et menaces concernent…",choices:["l'environnement externe","l'entreprise elle-même","le bilan comptable","les salariés uniquement"],answer:0,explain:"Forces/faiblesses = interne ; opportunités/menaces = externe."},{q:"Racheter un concurrent, c’est de la croissance…",choices:["externe","interne","organique","défensive"],answer:0,explain:"La croissance externe passe par rachat/fusion ; l’interne par ses propres moyens."},{q:"Herzberg distingue les facteurs d’hygiène et les facteurs…",choices:["de motivation","de production","de coût","de risque"],answer:0,explain:"Facteurs d’hygiène (salaire, conditions) vs facteurs de motivation (reconnaissance, responsabilités)."},{q:"Le style de direction « participatif » a été théorisé par…",choices:["Likert","Maslow","Porter","Ricardo"],answer:0,explain:"Rensis Likert distingue autoritaire, paternaliste, consultatif, participatif."},{q:"Se concentrer sur un seul métier, c’est une stratégie de…",choices:["spécialisation","diversification","internationalisation","externalisation"],answer:0,explain:"Spécialisation = concentrer les ressources sur un seul métier."}]},{id:"mgmt-t2-tri",type:"tri",title:"Tri — Analyse SWOT",icon:"🗂️",instruction:"Classe ces éléments de Vél’Oc dans la bonne case du SWOT.",categories:[{id:"f",label:"Forces"},{id:"w",label:"Faiblesses"},{id:"o",label:"Opportunités"},{id:"m",label:"Menaces"}],items:[{text:"Positionnement haut de gamme, savoir-faire",cat:"f"},{text:"Turnover élevé (tensions RH)",cat:"w"},{text:"Marché de la mobilité douce en expansion",cat:"o"},{text:"Concurrence et critique environnementale",cat:"m"},{text:"Dépendance à un seul produit",cat:"w"},{text:"Aides publiques disponibles",cat:"o"}]},{id:"mgmt-t2-assoc",type:"association",title:"Association — Auteur / notion",icon:"🔗",pairs:[{left:"Maslow",right:"Pyramide des besoins"},{left:"Herzberg",right:"Facteurs d’hygiène / de motivation"},{left:"Likert",right:"Styles de direction"},{left:"Porter",right:"Domination par les coûts / différenciation"}]},{id:"mgmt-t2-flash",type:"flashcard",title:"Flashcards — Acteurs & stratégie",icon:"🃏",cards:[{front:"Management stratégique",back:"Décisions de long terme prises par la direction générale."},{front:"Management opérationnel",back:"Décisions de court terme, au niveau de l’encadrement."},{front:"Diversification",back:"Élargir l’offre à de nouveaux produits/marchés (répartit le risque)."},{front:"Parties prenantes",back:"Acteurs internes/externes concernés par l’organisation, aux intérêts parfois divergents."},{front:"Culture d’entreprise",back:"Valeurs et pratiques partagées qui renforcent la cohésion."}]},{id:"mgmt-t2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Les forces et faiblesses du SWOT sont des facteurs internes.",answer:!0,explain:"Vrai : interne = forces/faiblesses ; externe = opportunités/menaces."},{statement:"La diversification supprime tout risque pour l’entreprise.",answer:!1,explain:"Faux : elle répartit le risque mais peut disperser les ressources."},{statement:"Selon Herzberg, le salaire est surtout un facteur d’hygiène.",answer:!0,explain:"Vrai : son absence démotive, mais il ne suffit pas à motiver durablement."}]}]},{id:"mgmt-t3",name:"Thème 3 — Les organisations et la société",short:"RSE & numérique",keywords:"RSE développement durable éthique déontologie transformation numérique données cybersécurité télétravail",cours:[{h:"La RSE",points:["**RSE** : concilier les dimensions économique, sociale et environnementale (développement durable).","Éthique et déontologie, transparence, protection des données, égalité, engagement civique."]},{h:"Transformations numériques",points:["Nouveaux modèles économiques, relation client/usager, exploitation des **données**.","Cybersécurité, automatisation, télétravail, évolution des modes de vie et de consommation."]}],formulas:["RSE = concilier économique + social + environnemental"],games:[{id:"mgmt-t3-qcm",type:"qcm",title:"QCM — RSE & numérique",icon:"❓",questions:[{q:"La RSE concilie trois dimensions :",choices:["économique, sociale, environnementale","juridique, fiscale, sociale","marketing, financière, commerciale","locale, nationale, mondiale"],answer:0,explain:"La RSE relève du développement durable : économique + social + environnemental."},{q:"La critique sur l’empreinte carbone des batteries relève de la dimension…",choices:["environnementale de la RSE","financière","juridique","commerciale"],answer:0,explain:"C’est la dimension environnementale de la responsabilité sociétale."},{q:"Parmi ces éléments, lequel est un enjeu de la transformation numérique ?",choices:["La cybersécurité","L’amortissement linéaire","Le seuil de rentabilité","La réserve légale"],answer:0,explain:"Cybersécurité, exploitation des données, automatisation, télétravail = transformation numérique."},{q:"Une réponse RSE à la critique environnementale pourrait être…",choices:["le recyclage/réemploi des batteries","l’augmentation des prix","la réduction des salaires","l’arrêt de toute communication"],answer:0,explain:"Recyclage, éco-conception, filière durable, communication transparente sont des réponses RSE."}]},{id:"mgmt-t3-flash",type:"flashcard",title:"Flashcards — Société & numérique",icon:"🃏",cards:[{front:"RSE",back:"Responsabilité de l’organisation face à l’impact de ses décisions sur la société et l’environnement."},{front:"Déontologie",back:"Ensemble des règles de bonne conduite propres à une profession."},{front:"Données (data)",back:"Ressource clé exploitée par les organisations à l’ère numérique."},{front:"Cybersécurité",back:"Protection des systèmes d’information contre les menaces."},{front:"Éco-conception",back:"Concevoir un produit en limitant son impact environnemental."}]},{id:"mgmt-t3-tri",type:"tri",title:"Tri — Les 3 piliers de la RSE",icon:"🗂️",instruction:"Classe chaque action dans le bon pilier du développement durable.",categories:[{id:"eco",label:"Économique"},{id:"soc",label:"Social"},{id:"env",label:"Environnemental"}],items:[{text:"Assurer la rentabilité et la pérennité",cat:"eco"},{text:"Améliorer les conditions de travail",cat:"soc"},{text:"Réduire l’empreinte carbone",cat:"env"},{text:"Recycler les batteries",cat:"env"},{text:"Favoriser l’égalité et la formation",cat:"soc"}]},{id:"mgmt-t3-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La RSE ne concerne que l’environnement.",answer:!1,explain:"Faux : elle concilie aussi l’économique et le social."},{statement:"Le télétravail est une conséquence de la transformation numérique.",answer:!0,explain:"Vrai : il découle des outils numériques et modifie l’organisation du travail."},{statement:"Protéger les données personnelles relève de l’éthique et de la RSE.",answer:!0,explain:"Vrai : transparence et protection des données font partie des enjeux RSE."}]}]}]},qh={id:"droit",name:"Droit",short:"Droit",icon:"⚖️",color:"#d97706",tagline:"Qualifier la situation puis résoudre le problème de droit.",chapters:[{id:"droit-t5",name:"Thème 5 — Quel est le rôle du contrat ?",short:"Le contrat",keywords:"contrat parties consommateur professionnel débiteur créancier offre acceptation consentement capacité contenu licite vices erreur dol violence nullité relative absolue liberté contractuelle force obligatoire effet relatif bonne foi obligation moyens résultat clause pénale abusive rétractation exécution inexécution mise en demeure exception d’inexécution résolution résiliation",cours:[{h:"Définition et validité",points:["Le **contrat** est un accord de volontés destiné à **créer des obligations** entre les parties.","Conditions de validité (art. 1128 du Code civil) : le **consentement**, la **capacité** et un **contenu licite et certain**.","Le consentement doit être **libre et éclairé**, donc exempt de **vices** : **erreur, dol, violence**.","Force obligatoire (art. 1103) : « le contrat fait la loi des parties »."]},{h:"Vices du consentement et inexécution",points:["Un **vice du consentement** entraîne la **nullité** du contrat (anéantissement + restitutions).","Le **dol** est une tromperie (mensonge, manœuvre, voire silence) déterminante du consentement.","En cas d’**inexécution**, le créancier peut demander l’**exécution forcée**, la **résolution** du contrat ou des **dommages et intérêts**."]}],formulas:["Validité (art. 1128) : consentement + capacité + contenu licite et certain"],games:[{id:"droit-t5-qcm",type:"qcm",title:"QCM — Le contrat",icon:"❓",questions:[{q:"Un contrat est un accord de volontés qui a pour effet de…",choices:["créer des obligations entre les parties","sanctionner une infraction pénale","réparer un dommage causé à un tiers","immatriculer une société"],answer:0,explain:"Le contrat crée des obligations entre les parties (le contracter, payer, livrer…)."},{q:"Selon l’article 1128 du Code civil, la validité d’un contrat suppose…",choices:["le consentement, la capacité et un contenu licite et certain","un écrit signé et enregistré","la présence obligatoire d’un notaire","le versement d’un acompte"],answer:0,explain:"Les trois conditions de validité sont : le consentement, la capacité et un contenu licite et certain."},{q:"Un vendeur dissimule volontairement que la voiture a été accidentée pour décider l’acheteur. Ce comportement caractérise…",choices:["un dol","une simple erreur de l’acheteur","une violence","un cas de force majeure"],answer:0,explain:"La tromperie (mensonge, manœuvre ou réticence) déterminante du consentement est un dol : vice du consentement pouvant entraîner la nullité."},{q:"La règle selon laquelle les parties sont tenues de respecter leurs engagements se nomme…",choices:["la force obligatoire du contrat","la liberté contractuelle","la nullité du contrat","la résolution du contrat"],answer:0,explain:"« Le contrat fait la loi des parties » (art. 1103) : c’est la force obligatoire."},{q:"La sanction d’un vice du consentement est…",choices:["la nullité du contrat","une amende pénale","une contravention","un licenciement"],answer:0,explain:"Un vice du consentement (erreur, dol, violence) peut entraîner la nullité du contrat."},{q:"En cas d’inexécution du contrat, le créancier peut notamment demander…",choices:["l’exécution forcée, la résolution ou des dommages et intérêts","une peine d’emprisonnement du débiteur","une amende pénale automatique","la dissolution d’une société"],answer:0,explain:"Les sanctions civiles de l’inexécution sont l’exécution forcée, la résolution et/ou les dommages et intérêts."}]},{id:"droit-t5-ordre",type:"ordre",title:"Remise en ordre — Le syllogisme juridique",icon:"🔢",instruction:"Remets les étapes du raisonnement juridique dans l’ordre.",steps:["Majeure : la règle de droit","Mineure : les faits qualifiés","Conclusion : application de la règle aux faits"],explain:"Syllogisme : règle de droit (majeure) → faits qualifiés (mineure) → conclusion."},{id:"droit-t5-flash",type:"flashcard",title:"Flashcards — Notions du contrat",icon:"🃏",cards:[{front:"Contrat",back:"Accord de volontés créant des obligations entre les parties."},{front:"Formation du contrat",back:"Rencontre d’une offre et d’une acceptation (échange des consentements)."},{front:"Les 3 conditions de validité (art. 1128)",back:"Consentement, capacité, contenu licite et certain."},{front:"Les 3 vices du consentement",back:"Erreur, dol, violence."},{front:"Nullité relative / absolue",back:"Protège un intérêt privé (vice, incapacité) / sanctionne une règle d’intérêt général."},{front:"Force obligatoire (art. 1103)",back:"« Le contrat fait la loi des parties »."},{front:"Obligation de moyens / de résultat",back:"Mettre en œuvre des moyens / atteindre un résultat précis."},{front:"Exception d’inexécution",back:"Suspendre son obligation tant que l’autre partie n’exécute pas la sienne."},{front:"Sanctions de l’inexécution",back:"Mise en demeure, exécution forcée, résolution/résiliation, dommages et intérêts (clause pénale)."}]},{id:"droit-t5-assoc",type:"association",title:"Association — Notion du contrat ↔ définition",icon:"🔗",pairs:[{left:"Consentement",right:"Accord de volonté libre et éclairé"},{left:"Capacité",right:"Aptitude juridique à s’engager"},{left:"Dol",right:"Tromperie qui vicie le consentement"},{left:"Force obligatoire",right:"« Le contrat fait la loi des parties »"},{left:"Nullité",right:"Anéantissement du contrat (restitutions)"}]},{id:"droit-t5-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La liberté contractuelle permet, en principe, de choisir de contracter ou non, et avec qui.",answer:!0,explain:"Vrai : c’est un principe, encadré par la loi et l’ordre public."},{statement:"Dans la plupart des cas, un contrat se forme par le seul accord des volontés, sans écrit obligatoire.",answer:!0,explain:"Vrai : c’est le principe du consensualisme (certains contrats exigent toutefois un écrit)."},{statement:"Le dol peut entraîner la nullité du contrat.",answer:!0,explain:"Vrai : le dol vicie le consentement."},{statement:"Une fois conclu, un contrat peut être rompu librement par une seule partie, à tout moment.",answer:!1,explain:"Faux : la force obligatoire impose de respecter ses engagements."},{statement:"Le contenu du contrat doit être licite et certain.",answer:!0,explain:"Vrai : c’est l’une des conditions de validité (art. 1128)."}]}]},{id:"droit-t6",name:"Thème 6 — Qu’est-ce qu’être responsable ?",short:"Responsabilité",keywords:"responsabilité civile pénale délictuelle extracontractuelle contractuelle fait générateur faute dommage préjudice corporel matériel moral écologique caractères certain direct personnel légitime assurance mutualisation lien de causalité régimes spéciaux accident du travail circulation produits défectueux obligation de sécurité exonération force majeure infraction dommages et intérêts",cours:[{h:"La responsabilité civile",points:["But : **réparer** un dommage causé à autrui.","**Contractuelle** (le dommage naît de l’inexécution d’un contrat) ou **délictuelle / extracontractuelle** (hors de tout contrat).","Trois conditions : **fait générateur + dommage (préjudice) + lien de causalité**.","Le préjudice réparable doit notamment être **certain, direct et personnel**.","Réparation = **dommages et intérêts**."]},{h:"La responsabilité pénale",points:["But : **sanctionner** l’auteur d’une **infraction**.","Infractions par gravité croissante : **contravention, délit, crime**.","Un même fait peut engager **à la fois** la responsabilité civile et la responsabilité pénale."]}],formulas:["Responsabilité civile = fait générateur + dommage + lien de causalité"],games:[{id:"droit-t6-qcm",type:"qcm",title:"QCM — La responsabilité",icon:"❓",questions:[{q:"La responsabilité civile a pour but principal…",choices:["de réparer le dommage causé à autrui","de punir l’auteur par une peine","de percevoir un impôt","d’annuler un contrat"],answer:0,explain:"La responsabilité civile répare (dommages et intérêts) ; c’est la pénale qui sanctionne."},{q:"Les trois conditions de la responsabilité civile sont…",choices:["un fait générateur, un dommage et un lien de causalité","une faute, une amende et une peine","un contrat, un salaire et une subordination","une offre, une acceptation et un prix"],answer:0,explain:"Il faut un fait générateur, un dommage (préjudice) et un lien de causalité entre les deux."},{q:"Lorsque le dommage résulte de l’inexécution d’un contrat, la responsabilité civile est…",choices:["contractuelle","délictuelle","pénale","administrative"],answer:0,explain:"Le dommage né de l’inexécution d’un contrat relève de la responsabilité contractuelle."},{q:"En l’absence de tout contrat entre l’auteur et la victime, la responsabilité civile est…",choices:["délictuelle (extracontractuelle)","contractuelle","pénale","inexistante"],answer:0,explain:"Hors de tout contrat, la responsabilité civile est délictuelle (extracontractuelle)."},{q:"La réparation du dommage en responsabilité civile prend le plus souvent la forme…",choices:["de dommages et intérêts","d’une peine d’emprisonnement","d’une amende pénale","d’un simple avertissement"],answer:0,explain:"La victime obtient réparation sous forme de dommages et intérêts."},{q:"La responsabilité pénale a pour but…",choices:["de sanctionner l’auteur d’une infraction","de réparer le préjudice de la victime","d’exécuter un contrat","de fixer le prix d’une vente"],answer:0,explain:"La responsabilité pénale sanctionne une infraction, au nom de la société."},{q:"Classées par gravité croissante, les infractions sont…",choices:["contraventions, délits, crimes","crimes, délits, contraventions","délits, contraventions, crimes","contraventions, crimes, délits"],answer:0,explain:"De la moins grave à la plus grave : contravention, délit, crime."}]},{id:"droit-t6-tri",type:"tri",title:"Tri — Responsabilité civile ou pénale ?",icon:"🗂️",instruction:"Classe selon la finalité de la responsabilité.",categories:[{id:"civ",label:"Civile (réparer)"},{id:"pen",label:"Pénale (sanctionner)"}],items:[{text:"Verser des dommages et intérêts à la victime",cat:"civ"},{text:"Condamner l’auteur d’un délit à une peine",cat:"pen"},{text:"Indemniser une personne blessée",cat:"civ"},{text:"Sanctionner un crime ou une contravention",cat:"pen"}]},{id:"droit-t6-assoc",type:"association",title:"Association — Condition ↔ exemple (cas du sol mouillé)",icon:"🔗",pairs:[{left:"Fait générateur",right:"Le sol laissé mouillé sans signalisation"},{left:"Dommage (préjudice)",right:"La fracture du poignet et l’opération"},{left:"Lien de causalité",right:"La chute résulte de l’absence de signalisation"}]},{id:"droit-t6-flash",type:"flashcard",title:"Flashcards — Responsabilité",icon:"🃏",cards:[{front:"Responsabilité civile",back:"Obligation de réparer le dommage causé à autrui."},{front:"Types de dommage",back:"Corporel, matériel, moral ; patrimonial / extrapatrimonial (+ préjudice écologique)."},{front:"Préjudice réparable",back:"Doit être certain, direct, personnel et légitime."},{front:"Contractuelle / extracontractuelle",back:"Née de l’inexécution d’un contrat / hors de tout contrat (fait personnel, des choses, d’autrui, des animaux, ruine)."},{front:"Assurance",back:"Prise en charge des dommages par mutualisation des risques (+ fonds de garantie)."},{front:"Lien de causalité",back:"Rapport de cause à effet entre le fait générateur et le dommage."},{front:"Moyens d’exonération",back:"Force majeure, fait d’un tiers, faute de la victime."},{front:"Responsabilité pénale",back:"Sanctionne une infraction (contravention, délit, crime)."}]},{id:"droit-t6-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La responsabilité civile vise à réparer, la responsabilité pénale à sanctionner.",answer:!0,explain:"Vrai : ce sont leurs finalités respectives."},{statement:"Un même fait peut engager à la fois la responsabilité civile et la responsabilité pénale.",answer:!0,explain:"Vrai : ex. une agression (peine + dommages et intérêts)."},{statement:"Sans lien de causalité entre le fait générateur et le dommage, la responsabilité civile n’est pas engagée.",answer:!0,explain:"Vrai : les trois conditions doivent être réunies."},{statement:"La responsabilité délictuelle suppose un contrat entre les parties.",answer:!1,explain:"Faux : la délictuelle joue justement hors de tout contrat."},{statement:"Pour être réparable, le préjudice doit notamment être certain.",answer:!0,explain:"Vrai : certain, direct et personnel."}]}]},{id:"droit-t7",name:"Thème 7 — Comment le droit encadre-t-il le travail salarié ?",short:"Travail salarié",keywords:"contrat de travail lien de subordination pouvoir de direction réglementaire règlement intérieur disciplinaire contrat d’entreprise CDI CDD chantier saisonnier intérim clauses générales spécifiques mobilité non-concurrence télétravail convention collective négociation partenaires sociaux sources licenciement motif personnel économique cause réelle et sérieuse rupture conventionnelle démission liberté d’expression vie privée droit de grève liberté syndicale CSE délégué syndical",cours:[{h:"Le contrat de travail",points:["Trois éléments : une **prestation de travail**, une **rémunération** et un **lien de subordination juridique** (critère déterminant).","Le **lien de subordination** = pouvoir de l’employeur de donner des ordres, d’en contrôler l’exécution et de sanctionner.","Le **CDI** est la forme normale et générale de la relation de travail ; le **CDD** et l’**intérim** sont l’exception (cas de recours, **écrit obligatoire**).","Sources : **Code du travail**, **conventions et accords collectifs**, règlement intérieur, contrat de travail."]},{h:"La rupture du contrat",points:["**Démission** (salarié), **licenciement** (employeur : **motif réel et sérieux** + procédure), **rupture conventionnelle** (accord homologué).","Le licenciement peut être **pour motif personnel** ou **pour motif économique**."]}],formulas:["Contrat de travail = prestation de travail + rémunération + lien de subordination"],games:[{id:"droit-t7-qcm",type:"qcm",title:"QCM — Le travail salarié",icon:"❓",questions:[{q:"Le critère déterminant du contrat de travail est…",choices:["le lien de subordination juridique","la durée du travail","le lieu de travail","le montant du salaire"],answer:0,explain:"C’est le lien de subordination (ordres, contrôle, sanction) qui caractérise le contrat de travail."},{q:"Une personne exécute un travail, est rémunérée et reçoit des ordres, sans contrat écrit. La relation est…",choices:["un contrat de travail (présumé à durée indéterminée)","nulle faute d’écrit","un contrat commercial","du bénévolat"],answer:0,explain:"La subordination caractérise un contrat de travail ; sans écrit fixant un terme, il est présumé à durée indéterminée (CDI)."},{q:"La forme normale et générale de la relation de travail est…",choices:["le CDI","le CDD","l’intérim","le stage"],answer:0,explain:"Le CDI est le contrat de droit commun ; CDD et intérim sont l’exception."},{q:"Contrairement au CDI, le CDD doit obligatoirement…",choices:["être établi par écrit et reposer sur un cas de recours prévu par la loi","durer au moins deux ans","être conclu sans aucun terme","être renouvelé indéfiniment"],answer:0,explain:"Le CDD est écrit et motivé (cas de recours) ; à défaut, il peut être requalifié en CDI."},{q:"Un licenciement n’est régulier que s’il repose sur…",choices:["un motif réel et sérieux, avec respect d’une procédure","la seule volonté de l’employeur","une décision du salarié","un tirage au sort"],answer:0,explain:"Le licenciement exige un motif réel et sérieux (personnel ou économique) et une procédure."},{q:"Parmi les sources du droit du travail figurent notamment…",choices:["le Code du travail et les conventions collectives","le seul Code civil","les statuts de la société","le règlement européen sur la TVA"],answer:0,explain:"Code du travail, conventions et accords collectifs, règlement intérieur et contrat encadrent la relation de travail."}]},{id:"droit-t7-assoc",type:"association",title:"Association — Rupture ↔ définition",icon:"🔗",pairs:[{left:"Démission",right:"Rupture à l’initiative du salarié"},{left:"Licenciement",right:"Rupture par l’employeur (motif réel et sérieux)"},{left:"Rupture conventionnelle",right:"Rupture du CDI d’un commun accord (homologuée)"},{left:"Convention collective",right:"Accord négocié applicable à une branche"}]},{id:"droit-t7-flash",type:"flashcard",title:"Flashcards — Travail salarié",icon:"🃏",cards:[{front:"Lien de subordination",back:"Pouvoir de l’employeur de donner des ordres, contrôler, sanctionner."},{front:"Pouvoirs de l’employeur",back:"De direction, réglementaire (règlement intérieur), disciplinaire."},{front:"CDI et ses clauses",back:"Norme du contrat de travail ; clauses générales + spécifiques (mobilité, non-concurrence, télétravail)."},{front:"Autres contrats",back:"CDD, CDI de chantier, saisonnier, intérim (écrits)."},{front:"Motifs de licenciement",back:"Motif personnel ou économique, avec cause réelle et sérieuse + procédure."},{front:"Rupture conventionnelle",back:"Rupture du CDI d’un commun accord (individuelle ou collective)."},{front:"Représentants / grève",back:"CSE et délégué syndical ; droit de grève (constitutionnel) et liberté syndicale."},{front:"Sources du droit du travail",back:"Code du travail, conventions/accords collectifs, règlement intérieur, contrat."}]},{id:"droit-t7-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le lien de subordination caractérise le contrat de travail.",answer:!0,explain:"Vrai : c’est le critère déterminant."},{statement:"Un CDD doit obligatoirement être établi par écrit.",answer:!0,explain:"Vrai : à défaut, il peut être requalifié en CDI."},{statement:"Le CDI est la forme normale du contrat de travail.",answer:!0,explain:"Vrai : CDD et intérim sont l’exception encadrée."},{statement:"L’employeur peut licencier un salarié sans aucun motif.",answer:!1,explain:"Faux : il faut un motif réel et sérieux et une procédure."},{statement:"Une convention collective peut compléter le Code du travail pour une branche.",answer:!0,explain:"Vrai : elle adapte les règles à une profession."}]}]},{id:"droit-t8",name:"Thème 8 — Dans quel cadre et comment entreprendre ?",short:"Entreprendre",keywords:"liberté d’entreprendre entreprise individuelle unicité du patrimoine insaisissabilité patrimoine d’affectation EURL société contrat de société article 1832 apport affectio societatis responsabilité limitée aux apports SCOP concurrence déloyale entente abus de position dominante franchise sous-traitance",cours:[{h:"Choisir sa structure : entreprise individuelle ou société",points:["**Liberté d’entreprendre** (à valeur constitutionnelle) et **liberté du commerce et de l’industrie**.","Entreprise individuelle : pas de personne morale nouvelle ; par le **principe d’unicité du patrimoine**, l’entrepreneur répond des dettes sur **tout son patrimoine** — d’où la **déclaration d’insaisissabilité** et le **patrimoine d’affectation**.","L’**EURL** crée une **personne morale** à associé unique, qui **protège le patrimoine** du gérant."]},{h:"La société et le respect de la concurrence",points:["La **société** naît d’un **contrat de société** (art. **1832**) : **apports** + **affectio societatis** + partage des bénéfices ; **responsabilité limitée aux apports**. Forme coopérative = **SCOP**.","**Concurrence déloyale** (parasitisme, dénigrement, imitation, désorganisation) → **action** fondée sur la **responsabilité civile**.","**Entente** et **abus de position dominante** interdits (Autorité de la concurrence). Partenariats sans subordination : **sous-traitance**, **franchise**."]}],formulas:["Société = apports + affectio societatis + partage des bénéfices (art. 1832)"],games:[{id:"droit-t8-qcm",type:"qcm",title:"QCM — Entreprendre",icon:"❓",questions:[{q:"La liberté d’entreprendre permet…",choices:["de créer et d’exercer librement une activité économique","de ne payer aucun impôt","de fixer seul le droit du travail","de contourner tout contrat"],answer:0,explain:"La liberté d’entreprendre (à valeur constitutionnelle) permet de créer et d’exercer une activité, dans le respect de la loi."},{q:"Dans une entreprise individuelle, le principe d’unicité du patrimoine signifie que…",choices:["l’entrepreneur répond des dettes sur l’ensemble de son patrimoine","l’entreprise a un patrimoine séparé automatiquement","l’entrepreneur ne risque rien","une personne morale est créée"],answer:0,explain:"Sans personne morale nouvelle, le patrimoine personnel répond des dettes professionnelles (d’où la déclaration d’insaisissabilité, le patrimoine d’affectation)."},{q:"L’EURL présente l’intérêt de…",choices:["créer une personne morale qui protège le patrimoine du gérant","supprimer tout impôt","éviter tout écrit","réunir au moins cinq associés"],answer:0,explain:"L’EURL est une société à associé unique : la personne morale distincte protège le patrimoine."},{q:"Selon l’article 1832 du Code civil, la société suppose des apports, le partage des bénéfices et…",choices:["l’affectio societatis","un lien de subordination","une clause pénale","un brevet"],answer:0,explain:"L’affectio societatis est la volonté commune des associés de collaborer."},{q:"Dans une société commerciale, la responsabilité des associés est en principe…",choices:["limitée à leurs apports","illimitée sur tout leur patrimoine","inexistante","transférée à l’État"],answer:0,explain:"La responsabilité est généralement limitée aux apports ; les bénéfices sont partagés au prorata."},{q:"Dénigrer un concurrent, l’imiter ou le parasiter constitue…",choices:["une concurrence déloyale (action en responsabilité civile)","un exercice normal de la concurrence","une entente licite","une clause du contrat"],answer:0,explain:"La concurrence déloyale se prouve comme la responsabilité civile : fait générateur + préjudice + lien de causalité."},{q:"Un accord entre entreprises faussant la concurrence est…",choices:["une entente (interdite)","une franchise","une sous-traitance","une SCOP"],answer:0,explain:"L’entente et l’abus de position dominante sont sanctionnés (Autorité de la concurrence, art. 101-102 TFUE)."}]},{id:"droit-t8-assoc",type:"association",title:"Association — Notion ↔ définition",icon:"🔗",pairs:[{left:"Unicité du patrimoine",right:"L’entrepreneur individuel répond des dettes sur tout son patrimoine"},{left:"EURL",right:"Société à associé unique qui protège le patrimoine"},{left:"Affectio societatis",right:"Volonté commune des associés de collaborer"},{left:"Concurrence déloyale",right:"Parasitisme, dénigrement, imitation, désorganisation"},{left:"Franchise / sous-traitance",right:"Partenariats sans lien de subordination"}]},{id:"droit-t8-flash",type:"flashcard",title:"Flashcards — Entreprendre",icon:"🃏",cards:[{front:"Liberté d’entreprendre",back:"Liberté (à valeur constitutionnelle) de créer et d’exercer une activité économique."},{front:"Unicité du patrimoine",back:"L’entrepreneur individuel répond des dettes sur tout son patrimoine (d’où insaisissabilité, patrimoine d’affectation)."},{front:"Contrat de société (art. 1832)",back:"Apports + affectio societatis + partage des bénéfices ; responsabilité limitée aux apports."},{front:"SCOP",back:"Société coopérative : forme de l’économie sociale et solidaire."},{front:"Concurrence déloyale",back:"Pratiques fautives sanctionnées par une action en responsabilité civile."}]},{id:"droit-t8-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La liberté d’entreprendre a une valeur constitutionnelle.",answer:!0,explain:"Vrai : elle est reconnue par le Conseil constitutionnel."},{statement:"Dans l’entreprise individuelle, le patrimoine personnel peut répondre des dettes professionnelles.",answer:!0,explain:"Vrai : c’est le principe d’unicité du patrimoine."},{statement:"La responsabilité des associés d’une société est généralement limitée à leurs apports.",answer:!0,explain:"Vrai : sauf formes particulières, on ne perd que son apport."},{statement:"Une entente entre concurrents pour fausser le marché est autorisée.",answer:!1,explain:"Faux : l’entente et l’abus de position dominante sont interdits."}]}]}]},kh={id:"economie",name:"Économie",short:"Économie",icon:"📈",color:"#dc2626",tagline:"Exploiter des données chiffrées puis argumenter.",chapters:[{id:"eco-t6",name:"Thème 6 — Le rôle de l’État",short:"Rôle de l’État",keywords:"Musgrave allocation redistribution stabilisation défaillances marché externalités biens collectifs politique budgétaire monétaire",cours:[{h:"Les fonctions de l’État (Musgrave)",points:["**Allocation** : produire des biens collectifs, corriger le marché.","**Redistribution** : réduire les inégalités (prélèvements et prestations).","**Stabilisation** : agir sur la conjoncture."]},{h:"Défaillances et politiques",points:["Défaillances du marché : externalités, biens collectifs, asymétries d’information, monopole.","Politiques : conjoncturelle (**budgétaire**, **monétaire**) et **structurelle**.","Budget : dépenses publiques, prélèvements obligatoires, déficit, dette publique."]}],formulas:["Fonctions de l’État (Musgrave) : allocation · redistribution · stabilisation"],games:[{id:"eco-t6-qcm",type:"qcm",title:"QCM — Le rôle de l’État",icon:"❓",questions:[{q:"Réduire les inégalités par les impôts et les prestations, c’est la fonction de…",choices:["redistribution","allocation","stabilisation","spéculation"],answer:0,explain:"La redistribution (Musgrave) réduit les inégalités."},{q:"La pollution est un exemple de…",choices:["externalité (défaillance du marché)","bien collectif pur","redistribution","politique monétaire"],answer:0,explain:"La pollution est une externalité négative, une défaillance du marché."},{q:"Agir sur les taux d’intérêt relève de la politique…",choices:["monétaire","structurelle","budgétaire","commerciale"],answer:0,explain:"La politique monétaire agit via la monnaie et les taux ; la budgétaire via dépenses/recettes."},{q:"Produire des biens collectifs correspond à la fonction d’…",choices:["allocation","redistribution","stabilisation","exportation"],answer:0,explain:"L’allocation : produire des biens collectifs et corriger le marché."}]},{id:"eco-t6-assoc",type:"association",title:"Association — Fonction ↔ objectif",icon:"🔗",pairs:[{left:"Allocation",right:"Produire des biens collectifs"},{left:"Redistribution",right:"Réduire les inégalités"},{left:"Stabilisation",right:"Agir sur la conjoncture"},{left:"Politique monétaire",right:"Agir sur la monnaie et les taux"}]},{id:"eco-t6-flash",type:"flashcard",title:"Flashcards — État & marché",icon:"🃏",cards:[{front:"Bien collectif",back:"Bien non rival et non excluable (ex. éclairage public)."},{front:"Externalité",back:"Effet d’une activité sur un tiers, non pris en compte par le marché."},{front:"Politique budgétaire",back:"Utiliser dépenses et recettes publiques pour agir sur l’économie."},{front:"Dette publique",back:"Ensemble des emprunts accumulés par l’État."}]},{id:"eco-t6-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Les asymétries d’information sont une défaillance du marché.",answer:!0,explain:"Vrai, au même titre que les externalités et les biens collectifs."},{statement:"La politique monétaire consiste à voter le budget de l’État.",answer:!1,explain:"Faux : c’est la politique budgétaire. La monétaire agit sur la monnaie et les taux."},{statement:"La stabilisation vise à agir sur la conjoncture.",answer:!0,explain:"Vrai : c’est l’une des trois fonctions de Musgrave."}]}]},{id:"eco-t7",name:"Thème 7 — Emploi et chômage",short:"Emploi & chômage",keywords:"marché du travail population active taux d’activité taux d’emploi taux de chômage conjoncturel structurel frictionnel",cours:[{h:"Le marché du travail",points:["Offre de travail (ménages) / demande de travail (entreprises) ; salaire d’équilibre.","Indicateurs : population active, taux d’activité, taux d’emploi, taux de chômage."]},{h:"Chômage et politiques",points:["Types de chômage : conjoncturel, structurel, frictionnel.","Politiques de l’emploi : baisse du coût du travail, formation, flexibilité (actives/passives)."]}],formulas:["Population active = personnes en emploi + chômeurs","Taux d’activité = population active / population en âge de travailler","Taux de chômage = chômeurs / population active"],games:[{id:"eco-t7-qcm",type:"qcm",title:"QCM — Emploi & chômage",icon:"❓",questions:[{q:"Emploi = 24 M, chômeurs = 3 M. Population active ?",choices:["27 millions","21 millions","3 millions","40 millions"],answer:0,explain:"Population active = emploi + chômeurs = 24 + 3 = 27 millions."},{q:"Population active 27 M, chômeurs 3 M. Taux de chômage ?",choices:["≈ 11,1 %","≈ 7,5 %","≈ 12,5 %","≈ 3 %"],answer:0,explain:"Taux de chômage = chômeurs / population active = 3 / 27 ≈ 11,1 %."},{q:"Un chômeur « d ,{text:"Ouvrir les marchés à la concurrence",cat:"le"},{text:"Taxer les produits importés",cat:"pr"},{text:"Se spécialiser selon ses avantages",cat:"le"}]},{id:"eco-t8-flash",type:"flashcard",title:"Flashcards — Mondialisation",icon:"🃏",cards:[{front:"Avantage comparatif",back:"Un pays se spécialise là où il est relativement le plus efficace (Ricardo)."},{front:"DIT",back:"Division internationale du travail : répartition mondiale des productions."},{front:"Protectionnisme",back:"Protéger la production nationale (droits de douane, quotas, normes)."},{front:"FMN",back:"Firme multinationale implantée dans plusieurs pays."}]},{id:"eco-t8-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le libre-échange profite également à tous les pays.",answer:!1,explain:"Faux : il crée de la richesse globale mais fait aussi des perdants (secteurs, pays)."},{statement:"L’OMC régule le commerce international.",answer:!0,explain:"Vrai : elle encadre les échanges et arbitre les différends."},{statement:"La spécialisation découle des avantages comparatifs.",answer:!0,explain:"Vrai, selon la théorie de Ricardo."}]}]},{id:"eco-t9",name:"Thème 9 — Croissance et développement durable",short:"Croissance durable",keywords:"croissance PIB développement durable soutenabilité économie circulaire collaborative pauvreté inégalités grand oral",cours:[{h:"Croissance et ses limites",points:["Croissance (PIB) et ses limites comme indicateur de bien-être.","Développement durable : économique + social + environnemental.","Soutenabilité faible/forte, capital naturel."]},{h:"Instruments et inégalités",points:["Instruments : économie circulaire, collaborative, taxation, quotas.","Pauvreté absolue/relative, inégalités.","Remarque : ce thème n’est **pas évalué à l’écrit**, il alimente surtout le **grand oral**."]}],formulas:["Développement durable = économique + social + environnemental"],games:[{id:"eco-t9-qcm",type:"qcm",title:"QCM — Croissance durable",icon:"❓",questions:[{q:"La xistence humaine et la culture · la morale et la politique · la connaissance"],games:[{id:"philo-notions-flash",type:"flashcard",title:"Flashcards — Les 7 notions",icon:"🃏",cards:[{front:"L’art",back:"Imitation ou création ? À quoi sert l’art ? Le beau est-il subjectif ?"},{front:"La justice",back:"Se réduit-elle à la loi ? Peut-il être juste de désobéir ? Justice = égalité ?"},{front:"La liberté",back:"Sommes-nous libres ? Liberté et déterminisme ; liberté et loi."},{front:"La nature",back:"L’homme fait-il partie de la nature ? Faut-il la respecter ? Nature/culture."},{front:"La religion",back:"Foi et raison sont-elles opposées ? La foi exclut-elle le doute ?"},{front:"La technique",back:"Nous libère-t-elle ou nous asservit-elle ? Progrès technique = progrès humain ?"},{front:"La vérité",back:"Peut-on tout démontrer ? Vérité et opinion ; rôle du doute."}]},{id:"philo-notions-assoc",type:"association",title:"Association — Repère ↔ son opposé",icon:"🔗",pairs:[{left:"Absolu",right:"Relatif"},{left:"Objectif",right:"Subjectif"},{left:"Légal",right:"Légitime"},{left:"Croire",right:"Savoir"},{left:"Contingent",right:"Nécessaire"},{left:"Universel",right:"Particulier"}]},{id:"philo-notions-qcm",type:"qcm",title:"QCM — Notions & repères",icon:"❓",questions:[{q:"La distinction « légal / légitime » oppose…",choices:["ce qui est conforme à la loi / ce qui est juste","le vrai / le faux","le beau / le laid","la cause / la fin"],answer:0,explain:"Légal = conforme à la loi ; légitime = conforme à la justice/au droit moral."},{q:"La question « la technique nous libère-t-elle ou nous asservit-elle ? » porte sur la notion de…",choices:["la technique","la justice","la religion","l’art"],answer:0,explain:"C’est une problématisation classique de la notion de technique."},{q:"Distinguer « croire » et « savoir » est utile pour la notion de…",choices:["la vérité (et la religion)","la nature","l’art","la liberté"],answer:0,explain:"Croire/savoir éclaire les rapports entre foi, opinion et v ere in 2019 »).","Present continuous : action en cours (« They are working now »).","Past perfect (had + participe passé) : antériorité dans le passé.","Futur : will (prévision) / be going to (intention)."]},{h:"Modaux, conditionnels, passif",points:["Modaux (+ base verbale) : can/could, may/might, must, have to, should, would.","Conditionnel type 1 : If + present, will + BV. Type 2 : If + preterit, would + BV. Type 3 : If + past perfect, would have + PP.","Voix passive : be (au temps voulu) + participe passé (« The report was written by the manager »).","Comparatifs : cheaper / more expensive ; irréguliers good→better→best, bad→worse→worst."]}],formulas:["Present perfect = have/has + participe passé","Conditionnel 2 : If + preterit, would + base verbale","Passif = be + participe passé"],games:[{id:"lng-en-gram-trou",type:"trou",title:"Texte à trous — Conjugaison",icon:"✏️",questions:[{text:"I ____ (live) in this city since 2015.",answer:"have lived",explain:"Present perfect + since : « I have lived »."},{text:"Yesterday, they ____ (go) to the cinema.",answer:"went",explain:"Preterit (action datée) : « went »."},{text:"If she ____ (study) more, she would pass.",answer:"studied",explain:"Conditionnel type 2 : if + preterit → « studied »."},{text:"The email ____ (send) by the assistant this morning.",answer:"was sent",explain:"Passif au preterit : « was sent »."}]},{id:"lng-en-gram-qcm",type:"qcm",title:"QCM — Grammaire anglaise",icon:"❓",questions:[{q:'Which tense: "I ___ London." (bilan / expérience, avec already)',choices:["have already visited","visited","am visiting","will visit"],answer:0,explain:"Le present perfect (have + PP) exprime un bilan/une expérience (already, ever, yet)."},{q:'Conditionnel type 2 : "If I ___ rich, I would travel."',choices:["were","am","will be","had been"],answer:0,explain:"Type 2 (irréel du présent) : If + preterit → « were »."},{q:'Passif : "The report ___ by the manager."',choices:["was written","wrote","has write","is writing"],answer:0,explain:"Passif = be + participe passé : « was written »."},{q:"Discours rapporté de « I will call you tomorrow » :",choices:["He said he would call me the following day","He said he will call me tomorrow","He says he calls me tomorrow","He told will call tomorrow"],answer:0,explain:"Recul d’un temps : will → would ; tomorrow → the following/next day."},{q:'Comparatif irrégulier de "good" :',choices:["better","gooder","more good","best"],answer:0,explain:"good → better → the best."}]},{id:"lng-en-gram-assoc",type:"association",title:"Association — Temps ↔ emploi",icon:"🔗",pairs:[{left:"Present perfect",right:"Lien passé-présent (for, since, already)"},{left:"Preterit",right:"Action passée datée et terminée"},{left:"Past perfect",right:"Antériorité dans le passé (had + PP)"},{left:"Be going to",right:"Intention, projet"}]},{id:"lng-en-gram-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Après un modal, on met la base verbale (sans « to »).",answer:!0,explain:"Vrai : can go, must go… (pas de « to », pas de « -s »)."},{statement:"Le present perfect se forme avec « had + participe passé ».",answer:!1,explain:"Faux : c’est « have/has + participe passé » (had = past perfect)."},{statement:"Le passif se construit avec « be + participe passé ».",answer:!0,explain:"Vrai : The report was written…"}]}]},{id:"lng-en-voc",name:"Anglais — Vocabulaire (axes & ETLV / management)",short:"Anglais · vocabulaire",keywords:"vocabulaire axes ETLV management turnover balance sheet cash flow break-even shareholders CSR",cours:[{h:"Vocabulaire ETLV / management",points:["turnover = chiffre d’affaires ; balance sheet = bilan ; cash flow = trésorerie.","break-even point = seuil de rentabilité ; shareholders = actionnaires ; loan = emprunt.","stakeholders = parties prenantes ; CSR = RSE ; carbon footprint = empreinte carbone."]},{h:"Vocabulaire par axes",points:["Identités & échanges : migration, border, diversity, discrimination, equality.","Innovations & responsabilité : technology, data, privacy, sustainability, ethics.","Citoyenneté & mondes virtuels : social media, fake news, surveillance, digital footprint."]}],formulas:["Astuce : ficher le vocabulaire par axe et le réviser en flashcards."],games:[{id:"lng-en-voc-memory",type:"memory",title:"Memory — Anglais ↔ français (management)",icon:"🧠",pairs:[{a:"turnover",b:"chiffre d’affaires"},{a:"balance sheet",b:"bilan"},{a:"cash flow",b:"trésorerie"},{a:"break-even point",b:"seuil de rentabilité"},{a:"shareholders",b:"actionnaires"},{a:"loan",b:"emprunt"}]},{id:"lng-en-voc-flash",type:"flashcard",title:"Flashcards — Vocabulaire ETLV",icon:"🃏",cards:[{front:"stakeholders",back:"parties prenantes"},{front:"CSR (Corporate Social Responsibility)",back:"RSE"},{front:"carbon footprint",back:"empreinte carbone"},{front:"break-even point",back:"seuil de rentabilité"},{front:"market share",back:"part de marché"},{front:"sustainable development",back:"développement durable"}]},{id:"lng-en-voc-qcm",type:"qcm",title:"QCM — Vocabulaire",icon:"❓",questions:[{q:"« turnover » se traduit par…",choices:["chiffre d’affaires","bénéfice net","emprunt","actionnaire"],answer:0,explain:"turnover = chiffre d’affaires."},{q:"« balance sheet » signifie…",choices:["bilan","compte en banque","trésorerie","budget"],answer:0,explain:"balance sheet = bilan."},{q:"« break-even point » correspond à…",choices:["seuil de rentabilité","point de vente","marge brute","coût fixe"],answer:0,explain:"break-even point = seuil de rentabilité."},{q:"« stakeholders » désigne…",choices:["les parties prenantes","les actionnaires seulement","les fournisseurs","les clients"],answer:0,explain:"stakeholders = parties prenantes (plus large que shareholders)."}]},{id:"lng-en-voc-assoc",type:"association",title:"Association — EN ↔ FR",icon:"🔗",pairs:[{left:"cash flow",right:"trésorerie"},{left:"shareholders",right:"actionnaires"},{left:"loan",right:"emprunt"},{left:"profit / loss",right:"bénéfice / perte"},{left:"growth",right:"croissance"}]}]},{id:"lng-es-gram",name:"Espagnol — Grammaire essentielle",short:"Espagnol · grammaire",keywords:"ser estar indefinido imperfecto futuro subjuntivo gerundio obligación gustar",cours:[{h:"Ser / Estar & les passés",points:["Ser = caractéristique permanente, identité, heure, origine, profession.","Estar = état, lieu, situation temporaire.","Indefinido = action passée ponctuelle et datée ; Imperfecto = description, habitude, arrière-plan."]},{h:"Futur, obligation, gustar",points:["Futur : infinitif + -é, -ás, -á, -emos, -éis, -án (irréguliers : tener→tendré, hacer→haré).","Obligation : tener que + inf. (personnelle) ; hay que + inf. (impersonnelle) ; deber + inf.","Tournures type gustar : « Me gusta el cine / Me gustan los libros » (accord avec la chose aimée)."]}],formulas:["Ser = permanent · Estar = état/lieu temporaire","Indefinido = action datée · Imperfecto = décor/habitude"],games:[{id:"lng-es-gram-tri-serestar",type:"tri",title:"Tri — Ser ou Estar ?",icon:"🗂️",instruction:"Classe chaque phrase selon le bon auxiliaire.",categories:[{id:"ser",label:"SER"},{id:"estar",label:"ESTAR"}],items:[{text:"María ___ profesora (profession)",cat:"ser"},{text:"Nosotros ___ en Madrid (lieu)",cat:"estar"},{text:"La sopa ___ muy caliente (état)",cat:"estar"},{text:"Son ___ las tres (heure)",cat:"ser"},{text:"Estoy ___ cansado (état passager)",cat:"estar"},{text:"Es ___ de España (origine)",cat:"ser"}]},{id:"lng-es-gram-tri-pasado",type:"tri",title:"Tri — Indefinido ou Imperfecto ?",icon:"🗂️",instruction:"Classe selon le temps du passé approprié.",categories:[{id:"ind",label:"Indefinido (action datée)"},{id:"imp",label:"Imperfecto (décor / habitude)"}],items:[{text:"Ayer comí en un restaurante",cat:"ind"},{text:"Cuando era niño, jugaba al fútbol",cat:"imp"},{text:"Ella habló por teléfono a las 8",cat:"ind"},{text:"Todos los días comía a mediodía",cat:"imp"},{text:"Llegó y saludó a todos",cat:"ind"}]},{id:"lng-es-gram-trou",type:"trou",title:"Texte à trous — Ser/Estar & passés",icon:"✏️",questions:[{text:"María ____ profesora.",answer:"es",explain:"Profession → ser : « es »."},{text:"La sopa ____ muy caliente.",answer:"está",alt:["esta"],explain:"État temporaire → estar : « está »."},{text:"Ayer ____ (comer, yo) en un restaurante.",answer:"comí",alt:["comi"],explain:"Action datée → indefinido : « comí »."},{text:"Mañana ____ (hablar, yo) con el director.",answer:"hablaré",alt:["hablare"],explain:"Futur : « hablaré »."}]},{id:"lng-es-gram-qcm",type:"qcm",title:"QCM — Grammaire espagnole",icon:"❓",questions:[{q:"« Nosotros ___ en Madrid esta semana. »",choices:["estamos","somos","estar","seremos"],answer:0,explain:"Lieu / situation temporaire → estar : « estamos »."},{q:"« Il faut étudier » se dit…",choices:["Hay que estudiar","Tengo estudiar","Es estudiar","Estar estudiar"],answer:0,explain:"Obligation impersonnelle : hay que + infinitif."},{q:"« J’aime les langues » :",choices:["Me gustan las lenguas","Me gusta las lenguas","Yo gusto las lenguas","Me gustar lenguas"],answer:0,explain:"Accord avec la chose aimée (pluriel) : « Me gustan »."},{q:"L’imperfecto sert surtout à…",choices:["décrire / exprimer une habitude","dater une action ponctuelle","donner un ordre","poser une question"],answer:0,explain:"Imperfecto = décor, description, habitude ; indefinido = action datée."}]}]},{id:"lng-es-voc",name:"Espagnol — Vocabulaire",short:"Espagnol · vocabulaire",keywords:"vocabulario migración memoria trabajo empresa paro sueldo medio ambiente",cours:[{h:"Vocabulaire par axes",points:["Identités & échanges : la migración, la frontera, el exilio, la integración, las raíces.","Territoire & mémoire : la memoria, la dictadura, la democracia, el patrimonio.","Monde du travail (utile en STMG) : la empresa, el trabajo, el paro (chômage), el sueldo (salaire), el cliente."]}],formulas:["Astuce : WordReference / Linguee pour voir les mots en contexte."],games:[{id:"lng-es-voc-memory",type:"memory",title:"Memory — Espagnol ↔ français",icon:"🧠",pairs:[{a:"el paro",b:"le chômage"},{a:"el sueldo",b:"le salaire"},{a:"la empresa",b:"l'entreprise"},{a:"el cliente",b:"le client"},{a:"la frontera",b:"la frontière"},{a:"el medio ambiente",b:"l'environnement"}]},{id:"lng-es-voc-flash",type:"flashcard",title:"Flashcards — Vocabulaire",icon:"🃏",cards:[{front:"la migración",back:"la migration"},{front:"la memoria",back:"la mémoire"},{front:"la democracia",back:"la démocratie"},{front:"el cambio climático",back:"le changement climatique"},{front:"las raíces",back:"les racines"},{front:"el mercado",back:"le marché"}]},{id:"lng-es-voc-qcm",type:"qcm",title:"QCM — Vocabulaire espagnol",icon:"❓",questions:[{q:"« el paro » signifie…",choices:["le chômage","le salaire","le marché","le client"],answer:0,explain:"el paro = le chômage ; el sueldo = le salaire."},{q:"« la empresa » se traduit par…",choices:["l'entreprise","le patron","le produit","la vente"],answer:0,explain:"la empresa = l’entreprise."},{q:"« el medio ambiente » désigne…",choices:["l'environnement","le milieu social","la moitié","le climat froid"],answer:0,explain:"el medio ambiente = l’environnement."},{q:"« la memoria » se rapporte à l’axe…",choices:["Territoire et mémoire","Innovations scientifiques","Art et pouvoir","Sport"],answer:0,explain:"Vocabulaire de l’axe « Territoire et mémoire » (memoria, dictadura, patrimonio)."}]},{id:"lng-es-voc-assoc",type:"association",title:"Association — ES ↔ FR",icon:"🔗",pairs:[{left:"el trabajo",right:"le travail"},{left:"la dictadura",right:"la dictature"},{left:"el patrimonio",right:"le patrimoine"},{left:"la integración",right:"l'intégration"},{left:"las energías renovables",right:"les énergies renouvelables"}]}]},{id:"lng-axes",name:"Les 8 axes culturels",short:"8 axes culturels",keywords:"axes culturels identités échanges espace privé public art pouvoir citoyenneté fictions innovations diversité mémoire",cours:[{h:"Programme « Gestes fondateurs et mondes en mouvement »",points:["1. Identités et échanges — 2. Es
