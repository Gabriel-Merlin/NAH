sonnages"]]},{t:"p",c:"On distingue aussi le **narrateur interne** (« je », un personnage raconte) du **narrateur externe** (« il/elle », extérieur à l’histoire). Le **rythme** du récit varie : **sommaire** (on résume), **scène** (temps réel, dialogue), **ellipse** (on saute une période), **pause** (description)."}]},{h:"Le théâtre : le vocabulaire du texte théâtral",blocks:[{t:"p",c:"Le **théâtre** (XVIIᵉ-XXIᵉ) est un texte fait pour être **joué**. Vocabulaire spécifique :"},{t:"table",head:["Terme","Définition"],rows:[["Réplique","Ce que dit un personnage (sa prise de parole)"],["Tirade","Une **longue** réplique ininterrompue"],["Monologue","Un personnage **seul** se parle à lui-même"],["Aparté","Des mots dits **à part**, entendus du public seul"],["Stichomythie","Échange de répliques **très courtes** (dialogue rapide, tension)"],["Didascalie","Les **indications scéniques** (décor, gestes, ton) en italique"],["Acte / scène","Les grandes divisions de la pièce"]]},{t:"tip",c:"La **double énonciation** est propre au théâtre : un personnage parle à un autre personnage **et**, en même temps, à travers lui, l’auteur parle au **public**."}]},{h:"Le théâtre : registres, mise en scène et représentation",blocks:[{t:"p",c:"Un texte théâtral n’existe pleinement qu’à la **représentation** : la **mise en scène** (décor, jeu des acteurs, lumières, costumes) **interprète** le texte."},{t:"list",c:["le **quiproquo** : un malentendu (un personnage pris pour un autre) — ressort du **comique** ;","le **coup de théâtre** : un rebondissement brutal ;","le **nœud** (le cœur du conflit) et le **dénouement** (la résolution)."]},{t:"p",c:"Registres fréquents : le **comique** (comédie : farce, satire) et le **tragique** (tragédie : fatalité, mort, dilemme). On parle de **tragi-comédie** quand les deux se mêlent."}]},{h:"La poésie : la versification",blocks:[{t:"p",c:"La **poésie** (XIXᵉ-XXIᵉ) travaille le **langage** : sa musique, ses images, sa forme. La **versification** est la technique du vers."},{t:"table",head:["Terme","Définition"],rows:[["Vers","Une ligne de poème"],["Strophe","Un groupe de vers (tercet = 3, quatrain = 4)"],["Mètre","Le nombre de **syllabes** d’un vers"],["Octosyllabe / décasyllabe / alexandrin","Vers de **8 / 10 / 12** syllabes"],["Rime","Retour du même son en fin de vers"],["Césure / hémistiche","La coupe / la moitié de l’alexandrin (6+6)"],["Enjambement / rejet","La phrase déborde d’un vers sur le suivant"]]},{t:"tip",c:"Attention au **e muet** : il se compte s’il est suivi d’une consonne (« une rose épanouie »). C’est essentiel pour compter les syllabes d’un alexandrin."}]},{h:"La poésie : sonorités, images et formes fixes",blocks:[{t:"p",c:"La poésie joue sur les **sons** :"},{t:"list",c:["**allitération** : répétition d’une **consonne** (« Pour qui sont ces serpents qui sifflent sur vos têtes ? ») ;","**assonance** : répétition d’une **voyelle** ;","les **rimes** (riches, suffisantes, pauvres) et leur disposition : **plates** (AABB), **croisées** (ABAB), **embrassées** (ABBA)."]},{t:"p",c:"Elle crée des **images** (métaphore, comparaison, symbole) et prend des **formes fixes** : le **sonnet** (2 quatrains + 2 tercets), l’**ode**, ou au contraire le **vers libre** et le **poème en prose** (sans mètre ni rime)."},{t:"p",c:"Registre dominant : le **lyrisme** (expression des sentiments personnels, souvent avec le « je »)."}]},{h:"La littérature d’idées : le vocabulaire de l’argumentation",blocks:[{t:"p",c:"La **littérature d’idées** (XVIᵉ-XVIIIᵉ) regroupe les textes qui **défendent des idées** et cherchent à **convaincre** ou **persuader**."},{t:"table",head:["Terme","Définition"],rows:[["Thèse","L’idée défendue par l’auteur"],["Argument","Une raison qui appuie la thèse"],["Convaincre","Emporter l’adhésion par la **raison** (logique, preuves)"],["Persuader","Emporter l’adhésion par les **émotions**"],["Réfuter","Démonter la thèse adverse"],["Argumentation directe / indirecte","Idées énoncées clairement / passant par une fiction"]]},{t:"p",c:"L’argumentation **indirecte** passe par une **fiction** : l’**apologue** (récit à visée morale), la **fable**, le **conte philosophique** (Voltaire), l’**utopie**."}]},{h:"La littérature d’idées : formes et mouvements",blocks:[{t:"p",c:"Les grandes **formes** de la littérature d’idées : l’**essai** (Montaigne), le **dialogue**, la **lettre** (les *Lettres persanes*), le **pamphlet**, la **maxime**, l’**article** (l’*Encyclopédie*)."},{t:"table",head:["Mouvement","Idées clés"],rows:[["**Humanisme** (XVIᵉ)","Confiance en l’homme, savoir, tolérance, retour à l’Antiquité"],["**Lumières** (XVIIIᵉ)","Raison, progrès, liberté, critique des injustices et du fanatisme"]]},{t:"p",c:"Registres associés : **polémique** (attaque violente), **satirique** (critique par le rire), **didactique** (qui cherche à instruire)."}]},{h:"Les figures de style (boîte à outils)",blocks:[{t:"p",c:"Les **figures de style** sont des procédés qui donnent de la force et du sens. À connaître et à savoir **nommer** :"},{t:"table",head:["Figure","Définition"],rows:[["Comparaison","Rapproche deux éléments avec un **outil** (« comme »)"],["Métaphore","Rapprochement **sans** outil (« une mer de larmes »)"],["Personnification","Traits humains à une chose (« le vent murmure »)"],["Hyperbole","Exagération (« mourir de faim »)"],["Litote","Dire peu pour suggérer beaucoup (« ce n’est pas mauvais »)"],["Euphémisme","Atténuer une réalité dure (« il nous a quittés »)"],["Anaphore","Répétition en début de vers/phrase (insistance)"],["Antithèse / oxymore","Opposition d’idées / deux mots contradictoires (« soleil noir »)"],["Gradation","Énumération d’intensité croissante"],["Ironie","Dire le contraire de ce qu’on pense pour critiquer"]]},{t:"tip",c:"Règle absolue en analyse : associer **le procédé + son effet**. Ex. : « l’**anaphore** de “je me souviens” insiste sur l’obsession du souvenir ». Nommer sans expliquer ne rapporte rien."}]}],essentiel:["**Roman/récit** : narrateur (≠ auteur), intrigue, incipit/dénouement ; **points de vue** : interne, externe, omniscient (zéro) ; rythme (scène, sommaire, ellipse, pause).","**Théâtre** : réplique, tirade, monologue, aparté, stichomythie, **didascalie** ; **double énonciation** ; comique / tragique ; le texte se réalise à la **représentation**.","**Poésie** : vers, strophe, **mètre** (alexandrin = 12 syll.), rime (plates/croisées/embrassées), césure, enjambement ; **allitération** (consonnes) / **assonance** (voyelles) ; sonnet, vers libre ; **lyrisme**.","**Littérature d’idées** : thèse, argument, **convaincre** (raison) / **persuader** (émotion) ; argumentation directe / indirecte (**apologue**, conte philosophique) ; **Humanisme** & **Lumières**.","**Figures de style** : toujours **nommer le procédé + expliquer son effet** (métaphore, personnification, anaphore, antithèse, ironie, litote…)."],resources:[{kind:"video",label:"Vocabulaire du théâtre et de la poésie",note:"Vidéos — recherche YouTube",url:T("vocabulaire théâtre poésie versification première français")},{kind:"video",label:"Roman : points de vue ; littérature d’idées",note:"Vidéos — recherche YouTube",url:T("point de vue focalisation roman argumentation littérature d idées première français")}],games:[{id:"p1-fr-3-qcm",type:"qcm",title:"QCM — Vocabulaire des genres",icon:"❓",questions:[{q:"Une **tirade** est…",choices:["une longue réplique ininterrompue","un personnage seul qui se parle","une indication scénique","un échange rapide"],answer:0,explain:"Le monologue = seul ; l’aparté = à part ; la stichomythie = répliques courtes."},{q:"Les **didascalies** sont…",choices:["les indications scéniques","les répliques","les rimes","les strophes"],answer:0,explain:"Elles indiquent décor, gestes, ton (en italique)."},{q:"Un **alexandrin** compte…",choices:["12 syllabes","8 syllabes","10 syllabes","14 syllabes"],answer:0,explain:"Octosyllabe = 8, décasyllabe = 10, alexandrin = 12."},{q:"La répétition d’une **consonne** est une…",choices:["allitération","assonance","anaphore","césure"],answer:0,explain:"Allitération = consonne ; assonance = voyelle."},{q:"Emporter l’adhésion par les **émotions**, c’est…",choices:["persuader","convaincre","réfuter","résumer"],answer:0,explain:"Convaincre = par la raison ; persuader = par les émotions."},{q:"Le récit à visée morale passant par une fiction est…",choices:["l’apologue","l’incipit","la didascalie","la césure"],answer:0,explain:"Fable, conte philosophique… = argumentation indirecte."},{q:"Voir l’histoire à travers les pensées d’un seul personnage, c’est la focalisation…",choices:["interne","externe","zéro","omnisciente"],answer:0,explain:"Interne = on suit un personnage et ses pensées."}]},{id:"p1-fr-3-tri",type:"tri",title:"Tri — À quel genre appartient ce mot ?",icon:"🗂️",instruction:"Classe chaque terme technique.",categories:[{id:"th",label:"Théâtre"},{id:"po",label:"Poésie"},{id:"ro",label:"Roman"}],items:[{text:"Didascalie",cat:"th"},{text:"Alexandrin",cat:"po"},{text:"Focalisation",cat:"ro"},{text:"Tirade",cat:"th"},{text:"Strophe",cat:"po"},{text:"Incipit",cat:"ro"},{text:"Stichomythie",cat:"th"},{text:"Enjambement",cat:"po"}]},{id:"p1-fr-3-assoc",type:"association",title:"Association — Terme ↔ définition",icon:"🔗",pairs:[{left:"Monologue",right:"Un personnage seul se parle à lui-même"},{left:"Enjambement",right:"La phrase déborde d’un vers sur le suivant"},{left:"Narrateur",right:"La voix qui raconte (≠ l’auteur)"},{left:"Apologue",right:"Récit à visée morale (fable, conte)"},{left:"Litote",right:"Dire peu pour suggérer beaucoup"},{left:"Double énonciation",right:"Le personnage parle à l’autre et au public"}]},{id:"p1-fr-3-trou",type:"trou",title:"Texte à trous — Vocabulaire littéraire",icon:"✏️",questions:[{text:"Un vers de 12 syllabes s’appelle un ____.",answer:"alexandrin",explain:"8 = octosyllabe, 10 = décasyllabe, 12 = alexandrin."},{text:"La répétition d’une voyelle est une ____.",answer:"assonance",explain:"Assonance = voyelle ; allitération = consonne."},{text:"Les indications scéniques d’une pièce sont les ____.",answer:"didascalies",alt:["didascalie"],explain:"Elles précisent décor, gestes, ton."},{text:"Convaincre s’adresse à la raison ; ____ s’adresse aux émotions.",answer:"persuader",explain:"Deux stratégies argumentatives."},{text:"Le début d’un roman est l’____.",answer:"incipit",explain:"La fin = le dénouement."}]},{id:"p1-fr-3-flash",type:"flashcard",title:"Flashcards — Genres & vocabulaire",icon:"🃏",cards:[{front:"Narrateur ≠ auteur",back:"L’auteur écrit ; le narrateur raconte (parfois un personnage)."},{front:"Focalisation interne / externe / zéro",back:"Pensées d’un perso / vue extérieure / narrateur omniscient."},{front:"Tirade / monologue / aparté",back:"Longue réplique / seul se parle / dit à part (public)."},{front:"Didascalie",back:"Indication scénique (décor, geste, ton)."},{front:"Alexandrin",back:"Vers de 12 syllabes (césure à l’hémistiche, 6+6)."},{front:"Allitération / assonance",back:"Répétition de consonne / de voyelle."},{front:"Convaincre / persuader",back:"Par la raison / par les émotions."},{front:"Apologue",back:"Récit à visée morale (argumentation indirecte)."},{front:"Humanisme / Lumières",back:"XVIᵉ (savoir, tolérance) / XVIIIᵉ (raison, progrès, liberté)."}]}]},{id:"p1-fr-4",name:"L’oral & les repères",short:"Oral & repères",keywords:"oral EAF explication linéaire question de grammaire présentation œuvre entretien registres lyrique tragique comique pathétique épique polémique mouvements littéraires humanisme baroque classicisme Lumières romantisme réalisme symbolisme surréalisme",intro:"L’oral (**coef. 5**) et les **repères culturels** complètent la préparation. On y révise le **déroulé de l’épreuve**, la méthode de l’**explication linéaire**, la **question de grammaire**, l’**entretien**, ainsi que les **registres** et **mouvements** littéraires à connaître.",cours:[{h:"L’oral : déroulé de l’épreuve",blocks:[{t:"p",c:"L’oral dure environ **20 minutes** (après **30 min de préparation**) et se déroule en deux parties :"},{t:"table",head:["Partie","Contenu","Durée"],rows:[["**Partie 1**","Lecture + **explication linéaire** d’un texte du descriptif, puis **question de grammaire**","~12 min"],["**Partie 2**","Présentation d’une **œuvre** choisie, puis **entretien** avec l’examinateur","~8 min"]]},{t:"p",c:"On apporte son **descriptif** (la liste des textes étudiés) et les **œuvres**. L’examinateur choisit le texte de la partie 1."}]},{h:"L’explication linéaire (méthode)",blocks:[{t:"p",c:"L’**explication linéaire** consiste à expliquer le texte **dans l’ordre**, **au fil de la lecture**, sans plaquer un plan thématique. On suit les **mouvements** du texte."},{t:"list",c:["commencer par une **introduction** (situer le texte, lecture à voix haute, **problématique**, annonce des mouvements) ;","expliquer le texte **mouvement par mouvement**, en analysant les **procédés + effets** au fur et à mesure ;","terminer par une **conclusion** (bilan + réponse à la problématique)."]},{t:"warning",c:"Erreur fréquente : la **paraphrase** (raconter le texte). Comme à l’écrit, on **analyse** le « comment » : chaque remarque associe une **citation**, un **procédé** et un **effet**."}]},{h:"La question de grammaire",blocks:[{t:"p",c:"Après l’explication, l’examinateur pose une **question de grammaire** sur une phrase du texte. Les points au programme les plus fréquents :"},{t:"list",c:["l’analyse des **propositions** (indépendante, principale, subordonnée) ;","les **subordonnées** (relative, conjonctive, interrogative indirecte) ;","la **négation** (totale / partielle) ;","l’**interrogation** (directe / indirecte, totale / partielle)."]},{t:"tip",c:"Méthode : **repérer le verbe conjugué** (autant de verbes conjugués = autant de propositions), puis **nommer** la nature de chaque proposition et sa fonction."}]},{h:"La présentation d’œuvre & l’entretien",blocks:[{t:"p",c:"Dans la **partie 2**, tu présentes une **œuvre lue** dans l’année (ou en lecture cursive) : tu expliques **pourquoi tu l’as choisie**, ce qu’elle raconte et ce qu’elle t’a apporté. Puis l’examinateur **dialogue** avec toi (l’**entretien**)."},{t:"tip",c:"Prépare : un **résumé** clair, **2-3 passages** marquants, un **avis argumenté** (pas seulement « j’ai aimé »), et des liens avec le **parcours**. Montre que tu as **vraiment lu** et **réfléchi**."}]},{h:"Les registres littéraires",blocks:[{t:"p",c:"Un **registre** est la **tonalité** d’un texte, l’émotion qu’il cherche à produire. À savoir reconnaître :"},{t:"table",head:["Registre","Effet recherché"],rows:[["Lyrique","Exprimer des **sentiments** personnels (amour, mélancolie)"],["Tragique","Fatalité, souffrance, mort inévitable"],["Comique","Faire **rire** (farce, satire, ironie)"],["Pathétique","Émouvoir, susciter la **pitié**"],["Épique","Amplifier, célébrer un exploit (souffle héroïque)"],["Polémique / satirique","**Attaquer**, critiquer (par la violence ou le rire)"],["Fantastique","Faire naître le **doute**, l’inquiétude"]]}]},{h:"Les mouvements littéraires (repères)",blocks:[{t:"p",c:"Situer un texte dans son **mouvement** aide à l’interpréter. Grands repères du XVIᵉ au XXᵉ :"},{t:"table",head:["Mouvement","Siècle","Idées clés"],rows:[["Humanisme","XVIᵉ","Confiance en l’homme, savoir, tolérance"],["Baroque","fin XVIᵉ-XVIIᵉ","Mouvement, instabilité, illusion, démesure"],["Classicisme","XVIIᵉ","Mesure, raison, règles, équilibre"],["Lumières","XVIIIᵉ","Raison, progrès, liberté, critique"],["Romantisme","XIXᵉ","Sentiments, « je », nature, mélancolie"],["Réalisme / Naturalisme","XIXᵉ","Peindre le réel, la société, avec précision"],["Symbolisme","fin XIXᵉ","Suggérer, musique du langage, symboles"],["Surréalisme","XXᵉ","Rêve, inconscient, écriture automatique"]]}]}],essentiel:["Oral (coef. 5, ~20 min après 30 min de prépa) : **partie 1** = explication linéaire + **question de grammaire** ; **partie 2** = présentation d’**œuvre** + **entretien**.","**Explication linéaire** : expliquer **dans l’ordre**, mouvement par mouvement (citation + procédé + effet), **jamais paraphraser**.","**Question de grammaire** : repérer les verbes conjugués → identifier les **propositions** (subordonnées, négation, interrogation).","Présentation d’**œuvre** : résumé, passages marquants, **avis argumenté** ; puis entretien.","**Registres** : lyrique, tragique, comique, pathétique, épique, polémique, fantastique.","**Mouvements** : Humanisme, Baroque, Classicisme, Lumières, Romantisme, Réalisme/Naturalisme, Symbolisme, Surréalisme."],resources:[{kind:"video",label:"Méthode de l’explication linéaire",note:"Vidéos — recherche YouTube",url:T("explication linéaire méthode oral EAF première français")},{kind:"video",label:"Registres et mouvements littéraires",note:"Vidéos — recherche YouTube",url:T("registres littéraires mouvements littéraires première français")}],games:[{id:"p1-fr-4-qcm",type:"qcm",title:"QCM — Oral & repères",icon:"❓",questions:[{q:"La partie 1 de l’oral comprend…",choices:["l’explication linéaire + une question de grammaire","la présentation d’œuvre","un débat","une dictée"],answer:0,explain:"La partie 2 = présentation d’œuvre + entretien."},{q:"L’explication linéaire suit le texte…",choices:["dans l’ordre, au fil de la lecture","par un plan thématique","en le résumant","à l’envers"],answer:0,explain:"Mouvement par mouvement, sans plaquer de plan."},{q:"Le registre qui exprime les sentiments personnels est…",choices:["lyrique","épique","comique","polémique"],answer:0,explain:"Lyrique = sentiments (amour, mélancolie)."},{q:"Le mouvement du XVIIIᵉ centré sur la raison et le progrès est…",choices:["les Lumières","le Romantisme","le Baroque","le Réalisme"],answer:0,explain:"Lumières : raison, progrès, liberté, critique."},{q:"Pour la question de grammaire, on repère d’abord…",choices:["les verbes conjugués","les rimes","les didascalies","les strophes"],answer:0,explain:"Autant de verbes conjugués = autant de propositions."},{q:"Le registre qui cherche à émouvoir et susciter la pitié est…",choices:["pathétique","comique","épique","satirique"],answer:0,explain:"Pathétique = émotion, pitié."}]},{id:"p1-fr-4-ordre",type:"ordre",title:"Remise en ordre — Déroulé de l’oral",icon:"🔢",instruction:"Remets les étapes de l’oral dans l’ordre.",steps:["30 min de préparation","Lecture du texte à voix haute","Explication linéaire","Question de grammaire","Présentation de l’œuvre choisie","Entretien"],explain:"Partie 1 (explication linéaire + grammaire) puis partie 2 (œuvre + entretien)."},{id:"p1-fr-4-assoc",type:"association",title:"Association — Mouvement ↔ idée clé",icon:"🔗",pairs:[{left:"Humanisme",right:"Confiance en l’homme, savoir, tolérance (XVIᵉ)"},{left:"Classicisme",right:"Mesure, raison, règles (XVIIᵉ)"},{left:"Lumières",right:"Raison, progrès, liberté (XVIIIᵉ)"},{left:"Romantisme",right:"Sentiments, « je », nature (XIXᵉ)"},{left:"Réalisme",right:"Peindre le réel et la société (XIXᵉ)"},{left:"Surréalisme",right:"Rêve, inconscient, écriture automatique (XXᵉ)"}]},{id:"p1-fr-4-tri",type:"tri",title:"Tri — Quel registre ?",icon:"🗂️",instruction:"Classe chaque effet recherché.",categories:[{id:"ly",label:"Lyrique"},{id:"tr",label:"Tragique"},{id:"co",label:"Comique"}],items:[{text:"Exprimer son amour et sa mélancolie",cat:"ly"},{text:"Montrer une fatalité qui mène à la mort",cat:"tr"},{text:"Faire rire par un quiproquo",cat:"co"},{text:"Chanter ses sentiments avec le « je »",cat:"ly"},{text:"Un dilemme sans issue heureuse",cat:"tr"},{text:"Une satire moqueuse",cat:"co"}]},{id:"p1-fr-4-flash",type:"flashcard",title:"Flashcards — Oral & repères",icon:"🃏",cards:[{front:"Explication linéaire",back:"Expliquer le texte dans l’ordre, mouvement par mouvement."},{front:"Question de grammaire",back:"Repérer les verbes conjugués → analyser les propositions."},{front:"Entretien",back:"Dialogue sur l’œuvre présentée (avis argumenté)."},{front:"Registre lyrique / tragique",back:"Sentiments personnels / fatalité et mort."},{front:"Lumières",back:"XVIIIᵉ : raison, progrès, liberté, critique."},{front:"Romantisme",back:"XIXᵉ : sentiments, « je », nature, mélancolie."}]}]}]},Dh={id:"p1-histoire-geo",name:"Histoire-Géographie",short:"Histoire-Géo",icon:"🗺️",color:"#0891b2",niveau:"premiere",tagline:"Le long XIXe siècle · les recompositions du territoire.",chapters:[{id:"p1-hg-h1",name:"Histoire — La Révolution française et l’Empire (1789-1815)",short:"Révolution & Empire",keywords:"Révolution française 1789 monarchie absolue DDHC République Napoléon Empire 1804 1815 Code civil",intro:"En 1789, la Révolution met fin à la **monarchie absolue** et proclame des principes nouveaux qui bouleversent l’Europe.",cours:[{h:"La Révolution française (1789)",blocks:[{t:"p",c:"La **Révolution française (1789)** met fin à la **monarchie absolue** et proclame des principes nouveaux : **liberté, égalité, souveraineté de la nation** (Déclaration des droits de l’homme et du citoyen)."},{t:"p",c:"Elle passe par plusieurs **phases** : monarchie constitutionnelle, proclamation de la **Ire République (1792)**, puis la **Terreur**."}]},{h:"L’Empire napoléonien (1804-1815)",blocks:[{t:"p",c:"**Napoléon Bonaparte** bâtit ensuite un **Empire (1804-1815)** qui réorganise la France (**Code civil**, administration centralisée) et diffuse — par la guerre — certains principes révolutionnaires en Europe."},{t:"table",head:["Date","Repère"],rows:[["1789","Révolution française (DDHC)"],["1792","Proclamation de la Ire République"],["1804","Napoléon empereur (Empire)"],["1815","Chute de Napoléon"]]}]}],essentiel:["**1789** : Révolution, DDHC (liberté, égalité, souveraineté de la nation).","**Napoléon** : Empire **1804-1815**, Code civil.","Repères : 1789 · 1792 · 1804 · 1815."],resources:[{kind:"video",label:"Révolution française et Empire",note:"Vidéos — recherche YouTube",url:T("Révolution française Empire Napoléon 1789 1815 première histoire")}],games:[{id:"p1-hg-h1-qcm",type:"qcm",title:"QCM — Révolution & Empire",icon:"❓",questions:[{q:"La Révolution française éclate en…",choices:["1789","1815","1848","1870"],answer:0,explain:"1789 : fin de la monarchie absolue, DDHC."},{q:"Le texte proclamant liberté et égalité en 1789 est…",choices:["la Déclaration des droits de l’homme et du citoyen","le Code civil","la Constitution de 1958","le traité de Rome"],answer:0,explain:"La DDHC de 1789."},{q:"Napoléon devient empereur en…",choices:["1804","1789","1848","1815"],answer:0,explain:"L’Empire : 1804-1815."},{q:"Le grand code juridique napoléonien est…",choices:["le Code civil","le Code du travail","le Code pénal européen","le RGPD"],answer:0,explain:"Le Code civil (1804) réorganise le droit."}]},{id:"p1-hg-h1-flash",type:"flashcard",title:"Flashcards — Repères",icon:"🃏",cards:[{front:"1789",back:"Révolution française, DDHC."},{front:"1792",back:"Ire République."},{front:"1804-1815",back:"Empire de Napoléon (Code civil)."}]},{id:"p1-hg-h1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La Révolution française commence en 1789.",answer:!0,explain:"Vrai : fin de la monarchie absolue, DDHC."},{statement:"Napoléon devient empereur en 1789.",answer:!1,explain:"Faux : en 1804 (Empire 1804-1815)."},{statement:"Le Code civil est une œuvre napoléonienne.",answer:!0,explain:"Vrai : 1804."}]}]},{id:"p1-hg-h2",name:"Histoire — La France au XIXe siècle",short:"La France au XIXe",keywords:"instabilité révolutions 1830 1848 IIe République suffrage universel masculin abolition esclavage industrialisation urbanisation",intro:"Après 1815, la France connaît une grande **instabilité politique** et une profonde **transformation sociale** liée à l’industrialisation.",cours:[{h:"Une grande instabilité politique",blocks:[{t:"p",c:"Après 1815, la France alterne les régimes : retour de la **monarchie**, puis **révolutions (1830, 1848)**."},{t:"p",c:"En **1848**, la **IIe République** marque une avancée majeure : elle instaure le **suffrage universel masculin** et **abolit l’esclavage**."}]},{h:"L’industrialisation et ses transformations sociales",blocks:[{t:"p",c:"Parallèlement, l’**industrialisation** transforme profondément la société : **urbanisation** (afflux vers les villes industrielles), essor de la **bourgeoisie** d’affaires et d’une **classe ouvrière**."},{t:"p",c:"Cette nouvelle organisation fait naître de fortes **tensions sociales** (conditions de travail, premières revendications ouvrières)."}]}],essentiel:["Après 1815 : **instabilité** (révolutions de 1830 et 1848).","**1848** : suffrage universel **masculin** + **abolition de l’esclavage**.","**Industrialisation** → urbanisation, bourgeoisie, classe ouvrière, tensions sociales."],resources:[{kind:"video",label:"La France au XIXe siècle",note:"Vidéos — recherche YouTube",url:T("France XIXe siècle 1848 industrialisation première histoire")}],games:[{id:"p1-hg-h2-qcm",type:"qcm",title:"QCM — La France au XIXe",icon:"❓",questions:[{q:"En 1848, la IIe République instaure…",choices:["le suffrage universel masculin","le suffrage des femmes","la monarchie absolue","l’Empire"],answer:0,explain:"1848 : suffrage universel masculin et abolition de l’esclavage."},{q:"Quel événement de 1848 concerne l’esclavage ?",choices:["son abolition","son rétablissement","son extension","aucun"],answer:0,explain:"L’esclavage est aboli en 1848."},{q:"L’industrialisation entraîne notamment…",choices:["l’urbanisation et une classe ouvrière","un retour à la campagne","la fin des villes","la disparition de la bourgeoisie"],answer:0,explain:"Urbanisation, bourgeoisie, ouvriers, tensions sociales."}]},{id:"p1-hg-h2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le suffrage universel de 1848 incluait les femmes.",answer:!1,explain:"Faux : il était masculin."},{statement:"L’industrialisation a favorisé l’urbanisation.",answer:!0,explain:"Vrai : afflux vers les villes industrielles."}]},{id:"p1-hg-h2-flash",type:"flashcard",title:"Flashcards — Repères",icon:"🃏",cards:[{front:"1848",back:"IIe République : suffrage universel masculin, abolition de l’esclavage."},{front:"Industrialisation",back:"Urbanisation, bourgeoisie, classe ouvrière, tensions sociales."},{front:"Révolutions de 1830 et 1848",back:"Instabilité politique de la France après 1815."}]}]},{id:"p1-hg-h3",name:"Histoire — La IIIe République et la Grande Guerre",short:"IIIe République & 1914-1918",keywords:"Troisième République laïcité école Ferry 1905 séparation empire colonial Première Guerre mondiale guerre totale",intro:"À partir de **1870**, la IIIe République s’enracine et associe la République à des valeurs concrètes, avant l’épreuve de la **Grande Guerre**.",cours:[{h:"La IIIe République s’enracine",blocks:[{t:"p",c:"La **IIIe République** (à partir de **1870**) installe durablement la République : **laïcité**, **école gratuite et obligatoire** (lois **Ferry**), libertés fondamentales (presse, syndicats)."},{t:"p",c:"La **loi de 1905** consacre la **séparation des Églises et de l’État**, pilier de la laïcité. La France se dote aussi d’un vaste **empire colonial**."}]},{h:"La Première Guerre mondiale, une guerre totale",blocks:[{t:"p",c:"La **Première Guerre mondiale (1914-1918)** est une **guerre totale** : elle mobilise les sociétés entières — soldats au front, **économie de guerre**, civils à l’arrière, **propagande**."},{t:"table",head:["Date","Repère"],rows:[["1870-1871","Début de la IIIe République"],["1905","Séparation des Églises et de l’État"],["1914-1918","Première Guerre mondiale"]]}]}],essentiel:["**IIIe République** (dès 1870) : laïcité, école gratuite/obligatoire (**lois Ferry**), empire colonial.","**1905** : séparation des Églises et de l’État.","**1914-1918** : Première Guerre mondiale, une **guerre totale**."],resources:[{kind:"video",label:"IIIe République et Première Guerre mondiale",note:"Vidéos — recherche YouTube",url:T("IIIe République Première Guerre mondiale guerre totale première histoire")}],games:[{id:"p1-hg-h3-qcm",type:"qcm",title:"QCM — IIIe République & Grande Guerre",icon:"❓",questions:[{q:"Les lois Ferry instaurent…",choices:["l’école gratuite et obligatoire","le suffrage des femmes","l’Empire","la monarchie"],answer:0,explain:"Laïcité et école gratuite/obligatoire sous la IIIe République."},{q:"La séparation des Églises et de l’État date de…",choices:["1905","1789","1870","1918"],answer:0,explain:"1905, un pilier de la laïcité."},{q:"La Première Guerre mondiale est qualifiée de guerre…",choices:["totale","éclair","froide","civile"],answer:0,explain:"Elle mobilise les sociétés entières (militaire, économique, morale)."}]},{id:"p1-hg-h3-flash",type:"flashcard",title:"Flashcards — Repères",icon:"🃏",cards:[{front:"Lois Ferry",back:"École gratuite, laïque et obligatoire (IIIe République)."},{front:"1905",back:"Séparation des Églises et de l’État."},{front:"Guerre totale",back:"Mobilisation militaire, économique et des esprits (1914-1918)."}]},{id:"p1-hg-h3-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Les lois Ferry rendent l’école gratuite et obligatoire.",answer:!0,explain:"Vrai (IIIe République)."},{statement:"La séparation des Églises et de l’État date de 1789.",answer:!1,explain:"Faux : 1905."},{statement:"La Première Guerre mondiale est une guerre totale.",answer:!0,explain:"Vrai : mobilisation des sociétés entières."}]}]},{id:"p1-hg-g1",name:"Géographie — La métropolisation",short:"La métropolisation",keywords:"métropolisation métropoles fonctions de commandement inégalités processus différencié",intro:"La **métropolisation** est la concentration croissante des populations, des activités et des pouvoirs dans les grandes villes.",cours:[{h:"Des métropoles qui concentrent hommes et pouvoirs",blocks:[{t:"p",c:"Plus de la moitié de l’humanité vit désormais **en ville**. La **métropolisation** concentre les populations, les activités et les pouvoirs dans les grandes villes."},{t:"p",c:"Quelques **métropoles mondiales** (New York, Londres, Tokyo, Paris) concentrent la richesse et les **fonctions de commandement** : sièges sociaux, bourses, universités, aéroports internationaux."}]},{h:"Un processus différencié et inégalitaire",blocks:[{t:"p",c:"Toutes les villes ne sont pas touchées de la même façon : le processus est **différencié**. Certaines métropoles dominent, tandis que d’autres espaces restent **en marge**."},{t:"p",c:"La métropolisation accentue donc les **inégalités** entre territoires, à toutes les échelles (mondiale, nationale, locale)."}]}],essentiel:["**Métropolisation** = concentration des populations, activités et pouvoirs dans les métropoles.","Processus **différencié** : quelques métropoles dominent, d’autres espaces restent en marge.","Il accentue les **inégalités** territoriales (mondiale, nationale, locale)."],resources:[{kind:"video",label:"La métropolisation",note:"Vidéos — recherche YouTube",url:T("métropolisation processus mondial différencié première géographie")}],games:[{id:"p1-hg-g1-qcm",type:"qcm",title:"QCM — La métropolisation",icon:"❓",questions:[{q:"La métropolisation désigne…",choices:["la concentration des populations et activités dans les grandes villes","l’exode vers les campagnes","la disparition des villes","la fin de la mondialisation"],answer:0,explain:"Concentration des hommes, activités et fonctions de commandement."},{q:"On dit ce processus « différencié » car…",choices:["il ne touche pas tous les territoires de la même façon","il est identique partout","il concerne seulement Paris","il ne crée aucune inégalité"],answer:0,explain:"Certaines métropoles dominent, d’autres espaces sont en marge."},{q:"La métropolisation tend à…",choices:["accentuer les inégalités entre territoires","égaliser tous les territoires","vider les métropoles","supprimer les fonctions de commandement"],answer:0,explain:"Elle renforce les inégalités à toutes les échelles."}]},{id:"p1-hg-g1-flash",type:"flashcard",title:"Flashcards — Métropolisation",icon:"🃏",cards:[{front:"Métropolisation",back:"Concentration des populations, activités et pouvoirs dans les métropoles."},{front:"Fonctions de commandement",back:"Sièges, bourses, universités, aéroports internationaux."},{front:"Processus différencié",back:"Touche inégalement les territoires → inégalités."}]},{id:"p1-hg-g1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"La métropolisation concentre hommes, activités et pouvoirs dans les grandes villes.",answer:!0,explain:"Vrai."},{statement:"La métropolisation touche tous les territoires de la même façon.",answer:!1,explain:"Faux : processus différencié, source d’inégalités."},{statement:"Les fonctions de commandement se concentrent dans les métropoles.",answer:!0,explain:"Vrai : sièges, bourses, aéroports internationaux."}]}]},{id:"p1-hg-g2",name:"Géographie — Espaces et acteurs de la production",short:"Espaces productifs",keywords:"espaces productifs mondialisation industrie services agriculture acteurs firmes multinationales État collectivités",intro:"Les **espaces productifs** se recomposent sous l’effet de la **mondialisation** et du numérique.",cours:[{h:"Des espaces productifs qui se recomposent",blocks:[{t:"p",c:"Sous l’effet de la **mondialisation** et du **numérique**, les espaces productifs se transforment : l’**industrie** se réorganise (délocalisations, **technopôles**), les **services** prennent une place croissante (**tertiarisation**), l’**agriculture** se modernise."}]},{h:"Une multiplicité d’acteurs",blocks:[{t:"p",c:"De nombreux **acteurs** interviennent dans la production et son organisation : les **entreprises** (dont les **firmes multinationales**, acteurs clés de la mondialisation), l’**État**, les **collectivités** territoriales et les **acteurs locaux**."}]}],essentiel:["Les **espaces productifs** se recomposent (mondialisation, numérique).","Montée des **services**, réorganisation de l’industrie (délocalisations, technopôles).","Acteurs multiples : **FMN**, État, collectivités, acteurs locaux."],resources:[{kind:"video",label:"Les espaces productifs",note:"Vidéos — recherche YouTube",url:T("espaces productifs acteurs mondialisation première géographie")}],games:[{id:"p1-hg-g2-qcm",type:"qcm",title:"QCM — Espaces productifs",icon:"❓",questions:[{q:"Les espaces productifs se recomposent surtout sous l’effet de…",choices:["la mondialisation et du numérique","la météo","la monarchie","la démographie seule"],answer:0,explain:"Mondialisation et numérique réorganisent la production."},{q:"Parmi les acteurs de la production :",choices:["les firmes multinationales et l’État","uniquement les touristes","seulement les agriculteurs","aucun acteur"],answer:0,explain:"FMN, État, collectivités, acteurs locaux."},{q:"Le secteur qui prend une place croissante est celui…",choices:["des services","de la chasse","de l’artisanat médiéval","de la monarchie"],answer:0,explain:"Tertiarisation : montée des services."}]},{id:"p1-hg-g2-flash",type:"flashcard",title:"Flashcards — Production",icon:"🃏",cards:[{front:"Espaces productifs",back:"Espaces où l’on produit biens et services."},{front:"Technopôle",back:"Concentration d’activités de haute technologie et de recherche."},{front:"FMN",back:"Firme multinationale, acteur clé de la production mondialisée."}]},{id:"p1-hg-g2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Les services prennent une place croissante dans la production.",answer:!0,explain:"Vrai : tertiarisation."},{statement:"Les firmes multinationales ne jouent aucun rôle dans la production.",answer:!1,explain:"Faux : ce sont des acteurs clés."},{statement:"Un technopôle concentre des activités de haute technologie.",answer:!0,explain:"Vrai : technologie et recherche."}]}]},{id:"p1-hg-g3",name:"Géographie — Les espaces ruraux",short:"Espaces ruraux",keywords:"espaces ruraux multifonctionnalité périurbanisation résidentielle touristique tensions",intro:"Les **espaces ruraux** ne sont plus seulement agricoles : ils remplissent désormais **plusieurs fonctions**.",cours:[{h:"Une multifonctionnalité croissante",blocks:[{t:"p",c:"Les espaces ruraux ne sont plus seulement agricoles : ils remplissent aujourd’hui **plusieurs fonctions** — **résidentielle**, **touristique**, **écologique** et **économique**."},{t:"p",c:"Certains, proches des villes, se **périurbanisent** (extension de l’habitat pavillonnaire) ; d’autres, isolés, **déclinent** ou se tournent vers le **tourisme**."}]},{h:"Des tensions dans l’usage des sols",blocks:[{t:"p",c:"Cette **multifonctionnalité** fait cohabiter des usages parfois concurrents (agriculture, logement, loisirs, protection de la nature)."},{t:"p",c:"Elle crée donc des **tensions** : conflits d’usage des sols, pression foncière près des villes, difficulté à maintenir les services dans les espaces isolés."}]}],essentiel:["Les espaces ruraux sont **multifonctionnels** (résidentiel, tourisme, écologie, économie).","**Périurbanisation** près des villes ; déclin ou tourisme dans les espaces isolés.","La multifonctionnalité crée des **tensions** (usage des sols)."],resources:[{kind:"video",label:"Les espaces ruraux",note:"Vidéos — recherche YouTube",url:T("espaces ruraux multifonctionnalité périurbanisation première géographie")}],games:[{id:"p1-hg-g3-qcm",type:"qcm",title:"QCM — Espaces ruraux",icon:"❓",questions:[{q:"Les espaces ruraux aujourd’hui sont…",choices:["multifonctionnels","uniquement agricoles","tous abandonnés","sans habitants"],answer:0,explain:"Résidentiel, touristique, écologique, économique."},{q:"Le développement de l’habitat pavillonnaire autour des villes s’appelle…",choices:["la périurbanisation","la métropolisation","la désertification","la littoralisation"],answer:0,explain:"La périurbanisation touche les espaces ruraux proches des villes."},{q:"La multifonctionnalité des espaces ruraux crée…",choices:["des tensions (usage des sols)","aucune difficulté","la fin de l’agriculture","la disparition du tourisme"],answer:0,explain:"Cohabitation d’activités → tensions."}]},{id:"p1-hg-g3-flash",type:"flashcard",title:"Flashcards — Ruralité",icon:"🃏",cards:[{front:"Multifonctionnalité",back:"Plusieurs fonctions : résidentielle, touristique, écologique, économique."},{front:"Périurbanisation",back:"Extension de l’habitat autour des villes."}]},{id:"p1-hg-g3-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Les espaces ruraux sont aujourd’hui multifonctionnels.",answer:!0,explain:"Vrai : résidentiel, tourisme, écologie, économie."},{statement:"La périurbanisation est l’extension de l’habitat autour des villes.",answer:!0,explain:"Vrai."},{statement:"La multifonctionnalité des espaces ruraux ne crée aucune tension.",answer:!1,explain:"Faux : tensions sur l’usage des sols."}]}]}]},Ih={id:"p1-langues",name:"Langues (Anglais / Espagnol)",short:"Langues",icon:"🗣️",color:"#db2777",niveau:"premiere",tagline:"Consolider les bases grammaticales (contrôle continu).",chapters:[{id:"p1-lng-en",name:"Anglais — Grammaire essentielle",short:"Anglais",keywords:"present simple continuous preterit present perfect futur modaux conditionnels comparatifs connecteurs",intro:"Quelques temps et structures reviennent sans cesse. La distinction **preterit / present perfect** est la difficulté majeure.",cours:[{h:"Les temps",blocks:[{t:"table",head:["Temps","Emploi","Exemple"],rows:[["Present simple","Habitude, vérité générale (+ -s à la 3e pers.)","She works in Paris"],["Present continuous (be + -ing)","Action en cours","They are working now"],["Preterit","Action passée datée et terminée","We went to London in 2019"],["Present perfect (have/has + PP)","Lien passé-présent (for, since, ever…)","I have visited London"]]},{t:"tip",c:"Une **date précise** (in 2019, yesterday) impose le **preterit** ; *for/since/ever/already/yet* appellent le **present perfect**."}]},{h:"Modaux, conditionnels, comparatifs",blocks:[{t:"list",c:["**Modaux** (+ base verbale) : can/could, may/might, must, have to, should.","**Conditionnels** : Type 1 *If + present, will + BV* ; Type 2 *If + preterit, would + BV*.","**Comparatifs** : cheaper / more expensive ; irréguliers good→better→best.","**Connecteurs** : however, therefore, because, although, moreover, for instance."]}]}],essentiel:["**Preterit** (daté) vs **present perfect** (lien passé-présent, for/since).","Modaux + **base verbale** ; conditionnel 2 : *If + preterit, would + BV*.","Comparatifs : -er / more… ; good → better → the best."],resources:[{kind:"video",label:"Present perfect vs preterit",note:"Vidéos — recherche YouTube",url:T("present perfect preterit anglais explication lycée")}],games:[{id:"p1-lng-en-trou",type:"trou",title:"Texte à trous — Conjugaison",icon:"✏️",questions:[{text:"She ____ (work) here since 2020.",answer:"has worked",explain:"Present perfect + since : « has worked »."},{text:"They ____ (watch) TV when I arrived.",answer:"were watching",explain:"Past continuous : action en cours interrompue."},{text:"If it ____ (rain), we will cancel.",answer:"rains",explain:"Conditionnel type 1 : If + present."}]},{id:"p1-lng-en-qcm",type:"qcm",title:"QCM — Grammaire anglaise",icon:"❓",questions:[{q:"« We ___ to London in 2019 » (date précise) :",choices:["went","have gone","go","are going"],answer:0,explain:"Date précise → preterit."},{q:"Conditionnel type 2 : « If I ___ rich, I would travel » :",choices:["were","am","will be","have been"],answer:0,explain:"If + preterit → would + BV."},{q:"Comparatif irrégulier de « good » :",choices:["better","gooder","more good","best"],answer:0,explain:"good → better → the best."}]},{id:"p1-lng-en-flash",type:"flashcard",title:"Flashcards — Temps",icon:"🃏",cards:[{front:"Present perfect",back:"have/has + PP : lien passé-présent (for, since)."},{front:"Preterit",back:"Action passée datée et terminée."},{front:"Conditionnel type 2",back:"If + preterit, would + base verbale."}]}]},{id:"p1-lng-es",name:"Espagnol — Grammaire essentielle",short:"Espagnol",keywords:"ser estar indefinido imperfecto perfecto futuro subjonctif gérondif gustar obligación a personnel",intro:"Deux difficultés majeures : **ser vs estar** et **indefinido vs imperfecto**.",cours:[{h:"Ser / Estar et les passés",blocks:[{t:"table",head:["SER","ESTAR"],rows:[["Caractéristique permanente, identité, profession, heure","État passager, lieu, situation"],["Soy estudiante · Es alto","Estoy cansado · Madrid está en España"]]},{t:"p",c:"**Indefinido** = action passée **datée** (« Ayer comí ») ; **imperfecto** = **description/habitude** (« Cuando era niño, jugaba ») ; **pretérito perfecto** (he/has/ha + participe) = passé récent lié au présent (« Hoy he comido »)."}]},{h:"Autres points clés",blocks:[{t:"list",c:["**Futur** : infinitif + -é, -ás, -á, -emos, -éis, -án (hablaré). Irréguliers : tener→tendré.","**Gustar** : « Me gusta el cine » / « Me gustan los libros » (accord avec la chose aimée).","**Obligation** : *tener que* + inf. (personnelle) ; *hay que* + inf. (impersonnelle).","Le **« a » personnel** devant un COD de personne (« Veo a María »)."]}]}],essentiel:["**Ser** = permanent ; **Estar** = état/lieu passager.","**Indefinido** = action datée ; **imperfecto** = décor/habitude.","**Gustar** : accord avec la chose aimée (gusta / gustan)."],resources:[{kind:"video",label:"Ser vs Estar ; indefinido vs imperfecto",note:"Vidéos — recherche YouTube",url:T("espagnol ser estar indefinido imperfecto lycée")}],games:[{id:"p1-lng-es-tri",type:"tri",title:"Tri — Ser ou Estar ?",icon:"🗂️",instruction:"Classe chaque phrase.",categories:[{id:"ser",label:"SER"},{id:"estar",label:"ESTAR"}],items:[{text:"Soy ___ estudiante (profession)",cat:"ser"},{text:"Estoy ___ cansado (état)",cat:"estar"},{text:"Madrid ___ en España (lieu)",cat:"estar"},{text:"Es ___ alto (caractéristique)",cat:"ser"},{text:"Son ___ las tres (heure)",cat:"ser"}]},{id:"p1-lng-es-trou",type:"trou",title:"Texte à trous — Passés & gustar",icon:"✏️",questions:[{text:"Ayer nosotros ____ (ir) al cine.",answer:"fuimos",alt:["fuímos"],explain:"Indefinido (action datée) : « fuimos »."},{text:"Cuando era niño, ____ (jugar) mucho.",answer:"jugaba",explain:"Imperfecto (habitude passée) : « jugaba »."},{text:"Me ____ (gustar) las películas de acción.",answer:"gustan",explain:"Accord avec le pluriel : « gustan »."}]},{id:"p1-lng-es-qcm",type:"qcm",title:"QCM — Grammaire espagnole",icon:"❓",questions:[{q:"« Madrid ___ en España » :",choices:["está","es","son","estar"],answer:0,explain:"Lieu → estar."},{q:"« Il faut étudier » se dit…",choices:["Hay que estudiar","Tengo estudiar","Es estudiar","Estar estudiar"],answer:0,explain:"Obligation impersonnelle : hay que + infinitif."},{q:"« Ayer ___ (comer) » se met à l’…",choices:["indefinido (comí)","imperfecto (comía)","futuro","présent"],answer:0,explain:"Action datée « ayer » → indefinido."}]}]},{id:"p1-lng-axes",name:"Les 8 axes culturels",short:"8 axes culturels",keywords:"axes culturels identités échanges espace privé public art pouvoir citoyenneté fictions innovations diversité mémoire médiation",intro:"Le programme s’organise autour de **8 axes culturels** (« Gestes fondateurs et mondes en mouvement ») et de **6 activités langagières**.",cours:[{h:"Les 8 axes culturels",blocks:[{t:"p",c:"Le programme s’organise autour de la thématique « **Gestes fondateurs et mondes en mouvement** », déclinée en **8 axes culturels** :"},{t:"list",c:["1. Identités et échanges — 2. Espace privé et espace public","3. Art et pouvoir — 4. Citoyenneté et mondes virtuels","5. Fictions et réalités — 6. Innovations scientifiques et responsabilité","7. Diversité et inclusion — 8. Territoire et mémoire"]}]},{h:"Les 6 activités langagières",blocks:[{t:"p",c:"On est évalué sur **6 activités langagières** :"},{t:"list",c:["la **compréhension** de l’oral et de l’écrit ;","l’**expression orale** en continu et en interaction ;","l’**expression écrite** ;","la **médiation** : reformuler, traduire ou expliquer un document à quelqu’un."]}]}],essentiel:["**8 axes culturels** (thématique « Gestes fondateurs et mondes en mouvement »).","6 activités langagières, dont la **médiation**."],resources:[{kind:"video",label:"Les axes du programme de langues",note:"Vidéos — recherche YouTube",url:T("axes programme langues lycée gestes fondateurs mondes en mouvement")}],games:[{id:"p1-lng-axes-qcm",type:"qcm",title:"QCM — Les 8 axes",icon:"❓",questions:[{q:"Combien d’axes culturels au programme ?",choices:["8","6","4","10"],answer:0,explain:"Le programme compte 8 axes culturels."},{q:"La « médiation » consiste à…",choices:["reformuler / traduire / expliquer un document","apprendre par cœur","passer un test de grammaire","faire une dictée"],answer:0,explain:"Médiation = expliquer/traduire un document à quelqu’un."},{q:"« Citoyenneté et mondes virtuels » couvre notamment…",choices:["réseaux sociaux, fake news","la Guerre de Cent Ans","la TVA","la dérivation"],answer:0,explain:"C’est l’axe du numérique et de la citoyenneté."}]},{id:"p1-lng-axes-ordre",type:"ordre",title:"Remise en ordre — Les 4 premiers axes",icon:"🔢",instruction:"Remets les 4 premiers axes dans l’ordre officiel.",steps:["Identités et échanges","Espace privé et espace public","Art et pouvoir","Citoyenneté et mondes virtuels"],explain:"Les axes 1 à 4 dans l’ordre du programme."},{id:"p1-lng-axes-flash",type:"flashcard",title:"Flashcards — Axes & activités",icon:"🃏",cards:[{front:"Nombre d’axes",back:"8 axes culturels (« Gestes fondateurs et mondes en mouvement »)."},{front:"Médiation",back:"Reformuler, traduire ou expliquer un document à quelqu’un."},{front:"6 activités langagières",back:"CO, CE, EO (continu + interaction), EE, médiation."}]}]}]},Fh=[Ph,Nh,Th,Rh,Mh,Ah,Dh,Ih],N=e=>"https://www.youtube.com/results?search_query="+encodeURIComponent(e),Vh={"gf-t1":{essentiel:["La comptabilité en **partie double** : tout enregistrement respecte **débit = crédit**.","**TVA à décaisser = TVA collectée − TVA déductible** ; si déductible > collectée → **crédit de TVA**.","**Amortissement** (perte définitive) ≠ **dépréciation** (réversible) ; **VNC = valeur d’origine − amortissements cumulés**.","Les **4 principes** comptables : prudence · indépendance des exercices · continuité · permanence des méthodes."],intro:"Tout part d'une idée simple : une entreprise doit **garder la trace de tout ce qu'elle achète, vend, possède et doit**. La comptabilité est le langage qui traduit chaque opération en chiffres, pour savoir si l'entreprise gagne de l'argent et si elle est en bonne santé. Ce premier thème pose les **règles du jeu** : comment enregistrer une opération, comment fonctionne la TVA, comment tenir compte de l'usure du matériel (l'amortissement) et quels grands principes garantissent une information honnête.",cours:[{h:"À quoi sert la comptabilité ? Le système d'information comptable (SIC)",blocks:[{t:"p",c:"Chaque jour, une entreprise réalise des dizaines d'opérations : elle achète des matières, paie ses salariés, vend ses produits, règle des factures. Le **système d'information comptable (SIC)** est l'ensemble des outils et procédures qui **saisissent, classent et enregistrent** ces opérations afin d'en donner une **image fidèle** du patrimoine, de la situation financière et du résultat (article 120-1 du PCG)."},{t:"p",c:"Cette information a **deux usages**. *En interne*, elle aide les dirigeants à piloter et décider (Faut-il investir ? Embaucher ? Baisser les prix ?). *En externe*, elle sert de **preuve** vis-à-vis de l'administration fiscale, des banques et des associés, et de **base au calcul des impôts**."},{t:"list",c:["**PGI / ERP** : un progiciel de gestion intégré est un logiciel unique reposant sur une **base de données unique**. Une information saisie une seule fois circule partout (compta, stocks, paie) → moins d'erreurs, plus de fiabilité.","**Dématérialisation** : les factures deviennent électroniques, les traitements s'automatisent. L'humain ne disparaît pas : il **contrôle et valide**.","**Sécurité du SI** : quatre exigences — **D**isponibilité, **I**ntégrité, **C**onfidentialité, traçabilité.","**Cadre normatif** : l'**ANC** (Autorité des Normes Comptables) fixe les règles, réunies dans le **PCG** (Plan Comptable Général)."]},{t:"tip",c:"La comptabilité n'est pas qu'une contrainte administrative : c'est un **outil de décision**. Derrière chaque chiffre se cache une opération réelle."}]},{h:"La partie double et la chaîne comptable",blocks:[{t:"p",c:"Règle d'or de la comptabilité : la **partie double**. Toute opération est enregistrée sur **au moins deux comptes**, une fois au **débit**, une fois au **crédit**, pour un **montant total égal**. Autrement dit : **débit = crédit**, toujours."},{t:"example",h:"Un achat payé par banque",c:`Boisdéco achète du bois pour 1 000 € réglé par virement.
→ Le compte **Achats (601)** augmente de 1 000 € au **débit**.
→ Le compte **Banque (512)** diminue de 1 000 € au **crédit**.
Débit = crédit : l'équilibre est respecté.`},{t:"p",c:"Quelques comptes à connaître : **Achats (classe 6)**, **Ventes (classe 7)**, **Clients (411)**, **Fournisseurs (401)**, **Banque (512)**, **immobilisations (classe 2)**."},{t:"p",c:"Une opération suit une **chaîne** jusqu'aux comptes annuels :"},{t:"formula",c:"Pièce justificative → Journal → Grand livre → Balance → Documents de synthèse (bilan, compte de résultat, annexe)"},{t:"list",c:["**Lettrage** : on relie une facture à son règlement pour vérifier que les clients ont bien payé.","**Rapprochement bancaire** : on compare le compte « Banque » de l'entreprise au **relevé** envoyé par la banque."]}]},{h:"La TVA : l'entreprise, simple collecteur pour l'État",blocks:[{t:"p",c:"La **TVA** (taxe sur la valeur ajoutée) est un impôt payé par le **consommateur final**. L'entreprise ne fait que la **collecter** sur ses ventes puis la **reverser** à l'État, après avoir déduit la TVA qu'elle a elle-même payée sur ses achats."},{t:"formula",c:"TVA à décaisser = TVA collectée (sur ventes) − TVA déductible (sur achats + immobilisations)"},{t:"figure",name:"tva"},{t:"example",h:"Mois de mars (Boisdéco, taux 20 %)",c:`Ventes HT = 90 000 € ; achats de matières HT = 40 000 € ; achat d'une machine HT = 15 000 €.
• TVA collectée = 90 000 × 20 % = **18 000 €**
• TVA déductible = (40 000 + 15 000) × 20 % = **11 000 €**
• TVA à décaisser = 18 000 − 11 000 = **7 000 €**
→ L'entreprise **doit 7 000 €** à l'État.`},{t:"warning",c:"La TVA n'est **ni une charge ni un produit** : elle ne fait que transiter par l'entreprise, ce n'est pas un bénéfice. Si la TVA déductible **dépasse** la collectée, on obtient un **crédit de TVA** : c'est l'État qui doit de l'argent à l'entreprise."},{t:"p",c:"Sur une **facture de doit**, on applique les **réductions commerciales** (rabais, remise, ristourne) puis on ajoute la TVA. Une **facture d'avoir** corrige ou annule une facture (retour de marchandise, geste commercial)."}]},{h:"Investir et amortir : le coût de l'usure",blocks:[{t:"p",c:"Quand l'entreprise achète un bien **durable** (machine, véhicule, ordinateur), ce n'est pas une charge de l'année mais une **immobilisation** (classe 2), inscrite à l'**actif**. Une dépense **consommée** dans l'année (électricité, fournitures) est au contraire une **charge** (classe 6)."},{t:"p",c:"L'**amortissement** répartit le coût de l'immobilisation sur sa **durée d'utilisation**, pour refléter sa perte de valeur (usure, obsolescence)."},{t:"formula",c:"Taux linéaire = 1 / durée · Annuité = valeur × taux · VNC = valeur d'origine − amortissements cumulés"},{t:"example",h:"Une machine amortie en linéaire",c:`Machine : 15 000 € HT, durée 5 ans, mise en service le **01/04/N**.
• Taux = 1/5 = **20 %** → annuité pleine = 15 000 × 20 % = **3 000 €**
• 1re année, **prorata temporis** (9 mois sur 12) : 3 000 × 9/12 = **2 250 €**
• VNC au 31/12/N = 15 000 − 2 250 = **12 750 €**`},{t:"tip",c:"La 1re année, n'oublie jamais le **prorata temporis** : on ne compte que les mois d'utilisation, à partir de la **date de mise en service**."}]},{h:"Communiquer une information fidèle : principes et inventaire",blocks:[{t:"p",c:"À la clôture de l'exercice (12 mois), on réalise l'**inventaire** : on recense et valorise ce que possède l'entreprise, ce qui donne lieu à des **écritures d'ajustement** (stocks, amortissements, dépréciations, cessions)."},{t:"p",c:"Quatre **principes comptables** garantissent une information honnête :"},{t:"table",head:["Principe","Ce qu'il impose"],rows:[["Prudence","Ne pas surévaluer l'actif ni le résultat ; anticiper les pertes probables."],["Indépendance des exercices","Rattacher chaque charge et produit au bon exercice."],["Continuité de l'exploitation","Comptabiliser en supposant que l'entreprise poursuivra son activité."],["Permanence des méthodes","Garder les mêmes méthodes d'un exercice à l'autre pour pouvoir comparer."]]},{t:"warning",c:"Ne confonds pas **amortissement** (perte de valeur **définitive**, ex. l'usure d'une machine) et **dépréciation** (perte de valeur **réversible**, ex. un stock qui pourrait se revendre plus tard)."},{t:"p",c:"Enfin, l'**annexe** est un document de synthèse qui **explicite** le bilan et le compte de résultat (méthodes retenues, détails utiles à la compréhension)."}]}],resources:[{kind:"video",label:"Le mécanisme de la TVA expliqué",note:"Vidéos — recherche YouTube",url:N("mécanisme TVA collectée déductible à décaisser terminale STMG")},{kind:"video",label:"L'amortissement linéaire (méthode + calcul)",note:"Vidéos — recherche YouTube",url:N("amortissement linéaire annuité VNC prorata temporis STMG")},{kind:"video",label:"La partie double et la chaîne comptable",note:"Vidéos — recherche YouTube",url:N("partie double débit crédit journal grand livre STMG gestion finance")}]},"gf-t2":{essentiel:["Cascade des SIG : **Marge → VA → EBE → Résultat d’exploitation → RCAI → Résultat net**.","**EBE = VA + subventions d’exploitation − impôts et taxes − charges de personnel**.","**FRNG = ressources stables − emplois stables** ; **BFR = actif circ. − passif circ. d’exploitation** ; **Trésorerie nette = FRNG − BFR**.","Rentabilité **économique** (Rés. expl. / capitaux investis) ≠ **financière** (Rés. net / capitaux propres) ; **effet de levier** favorable si rentabilité éco. > coût de la dette."],intro:"Après avoir enregistré les opérations, on passe à l'**analyse** : l'entreprise est-elle **performante** ? est-elle **solide** ? Ce thème, le plus fréquent au bac, apprend à lire les résultats (les SIG, l'EBE, la CAF), à mesurer la **rentabilité** et à diagnostiquer la **structure financière** grâce au bilan fonctionnel (FRNG, BFR, trésorerie). L'objectif n'est pas de calculer pour calculer, mais d'**interpréter** ce que disent les chiffres.",cours:[{h:"Mesurer la performance : les Soldes Intermédiaires de Gestion (SIG)",blocks:[{t:"p",c:"Le compte de résultat peut être « découpé » en plusieurs **paliers** : les **SIG**. On part du chiffre d'affaires et, étage par étage, on retire des charges pour comprendre **d'où vient le résultat**."},{t:"formula",c:"Marge commerciale → Valeur ajoutée → EBE → Résultat d'exploitation → RCAI → Résultat net"},{t:"figure",name:"sig-cascade"},{t:"list",c:["**Valeur ajoutée (VA)** = ce que l'entreprise crée réellement = marge commerciale + production − consommations en provenance des tiers.","**EBE (excédent brut d'exploitation)** = VA + subventions d'exploitation − impôts et taxes − charges de personnel. C'est la **richesse dégagée par l'activité seule**, avant amortissements et financement.","**Résultat d'exploitation** = EBE − dotations (+ autres produits/charges).","**Résultat net** = ce qui reste vraiment, après le financier, l'exceptionnel et l'impôt."]},{t:"example",h:"De la VA au résultat net",c:`Production vendue 520 000 € ; consommations 210 000 € ; subventions 5 000 € ; impôts et taxes 8 000 € ; charges de personnel 190 000 € ; dotations 40 000 € ; résultat financier −6 000 € ; IS 15 000 €.
• VA = 520 000 − 210 000 = **310 000 €**
• EBE = 310 000 + 5 000 − 8 000 − 190 000 = **117 000 €**
• Résultat d'exploitation = 117 000 − 40 000 = **77 000 €**
• Résultat net = 77 000 − 6 000 − 15 000 = **56 000 €**`}]},{h:"La CAF : la ressource dégagée par l'activité",blocks:[{t:"p",c:"La **capacité d'autofinancement (CAF)** mesure l'argent que l'entreprise **génère par son activité** et qu'elle pourra utiliser pour **investir, rembourser ses emprunts ou verser des dividendes**."},{t:"formula",c:"CAF (méthode additive) = Résultat net + dotations − reprises + VNC des éléments cédés − produits de cession"},{t:"example",h:"Calcul rapide",c:`Résultat net = 56 000 € ; dotations = 40 000 € ; pas de reprise ni de cession.
CAF = 56 000 + 40 000 = **96 000 €**.`},{t:"tip",c:"Les **dotations aux amortissements** sont des charges **calculées** (pas de sortie d'argent) : on les **rajoute** au résultat pour retrouver la trésorerie potentielle générée."}]},{h:"Profitabilité, rentabilité et effet de levier",blocks:[{t:"p",c:"Attention à ne pas tout mélanger : **profitabilité** et **rentabilité** ne mesurent pas la même chose."},{t:"table",head:["Indicateur","Formule","Ce qu'il mesure"],rows:[["Profitabilité","Résultat / Chiffre d'affaires","Combien rapporte 1 € de vente"],["Rentabilité économique","Résultat d'exploitation / capitaux investis","L'efficacité de l'outil (vision du dirigeant)"],["Rentabilité financière","Résultat net / capitaux propres","Le rendement pour l'associé"]]},{t:"p",c:"**L'effet de levier** explique l'intérêt de s'endetter. Si la **rentabilité économique** est **supérieure au coût de la dette**, emprunter **augmente** la rentabilité financière : l'argent emprunté rapporte plus qu'il ne coûte."},{t:"warning",c:"L'effet peut se retourner : si la rentabilité économique passe **sous** le taux d'intérêt, la dette **détruit** de la rentabilité — c'est l'**effet de massue**."}]},{h:"La structure financière : le bilan fonctionnel",blocks:[{t:"p",c:"Le bilan fonctionnel classe les ressources et les emplois selon qu'ils sont **stables** (long terme) ou liés au **cycle d'exploitation** (court terme). Trois indicateurs clés en découlent."},{t:"formula",c:"FRNG = Ressources stables − Emplois stables"},{t:"formula",c:"BFR = Actif circulant d'exploitation − Passif circulant d'exploitation"},{t:"formula",c:"Trésorerie nette = FRNG − BFR = Trésorerie active − Trésorerie passive"},{t:"figure",name:"bilan"},{t:"example",h:"Lire l'équilibre financier",c:`Ressources stables 380 000 ; emplois stables 300 000 ; actif circ. d'exploit. 160 000 ; passif circ. d'exploit. 70 000.
• FRNG = 380 000 − 300 000 = **80 000 €**
• BFR = 160 000 − 70 000 = **90 000 €**
• Trésorerie nette = 80 000 − 90 000 = **− 10 000 €**
→ Le FRNG ne couvre pas tout le BFR : la trésorerie est **négative** (découvert). Il faudrait **réduire le BFR** ou **augmenter le FRNG**.`},{t:"tip",c:"Bonne santé = **FRNG > BFR** → trésorerie positive. Le **BFR** représente l'argent « immobilisé » dans les stocks et les créances clients, en attendant d'être encaissé."}]},{h:"Les ratios et leurs limites",blocks:[{t:"list",c:["**Rotation des stocks** = (stock moyen / coût d'achat des marchandises vendues) × 360.","**Délai clients** = (créances clients TTC / CA TTC) × 360 — combien de jours pour être payé.","**Délai fournisseurs** = (dettes fournisseurs TTC / achats TTC) × 360.","**Indépendance financière** = dettes financières / capitaux propres.","**Capacité de remboursement** = dettes financières / CAF (idéalement < 3-4 ans)."]},{t:"warning",c:"Un ratio seul ne veut rien dire : l'analyse est **statique** et sensible aux choix comptables. Il faut **comparer dans le temps** (évolution) et **dans l'espace** (concurrents, secteur)."}]}],resources:[{kind:"video",label:"Les SIG, l'EBE et la CAF",note:"Vidéos — recherche YouTube",url:N("SIG EBE CAF soldes intermédiaires de gestion terminale STMG")},{kind:"video",label:"Bilan fonctionnel : FRNG, BFR, trésorerie",note:"Vidéos — recherche YouTube",url:N("bilan fonctionnel FRNG BFR trésorerie nette STMG")},{kind:"video",label:"Rentabilité et effet de levier",note:"Vidéos — recherche YouTube",url:N("rentabilité économique financière effet de levier STMG")}]},"gf-t3":{essentiel:["Financements **internes** (autofinancement/CAF) vs **externes** (emprunt, augmentation de capital, subventions).","**MCV = CA − charges variables** ; **taux de MCV = MCV / CA**.","**Seuil de rentabilité = charges fixes / taux de MCV** ; au seuil, le résultat est **nul** ; le **point mort** en est la date.","**Réserve légale** : 5 % du bénéfice jusqu’à 10 % du capital."],intro:"Dernière étape : la comptabilité au service de la **décision**. Comment **financer** un projet ? Comment garder une **trésorerie** saine ? Que faire du **bénéfice** ? Et surtout, à partir de quel niveau de ventes l'entreprise devient-elle **rentable** ? Ce thème mobilise les **coûts** et le célèbre **seuil de rentabilité**.",cours:[{h:"Financer l'activité et les investissements",blocks:[{t:"p",c:"Pour investir, une entreprise dispose de deux grandes sources de financement."},{t:"table",head:["Financements internes","Financements externes"],rows:[["Autofinancement (la CAF)","Emprunt bancaire"],["Apports en compte courant d'associés","Augmentation de capital"],["—","Crowdfunding, subventions"]]},{t:"p",c:"Le choix se fait selon plusieurs **critères** : le coût, le niveau d'endettement déjà atteint, le **pouvoir** laissé aux associés (une augmentation de capital dilue le contrôle) et l'attractivité du projet."}]},{h:"Optimiser la trésorerie",blocks:[{t:"p",c:"La **trésorerie** est le nerf de la guerre : une entreprise rentable peut faire faillite si elle manque de liquidités au mauvais moment."},{t:"list",c:["Le **budget de trésorerie** prévoit, **mois par mois**, les encaissements et les décaissements.","Pour l'améliorer : **réduire le BFR** (encaisser plus vite, négocier les délais fournisseurs, alléger les stocks), recourir au découvert, **placer les excédents**."]}]},{h:"Affecter le résultat",blocks:[{t:"p",c:"Quand l'exercice dégage un bénéfice, les associés décident de sa **répartition**."},{t:"list",c:["**Réserve légale** : obligatoire, 5 % du bénéfice jusqu'à atteindre 10 % du capital.","**Réserves** statutaires ou facultatives (mises de côté pour l'entreprise).","**Dividendes** : la part distribuée aux associés.","**Report à nouveau** : la part non affectée, reportée sur l'exercice suivant."]},{t:"tip",c:"Tout l'arbitrage tient en une phrase : **garder** pour financer l'entreprise (réserves = autofinancement) ou **distribuer** pour rémunérer les associés (dividendes)."}]},{h:"Analyser les coûts et trouver le seuil de rentabilité",blocks:[{t:"p",c:"On distingue les **charges variables** (qui dépendent de l'activité : matières, énergie de production) des **charges fixes** (indépendantes du volume : loyer, assurance)."},{t:"formula",c:"MCV (marge sur coût variable) = CA − charges variables · Taux de MCV = MCV / CA"},{t:"formula",c:"Seuil de rentabilité = charges fixes / taux de MCV"},{t:"figure",name:"seuil"},{t:"example",h:"Le seuil de rentabilité de Boisdéco",c:`CA = 300 000 € ; charges variables = 180 000 € ; charges fixes = 96 000 €.
• MCV = 300 000 − 180 000 = **120 000 €** ; taux de MCV = 120 000 / 300 000 = **0,40**
• Seuil = 96 000 / 0,40 = **240 000 €** de CA
• Résultat = 120 000 − 96 000 = **24 000 €** (bénéfice)
• Marge de sécurité = 300 000 − 240 000 = **60 000 €** : le CA peut baisser de 20 % avant les pertes.`},{t:"warning",c:"Au **seuil de rentabilité**, le résultat est **nul** (ni perte ni bénéfice). Le **point mort** est la **date** à laquelle ce seuil est atteint dans l'année."}]}],resources:[{kind:"video",label:"Le seuil de rentabilité (méthode + exemple)",note:"Vidéos — recherche YouTube",url:N("seuil de rentabilité marge sur coût variable point mort STMG")},{kind:"video",label:"Les modes de financement de l'entreprise",note:"Vidéos — recherche YouTube",url:N("financement interne externe entreprise terminale STMG gestion finance")},{kind:"video",label:"L'affectation du résultat",note:"Vidéos — recherche YouTube",url:N("affectation du résultat réserve légale dividendes STMG")}]},"mgmt-t1":{essentiel:["Trois types d’organisations : **privée** (lucrative), **publique** (intérêt général), **société civile** (association, ONG).","**Efficacité** = atteindre l’objectif ; **efficience** = l’atteindre au **moindre coût**.","Ressources : financières, humaines, matérielles et **immatérielles** (marque, savoir-faire, brevets).","Compétitivité **prix** (prix bas) vs **hors-prix** (qualité, innovation, image, délais)."],intro:"Le management, c’est l’art de **piloter une organisation** pour qu’elle atteigne ses objectifs. Avant de savoir diriger, il faut comprendre : qu’est-ce qu’une organisation, quelle est sa **finalité**, avec quelles **ressources** crée-t-elle de la valeur, et comment reste-t-elle **compétitive** face aux autres ?",cours:[{h:"Qu’est-ce qu’une organisation ? Types et finalités",blocks:[{t:"p",c:"Une **organisation** est un groupe humain structuré (des moyens, une division du travail, des règles) réuni pour atteindre un **but commun**. On en distingue trois grandes familles, selon leur **finalité**."},{t:"table",head:["Type","Finalité","Exemples"],rows:[["Entreprise privée","Lucrative (réaliser un profit)","PME, multinationale"],["Organisation publique","Non lucrative (intérêt général, service public)","Mairie, hôpital public"],["Société civile","Non lucrative (défendre une cause)","Association, ONG, syndicat"]]},{t:"p",c:"Au-delà du profit, une entreprise peut aussi poursuivre une finalité **sociétale** (prise en compte des enjeux sociaux et environnementaux : la **RSE**)."}]},{h:"Efficacité et efficience : deux mesures de la performance",blocks:[{t:"p",c:"La **performance** se juge sur deux plans. L’**efficacité**, c’est **atteindre l’objectif** fixé. L’**efficience**, c’est l’atteindre **au moindre coût**, en utilisant au mieux les ressources."},{t:"example",h:"Efficace ≠ efficient",c:`Deux équipes atteignent l’objectif de 100 ventes : les deux sont **efficaces**.
Mais l’équipe B l’a fait avec deux fois moins de budget : elle est plus **efficiente**.`},{t:"tip",c:"Moyen mnémotechnique : efficac**ité** = le résult**at** ; effici**ence** = les moy**ens**."}]},{h:"Les ressources et la création de valeur",blocks:[{t:"list",c:["**Ressources financières** : capitaux, trésorerie.","**Ressources humaines** : les salariés, leurs compétences.","**Ressources matérielles** : locaux, machines, matières.","**Ressources immatérielles** : savoir-faire, marque, image, brevets — souvent les plus difficiles à copier."]},{t:"p",c:"En combinant ces ressources tout au long de sa **chaîne de valeur** (l’enchaînement des activités), l’organisation **crée de la valeur** pour ses clients — et, si elle est efficiente, un profit pour elle-même."}]},{h:"Être compétitif : par les prix ou hors-prix",blocks:[{t:"p",c:"La **compétitivité** est la capacité à s’imposer face à la concurrence. Deux stratégies :"},{t:"list",c:["**Compétitivité-prix** : proposer un **prix plus bas** (grâce à des coûts maîtrisés).","**Compétitivité hors-prix** : se démarquer par la **qualité, l’innovation, l’image, les délais**."]},{t:"example",h:"Vél’Oc",c:"En se positionnant « haut de gamme », le fabricant de vélos électriques Vél’Oc mise sur la compétitivité **hors-prix** (qualité, image) plutôt que sur le prix le plus bas."}]}],resources:[{kind:"video",label:"Organisation, finalités et types",note:"Vidéos — recherche YouTube",url:N("organisation entreprise finalité type management terminale STMG")},{kind:"video",label:"Efficacité et efficience",note:"Vidéos — recherche YouTube",url:N("efficacité efficience performance organisation management STMG")}]},"mgmt-t2":{essentiel:["Management **stratégique** (long terme, direction) vs **opérationnel** (court terme, encadrement).","**SWOT** : Forces/Faiblesses = **interne** ; Opportunités/Menaces = **externe**.","Choix stratégiques : spécialisation/diversification ; croissance **interne/externe** ; coûts/différenciation (**Porter**).","Motivation : **Maslow** (pyramide) ; **Herzberg** (hygiène/motivation) ; styles de direction de **Likert**."],intro:"Une organisation, ce sont des **acteurs** aux intérêts parfois divergents, qu’il faut **diagnostiquer**, **décider** et **mobiliser**. Ce thème réunit les outils stars du bac : le **SWOT**, les **choix stratégiques** et les théories de la **motivation**.",cours:[{h:"Management stratégique et management opérationnel",blocks:[{t:"table",head:["","Stratégique","Opérationnel"],rows:[["Horizon","Long terme","Court terme"],["Qui ?","Direction générale","Encadrement, équipes"],["Exemple","Se diversifier vers les trottinettes","Organiser le planning de la semaine"]]},{t:"p",c:"Les deux niveaux sont **complémentaires** : la stratégie fixe le cap, l’opérationnel le met en œuvre au quotidien."}]},{h:"Le diagnostic stratégique : le SWOT",blocks:[{t:"p",c:"Le **SWOT** croise un diagnostic **interne** (ce que l’entreprise maîtrise) et **externe** (ce qu’elle subit)."},{t:"figure",name:"swot"},{t:"table",head:["Interne","Externe"],rows:[["**Forces** (Strengths)","**Opportunités** (Opportunities)"],["**Faiblesses** (Weaknesses)","**Menaces** (Threats)"]]},{t:"example",h:"SWOT de Vél’Oc",c:`Forces : savoir-faire, image haut de gamme.
Faiblesses : turnover élevé, dépendance à un seul produit.
Opportunités : marché de la mobilité douce en expansion, aides publiques.
Menaces : concurrence, critiques environnementales.`},{t:"warning",c:"Erreur classique : ranger un élément **externe** (ex. une aide de l’État) dans les forces. Forces/faiblesses = **interne** ; opportunités/menaces = **externe**."}]},{h:"Les choix stratégiques",blocks:[{t:"list",c:["**Spécialisation** (un seul métier) vs **diversification** (élargir l’offre) : la spécialisation donne de l’expertise mais crée une dépendance ; la diversification répartit le risque mais disperse les ressources.","**Croissance interne** (par ses propres moyens) vs **croissance externe** (rachat, fusion).","**Domination par les coûts** vs **différenciation** (Porter) : être le moins cher, ou proposer une offre unique."]}]},{h:"Motiver et mobiliser les acteurs",blocks:[{t:"p",c:"Fédérer les salariés améliore la **performance sociale** et la cohésion. Plusieurs théories l’expliquent :"},{t:"table",head:["Auteur","Idée clé"],rows:[["Maslow","Pyramide des besoins (physiologiques → estime → accomplissement)"],["Herzberg","Facteurs d’**hygiène** (salaire, conditions : leur absence démotive) vs facteurs de **motivation** (reconnaissance, responsabilités : ils motivent)"],["Likert","Styles de direction : autoritaire, paternaliste, consultatif, participatif"]]},{t:"figure",name:"maslow"},{t:"tip",c:"Face à un turnover élevé, on cherche d’abord les facteurs de **motivation** manquants (reconnaissance, perspectives d’évolution), pas seulement le salaire."}]}],resources:[{kind:"video",label:"Le diagnostic SWOT expliqué",note:"Vidéos — recherche YouTube",url:N("matrice SWOT diagnostic stratégique management terminale STMG")},{kind:"video",label:"Les théories de la motivation (Maslow, Herzberg)",note:"Vidéos — recherche YouTube",url:N("Maslow Herzberg motivation au travail management STMG")}]},"mgmt-t3":{essentiel:["**RSE** = concilier **économique + social + environnemental** (développement durable).","La RSE = assumer l’**impact** des décisions de l’organisation sur la société et l’environnement.","Transformation numérique : exploitation des **données**, **cybersécurité**, automatisation, télétravail."],intro:"Une organisation n’évolue pas dans le vide : elle est **responsable** de son impact sur la société et l’environnement (la **RSE**) et bouleversée par le **numérique**. Deux thèmes quasi systématiques au bac.",cours:[{h:"La responsabilité sociétale des entreprises (RSE)",blocks:[{t:"p",c:"La **RSE** consiste, pour une organisation, à assumer l’**impact de ses décisions** sur la société et l’environnement, au-delà de la seule recherche du profit. Elle concilie **trois piliers** (le développement durable)."},{t:"table",head:["Pilier","Exemples d’actions"],rows:[["Économique","Assurer la rentabilité et la pérennité"],["Social","Conditions de travail, égalité, formation"],["Environnemental","Réduire l’empreinte carbone, recycler, éco-concevoir"]]},{t:"example",h:"Le cas des batteries de Vél’Oc",c:"La critique sur l’empreinte carbone des batteries relève du pilier **environnemental**. Réponses possibles : recyclage/réemploi des batteries, filière plus durable, communication transparente."}]},{h:"La transformation numérique",blocks:[{t:"p",c:"Le numérique bouleverse les organisations : nouveaux **modèles économiques**, relation client repensée, exploitation des **données**."},{t:"list",c:["**Données (data)** : ressource stratégique, mais à protéger.","**Cybersécurité** : protéger les systèmes contre les menaces.","**Automatisation**, **télétravail** : nouvelles façons de travailler."]},{t:"tip",c:"Éthique et **déontologie**, transparence et protection des données personnelles font partie intégrante d’une démarche RSE à l’ère numérique."}]}],resources:[{kind:"video",label:"La RSE et le développement durable",note:"Vidéos — recherche YouTube",url:N("RSE responsabilité sociétale entreprise développement durable STMG")},{kind:"video",label:"La transformation numérique des organisations",note:"Vidéos — recherche YouTube",url:N("transformation numérique organisation données management STMG")}]},"droit-t5":{essentiel:["Contrat = **accord de volontés** créant des obligations ; parties : **consommateur/professionnel**, **débiteur/créancier**.","Formation : **offre + acceptation** (échange des consentements) + **consentement, capacité, objet** (art. 1128).","Vices du consentement (**erreur, dol, violence**) → **nullité relative** ; contenu illicite → **nullité absolue**.","Principes : **liberté contractuelle, force obligatoire, effet relatif, bonne foi** ; obligation de **moyens** vs de **résultat**.","Inexécution → **mise en demeure**, **exécution forcée**, **exception d’inexécution**, **résolution/résiliation**, dommages et intérêts (+ **clause pénale**)."],intro:"Le **contrat** est au cœur de la vie économique : acheter, louer, travailler, tout passe par des accords. Ce thème explique **comment un contrat se forme**, quand il est **valable**, quelles **obligations** il crée, et ce qui se passe **s’il n’est pas respecté**. Le consommateur y bénéficie d’une protection renforcée.",cours:[{h:"Qu’est-ce qu’un contrat ? Les parties",blocks:[{t:"p",c:"Un **contrat** est un **accord de volontés** destiné à **créer, modifier, transmettre ou éteindre des obligations** entre deux ou plusieurs **parties**. Selon le contrat, les parties portent des qualifications différentes :"},{t:"list",c:["le **consommateur** (qui agit pour un usage personnel) et le **professionnel** (qui agit dans le cadre de son activité) ;","le **débiteur** (celui qui doit une obligation) et le **créancier** (celui à qui elle est due)."]},{t:"p",c:"Avant même de conclure, chaque partie a une **obligation d’information** réciproque ; le professionnel a en plus une **obligation de conseil**, pour que le consentement soit **libre et éclairé**."}]},{h:"La formation du contrat : offre, acceptation et validité",blocks:[{t:"p",c:"Le contrat se forme par la **rencontre d’une offre et d’une acceptation** : c’est l’**échange des consentements**. Pour être **valablement formé** (art. 1128 du Code civil), il doit réunir trois conditions :"},{t:"list",c:["**le consentement** des parties : libre et éclairé, donc sans « vice » ;","**la capacité** de contracter (ex. être majeur et non protégé) ;","**un contenu licite et certain** : un **objet** légal et déterminé."]},{t:"tip",c:"Pour certains contrats (à distance, hors établissement), le consommateur dispose en plus d’un **droit de rétractation** (souvent 14 jours) : il peut revenir sur son accord sans avoir à se justifier."}]},{h:"Les vices du consentement et la nullité",blocks:[{t:"p",c:"Si le consentement a été faussé, le contrat peut être **annulé**. Trois **vices du consentement** :"},{t:"table",head:["Vice","Définition"],rows:[["Erreur","Se tromper sur une qualité essentielle du bien ou de la personne"],["Dol","Être trompé par un mensonge, une manœuvre ou un silence (réticence dolosive)"],["Violence","Consentement extorqué par la contrainte (physique, morale ou économique)"]]},{t:"warning",c:"On distingue deux sanctions : la **nullité relative** protège un intérêt privé (ex. une partie dont le consentement est vicié, ou un incapable) — seule la personne protégée peut la demander ; la **nullité absolue** sanctionne la violation d’une règle d’intérêt général (ex. un contenu illicite) — toute personne intéressée peut l’invoquer. Dans les deux cas, le contrat est **anéanti** et les parties doivent se **restituer** ce qu’elles ont reçu."}]},{h:"Les grands principes du droit des contrats",blocks:[{t:"p",c:"Le droit des contrats repose sur quatre principes, hérités de la philosophie des Lumières et codifiés :"},{t:"list",c:["**Liberté contractuelle** : on est libre de contracter ou non, de choisir son cocontractant et le contenu (dans le respect de l’ordre public).","**Force obligatoire** (art. 1103) : « le contrat fait la loi des parties » ; on ne peut le modifier ou le rompre unilatéralement.","**Effet relatif des conventions** : le contrat ne produit d’effets qu’entre les parties, pas à l’éga
