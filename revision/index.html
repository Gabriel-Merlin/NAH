• Résultat = 120 000 − 96 000 = **24 000 €** (bénéfice)
• Marge de sécurité = 300 000 − 240 000 = **60 000 €** : le CA peut baisser de 20 % avant les pertes.`},{t:"warning",c:"Au **seuil de rentabilité**, le résultat est **nul** (ni perte ni bénéfice). Le **point mort** est la **date** à laquelle ce seuil est atteint dans l'année."}]}],resources:[{kind:"video",label:"Le seuil de rentabilité (méthode + exemple)",note:"Vidéos — recherche YouTube",url:P("seuil de rentabilité marge sur coût variable point mort STMG")},{kind:"video",label:"Les modes de financement de l'entreprise",note:"Vidéos — recherche YouTube",url:P("financement interne externe entreprise terminale STMG gestion finance")},{kind:"video",label:"L'affectation du résultat",note:"Vidéos — recherche YouTube",url:P("affectation du résultat réserve légale dividendes STMG")}]},"mgmt-t1":{essentiel:["Trois types d’organisations : **privée** (lucrative), **publique** (intérêt général), **société civile** (association, ONG).","**Efficacité** = atteindre l’objectif ; **efficience** = l’atteindre au **moindre coût**.","Ressources : financières, humaines, matérielles et **immatérielles** (marque, savoir-faire, brevets).","Compétitivité **prix** (prix bas) vs **hors-prix** (qualité, innovation, image, délais)."],intro:"Le management, c’est l’art de **piloter une organisation** pour qu’elle atteigne ses objectifs. Avant de savoir diriger, il faut comprendre : qu’est-ce qu’une organisation, quelle est sa **finalité**, avec quelles **ressources** crée-t-elle de la valeur, et comment reste-t-elle **compétitive** face aux autres ?",cours:[{h:"Qu’est-ce qu’une organisation ? Types et finalités",blocks:[{t:"p",c:"Une **organisation** est un groupe humain structuré (des moyens, une division du travail, des règles) réuni pour atteindre un **but commun**. On en distingue trois grandes familles, selon leur **finalité**."},{t:"table",head:["Type","Finalité","Exemples"],rows:[["Entreprise privée","Lucrative (réaliser un profit)","PME, multinationale"],["Organisation publique","Non lucrative (intérêt général, service public)","Mairie, hôpital public"],["Société civile","Non lucrative (défendre une cause)","Association, ONG, syndicat"]]},{t:"p",c:"Au-delà du profit, une entreprise peut aussi poursuivre une finalité **sociétale** (prise en compte des enjeux sociaux et environnementaux : la **RSE**)."}]},{h:"Efficacité et efficience : deux mesures de la performance",blocks:[{t:"p",c:"La **performance** se juge sur deux plans. L’**efficacité**, c’est **atteindre l’objectif** fixé. L’**efficience**, c’est l’atteindre **au moindre coût**, en utilisant au mieux les ressources."},{t:"example",h:"Efficace ≠ efficient",c:`Deux équipes atteignent l’objectif de 100 ventes : les deux sont **efficaces**.
Mais l’équipe B l’a fait avec deux fois moins de budget : elle est plus **efficiente**.`},{t:"tip",c:"Moyen mnémotechnique : efficac**ité** = le résult**at** ; effici**ence** = les moy**ens**."}]},{h:"Les ressources et la création de valeur",blocks:[{t:"list",c:["**Ressources financières** : capitaux, trésorerie.","**Ressources humaines** : les salariés, leurs compétences.","**Ressources matérielles** : locaux, machines, matières.","**Ressources immatérielles** : savoir-faire, marque, image, brevets — souvent les plus difficiles à copier."]},{t:"p",c:"En combinant ces ressources tout au long de sa **chaîne de valeur** (l’enchaînement des activités), l’organisation **crée de la valeur** pour ses clients — et, si elle est efficiente, un profit pour elle-même."}]},{h:"Être compétitif : par les prix ou hors-prix",blocks:[{t:"p",c:"La **compétitivité** est la capacité à s’imposer face à la concurrence. Deux stratégies :"},{t:"list",c:["**Compétitivité-prix** : proposer un **prix plus bas** (grâce à des coûts maîtrisés).","**Compétitivité hors-prix** : se démarquer par la **qualité, l’innovation, l’image, les délais**."]},{t:"example",h:"Vél’Oc",c:"En se positionnant « haut de gamme », le fabricant de vélos électriques Vél’Oc mise sur la compétitivité **hors-prix** (qualité, image) plutôt que sur le prix le plus bas."}]}],resources:[{kind:"video",label:"Organisation, finalités et types",note:"Vidéos — recherche YouTube",url:P("organisation entreprise finalité type management terminale STMG")},{kind:"video",label:"Efficacité et efficience",note:"Vidéos — recherche YouTube",url:P("efficacité efficience performance organisation management STMG")}]},"mgmt-t2":{essentiel:["Management **stratégique** (long terme, direction) vs **opérationnel** (court terme, encadrement).","**SWOT** : Forces/Faiblesses = **interne** ; Opportunités/Menaces = **externe**.","Choix stratégiques : spécialisation/diversification ; croissance **interne/externe** ; coûts/différenciation (**Porter**).","Motivation : **Maslow** (pyramide) ; **Herzberg** (hygiène/motivation) ; styles de direction de **Likert**."],intro:"Une organisation, ce sont des **acteurs** aux intérêts parfois divergents, qu’il faut **diagnostiquer**, **décider** et **mobiliser**. Ce thème réunit les outils stars du bac : le **SWOT**, les **choix stratégiques** et les théories de la **motivation**.",cours:[{h:"Management stratégique et management opérationnel",blocks:[{t:"table",head:["","Stratégique","Opérationnel"],rows:[["Horizon","Long terme","Court terme"],["Qui ?","Direction générale","Encadrement, équipes"],["Exemple","Se diversifier vers les trottinettes","Organiser le planning de la semaine"]]},{t:"p",c:"Les deux niveaux sont **complémentaires** : la stratégie fixe le cap, l’opérationnel le met en œuvre au quotidien."}]},{h:"Le diagnostic stratégique : le SWOT",blocks:[{t:"p",c:"Le **SWOT** croise un diagnostic **interne** (ce que l’entreprise maîtrise) et **externe** (ce qu’elle subit)."},{t:"figure",name:"swot"},{t:"table",head:["Interne","Externe"],rows:[["**Forces** (Strengths)","**Opportunités** (Opportunities)"],["**Faiblesses** (Weaknesses)","**Menaces** (Threats)"]]},{t:"example",h:"SWOT de Vél’Oc",c:`Forces : savoir-faire, image haut de gamme.
Faiblesses : turnover élevé, dépendance à un seul produit.
Opportunités : marché de la mobilité douce en expansion, aides publiques.
Menaces : concurrence, critiques environnementales.`},{t:"warning",c:"Erreur classique : ranger un élément **externe** (ex. une aide de l’État) dans les forces. Forces/faiblesses = **interne** ; opportunités/menaces = **externe**."}]},{h:"Les choix stratégiques",blocks:[{t:"list",c:["**Spécialisation** (un seul métier) vs **diversification** (élargir l’offre) : la spécialisation donne de l’expertise mais crée une dépendance ; la diversification répartit le risque mais disperse les ressources.","**Croissance interne** (par ses propres moyens) vs **croissance externe** (rachat, fusion).","**Domination par les coûts** vs **différenciation** (Porter) : être le moins cher, ou proposer une offre unique."]}]},{h:"Motiver et mobiliser les acteurs",blocks:[{t:"p",c:"Fédérer les salariés améliore la **performance sociale** et la cohésion. Plusieurs théories l’expliquent :"},{t:"table",head:["Auteur","Idée clé"],rows:[["Maslow","Pyramide des besoins (physiologiques → estime → accomplissement)"],["Herzberg","Facteurs d’**hygiène** (salaire, conditions : leur absence démotive) vs facteurs de **motivation** (reconnaissance, responsabilités : ils motivent)"],["Likert","Styles de direction : autoritaire, paternaliste, consultatif, participatif"]]},{t:"figure",name:"maslow"},{t:"tip",c:"Face à un turnover élevé, on cherche d’abord les facteurs de **motivation** manquants (reconnaissance, perspectives d’évolution), pas seulement le salaire."}]}],resources:[{kind:"video",label:"Le diagnostic SWOT expliqué",note:"Vidéos — recherche YouTube",url:P("matrice SWOT diagnostic stratégique management terminale STMG")},{kind:"video",label:"Les théories de la motivation (Maslow, Herzberg)",note:"Vidéos — recherche YouTube",url:P("Maslow Herzberg motivation au travail management STMG")}]},"mgmt-t3":{essentiel:["**RSE** = concilier **économique + social + environnemental** (développement durable).","La RSE = assumer l’**impact** des décisions de l’organisation sur la société et l’environnement.","Transformation numérique : exploitation des **données**, **cybersécurité**, automatisation, télétravail."],intro:"Une organisation n’évolue pas dans le vide : elle est **responsable** de son impact sur la société et l’environnement (la **RSE**) et bouleversée par le **numérique**. Deux thèmes quasi systématiques au bac.",cours:[{h:"La responsabilité sociétale des entreprises (RSE)",blocks:[{t:"p",c:"La **RSE** consiste, pour une organisation, à assumer l’**impact de ses décisions** sur la société et l’environnement, au-delà de la seule recherche du profit. Elle concilie **trois piliers** (le développement durable)."},{t:"table",head:["Pilier","Exemples d’actions"],rows:[["Économique","Assurer la rentabilité et la pérennité"],["Social","Conditions de travail, égalité, formation"],["Environnemental","Réduire l’empreinte carbone, recycler, éco-concevoir"]]},{t:"example",h:"Le cas des batteries de Vél’Oc",c:"La critique sur l’empreinte carbone des batteries relève du pilier **environnemental**. Réponses possibles : recyclage/réemploi des batteries, filière plus durable, communication transparente."}]},{h:"La transformation numérique",blocks:[{t:"p",c:"Le numérique bouleverse les organisations : nouveaux **modèles économiques**, relation client repensée, exploitation des **données**."},{t:"list",c:["**Données (data)** : ressource stratégique, mais à protéger.","**Cybersécurité** : protéger les systèmes contre les menaces.","**Automatisation**, **télétravail** : nouvelles façons de travailler."]},{t:"tip",c:"Éthique et **déontologie**, transparence et protection des données personnelles font partie intégrante d’une démarche RSE à l’ère numérique."}]}],resources:[{kind:"video",label:"La RSE et le développement durable",note:"Vidéos — recherche YouTube",url:P("RSE responsabilité sociétale entreprise développement durable STMG")},{kind:"video",label:"La transformation numérique des organisations",note:"Vidéos — recherche YouTube",url:P("transformation numérique organisation données management STMG")}]},"droit-t5":{essentiel:["Contrat = **accord de volontés** créant des obligations ; parties : **consommateur/professionnel**, **débiteur/créancier**.","Formation : **offre + acceptation** (échange des consentements) + **consentement, capacité, objet** (art. 1128).","Vices du consentement (**erreur, dol, violence**) → **nullité relative** ; contenu illicite → **nullité absolue**.","Principes : **liberté contractuelle, force obligatoire, effet relatif, bonne foi** ; obligation de **moyens** vs de **résultat**.","Inexécution → **mise en demeure**, **exécution forcée**, **exception d’inexécution**, **résolution/résiliation**, dommages et intérêts (+ **clause pénale**)."],intro:"Le **contrat** est au cœur de la vie économique : acheter, louer, travailler, tout passe par des accords. Ce thème explique **comment un contrat se forme**, quand il est **valable**, quelles **obligations** il crée, et ce qui se passe **s’il n’est pas respecté**. Le consommateur y bénéficie d’une protection renforcée.",cours:[{h:"Qu’est-ce qu’un contrat ? Les parties",blocks:[{t:"p",c:"Un **contrat** est un **accord de volontés** destiné à **créer, modifier, transmettre ou éteindre des obligations** entre deux ou plusieurs **parties**. Selon le contrat, les parties portent des qualifications différentes :"},{t:"list",c:["le **consommateur** (qui agit pour un usage personnel) et le **professionnel** (qui agit dans le cadre de son activité) ;","le **débiteur** (celui qui doit une obligation) et le **créancier** (celui à qui elle est due)."]},{t:"p",c:"Avant même de conclure, chaque partie a une **obligation d’information** réciproque ; le professionnel a en plus une **obligation de conseil**, pour que le consentement soit **libre et éclairé**."}]},{h:"La formation du contrat : offre, acceptation et validité",blocks:[{t:"p",c:"Le contrat se forme par la **rencontre d’une offre et d’une acceptation** : c’est l’**échange des consentements**. Pour être **valablement formé** (art. 1128 du Code civil), il doit réunir trois conditions :"},{t:"list",c:["**le consentement** des parties : libre et éclairé, donc sans « vice » ;","**la capacité** de contracter (ex. être majeur et non protégé) ;","**un contenu licite et certain** : un **objet** légal et déterminé."]},{t:"tip",c:"Pour certains contrats (à distance, hors établissement), le consommateur dispose en plus d’un **droit de rétractation** (souvent 14 jours) : il peut revenir sur son accord sans avoir à se justifier."}]},{h:"Les vices du consentement et la nullité",blocks:[{t:"p",c:"Si le consentement a été faussé, le contrat peut être **annulé**. Trois **vices du consentement** :"},{t:"table",head:["Vice","Définition"],rows:[["Erreur","Se tromper sur une qualité essentielle du bien ou de la personne"],["Dol","Être trompé par un mensonge, une manœuvre ou un silence (réticence dolosive)"],["Violence","Consentement extorqué par la contrainte (physique, morale ou économique)"]]},{t:"warning",c:"On distingue deux sanctions : la **nullité relative** protège un intérêt privé (ex. une partie dont le consentement est vicié, ou un incapable) — seule la personne protégée peut la demander ; la **nullité absolue** sanctionne la violation d’une règle d’intérêt général (ex. un contenu illicite) — toute personne intéressée peut l’invoquer. Dans les deux cas, le contrat est **anéanti** et les parties doivent se **restituer** ce qu’elles ont reçu."}]},{h:"Les grands principes du droit des contrats",blocks:[{t:"p",c:"Le droit des contrats repose sur quatre principes, hérités de la philosophie des Lumières et codifiés :"},{t:"list",c:["**Liberté contractuelle** : on est libre de contracter ou non, de choisir son cocontractant et le contenu (dans le respect de l’ordre public).","**Force obligatoire** (art. 1103) : « le contrat fait la loi des parties » ; on ne peut le modifier ou le rompre unilatéralement.","**Effet relatif des conventions** : le contrat ne produit d’effets qu’entre les parties, pas à l’égard des tiers.","**Bonne foi** : le contrat doit être négocié, formé et exécuté loyalement."]}]},{h:"Les obligations et l’exécution du contrat",blocks:[{t:"p",c:"Le contrat met à la charge des parties des **obligations**, précisées par des **clauses**. On distingue deux intensités d’engagement :"},{t:"table",head:["Obligation de moyens","Obligation de résultat"],rows:[["S’engager à mettre en œuvre tous les moyens","S’engager à atteindre un résultat précis"],["Ex. le médecin doit soigner (pas guérir)","Ex. le transporteur doit livrer à bon port"],["Le créancier doit prouver la faute","La seule absence de résultat suffit"]]},{t:"p",c:"Cette distinction est essentielle pour la **responsabilité** (thème 6)."}]},{h:"L’inexécution du contrat et ses sanctions",blocks:[{t:"p",c:"Si une partie n’exécute pas ses obligations, le créancier peut réagir. Une **mise en demeure** (rappel formel d’exécuter) est le plus souvent nécessaire. Ensuite, plusieurs sanctions sont possibles :"},{t:"list",c:["l’**exécution forcée** (en nature ou par équivalent) ;","l’**exception d’inexécution** : suspendre sa propre obligation tant que l’autre n’exécute pas (« je ne paie pas tant que tu ne livres pas ») ;","la **résolution** (anéantissement rétroactif du contrat) ou la **résiliation** (fin du contrat pour l’avenir, pour les contrats à exécution successive) ;","des **dommages et intérêts** ; les parties peuvent les fixer à l’avance par une **clause pénale**."]},{t:"warning",c:"Le consommateur est protégé contre les **clauses abusives** : celles qui créent un déséquilibre significatif à son détriment dans un contrat d’adhésion sont **réputées non écrites** (art. 1171 du Code civil)."},{t:"example",h:"La cuisine livrée non conforme",c:`Un cuisiniste s’engage à installer une cuisine avant le 1er mars (obligation de **résultat**). Au 15 mars, rien n’est posé. 
→ Le client adresse une **mise en demeure**. Comme il devait verser le solde à la pose, il peut invoquer l’**exception d’inexécution** (« je ne paie pas tant que ce n’est pas installé »). Si le retard persiste, il demande la **résolution** du contrat (remboursement) et des **dommages et intérêts** — dont le montant peut être fixé d’avance par une **clause pénale**.`}]},{h:"Méthode : le syllogisme juridique",blocks:[{t:"p",c:"En droit, on raisonne en trois temps : la **règle** (majeure), les **faits qualifiés** (mineure), puis la **conclusion**."},{t:"example",h:"Marc et la voiture accidentée",c:`**Règle** : le dol (mensonge déterminant) est une cause de nullité du contrat.
**Faits** : le garagiste a affirmé par écrit, faussement, que la voiture n’avait jamais eu d’accident — information déterminante pour Marc.
**Conclusion** : le dol est caractérisé ; Marc peut obtenir la **nullité (relative) de la vente** et des dommages et intérêts.`},{t:"tip",c:"Au bac, on attend toujours : **qualifier** juridiquement la situation, puis **appliquer la règle** aux faits pour conclure."}]}],resources:[{kind:"video",label:"La formation du contrat et sa validité",note:"Vidéos — recherche YouTube",url:P("contrat formation offre acceptation conditions de validité vices droit terminale STMG")},{kind:"video",label:"L’exécution et l’inexécution du contrat",note:"Vidéos — recherche YouTube",url:P("exécution inexécution contrat mise en demeure résolution clause pénale droit terminale STMG")},{kind:"video",label:"Le syllogisme juridique (méthode)",note:"Vidéos — recherche YouTube",url:P("syllogisme juridique méthode cas pratique droit STMG")}]},"droit-t6":{essentiel:["Responsabilité **civile** = **réparer** un dommage ; **pénale** = **sanctionner** une infraction.","Dommage réparable = **certain, direct, personnel et légitime** ; types : **corporel, matériel, moral** (+ **préjudice écologique**).","3 conditions : **fait générateur + dommage + lien de causalité** ; la plupart des dommages sont pris en charge par l’**assurance** (mutualisation).","Régimes : **contractuelle** (dont obligation de sécurité), **extracontractuelle** (fait personnel, des choses, d’autrui, des animaux, ruine des bâtiments) et **régimes spéciaux** (accident du travail/circulation, produits défectueux).","Exonération : **force majeure**, **fait d’un tiers**, **faute de la victime**."],intro:"Quand un dommage est causé à autrui, le droit organise sa **réparation** (responsabilité civile) ou sa **sanction** (responsabilité pénale). Ce thème identifie **quel dommage** est réparable, **quel régime** s’applique et comment un responsable peut **s’exonérer**.",cours:[{h:"Réparer ou sanctionner : civile ou pénale ?",blocks:[{t:"p",c:"Il faut distinguer deux grandes responsabilités :"},{t:"table",head:["Responsabilité civile","Responsabilité pénale"],rows:[["But : réparer le dommage de la victime","But : sanctionner une infraction"],["Au profit de la victime","Au nom de la société"],["Dommages et intérêts","Peine (amende, prison…)"]]},{t:"p",c:"Les **infractions** pénales sont classées par gravité croissante : **contravention**, **délit**, **crime**."},{t:"warning",c:"Un même fait peut engager **les deux** responsabilités (ex. une agression : une peine + des dommages et intérêts à la victime)."}]},{h:"Le dommage réparable",blocks:[{t:"p",c:"La condition première de la responsabilité civile est l’existence d’un **dommage** (ou **préjudice**). On le qualifie selon deux classifications :"},{t:"list",c:["dommage **corporel** (atteinte au corps), **matériel** (atteinte aux biens) ou **moral** (souffrance, atteinte à la réputation) ;","dommage **patrimonial** (évaluable en argent) ou **extrapatrimonial**."]},{t:"p",c:"Pour être **réparable**, le dommage doit présenter certains caractères : il doit être **certain**, **direct**, **personnel** et **légitime**. Le **préjudice écologique** (atteinte à l’environnement) est désormais reconnu et réparable."}]},{h:"L’assurance et l’indemnisation des victimes",blocks:[{t:"p",c:"La plupart des dommages sont pris en charge par un **assureur** grâce à la **mutualisation des risques** : chacun cotise, et l’ensemble des cotisations indemnise ceux qui subissent un sinistre (Sécurité sociale et complémentaires pour le corporel, assureurs de biens et de responsabilité pour le matériel). Des **fonds de garantie**, fondés sur la solidarité, complètent ce système. La recherche de responsabilité intervient dans un **second temps**."}]},{h:"Les conditions de la responsabilité",blocks:[{t:"p",c:"Points communs à tous les régimes, la victime doit établir **trois éléments** :"},{t:"formula",c:"Fait générateur (ou faute) + Dommage + Lien de causalité"},{t:"example",h:"La chute au supermarché",c:`Une entreprise laisse le sol mouillé sans signalisation ; une cliente glisse et se fracture le poignet.
• **Fait générateur** : le sol mouillé non signalé.
• **Dommage** : la fracture, l’opération.
• **Lien de causalité** : la chute résulte directement de l’absence de signalisation.
→ Les trois conditions sont réunies : la cliente peut être **indemnisée**.`}]},{h:"Les différents régimes de responsabilité",blocks:[{t:"p",c:"Selon la situation, on applique un régime différent (on cherche dans cet ordre) :"},{t:"list",c:["Les **régimes spéciaux** : **accident du travail**, **accident de la circulation**, **produits défectueux**, **préjudice écologique** — chacun a ses propres règles d’indemnisation.","La **responsabilité contractuelle** : si le dommage naît de l’**inexécution d’un contrat**. Les obligations peuvent être de **moyens** ou de **résultat** ; le juge peut ajouter une **obligation de sécurité**. Une **clause de limitation ou d’exonération** de responsabilité peut être prévue (mais elle est encadrée).","La **responsabilité extracontractuelle** (hors contrat) : **fait personnel**, **fait des choses**, **fait d’autrui**, **fait des animaux**, **ruine des bâtiments**."]},{t:"tip",c:"Beaucoup de ces régimes sont des **responsabilités objectives** : la victime n’a **pas à prouver une faute**, seulement le **fait générateur**, le **dommage** et le **lien de causalité**."}]},{h:"Les moyens d’exonération",blocks:[{t:"p",c:"Le responsable peut chercher à s’exonérer **totalement ou partiellement** en prouvant une **cause étrangère** :"},{t:"list",c:["la **force majeure** : un événement **imprévisible, irrésistible et extérieur** ;","le **fait ou la faute d’un tiers** ;","le **fait ou la faute de la victime** elle-même."]},{t:"example",h:"L’accident de la circulation",c:`Un automobiliste renverse un piéton : c’est un **régime spécial** (accident de la circulation), une **responsabilité objective** — la victime n’a pas à prouver de **faute**, seulement le **fait générateur**, le **dommage** (corporel) et le **lien de causalité**. 
→ Le conducteur pourra difficilement s’**exonérer** ; il peut seulement invoquer une **faute de la victime** (ex. le piéton a traversé volontairement une autoroute). L’**assurance** indemnise la victime au titre de la mutualisation des risques.`}]}],resources:[{kind:"video",label:"Le dommage réparable et la responsabilité civile",note:"Vidéos — recherche YouTube",url:P("dommage réparable responsabilité civile fait générateur lien de causalité droit terminale STMG")},{kind:"video",label:"Les régimes de responsabilité et l’exonération",note:"Vidéos — recherche YouTube",url:P("régimes responsabilité contractuelle extracontractuelle exonération force majeure droit terminale STMG")}]},"droit-t7":{essentiel:["Contrat de travail = **prestation de travail + rémunération + lien de subordination** (critère déterminant) ≠ contrat d’entreprise.","Pouvoirs de l’employeur : **direction**, **réglementaire** (règlement intérieur), **disciplinaire**.","**CDI** = norme (clauses générales + spécifiques : mobilité, non-concurrence, télétravail) ; **CDD, chantier, saisonnier, intérim** = l’exception écrite.","Rupture : **démission**, **licenciement** (motif personnel ou économique, **cause réelle et sérieuse** + procédure), **rupture conventionnelle** (individuelle/collective).","Libertés du salarié : **vie privée**, **liberté d’expression** (+ devoir de loyauté), **droit de grève**, **liberté syndicale** ; représentants : **CSE**, **délégué syndical**."],intro:"Le droit du travail est un **droit protecteur du salarié**. Il organise la relation de travail autour d’un critère décisif — le **lien de subordination** — puis encadre le contrat, sa **rupture** et les **libertés** du salarié.",cours:[{h:"Le contrat de travail et les pouvoirs de l’employeur",blocks:[{t:"p",c:"Le **contrat de travail** existe dès qu’une personne fournit une **prestation de travail** contre une **rémunération** sous l’**autorité** d’un employeur. Ce dernier élément — le **lien de subordination juridique** — est le **critère déterminant** : il se manifeste par les **pouvoirs de l’employeur** :"},{t:"list",c:["le **pouvoir de direction** : donner des ordres et des directives ;","le **pouvoir réglementaire** : fixer des règles collectives dans le **règlement intérieur** ;","le **pouvoir disciplinaire** : contrôler l’exécution et **sanctionner** les manquements."]},{t:"p",c:"Ce lien de subordination distingue le contrat de travail du **contrat d’entreprise** (ou contrat de prestation de service), conclu avec un **prestataire indépendant** qui n’est pas soumis à cette autorité."},{t:"example",h:"Le cas de Sonia",c:`Sonia suit les consignes du chef, a des horaires imposés et un salaire, mais aucun écrit. L’employeur la dit « indépendante ».
→ La **subordination** est présente : c’est un **contrat de travail** (un **CDI**, faute d’écrit prévoyant un terme). Sonia bénéficie de toute la protection du droit du travail.`}]},{h:"Les formes du contrat de travail",blocks:[{t:"p",c:"Le **CDI** (contrat à durée indéterminée) est la **forme normale et générale** de la relation de travail. Il comporte :"},{t:"list",c:["des **clauses générales** : période d’essai, lieu, horaires et durée du travail, rémunération, qualification, missions ;","des **clauses spécifiques**, qui individualisent la relation et dont la validité est encadrée : clause de **mobilité**, clause de **non-concurrence**, clause de **télétravail**."]},{t:"p",c:"À côté du CDI existent d’**autres formes**, adaptées à certains besoins et **établies par écrit** : le **CDD**, le **CDI de chantier**, le **contrat saisonnier** et le **contrat de travail temporaire (intérim)**. À défaut d’écrit ou de cas de recours valable, un CDD peut être **requalifié en CDI**."}]},{h:"Les sources et la négociation collective",blocks:[{t:"p",c:"La relation de travail est régie par plusieurs **sources** : le **Code du travail**, les **conventions et accords collectifs** (négociés par branche ou par entreprise), le **règlement intérieur** et le **contrat**. La **négociation collective**, menée par les **partenaires sociaux** (syndicats de salariés et d’employeurs), joue un rôle croissant pour adapter les règles à chaque entreprise ou branche."}]},{h:"La rupture du contrat de travail",blocks:[{t:"table",head:["Mode de rupture","À l’initiative de…"],rows:[["Démission","Le salarié"],["Licenciement","L’employeur (cause réelle et sérieuse + procédure)"],["Rupture conventionnelle","Un commun accord (individuelle ou collective)"],["Départ / mise à la retraite","Le salarié ou l’employeur"]]},{t:"p",c:"Le **licenciement** doit reposer sur une **cause réelle et sérieuse** et respecter une **procédure**. On distingue le licenciement pour **motif personnel** (lié au salarié) du licenciement pour **motif économique** (lié à l’entreprise). Ses conséquences : indemnité de licenciement, préavis, solde de tout compte, droits à l’assurance chômage."},{t:"warning",c:"Un licenciement sans **cause réelle et sérieuse** ou sans respect de la **procédure** est **abusif** : le juge peut le sanctionner."},{t:"example",h:"Le licenciement contesté de Karim",c:`Karim est licencié du jour au lendemain, sans entretien préalable, parce que son responsable « ne l’apprécie pas ». 
→ Ce **motif personnel** n’est pas une **cause réelle et sérieuse** (elle doit être objective et vérifiable) et la **procédure** n’a pas été respectée. Le licenciement est **abusif** : saisi, le conseil de prud’hommes peut condamner l’employeur à verser des indemnités. Une **rupture conventionnelle** (accord commun) aurait été une voie légale.`}]},{h:"Les libertés individuelles et collectives",blocks:[{t:"p",c:"Le salarié conserve ses **libertés fondamentales** au travail ; l’employeur ne peut les limiter que si c’est **justifié par la tâche et proportionné**."},{t:"list",c:["le respect de la **vie privée** (y compris face aux outils numériques et aux réseaux sociaux) ;","la **liberté d’expression**, tempérée par un **devoir de loyauté** envers l’employeur ;","le **droit de grève** (reconnu par la Constitution) — mais une grève **illicite** ne protège pas le salarié ;","la **liberté syndicale**."]},{t:"p",c:"Les salariés sont représentés par le **Comité social et économique (CSE)** — expression des salariés, organisation, santé et sécurité, droit d’alerte — et par les **délégués syndicaux**, qui négocient les accords."}]}],resources:[{kind:"video",label:"Le contrat de travail et ses clauses",note:"Vidéos — recherche YouTube",url:P("contrat de travail lien de subordination clauses CDI CDD droit terminale STMG")},{kind:"video",label:"La rupture du contrat de travail",note:"Vidéos — recherche YouTube",url:P("rupture contrat de travail licenciement motif personnel économique rupture conventionnelle STMG")},{kind:"video",label:"Les libertés du salarié, la grève et le CSE",note:"Vidéos — recherche YouTube",url:P("libertés salarié droit de grève CSE délégué syndical droit terminale STMG")}]},"droit-t8":{essentiel:["**Liberté d’entreprendre** et **liberté du commerce et de l’industrie** ; choix : **entreprise individuelle** ou **société**.","Entreprise individuelle : **unicité du patrimoine** (responsabilité sur tout le patrimoine), protégé par la **déclaration d’insaisissabilité** / le **patrimoine d’affectation** ; l’**EURL** crée une personne morale.","Société = personne morale née d’un **contrat de société** (art. 1832) : **apports** + **affectio societatis** + partage des bénéfices ; **responsabilité limitée aux apports** ; forme coopérative = **SCOP**.","**Concurrence déloyale** (parasitisme, dénigrement, imitation, désorganisation) → **action** fondée sur la responsabilité civile ; **entente** et **abus de position dominante** interdits (Autorité de la concurrence).","Partenariats : **contrat d’entreprise (sous-traitance)**, **franchise** — sans lien de subordination."],intro:"Entreprendre est une **liberté**, mais elle s’exerce dans un cadre juridique. Le choix de la **structure** a des conséquences majeures sur le **patrimoine** et la **responsabilité** ; l’activité se développe dans le respect de la **concurrence** et peut s’organiser par des **partenariats**.",cours:[{h:"La liberté d’entreprendre et l’entreprise individuelle",blocks:[{t:"p",c:"La **liberté d’entreprendre** (à valeur constitutionnelle) et la **liberté du commerce et de l’industrie** permettent à chacun de créer et d’exercer une activité économique. La forme la plus simple est l’**entreprise individuelle** : il n’y a **pas** de nouvelle personne juridique."},{t:"warning",c:"Par le **principe d’unicité du patrimoine**, l’entrepreneur individuel répond des dettes de son activité sur **l’ensemble de son patrimoine personnel**. Pour le protéger, la loi prévoit la **déclaration d’insaisissabilité** et le **patrimoine d’affectation** (séparer les biens professionnels des biens personnels)."},{t:"p",c:"Autre solution : créer une **EURL** (entreprise unipersonnelle à responsabilité limitée). C’est une **société à associé unique** : une **personne morale** distincte est créée, ce qui **protège le patrimoine** du gérant."},{t:"example",h:"Léa hésite : entreprise individuelle ou EURL ?",c:`Léa ouvre un salon de coiffure et emprunte 40 000 €. 
→ En **entreprise individuelle**, par l’**unicité du patrimoine**, ses biens personnels (voiture, épargne) peuvent servir à payer les dettes en cas de faillite — sauf **déclaration d’insaisissabilité** ou **patrimoine d’affectation**. En **EURL**, une **personne morale** distincte est créée : sa responsabilité est en principe **limitée à ses apports**, ce qui protège mieux son patrimoine personnel.`}]},{h:"La société commerciale",blocks:[{t:"p",c:"La **société** naît d’un **contrat de société** (article **1832** du Code civil) : plusieurs associés **affectent à une entreprise commune des biens ou leur industrie en vue de partager le bénéfice** ou de profiter de l’économie qui en résulte. Trois éléments clés :"},{t:"list",c:["l’**apport** de chaque associé (en argent, en nature ou en industrie) ;","l’**affectio societatis** : la volonté commune de collaborer ;","la vocation à **partager les bénéfices** (au prorata des apports) et à **contribuer aux pertes**."]},{t:"p",c:"Généralement, la **responsabilité des associés est limitée à leurs apports**. Les décisions relèvent d’**organes de gestion courante** (dirigeants) ou d’**organes délibératifs** (assemblées). La **société coopérative (SCOP)** est une forme particulière, porteuse d’une **éthique coopérative** (économie sociale et solidaire)."}]},{h:"Le respect de la concurrence",blocks:[{t:"p",c:"La **libre concurrence** découle de la liberté du commerce et de l’industrie : produire et vendre librement, sans monopole. Elle est toutefois **encadrée** pour éviter les comportements déloyaux ou anti-concurrentiels."},{t:"p",c:"La **concurrence déloyale** engage la **responsabilité civile** de son auteur. La victime doit établir : un **fait générateur** (comportement déloyal : **parasitisme, dénigrement, imitation, désorganisation**), un **préjudice** (perte de clientèle, baisse de notoriété) et un **lien de causalité** — c’est l’**action en concurrence déloyale**."},{t:"p",c:"Certaines pratiques sont spécifiquement interdites : l’**entente** (accord faussant la concurrence) et l’**abus de position dominante**. L’**Autorité de la concurrence** veille au respect des règles en France ; au niveau européen, les **articles 101 et 102 du TFUE** s’appliquent."},{t:"example",h:"Le concurrent dénigré",c:`Un commerçant diffuse de fausses rumeurs affirmant que les produits d’un concurrent sont dangereux, et copie son enseigne pour semer la confusion. 
→ Ce sont des actes de **concurrence déloyale** (**dénigrement** et **imitation**). Le concurrent lésé engage une **action en concurrence déloyale** fondée sur la **responsabilité civile** : il doit prouver le **fait générateur** (le comportement déloyal), le **préjudice** (perte de clientèle) et le **lien de causalité**, pour obtenir réparation.`}]},{h:"Les partenariats contractuels",blocks:[{t:"p",c:"Une entreprise peut organiser son activité en contractant avec des **partenaires**, sans créer de lien de subordination :"},{t:"list",c:["le **contrat d’entreprise (sous-traitance)** : un entrepreneur confie tout ou partie de son activité à un autre entrepreneur ;","le **contrat de franchise** : un franchisé exploite le concept, la marque et le savoir-faire d’un franchiseur, en échange d’une redevance."]},{t:"tip",c:"Ces partenariats se distinguent du **contrat de travail** : il n’y a **pas de lien de subordination** entre les entreprises partenaires."}]}],resources:[{kind:"video",label:"Entreprise individuelle, EURL et société",note:"Vidéos — recherche YouTube",url:P("entreprise individuelle EURL société contrat de société apports affectio societatis droit terminale STMG")},{kind:"video",label:"Concurrence déloyale et partenariats (franchise, sous-traitance)",note:"Vidéos — recherche YouTube",url:P("concurrence déloyale entente abus position dominante franchise sous-traitance droit terminale STMG")}]},"eco-t6":{essentiel:["Fonctions de l’État (**Musgrave**) : **allocation · redistribution · stabilisation**.","Défaillances du marché : **externalités**, biens collectifs, asymétries d’information, monopole.","Politiques : **budgétaire** et **monétaire** (conjoncturelles), **structurelle** (long terme)."],intro:"Le marché ne règle pas tout : l’**État** intervient pour produire ce que le marché ne fournit pas, réduire les inégalités et stabiliser l’économie. Comprendre **pourquoi** et **comment** il agit est la base de ce thème.",cours:[{h:"Les trois fonctions de l’État (Musgrave)",blocks:[{t:"table",head:["Fonction","Objectif"],rows:[["Allocation","Produire des biens collectifs, corriger le marché"],["Redistribution","Réduire les inégalités (prélèvements et prestations)"],["Stabilisation","Agir sur la conjoncture (croissance, emploi, prix)"]]},{t:"figure",name:"etat-fonctions"}]},{h:"Pourquoi intervenir ? Les défaillances du marché",blocks:[{t:"p",c:"Le marché **défaille** dans plusieurs cas qui justifient l’intervention publique :"},{t:"list",c:["**Externalités** : effet d’une activité sur un tiers, non pris en compte par le prix (ex. la pollution).","**Biens collectifs** : biens non rivaux et non excluables (ex. l’éclairage public), que le marché ne produit pas spontanément.","**Asymétries d’information** entre acheteur et vendeur.","**Situations de monopole**."]}]},{h:"Comment intervenir ? Les politiques économiques",blocks:[{t:"list",c:["**Politique conjoncturelle** (agir à court terme) : **budgétaire** (dépenses et recettes de l’État) et **monétaire** (monnaie, taux d’intérêt).","**Politique structurelle** (transformer l’économie à long terme)."]},{t:"p",c:"Le **budget de l’État** repose sur les **dépenses publiques** et les **prélèvements obligatoires**. Un déficit répété nourrit la **dette publique**."}]}],resources:[{kind:"video",label:"Les fonctions de l’État (Musgrave)",note:"Vidéos — recherche YouTube",url:P("fonctions de l État allocation redistribution stabilisation Musgrave STMG")},{kind:"video",label:"Les défaillances du marché",note:"Vidéos — recherche YouTube",url:P("défaillances du marché externalités biens collectifs économie STMG")}]},"eco-t7":{essentiel:["**Population active = personnes en emploi + chômeurs** ; **taux de chômage = chômeurs / population active**.","Types de chômage : **conjoncturel**, **structurel**, **frictionnel**.","Piège : une baisse du taux de chômage peut venir de **chômeurs découragés** quittant la population active."],intro:"Le **chômage** est au cœur du débat économique. Pour en parler juste, il faut d’abord maîtriser le **vocabulaire** (population active, taux de chômage) et savoir **lire les chiffres** sans se tromper.",cours:[{h:"Le marché du travail",blocks:[{t:"p",c:"Sur le marché du travail se rencontrent l’**offre de travail** (les ménages qui cherchent un emploi) et la **demande de travail** (les entreprises qui embauchent). Leur rencontre détermine un **salaire d’équilibre**."}]},{h:"Les indicateurs à connaître",blocks:[{t:"formula",c:"Population active = personnes en emploi + chômeurs"},{t:"formula",c:"Taux d’activité = population active / population en âge de travailler"},{t:"formula",c:"Taux de chômage = chômeurs / population active"},{t:"example",h:"Lecture de données",c:`Population en âge de travailler = 40 M ; emploi = 24 M ; chômeurs = 3 M.
• Population active = 24 + 3 = **27 M**
• Taux d’activité = 27 / 40 = **67,5 %**
• Taux de chômage = 3 / 27 ≈ **11,1 %**`}]},{h:"Types de chômage et politiques de l’emploi",blocks:[{t:"list",c:["**Conjoncturel** : lié au ralentissement de l’activité.","**Structurel** : lié aux structures de l’économie (inadéquation compétences/emplois).","**Frictionnel** : lié au temps de passage d’un emploi à un autre."]},{t:"warning",c:"Une baisse du taux de chômage ne signifie pas toujours une amélioration : si des **chômeurs découragés** quittent la population active, le taux baisse **mécaniquement** sans qu’un seul emploi ait été créé. Il faut aussi regarder le **taux d’emploi**."}]}],resources:[{kind:"video",label:"Population active, taux de chômage",note:"Vidéos — recherche YouTube",url:P("population active taux chômage taux emploi calcul économie STMG")},{kind:"video",label:"Les types de chômage",note:"Vidéos — recherche YouTube",url:P("types de chômage conjoncturel structurel frictionnel économie STMG")}]},"eco-t8":{essentiel:["**Avantages comparatifs** (Ricardo) → spécialisation puis échange = richesse globale.","**Libre-échange** (ouverture) vs **protectionnisme** (droits de douane, barrières non tarifaires).","Le libre-échange fait des **perdants** ; régulation par l’**OMC**."],intro:"Pourquoi les pays échangent-ils ? Le **commerce international** repose sur la **spécialisation**, mais oppose partisans du **libre-échange** et du **protectionnisme**. Un classique de la question de réflexion.",cours:[{h:"Les fondements : les avantages comparatifs (Ricardo)",blocks:[{t:"p",c:"Selon **David Ricardo**, chaque pays a intérêt à se **spécialiser** dans la production pour laquelle il est **relativement le plus efficace** (son **avantage comparatif**), puis à échanger. Cette **division internationale du travail (DIT)** augmente la richesse globale."}]},{h:"Libre-échange ou protectionnisme ?",blocks:[{t:"table",head:["Libre-échange","Protectionnisme"],rows:[["Ouvrir les marchés, supprimer les barrières","Protéger la production nationale"],["Baisse des prix, marchés élargis, croissance","Droits de douane, quotas, barrières non tarifaires"],["Risque : perdants (industries non compétitives)","Risque : représailles, prix plus élevés"]]},{t:"warning",c:"Le libre-échange **crée de la richesse globale** mais **ne profite pas également à tous** : il fait des **perdants** (secteurs, régions, pays spécialisés dans des productions peu rémunératrices)."}]},{h:"La régulation du commerce mondial",blocks:[{t:"p",c:"Le commerce international est encadré par l’**OMC** (Organisation mondiale du commerce), des **accords commerciaux** et des **intégrations régionales** comme l’**Union européenne**. Les **firmes multinationales** et les **délocalisations** sont des acteurs majeurs de la mondialisation."}]}],resources:[{kind:"video",label:"Les avantages comparatifs (Ricardo)",note:"Vidéos — recherche YouTube",url:P("avantages comparatifs Ricardo spécialisation commerce international STMG")},{kind:"video",label:"Libre-échange et protectionnisme",note:"Vidéos — recherche YouTube",url:P("libre échange protectionnisme avantages limites économie STMG")}]},"eco-t9":{essentiel:["La croissance se mesure par le **PIB**, indicateur **limité** du bien-être.","**Développement durable** = concilier **économique + social + environnemental**.","Instruments : économie **circulaire**, **collaborative**, taxation, quotas. (Thème surtout utile au **grand oral**.)"],intro:"La **croissance** est-elle toujours souhaitable ? Ce thème confronte le PIB à ses **limites** et introduit le **développement durable**. Il n’est pas évalué à l’écrit mais alimente le **grand oral**.",cours:[{h:"La croissance et ses limites",blocks:[{t:"p",c:"La **croissance** est mesurée par l’évolution du **PIB**. Mais le PIB est un indicateur **limité du bien-être** : il n’intègre ni les **inégalités**, ni la dégradation de l’**environnement**, ni le travail non marchand."}]},{h:"Le développement durable",blocks:[{t:"p",c:"Le **développement durable** cherche à concilier **trois dimensions** : **économique**, **sociale** et **environnementale** — répondre aux besoins présents sans compromettre ceux des générations futures."},{t:"list",c:["**Soutenabilité faible** : le capital naturel peut être remplacé par du capital produit.","**Soutenabilité forte** : le **capital naturel** est irremplaçable et doit être préservé."]}]},{h:"Instruments et inégalités",blocks:[{t:"list",c:["**Économie circulaire** : réduire, réutiliser, recycler pour boucler les cycles de matières.","**Économie collaborative** : partage et mutualisation entre particuliers.","**Taxation** et **quotas** pour limiter les externalités négatives."]},{t:"p",c:"On distingue la **pauvreté absolue** (sous un seuil de subsistance) de la **pauvreté relative** (par rapport au niveau de vie médian d’un pays)."}]}],resources:[{kind:"video",label:"PIB, croissance et ses limites",note:"Vidéos — recherche YouTube",url:P("PIB croissance limites bien-être développement durable STMG")},{kind:"video",label:"Le développement durable",note:"Vidéos — recherche YouTube",url:P("développement durable soutenabilité économie circulaire STMG")}]},"math-c1":{intro:"En gestion, presque tout se mesure en **variations** : un chiffre d’affaires qui augmente, un prix qui baisse, un effectif qui évolue. Ce chapitre te donne les outils pour manier ces variations sans te tromper : **taux d’évolution**, **coefficient multiplicateur**, évolutions **successives** et **moyennes**.",cours:[{h:"Taux d’évolution et coefficient multiplicateur",blocks:[{t:"p",c:"Le **taux d’évolution** mesure une variation en pourcentage entre une valeur de départ et une valeur d’arrivée."},{t:"formula",c:"t = (V arrivée − V départ) / V départ · Coefficient multiplicateur : CM = 1 + t"},{t:"example",h:"Un CA qui progresse",c:`Le CA passe de 250 000 € à 280 000 €.
t = (280 000 − 250 000) / 250 000 = 0,12 = **+12 %**.
Le coefficient multiplicateur associé est CM = 1,12.`},{t:"tip",c:"Une **hausse** de t % ⇒ CM = 1 + t/100. Une **baisse** de t % ⇒ CM = 1 − t/100. (Ex. : −8 % ⇒ CM = 0,92.)"}]},{h:"Évolutions successives et taux moyen",blocks:[{t:"p",c:"Pour enchaîner plusieurs évolutions, on **multiplie** les coefficients (on n’additionne surtout pas les taux !)."},{t:"formula",c:"CM global = produit des CM · CM moyen = (CM global)^(1/n) · t moyen = CM moyen − 1"},{t:"example",h:"Deux années de suite",c:`+12 % puis +5 %.
CM global = 1,12 × 1,05 = 1,176 → **+17,6 %** au total.
Taux moyen annuel : CM = √1,176 ≈ 1,0845 → environ **+8,45 % par an**.`},{t:"warning",c:"Piège classique : +12 % puis +5 % ne fait **pas** +17 %. On multiplie les coefficients (1,12 × 1,05), on n’additionne pas les pourcentages."}]},{h:"Évolution réciproque et indice base 100",blocks:[{t:"list",c:["**Évolution réciproque** : pour « annuler » une évolution, on prend le coefficient inverse. CM réciproque = 1 / CM.","**Indice base 100** : Indice = (valeur / valeur de référence) × 100. Pratique pour comparer des évolutions."]}]}],resources:[{kind:"video",label:"Taux d’évolution et coefficient multiplicateur",note:"Vidéos — recherche YouTube",url:P("taux évolution coefficient multiplicateur terminale STMG maths")},{kind:"video",label:"Taux moyen et évolutions successives",note:"Vidéos — recherche YouTube",url:P("taux moyen évolutions successives coefficient multiplicateur STMG")}]},"math-c2":{intro:"Une **suite** est une liste de nombres qui se suivent selon une règle. En STMG, elles modélisent des évolutions : un capital qui grossit, une machine qui perd de la valeur. Deux modèles à distinguer absolument : **arithmétique** et **géométrique**.",cours:[{h:"Deux types de suites",blocks:[{t:"table",head:["","Arithmétique","Géométrique"],rows:[["On passe d’un terme à l’autre en…","ajoutant la raison r","multipliant par la raison q"],["Formule","u_n = u_0 + n × r","u_n = u_0 × q^n"],["Type de croissance","linéaire","exponentielle"]]}]},{h:"Reconnaître et calculer",blocks:[{t:"p",c:"Une évolution en **pourcentage constant** donne une suite **géométrique** : la raison est le coefficient multiplicateur."},{t:"example",h:"Une machine qui se déprécie",c:`Une machine de 20 000 € perd 8 % par an.
→ Suite géométrique de raison q = 1 − 0,08 = **0,92**, avec u_0 = 20 000.
u_n = 20 000 × 0,92^n.
Au bout de 3 ans : u_3 = 20 000 × 0,92³ ≈ **15 574 €**.`}]}],resources:[{kind:"video",label:"Suites arithmétiques et géométriques",note:"Vidéos — recherche YouTube",url:P("suites arithmétiques géométriques terminale STMG maths")}]},"math-c3":{intro:"La **dérivation** est l’outil pour étudier comment une fonction **varie** et trouver ses **maximums** (bénéfice maximal) ou **minimums** (coût minimal). C’est l’application phare des maths en gestion : l’**optimisation**.",cours:[{h:"Nombre dérivé et tangente",blocks:[{t:"p",c:"Le **nombre dérivé** f’(a) est le **coefficient directeur de la tangente** à la courbe au point d’abscisse a. Il indique la « pente » de la courbe en ce point."},{t:"formula",c:"Équation de la tangente en a : y = f’(a)(x − a) + f(a)"}]},{h:"Du signe de la dérivée aux variations",blocks:[{t:"list",c:["Si f’(x) > 0 sur un intervalle → f est **croissante**.","Si f’(x) < 0 → f est **décroissante**.","Un **extremum** (maximum ou minimum) apparaît là où f’ **s’annule en changeant de signe**."]},{t:"figure",name:"derivee"},{t:"example",h:"Maximiser un bénéfice",c:`f(x) = −x² + 40x − 100 (bénéfice pour x articles).
f’(x) = −2x + 40.
f’(x) = 0 ⇔ x = 20 ; f’ passe de + à − : c’est un **maximum**.
Bénéfice maximal : f(20) = −400 + 800 − 100 = **300 €** pour **20 articles**.`},{t:"tip",c:"Méthode d’optimisation : (1) calculer f’, (2) étudier son signe, (3) dresser le tableau de variation, (4) conclure sur le maximum/minimum."}]}],resources:[{kind:"video",label:"Dérivation et tangente",note:"Vidéos — recherche YouTube",url:P("dérivation nombre dérivé tangente terminale STMG")},{kind:"video",label:"Signe de la dérivée et variations",note:"Vidéos — recherche YouTube",url:P("signe dérivée tableau de variation optimisation STMG maths")}]},"math-c4":{intro:"Quand deux grandeurs semblent liées (le budget pub et les ventes, par exemple), on cherche une **droite** qui résume le nuage de points, pour ensuite **faire des prévisions**.",cours:[{h:"Nuage de points et ajustement",blocks:[{t:"p",c:"On représente les couples (x ; y) par un **nuage de points**. Son centre est le **point moyen G**, de coordonnées (moyenne des x ; moyenne des y)."},{t:"p",c:"La **méthode des moindres carrés** (à la calculatrice) donne la **droite d’ajustement** y = ax + b qui passe au plus près des points (et par G)."}]},{h:"Interpoler et extrapoler",blocks:[{t:"list",c:["**Interpoler** : estimer une valeur **à l’intérieur** de l’intervalle des données.","**Extrapoler** : prévoir une valeur **au-delà** des données connues (avec prudence : la tendance peut ne pas se poursuivre)."]}]}],resources:[{kind:"video",label:"Ajustement affine (moindres carrés)",note:"Vidéos — recherche YouTube",url:P("ajustement affine moindres carrés statistiques deux variables STMG")}]},"math-c5":{intro:"Les **probabilités conditionnelles** répondent à : « sachant qu’un événement s’est produit, quelle est la probabilité d’un autre ? ». L’outil visuel indispensable est l’**arbre pondéré**.",cours:[{h:"Probabilité conditionnelle et arbre pondéré",blocks:[{t:"formula",c:"P_A(B) = P(A ∩ B) / P(A)"},{t:"p",c:"Sur un **arbre pondéré** : la somme des branches issues d’un même nœud vaut **1**, et on **multiplie** les probabilités le long d’un chemin."},{t:"example",h:"Pièces défectueuses",c:`Machine A (60 %) : 2 % de défauts. Machine B (40 %) : 5 % de défauts.
P(défectueuse) = 0,60 × 0,02 + 0,40 × 0,05 = 0,012 + 0,020 = **0,032**.
Sachant qu’une pièce est défectueuse, vient-elle de B ?
P = 0,020 / 0,032 = **0,625** (soit 62,5 %).`}]},{h:"Indépendance",blocks:[{t:"p",c:"Deux événements A et B sont **indépendants** si la réalisation de l’un ne change pas la probabilité de l’autre :"},{t:"formula",c:"A et B indépendants ⇔ P(A ∩ B) = P(A) × P(B)"}]}],resources:[{kind:"video",label:"Probabilités conditionnelles et arbres",note:"Vidéos — recherche YouTube",url:P("probabilités conditionnelles arbre pondéré terminale STMG")}]},"math-c6":{intro:"La **loi binomiale** modélise une expérience répétée un certain nombre de fois, où l’on compte les **succès** (ex. : nombre de pièces défectueuses sur 20). C’est un incontournable, à maîtriser à la calculatrice.",cours:[{h:"De l’épreuve de Bernoulli à la loi binomiale",blocks:[{t:"list",c:["Une **épreuve de Bernoulli** n’a que deux issues : **succès** (probabilité p) ou **échec** (1 − p).","Répéter n fois cette épreuve, de façon **identique et indépendante**, et compter les succès, donne la **loi binomiale B(n ; p)**."]},{t:"formula",c:"Espérance : E(X) = n × p"},{t:"example",h:"Espérance",c:"X suit B(20 ; 0,3). En moyenne, on attend E(X) = 20 × 0,3 = **6** succès."}]}],resources:[{kind:"video",label:"La loi binomiale (calculatrice)",note:"Vidéos — recherche YouTube",url:P("loi binomiale Bernoulli espérance calculatrice terminale STMG")}]},"math-c7":{intro:"La **loi normale** décrit une multitude de phénomènes « en cloche » (tailles, mesures, erreurs). Associée à l’**estimation**, elle permet d’interpréter les sondages et le contrôle qualité.",cours:[{h:"La courbe en cloche",blocks:[{t:"p",c:"La **loi normale** a une courbe **en cloche**, **symétrique** autour de la moyenne **μ**. L’**écart-type σ** règle la **dispersion** : plus σ est grand, plus la cloche est étalée."}]},{h:"Estimation et intervalle de confiance",blocks:[{t:"p",c:"À partir d’un échantillon, l’**intervalle de confiance** encadre une **proportion** inconnue avec un certain **niveau** (souvent ~95 %). Applications : **sondages**, contrôle de **qualité**."},{t:"warning",c:"Un intervalle de confiance ne donne pas une valeur exacte : il fournit une **fourchette** avec un niveau de confiance."}]}],resources:[{kind:"video",label:"La loi normale",note:"Vidéos — recherche YouTube",url:P("loi normale courbe cloche moyenne écart type terminale STMG")},{kind:"video",label:"Intervalle de confiance",note:"Vidéos — recherche YouTube",url:P("intervalle de confiance estimation proportion STMG maths")}]},"philo-notions":{intro:"La philosophie ne se récite pas : elle se **pense**. On n’apprend pas des définitions par cœur, on apprend à **problématiser** — à voir qu’une question évidente cache un vrai problème. Ce chapitre présente les **7 notions** du programme et les **repères** qui servent à raisonner.",cours:[{h:"Les 7 notions et leurs problématiques",blocks:[{t:"p",c:"Chaque notion s’aborde par des **questions** (des problématiques), pas par une définition figée."},{t:"list",c:["**L’art** : imitation ou création ? À quoi sert l’art ? Le beau est-il subjectif ?","**La justice** : se réduit-elle à la loi ? Peut-il être juste de désobéir ?","**La liberté** : sommes-nous vraiment libres ? Liberté et déterminisme.","**La nature** : l’homme en fait-il partie ? Faut-il la respecter ?","**La religion** : foi et raison s’opposent-elles ?","**La technique** : nous libère-t-elle ou nous asservit-elle ?","**La vérité** : peut-on tout démontrer ? Vérité et opinion."]}]},{h:"Les repères : des distinctions pour raisonner",blocks:[{t:"p",c:"Les **repères** sont des couples de concepts qui aiguisent l’analyse. Les connaître permet de nuancer un devoir."},{t:"table",head:["Repère","Distinction"],rows:[["Légal / Légitime","Conforme à la loi / conforme à la justice"],["Objectif / Subjectif","Indépendant de moi / propre à chacun"],["Croire / Savoir","Tenir pour vrai sans preuve / avec preuve"],["En théorie / En pratique","Dans l’idée / dans les faits"]]},{t:"tip",c:"Une loi peut être **légale** sans être jugée **légitime** : ce simple écart nourrit à lui seul une dissertation sur la justice."}]}],resources:[{kind:"video",label:"Méthode : problématiser en philo",note:"Vidéos — recherche YouTube",url:P("philosophie méthode problématiser notion terminale technologique")}]},"philo-methode":{intro:"Au bac, on choisit entre une **dissertation** et une **explication de texte**. Dans les deux cas, la note récompense la **méthode** et la capacité à **argumenter**, pas la récitation. Voici comment structurer un devoir.",cours:[{h:"La dissertation, étape par étape",blocks:[{t:"list",c:["**Analyser** le sujet et **définir** les termes.","**Problématiser** : dégager le paradoxe, le vrai problème.","Construire un **plan progressif** (souvent thèse / antithèse / dépassement).","**Argumenter** avec notions, repères, auteurs et exemples concrets.","**Conclure** en répondant clairement au problème."]},{t:"example",h:"Introduction rédigée (extrait)",c:`« La technique nous éloigne-t-elle de la nature ? »
On oppose spontanément technique (les outils par lesquels l’homme agit) et nature (ce qui existe sans lui). Mais la technique n’est-elle pas, justement, la manière proprement **humaine** d’habiter la nature ? Le vrai problème n’est peut-être pas la distance, mais le **rapport** que la technique instaure avec la nature.`}]},{h:"L’explication de texte et les auteurs",blocks:[{t:"p",c:"Pour l’**explication de texte** : dégager la **thèse**, suivre les **mouvements** du texte, expliquer le raisonnement, puis en discuter la portée."},{t:"table",head:["Période","Auteurs"],rows:[["Antiquité / Moyen Âge","Platon, Aristote, Épicure"],["Moderne","Descartes, Pascal, Rousseau, Kant"],["Contemporaine","Nietzsche, Freud, Bergson, Arendt, Sartre, Beauvoir, Foucault"]]}]}],resources:[{kind:"video",label:"Méthode de la dissertation de philo",note:"Vidéos — recherche YouTube",url:P("méthode dissertation philosophie bac technologique introduction plan")},{kind:"video",label:"Méthode de l’explication de texte",note:"Vidéos — recherche YouTube",url:P("méthode explication de texte philosophie bac")}]},"hg-h1":{intro:"Entre 1939 et 1945, le monde bascule dans une guerre d’un genre nouveau : une **guerre d’anéantissement** qui vise les populations elles-mêmes, et qui culmine avec un projet d’extermination, la **Shoah**. Comprendre ce basculement est essentiel.",cours:[{h:"Des régimes totalitaires à la guerre",blocks:[{t:"p",c:"Dans l’entre-deux-guerres s’imposent des **régimes totalitaires** (nazisme, stalinisme) qui contrôlent tous les aspects de la société : parti unique, propagande, terreur, culte du chef."},{t:"p",c:"La **Seconde Guerre mondiale** (1939-1945) oppose l’Axe aux Alliés et devient un conflit **total** et **mondial**."}]},{h:"Une guerre d’anéantissement",blocks:[{t:"p",c:"Elle se distingue par une **violence de masse** qui ne vise plus seulement les armées, mais les **civils** : bombardements de villes, famines organisées, exactions. Le front et l’arrière se confondent."},{t:"p",c:"À l’Est notamment, la guerre est menée comme une guerre d’**extermination**. Elle s’achève avec l’usage de l’**arme nucléaire** (Hiroshima, Nagasaki, 1945)."}]},{h:"La Shoah, un génocide planifié",blocks:[{t:"p",c:"La **Shoah** est le **génocide des Juifs** (et des Tsiganes) : une volonté de destruction **totale** d’un groupe, **planifiée et industrialisée** (ghettos, Einsatzgruppen, camps d’extermination)."},{t:"warning",c:"Un génocide n’est pas une « bavure » de guerre : c’est un projet **délibéré et organisé** d’extermination d’un groupe humain."}]},{h:"La France dans la guerre",blocks:[{t:"p",c:"Après la défaite de 1940, le **régime de Vichy** collabore avec l’occupant, tandis que la **Résistance** s’organise jusqu’à la **Libération**. Bilan du conflit : sans précédent (~50-60 millions de morts)."}]}],resources:[{kind:"video",label:"Totalitarismes et Seconde Guerre mondiale",note:"Vidéos — recherche YouTube",url:P("totalitarismes seconde guerre mondiale guerre anéantissement terminale")},{kind:"video",label:"La Shoah",note:"Vidéos — recherche YouTube",url:P("Shoah génocide juifs seconde guerre mondiale histoire terminale")}]},"hg-h2":{intro:"De 1945 à nos jours, l’ordre mondial change deux fois : d’abord figé par la **Guerre froide** (deux blocs), il s’ouvre avec la **décolonisation** puis bascule, après 1991, vers un monde **multipolaire**.",cours:[{h:"La Guerre froide : un monde bipolaire (1947-1991)",blocks:[{t:"p",c:"Après 1945, les deux vainqueurs — les **États-Unis** et l’**URSS** — deviennent rivaux. Le monde se divise en **deux blocs** aux idéologies opposées (capitalisme/démocratie libérale contre communisme). Ils ne s’affrontent **jamais directement** (risque nucléaire) mais **indirectement** : course aux armements, propagande, espionnage, guerres « par procuration » (Corée, Vietnam)."},{t:"p",c:"Chaque bloc s’organise militairement : l’**OTAN** (1949) à l’Ouest, le **pacte de Varsovie** (1955) à l’Est. La menace de destruction mutuelle instaure un « **équilibre de la terreur** » (dissuasion nucléaire)."},{t:"table",head:["Date","Événement clé"],rows:[["1947","Début de la Guerre froide (doctrine Truman, plan Marshall)"],["1948-1949","Blocus de Berlin ; l’Allemagne est divisée (RFA / RDA)"],["1961","Construction du mur de Berlin"],["1962","Crise des missiles de Cuba (point de tension maximal)"],["1989","Chute du mur de Berlin"],["1991","Éclatement de l’URSS : fin de la Guerre froide"]]}]},{h:"La décolonisation",blocks:[{t:"p",c:"En parallèle, les anciennes **colonies** accèdent à l’**indépendance** : c’est la **décolonisation** (années 1945-1960 surtout). Elle est parfois pacifique (Inde, 1947), parfois violente (guerre d’Algérie, 1954-1962)."},{t:"p",c:"De nombreux pays nouvellement indépendants refusent de choisir un camp : c’est le mouvement des **non-alignés** (conférence de Bandung, 1955), à l’origine de l’idée de « **tiers-monde** »."}]},{h:"Vers un monde multipolaire",blocks:[{t:"p",c:"La disparition de l’URSS en **1991** met fin au monde **bipolaire**. Les États-Unis restent un temps la seule superpuissance, mais de **nouvelles puissances** émergent (Chine, Inde, Union européenne, etc.) : on parle d’un monde **multipolaire**."},{t:"tip",c:"Repères à mémoriser : **1947** (début) et **1991** (fin) de la Guerre froide ; **1962** (Cuba) et **1989** (chute du mur) comme tournants."}]}],resources:[{kind:"video",label:"La Guerre froide expliquée",note:"Vidéos — recherche YouTube",url:P("guerre froide monde bipolaire multipolaire terminale histoire")},{kind:"video",label:"La décolonisation",note:"Vidéos — recherche YouTube",url:P("décolonisation Inde Algérie tiers monde terminale histoire")}]},"hg-h3":{intro:"Depuis 1945, la France cherche une **nouvelle place dans le monde** : elle se reconstruit, participe à la **construction européenne** et affirme un rôle international.",cours:[{h:"La reconstruction et les Trente Glorieuses",blocks:[{t:"p",c:"Au sortir de la guerre, la France se **reconstruit** (aidée notamment par le **plan Marshall**, 1948) et connaît une longue période de forte croissance, les **Trente Glorieuses** (≈ 1945-1975) : modernisation, plein emploi, société de consommation."},{t:"p",c:"Sur le plan politique, la **IVe République** (1946) laisse place à la **Ve République** (**1958**, retour du général de Gaulle), qui renforce le pouvoir présidentiel."}]},{h:"La construction européenne",blocks:[{t:"p",c:"La France est un **moteur de la construction européenne**, pensée pour garantir la paix et la prospérité."},{t:"table",head:["Date","Étape"],rows:[["1957","Traité de Rome : création de la CEE"],["1992","Traité de Maastricht : naissance de l’Union européenne"],["2002","Mise en circulation de l’euro"]]}]},{h:"Une puissance à rayonnement mondial",blocks:[{t:"p",c:"La France affirme un **rôle international** : membre permanent du **Conseil de sécurité de l’ONU**, dotée de l’**arme nucléaire** (depuis 1960) et d’une importante **influence culturelle** (francophonie). C’est le **thème conclusif** de la partie histoire."},{t:"tip",c:"Repères : **1958** (Ve République), **1957** (traité de Rome), **2002** (euro)."}]}],resources:[{kind:"video",label:"La France depuis 1945",note:"Vidéos — recherche YouTube",url:P("France depuis 1945 reconstruction Trente Glorieuses Ve République terminale")},{kind:"video",label:"La construction européenne",note:"Vidéos — recherche YouTube",url:P("construction européenne traité de Rome Maastricht euro terminale")}]},"hg-g1":{intro:"Les **mers et océans** sont le grand théâtre de la mondialisation : par eux transite l’essentiel des marchandises, mais ils concentrent aussi des **ressources** et des **tensions**.",cours:[{h:"Le support des échanges mondiaux",blocks:[{t:"p",c:"Environ **80 % du commerce mondial** transite par voie **maritime**. La **conteneurisation** a massifié les échanges ; de grandes **routes** (Suez, Panama, Malacca) et de puissantes **façades maritimes** structurent le commerce. C’est la **maritimisation** des économies."}]},{h:"Des espaces d’enjeux et de tensions",blocks:[{t:"list",c:["**Ressources** : halieutiques (pêche), énergétiques, minérales.","**Câbles sous-marins** : ils font transiter les **données** mondiales.","**Tensions** : piraterie, rivalités géopolitiques (mer de Chine méridionale).","**Enjeux environnementaux** : pollution, surpêche."]}]}],resources:[{kind:"video",label:"Mers et océans dans la mondialisation",note:"Vidéos — recherche YouTube",url:P("mers océans mondialisation maritimisation terminale géographie")}]},"hg-g2":{intro:"La mondialisation n’intègre pas les territoires de la même façon : certains concentrent la richesse (**métropolisation**), d’autres restent en **marge**.",cours:[{h:"La métropolisation et les aires de puissance",blocks:[{t:"p",c:"La **métropolisation** est la concentration des hommes, des activités et des pouvoirs (économique, politique, culturel) dans les grandes **métropoles**. Ces villes, connectées entre elles, commandent l’économie mondiale et forment des **aires de puissance** (Amérique du Nord, Europe, Asie de l’Est)."},{t:"p",c:"Ces métropoles concentrent les **fonctions de commandement** : sièges sociaux, bourses, universités, aéroports internationaux (les « hubs »)."}]},{h:"Des territoires inégalement intégrés",blocks:[{t:"p",c:"La mondialisation crée des **gagnants** et des **perdants**. À l’opposé des métropoles, des **territoires en marge** (espaces ruraux isolés, régions industrielles en déclin, pays les moins avancés) restent faiblement connectés aux flux mondiaux."},{t:"p",c:"Différents **acteurs** façonnent ces inégalités : les **États**, les **firmes multinationales (FMN)** qui choisissent où s’implanter, et les **organisations internationales**."},{t:"tip",c:"Idée clé : la mondialisation **hiérarchise** les territoires ; l’intégration est une question de **degré**, du cœur (métropoles) aux marges."}]}],resources:[{kind:"video",label:"Territoires et mondialisation",note:"Vidéos — recherche YouTube",url:P("territoires inégalement intégrés mondialisation métropolisation terminale")}]},"hg-g3":{intro:"Dernier thème : la **France** et ses régions dans l’**Union européenne** et la mondialisation — un territoire aux **atouts** réels mais aux **contrastes** marqués.",cours:[{h:"Les atouts et les contrastes du territoire français",blocks:[{t:"p",c:"La France dispose de nombreux **atouts** : une **position** de carrefour en Europe, de grandes **métropoles** (Paris, ville mondiale), des **façades maritimes**, un vaste domaine grâce à ses territoires **ultramarins**, de bons réseaux de transport."},{t:"p",c:"Mais le territoire est **contrasté** : **inégalités régionales**, opposition entre métropoles dynamiques et espaces ruraux ou industriels en difficulté."}]},{h:"Le rayonnement de la France dans l’UE et le monde",blocks:[{t:"p",c:"Intégrée à l’**Union européenne** et à la mondialisation, la France **rayonne** sur les plans économique, scientifique et culturel."},{t:"example",h:"Kourou",c:"Le centre spatial de **Kourou** (Guyane) illustre le rayonnement **scientifique et technologique** de la France, au service de l’Europe spatiale — un atout majeur situé dans un territoire ultramarin."}]}],resources:[{kind:"video",label:"La France dans l’UE et la mondialisation",note:"Vidéos — recherche YouTube",url:P("France UE mondialisation régions rayonnement terminale géographie")}]},"lng-en-gram":{intro:"En anglais, quelques **temps** et structures reviennent sans cesse. Bien les distinguer (surtout **present perfect** vs **preterit**) fait la différence à l’écrit comme à l’oral.",cours:[{h:"Les temps : present perfect vs preterit",blocks:[{t:"table",head:["Temps","Emploi","Exemple"],rows:[["Present perfect (have/has + PP)","Lien passé-présent, bilan, expérience","I **have visited** London."],["Preterit","Action passée **datée** et terminée","We **went** there in 2019."],["Past perfect (had + PP)","Antériorité dans le passé","She **had left** before I arrived."]]},{t:"tip",c:"Le present perfect va souvent avec *for*, *since*, *ever*, *already*, *yet*. Une date précise (*yesterday*, *in 2019*) impose le **preterit**."}]},{h:"Modaux, conditionnels et passif",blocks:[{t:"list",c:["**Modaux** (+ base verbale) : *can/could*, *may/might*, *must*, *have to*, *should*, *would*.","**Conditionnels** : Type 1 (réel) *If + present, will* ; Type 2 (irréel présent) *If + preterit, would* ; Type 3 (irréel passé) *If + past perfect, would have + PP*.","**Passif** : *be* (au temps voulu) + participe passé — « The report **was written** by the manager. »"]},{t:"example",h:"Discours rapporté",c:`« I will call you tomorrow », he said.
→ He said he **would** call me **the following day** (recul d’un temps).`}]}],resources:[{kind:"video",label:"Present perfect vs preterit",note:"Vidéos — recherche YouTube",url:P("present perfect vs preterit anglais explication lycée")},{kind:"video",label:"Les conditionnels en anglais",note:"Vidéos — recherche YouTube",url:P("conditionnels anglais if type 1 2 3 lycée")}]},"lng-en-voc":{intro:"Le vocabulaire s’organise par **axes culturels** et, en STMG, par le lexique du **management** (utile aussi pour l’ETLV). Le mémoriser régulièrement, par petits blocs, est plus efficace qu’une longue liste.",cours:[{h:"Vocabulaire du management (ETLV)",blocks:[{t:"table",head:["Anglais","Français"],rows:[["turnover","chiffre d'affaires"],["balance sheet","bilan"],["cash flow","trésorerie"],["break-even point","seuil de rentabilité"],["shareholders / stakeholders","actionnaires / parties prenantes"],["CSR","RSE"]]}]},{h:"Vocabulaire par axes",blocks:[{t:"list",c:["*Identités et échanges* : migration, border, diversity, equality.","*Innovations et responsabilité* : technology, data, privacy, sustainability, ethics.","*Citoyenneté et mondes virtuels* : social media, fake news, surveillance."]},{t:"tip",c:"Fais une **fiche par axe** et révise-la en flashcards : 10-15 min par jour valent mieux qu’une longue liste une fois par mois."}]}],resources:[{kind:"video",label:"Vocabulaire du management (anglais)",note:"Vidéos — recherche YouTube",url:P("anglais vocabulaire management entreprise ETLV STMG")}]},"lng-es-gram":{intro:"En espagnol, deux difficultés reviennent tout le temps : le choix entre **ser** et **estar**, et entre **indefinido** et **imperfecto**. Les maîtriser change tout.",cours:[{h:"Ser ou Estar ?",blocks:[{t:"table",head:["SER","ESTAR"],rows:[["Caractéristique permanente, identité","État, situation temporaire"],["Heure, origine, profession","Lieu"],["*Soy* estudiante. / *Es* las tres.","*Estoy* cansado. / El libro *está* en la mesa."]]}]},{h:"Les passés : indefinido ou imperfecto ?",blocks:[{t:"p",c:"**Règle d’or** : *indefinido* = action **précise et terminée** (datée) ; *imperfecto* = **décor, habitude, arrière-plan**."},{t:"example",h:"Les deux ensemble",c:`Cuando **era** niño (décor → imperfecto), **jugaba** al fútbol todos los días (habitude → imperfecto).
