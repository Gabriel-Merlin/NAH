décide quoi et combien produire pour dégager un **profit**."}]},{h:"Les agents économiques",blocks:[{t:"table",head:["Agent","Rôle principal"],rows:[["Ménages","Consomment, fournissent du travail"],["Entreprises","Produisent des biens et services"],["Institutions financières (banques)","Financent l’économie"],["Administrations publiques","Services non marchands, redistribution"],["Reste du monde","Échanges avec l’étranger"]]}]}],essentiel:["La **rareté** des ressources oblige à faire des **choix** ; tout choix a un **coût**.","**Bien** (matériel) vs **service** (immatériel) ; l’**utilité** du consommateur est **décroissante**.","Agents : **ménages, entreprises, institutions financières, administrations, reste du monde**."],resources:[{kind:"video",label:"Les grandes questions économiques",note:"Vidéos — recherche YouTube",url:M("grandes questions économiques rareté agents économiques première STMG")}],games:[{id:"p1-eco-t1-qcm",type:"qcm",title:"QCM — Grandes questions",icon:"❓",questions:[{q:"Le problème économique de base vient de ce que les besoins sont illimités et les ressources…",choices:["rares","infinies","gratuites","interdites"],answer:0,explain:"La rareté oblige à faire des choix."},{q:"L’utilité procurée par la consommation est…",choices:["décroissante","toujours croissante","constante","nulle"],answer:0,explain:"Chaque unité supplémentaire procure moins de satisfaction."},{q:"Les ménages, dans le circuit économique…",choices:["consomment et fournissent du travail","produisent tous les biens","votent les lois","fixent les taux"],answer:0,explain:"Rôle des ménages : consommation et offre de travail."},{q:"Un service se distingue d’un bien car il est…",choices:["immatériel","toujours gratuit","toujours importé","stockable"],answer:0,explain:"Le service est immatériel, le bien est matériel."}]},{id:"p1-eco-t1-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Tout choix économique implique un coût (renoncement).",answer:!0,explain:"Vrai : choisir, c’est renoncer."},{statement:"Les banques sont des agents qui financent l’économie.",answer:!0,explain:"Vrai : ce sont les institutions financières."},{statement:"L’utilité d’un bien augmente à chaque unité consommée.",answer:!1,explain:"Faux : l’utilité est décroissante."}]},{id:"p1-eco-t1-flash",type:"flashcard",title:"Flashcards — Bases",icon:"🃏",cards:[{front:"Rareté",back:"Ressources limitées face à des besoins illimités."},{front:"Coût (d’un choix)",back:"Ce à quoi on renonce en choisissant."},{front:"Utilité décroissante",back:"Chaque unité supplémentaire procure moins de satisfaction."},{front:"Agents économiques",back:"Ménages, entreprises, banques, administrations, reste du monde."}]}]},{id:"p1-eco-t2",name:"Thème 2 — Comment crée-t-on des richesses et comment les mesure-t-on ?",short:"Créer & mesurer la richesse",keywords:"production valeur ajoutée consommations intermédiaires PIB croissance limites facteurs travail capital productivité",intro:"Produire, c’est créer des biens et services. Pour mesurer la richesse **réellement créée**, on utilise la **valeur ajoutée**, puis le **PIB**.",cours:[{h:"La valeur ajoutée",blocks:[{t:"formula",c:"Valeur ajoutée = valeur de la production − consommations intermédiaires"},{t:"p",c:"Les **consommations intermédiaires** sont les biens détruits ou transformés dans la production (matières, énergie)."},{t:"example",h:"Exemple",c:"Un menuisier vend 100 € de meubles en utilisant 30 € de bois → VA = 70 €. La VA rémunère le travail (salaires), le capital (intérêts, profits) et l’État (impôts)."}]},{h:"Le PIB et la croissance",blocks:[{t:"p",c:"Le **PIB** (Produit Intérieur Brut) est la **somme des valeurs ajoutées** produites sur un territoire pendant un an. La **croissance** est l’augmentation du PIB dans le temps."},{t:"warning",c:"Le PIB a des **limites** : il ne mesure ni le **bien-être**, ni les **inégalités**, ni les dégâts **environnementaux**, ni le travail non rémunéré (bénévolat, tâches domestiques)."}]},{h:"Les facteurs de production",blocks:[{t:"p",c:"On combine deux facteurs : le **travail** (main-d’œuvre) et le **capital** (machines, bâtiments). La **productivité** mesure l’efficacité de la production : gagner en productivité permet de produire plus avec autant, source de croissance."}]}],essentiel:["**Valeur ajoutée = production − consommations intermédiaires** ; elle rémunère travail, capital, État.","**PIB = somme des valeurs ajoutées** d’un territoire ; la **croissance** = hausse du PIB.","Le PIB est **limité** (ni bien-être, ni inégalités, ni environnement).","Facteurs : **travail** + **capital** ; la **productivité** est source de croissance."],resources:[{kind:"video",label:"Valeur ajoutée, PIB, croissance",note:"Vidéos — recherche YouTube",url:M("valeur ajoutée PIB croissance facteurs de production première STMG économie")}],games:[{id:"p1-eco-t2-qcm",type:"qcm",title:"QCM — Créer et mesurer la richesse",icon:"❓",questions:[{q:"La valeur ajoutée se calcule…",choices:["production − consommations intermédiaires","production + impôts","salaires + profit","CA − TVA"],answer:0,explain:"VA = valeur de la production − consommations intermédiaires."},{q:"Une boulangerie produit 300 000 € en consommant 90 000 €. Sa VA est…",choices:["210 000 €","390 000 €","90 000 €","300 000 €"],answer:0,explain:"VA = 300 000 − 90 000 = 210 000 €."},{q:"Le PIB est…",choices:["la somme des valeurs ajoutées d’un territoire sur un an","le total des salaires","le montant des impôts","le chiffre d’affaires mondial"],answer:0,explain:"Le PIB agrège les VA produites sur un territoire."},{q:"Une limite du PIB est qu’il ne mesure pas…",choices:["le bien-être ni les inégalités","la production","la croissance","les échanges"],answer:0,explain:"Il ignore bien-être, inégalités, environnement, travail non rémunéré."},{q:"Les deux facteurs de production sont…",choices:["le travail et le capital","l’offre et la demande","le prix et la quantité","l’actif et le passif"],answer:0,explain:"On combine travail (main-d’œuvre) et capital (équipements)."}]},{id:"p1-eco-t2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le PIB est la somme des valeurs ajoutées.",answer:!0,explain:"Vrai, sur un territoire et une année."},{statement:"Le PIB mesure parfaitement le bien-être.",answer:!1,explain:"Faux : c’est un indicateur limité."},{statement:"Gagner en productivité peut être source de croissance.",answer:!0,explain:"Vrai : produire plus avec autant de facteurs."}]},{id:"p1-eco-t2-flash",type:"flashcard",title:"Flashcards — Richesse",icon:"🃏",cards:[{front:"Valeur ajoutée",back:"Production − consommations intermédiaires."},{front:"PIB",back:"Somme des valeurs ajoutées d’un territoire sur un an."},{front:"Limites du PIB",back:"N’intègre ni bien-être, ni inégalités, ni environnement."},{front:"Productivité",back:"Efficacité de la production (source de croissance)."}]}]},{id:"p1-eco-t3",name:"Thème 3 — Comment répartir les revenus et la richesse ?",short:"Répartition des revenus",keywords:"répartition primaire revenus travail capital mixtes redistribution prélèvements prestations revenu disponible consommation épargne taux d’épargne pouvoir d’achat patrimoine",intro:"La richesse créée (la VA) est **répartie**, d’abord entre ceux qui ont produit, puis **corrigée** par l’État pour réduire les inégalités.",cours:[{h:"Répartition primaire et redistribution",blocks:[{t:"p",c:"La **répartition primaire** partage la VA entre les **revenus primaires** : les **revenus du travail** (salaires), les **revenus du capital** (intérêts, loyers, dividendes) et les **revenus mixtes** (indépendants, qui rémunèrent à la fois travail et capital)."},{t:"p",c:"L’État corrige ensuite par la **redistribution** : il opère des **prélèvements obligatoires** (impôts, cotisations sociales) et verse des **revenus de transfert** (prestations : allocations, retraites, aides sociales). On obtient alors le **revenu disponible** des ménages (ce qui reste pour consommer ou épargner)."},{t:"formula",c:"Revenu disponible = Revenus primaires − Prélèvements obligatoires + Revenus de transfert"}]},{h:"Consommer ou épargner",blocks:[{t:"p",c:"Avec son revenu disponible, le ménage arbitre entre **consommer** (dépenser maintenant) et **épargner** (mettre de côté)."},{t:"formula",c:"Taux d’épargne = épargne / revenu disponible"},{t:"example",h:"Exemple",c:"Revenu disponible 2 500 €, consommation 2 100 € → épargne = 400 € → taux d’épargne = 400/2 500 = **16 %**."},{t:"p",c:"Notions liées : le **pouvoir d’achat** (ce que le revenu permet réellement d’acheter compte tenu des prix) et le **patrimoine** (accumulation de l’épargne : logement, placements)."}]}],essentiel:["Répartition **primaire** : **revenus primaires** = travail + capital + mixtes.","**Revenu disponible = revenus primaires − prélèvements obligatoires + revenus de transfert**.","**Taux d’épargne = épargne / revenu disponible** ; notions de **pouvoir d’achat** et de **patrimoine**."],resources:[{kind:"video",label:"Répartition et redistribution des revenus",note:"Vidéos — recherche YouTube",url:M("répartition primaire redistribution revenu disponible taux épargne première STMG")}],games:[{id:"p1-eco-t3-qcm",type:"qcm",title:"QCM — Répartition des revenus",icon:"❓",questions:[{q:"Les salaires sont des revenus…",choices:["du travail","du capital","mixtes","de transfert"],answer:0,explain:"Travail = salaires ; capital = intérêts, loyers, dividendes ; mixtes = indépendants."},{q:"La redistribution consiste à…",choices:["prélever des prélèvements obligatoires et verser des revenus de transfert","produire des biens","fixer les prix","créer de la monnaie"],answer:0,explain:"Elle corrige la répartition primaire pour réduire les inégalités."},{q:"La formule du revenu disponible est…",choices:["revenus primaires − prélèvements obligatoires + revenus de transfert","revenus primaires + prélèvements obligatoires","salaires − TVA","consommation + épargne − impôts"],answer:0,explain:"Revenu disponible = revenus primaires − prélèvements obligatoires (impôts, cotisations) + revenus de transfert (prestations)."},{q:"Revenu disponible 2 500 €, consommation 2 100 €. Taux d’épargne ?",choices:["16 %","84 %","40 %","4 %"],answer:0,explain:"Épargne = 400 ; 400/2 500 = 0,16 = 16 %."}]},{id:"p1-eco-t3-tri",type:"tri",title:"Tri — Type de revenu",icon:"🗂️",instruction:"Classe chaque revenu.",categories:[{id:"trav",label:"Revenu du travail"},{id:"cap",label:"Revenu du capital"}],items:[{text:"Un salaire",cat:"trav"},{text:"Un loyer perçu",cat:"cap"},{text:"Des dividendes",cat:"cap"},{text:"Un traitement de fonctionnaire",cat:"trav"},{text:"Des intérêts d’un placement",cat:"cap"}]},{id:"p1-eco-t3-flash",type:"flashcard",title:"Flashcards — Revenus",icon:"🃏",cards:[{front:"Répartition primaire",back:"Partage de la VA en revenus primaires : travail, capital, mixtes."},{front:"Redistribution",back:"Prélèvements obligatoires + revenus de transfert pour réduire les inégalités."},{front:"Revenu disponible",back:"Revenus primaires − prélèvements obligatoires + revenus de transfert."},{front:"Pouvoir d’achat",back:"Ce que le revenu permet réellement d’acheter."}]}]},{id:"p1-eco-t4",name:"Thème 4 — Comment les agents économiques se financent-ils ?",short:"Le financement",keywords:"besoin capacité de financement direct indirect marché financier actions obligations banque crédit banque centrale taux directeurs",intro:"Certains agents dépensent plus qu’ils ne gagnent (**besoin de financement**), d’autres épargnent (**capacité de financement**). Le système financier met les deux en relation.",cours:[{h:"Deux modes de financement",blocks:[{t:"table",head:["Financement direct (désintermédié)","Financement indirect (intermédié)"],rows:[["Sur le marché financier","Auprès d’une banque"],["Émission de titres","Octroi d’un crédit"],["Actions (propriété) et obligations (dette)","Emprunt remboursé avec intérêts"]]},{t:"p",c:"Dans le financement **direct**, l’agent obtient des fonds **directement** des épargnants (marché financier). Dans le financement **indirect**, il passe par un **intermédiaire**, la **banque**."}]},{h:"Le rôle des banques",blocks:[{t:"p",c:"Les **banques** financent l’économie par le **crédit** et peuvent **créer de la monnaie**. La **banque centrale** (la **BCE** pour la zone euro) régule tout cela par ses **taux directeurs** : en baissant les taux, elle rend le crédit moins cher et stimule l’économie ; en les augmentant, elle freine l’inflation."}]}],essentiel:["**Besoin** de financement (dépenser plus) vs **capacité** de financement (épargner).","Financement **direct** (marché financier : **actions** = propriété, **obligations** = dette) vs **indirect** (crédit bancaire).","Les **banques** créent de la monnaie ; la **BCE** régule via ses **taux directeurs**."],resources:[{kind:"video",label:"Le financement de l’économie",note:"Vidéos — recherche YouTube",url:M("financement direct indirect actions obligations banque première STMG économie")}],games:[{id:"p1-eco-t4-qcm",type:"qcm",title:"QCM — Le financement",icon:"❓",questions:[{q:"Un agent qui épargne a une…",choices:["capacité de financement","besoin de financement","dette obligatoire","obligation légale"],answer:0,explain:"Capacité de financement = épargne disponible ; besoin = dépenses > ressources."},{q:"Emprunter auprès d’une banque est un financement…",choices:["indirect (intermédié)","direct","interne","gratuit"],answer:0,explain:"La banque est l’intermédiaire ; le marché financier = direct."},{q:"Une action est…",choices:["un titre de propriété d’une entreprise","un titre de dette","un crédit bancaire","un impôt"],answer:0,explain:"Action = part de propriété ; obligation = titre de dette."},{q:"La BCE agit sur l’économie via…",choices:["ses taux directeurs","la TVA","le SWOT","les cotisations"],answer:0,explain:"Baisser les taux stimule le crédit ; les monter freine l’inflation."}]},{id:"p1-eco-t4-tri",type:"tri",title:"Tri — Financement direct ou indirect ?",icon:"🗂️",instruction:"Classe chaque mode de financement.",categories:[{id:"dir",label:"Direct (marché)"},{id:"ind",label:"Indirect (banque)"}],items:[{text:"Émettre des actions en Bourse",cat:"dir"},{text:"Un crédit bancaire",cat:"ind"},{text:"Émettre des obligations",cat:"dir"},{text:"Un emprunt auprès de sa banque",cat:"ind"}]},{id:"p1-eco-t4-flash",type:"flashcard",title:"Flashcards — Financement",icon:"🃏",cards:[{front:"Besoin / capacité de financement",back:"Dépenser plus que gagner / épargner."},{front:"Financement direct",back:"Marché financier : actions et obligations."},{front:"Financement indirect",back:"Crédit accordé par une banque."},{front:"Taux directeurs (BCE)",back:"Outil pour stimuler l’économie ou freiner l’inflation."}]}]},{id:"p1-eco-t5",name:"Thème 5 — Les marchés sont-ils concurrentiels ?",short:"Le marché",keywords:"marché offre demande prix d’équilibre élasticité-prix coût marginal concurrence parfaite imparfaite monopole oligopole barrières à l’entrée",intro:"Un **marché** est le lieu de rencontre de l’**offre** et de la **demande**. De leur confrontation naît le **prix d’équilibre**. Mais la concurrence est souvent **imparfaite**.",cours:[{h:"Offre, demande et prix d’équilibre",blocks:[{t:"p",c:"Le **prix d’équilibre** est le prix pour lequel la quantité offerte égale la quantité demandée. En général, quand le prix monte, l’**offre augmente** mais la **demande baisse** ; le marché ajuste le prix jusqu’à l’équilibre."}]},{h:"Élasticité et coût marginal",blocks:[{t:"p",c:"L’**élasticité-prix de la demande** mesure la **sensibilité de la demande à une variation de prix**. Si une hausse fait beaucoup baisser la demande, elle est **élastique** ; si elle change peu (produits de première nécessité), elle est **peu élastique**."},{t:"p",c:"Le **coût marginal** est le coût de production d’une **unité supplémentaire** : le producteur a intérêt à produire tant que le prix couvre ce coût."}]},{h:"Concurrence parfaite et imparfaite",blocks:[{t:"p",c:"La **concurrence pure et parfaite** suppose de nombreux vendeurs/acheteurs, des produits identiques, une information parfaite et une entrée libre. La réalité est souvent **imparfaite** :"},{t:"list",c:["**Monopole** (un seul vendeur) et **oligopole** (quelques vendeurs) → pouvoir sur les prix.","**Barrières à l’entrée** (coûts élevés, brevets, réglementation) → protègent les acteurs en place."]}]}],essentiel:["Le **prix d’équilibre** égalise quantité offerte et demandée.","**Élasticité-prix** = sensibilité de la demande au prix ; **coût marginal** = coût d’une unité supplémentaire.","Concurrence **imparfaite** : **monopole**, **oligopole**, **barrières à l’entrée**."],resources:[{kind:"video",label:"Marché, offre, demande, concurrence",note:"Vidéos — recherche YouTube",url:M("marché offre demande prix équilibre concurrence imparfaite première STMG")}],games:[{id:"p1-eco-t5-qcm",type:"qcm",title:"QCM — Le marché",icon:"❓",questions:[{q:"Le prix d’équilibre est celui pour lequel…",choices:["la quantité offerte = la quantité demandée","l’offre est nulle","la demande est infinie","le vendeur perd de l’argent"],answer:0,explain:"À l’équilibre, offre et demande s’égalisent."},{q:"Si un produit devient rare, son prix a tendance à…",choices:["augmenter","baisser","rester identique","disparaître"],answer:0,explain:"L’offre baisse alors que la demande reste forte → hausse du prix."},{q:"L’élasticité-prix de la demande mesure…",choices:["la sensibilité de la demande au prix","le coût d’une unité","le nombre de vendeurs","la marge"],answer:0,explain:"Forte sensibilité = demande élastique ; faible = peu élastique."},{q:"Un marché avec un seul vendeur est un…",choices:["monopole","oligopole","marché parfait","marché libre"],answer:0,explain:"Monopole = un vendeur ; oligopole = quelques-uns."},{q:"Les barrières à l’entrée…",choices:["freinent l’arrivée de nouveaux concurrents","garantissent la concurrence parfaite","baissent les prix","suppriment les monopoles"],answer:0,explain:"Coûts, brevets, réglementation protègent les acteurs en place."}]},{id:"p1-eco-t5-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"En concurrence pure et parfaite, les produits sont identiques.",answer:!0,explain:"Vrai : c’est l’une des hypothèses (homogénéité)."},{statement:"Un produit de première nécessité a une demande très élastique.",answer:!1,explain:"Faux : elle est peu élastique (on l’achète quel que soit le prix)."},{statement:"Le coût marginal est le coût d’une unité supplémentaire.",answer:!0,explain:"Vrai : on produit tant que le prix le couvre."}]},{id:"p1-eco-t5-flash",type:"flashcard",title:"Flashcards — Le marché",icon:"🃏",cards:[{front:"Prix d’équilibre",back:"Prix où quantité offerte = quantité demandée."},{front:"Élasticité-prix",back:"Sensibilité de la demande à une variation de prix."},{front:"Coût marginal",back:"Coût de production d’une unité supplémentaire."},{front:"Monopole / oligopole",back:"Un seul / quelques vendeurs (concurrence imparfaite)."}]}]}]},Th={id:"p1-maths",name:"Mathématiques",short:"Maths",icon:"🧮",color:"#2563eb",niveau:"premiere",tagline:"Maths appliquées à la gestion (contrôle continu).",chapters:[{id:"p1-math-c1",name:"Chapitre 1 — Information chiffrée",short:"Information chiffrée",keywords:"proportion pourcentage taux d’évolution coefficient multiplicateur évolutions successives réciproque",intro:"Proportions et évolutions sont partout en gestion. Ce chapitre apprend à les manier sans se tromper.",cours:[{h:"Proportion et taux d’évolution",blocks:[{t:"p",c:"Une **proportion** = partie / tout (× 100 pour un pourcentage). Ex. 15 filles sur 30 → 50 %."},{t:"formula",c:"t = (Valeur d’arrivée − Valeur de départ) / Valeur de départ · CM = 1 + t"},{t:"example",h:"Exemple",c:"Un prix passe de 200 € à 250 € → t = 50/200 = **+25 %** (CM = 1,25)."}]},{h:"Évolutions successives et réciproque",blocks:[{t:"p",c:"Pour enchaîner des évolutions, on **multiplie les CM** (jamais additionner les taux !). Ex. +20 % puis −10 % → 1,20 × 0,90 = 1,08 = **+8 %**."},{t:"warning",c:"Évolution réciproque : après +25 % (×1,25), pour revenir il faut ×(1/1,25) = 0,80, soit **−20 %** (et non −25 %)."}]}],essentiel:["t = (arrivée − départ) / départ ; **CM = 1 + t**.","Évolutions successives : on **multiplie les CM** (on n’additionne pas les taux).","Réciproque : CM réciproque = 1 / CM."],resources:[{kind:"video",label:"Taux d’évolution et coefficient multiplicateur",note:"Vidéos — recherche YouTube",url:M("taux évolution coefficient multiplicateur première STMG maths")}],games:[{id:"p1-math-c1-calc",type:"calcul",title:"Calcul express — Taux d’évolution",icon:"⚡",gen:"taux_evolution",count:5},{id:"p1-math-c1-calc2",type:"calcul",title:"Calcul express — Évolutions successives",icon:"⚡",gen:"cm_successif",count:5},{id:"p1-math-c1-qcm",type:"qcm",title:"QCM — Information chiffrée",icon:"❓",questions:[{q:"Un prix passe de 200 € à 250 €. Taux d’évolution ?",choices:["+25 %","+50 %","+20 %","+5 %"],answer:0,explain:"t = 50/200 = 0,25 = +25 %."},{q:"Le CM d’une baisse de 10 % est…",choices:["0,90","1,10","0,10","10"],answer:0,explain:"CM = 1 − 0,10 = 0,90."},{q:"+20 % puis −10 % donne au total…",choices:["+8 %","+10 %","−8 %","+30 %"],answer:0,explain:"1,20 × 0,90 = 1,08 → +8 %."}]}]},{id:"p1-math-c2",name:"Chapitre 2 — Suites numériques",short:"Suites",keywords:"suite arithmétique géométrique raison linéaire exponentielle",intro:"Une **suite** est une liste ordonnée de nombres. Deux modèles clés en gestion : arithmétique et géométrique.",cours:[{h:"Arithmétique et géométrique",blocks:[{t:"table",head:["Arithmétique","Géométrique"],rows:[["On ajoute la raison r","On multiplie par la raison q"],["u_n = u_0 + n × r","u_n = u_0 × q^n"],["Croissance linéaire","Croissance exponentielle"]]},{t:"example",h:"Exemple",c:"Capital 1 000 € placé à 3 %/an → q = 1,03, u_5 = 1 000 × 1,03⁵ ≈ **1 159 €**. Astuce : évolution en % fixe → suite **géométrique**."}]}],essentiel:["Arithmétique : **u_n = u_0 + n·r** (linéaire).","Géométrique : **u_n = u_0 × q^n** (exponentielle).","Évolution en % constant → suite **géométrique** (q = 1 + t)."],resources:[{kind:"video",label:"Suites arithmétiques et géométriques",note:"Vidéos — recherche YouTube",url:M("suites arithmétiques géométriques première STMG maths")}],games:[{id:"p1-math-c2-calc",type:"calcul",title:"Calcul express — Suite géométrique",icon:"⚡",gen:"suite_geo",count:5},{id:"p1-math-c2-qcm",type:"qcm",title:"QCM — Suites",icon:"❓",questions:[{q:"Un capital placé à taux fixe forme une suite…",choices:["géométrique","arithmétique","constante","aléatoire"],answer:0,explain:"Évolution en % constant → géométrique (q = 1 + t)."},{q:"Pour une suite arithmétique, u_n = …",choices:["u_0 + n·r","u_0 × q^n","u_0 − r","n × q"],answer:0,explain:"Suite arithmétique : on ajoute la raison r."},{q:"Un salaire de 1 500 € + 50 €/an au bout de 4 ans :",choices:["1 700 €","1 650 €","2 000 €","1 550 €"],answer:0,explain:"u_4 = 1 500 + 4×50 = 1 700 €."}]},{id:"p1-math-c2-flash",type:"flashcard",title:"Flashcards — Suites",icon:"🃏",cards:[{front:"Suite arithmétique",back:"On ajoute la raison r : u_n = u_0 + n·r."},{front:"Suite géométrique",back:"On multiplie par la raison q : u_n = u_0 × q^n."},{front:"Placement à t %",back:"Suite géométrique de raison q = 1 + t."}]}]},{id:"p1-math-c3",name:"Chapitre 3 — Second degré et fonctions",short:"Second degré",keywords:"polynôme second degré parabole sommet maximum minimum fonction inverse hyperbole",intro:"La fonction du **second degré** modélise beaucoup de situations d’optimisation (bénéfice max, coût min).",cours:[{h:"La parabole",blocks:[{t:"p",c:"f(x) = ax² + bx + c (a ≠ 0) a pour courbe une **parabole**."},{t:"list",c:["Si **a > 0** : parabole vers le haut (∪), la fonction a un **minimum**.","Si **a < 0** : parabole vers le bas (∩), la fonction a un **maximum**."]},{t:"p",c:"Le **sommet** donne l’extremum ; la courbe est symétrique par rapport à l’axe vertical passant par le sommet."}]}],essentiel:["f(x) = ax² + bx + c → **parabole**.","**a > 0** : minimum (∪) ; **a < 0** : maximum (∩).","Le **sommet** donne l’extremum ; sert à l’**optimisation**."],resources:[{kind:"video",label:"Fonctions du second degré",note:"Vidéos — recherche YouTube",url:M("fonction second degré parabole sommet première STMG maths")}],games:[{id:"p1-math-c3-qcm",type:"qcm",title:"QCM — Second degré",icon:"❓",questions:[{q:"La courbe de f(x) = ax² + bx + c est…",choices:["une parabole","une droite","un cercle","une hyperbole"],answer:0,explain:"Le second degré donne une parabole."},{q:"Si a < 0, la fonction du second degré a un…",choices:["maximum","minimum","ni max ni min","point d’inflexion"],answer:0,explain:"a < 0 : parabole vers le bas (∩) → maximum."},{q:"Le point qui donne l’extremum de la parabole est…",choices:["le sommet","l’origine","l’axe des x","le foyer"],answer:0,explain:"Le sommet donne le minimum ou le maximum."}]},{id:"p1-math-c3-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Si a > 0, la parabole est tournée vers le haut.",answer:!0,explain:"Vrai : ∪, la fonction a un minimum."},{statement:"La parabole n’a aucun axe de symétrie.",answer:!1,explain:"Faux : elle est symétrique par rapport à la verticale passant par le sommet."}]}]},{id:"p1-math-c4",name:"Chapitre 4 — Dérivation",short:"Dérivation",keywords:"nombre dérivé tangente dérivées signe variations extremum optimisation",intro:"La **dérivée** mesure comment une fonction varie. C’est l’outil de l’**optimisation**.",cours:[{h:"Nombre dérivé et variations",blocks:[{t:"p",c:"f’(a) est le **coefficient directeur de la tangente** en a. Équation de la tangente : y = f’(a)(x − a) + f(a)."},{t:"p",c:"Dérivées utiles : (constante)’ = 0 ; (x²)’ = 2x ; (ax² + bx + c)’ = **2ax + b**."},{t:"figure",name:"derivee"},{t:"list",c:["f’(x) > 0 → f **croissante** ; f’(x) < 0 → f **décroissante**.","f’(x) = 0 en changeant de signe → **extremum**."]},{t:"example",h:"Exemple",c:"f(x) = −2x² + 12x → f’(x) = −4x + 12, s’annule en x = 3 : maximum f(3) = **18**."}]}],essentiel:["f’(a) = pente de la **tangente** en a ; tangente : y = f’(a)(x − a) + f(a).","(ax² + bx + c)’ = **2ax + b**.","f’ > 0 croissante · f’ < 0 décroissante · f’ = 0 (change de signe) → extremum."],resources:[{kind:"video",label:"Dérivation et variations",note:"Vidéos — recherche YouTube",url:M("dérivation nombre dérivé signe variations première STMG maths")}],games:[{id:"p1-math-c4-calc",type:"calcul",title:"Calcul express — Nombre dérivé",icon:"⚡",gen:"derivee_affine",count:5},{id:"p1-math-c4-qcm",type:"qcm",title:"QCM — Dérivation",icon:"❓",questions:[{q:"La dérivée de ax² + bx + c est…",choices:["2ax + b","ax + b","2ax","a x² + b"],answer:0,explain:"(ax² + bx + c)’ = 2ax + b."},{q:"Si f’(x) > 0 sur un intervalle, alors f est…",choices:["croissante","décroissante","constante","négative"],answer:0,explain:"f’ > 0 ⇒ f croissante."},{q:"f(x) = −2x² + 12x. f’(x) s’annule en…",choices:["x = 3","x = 6","x = 12","x = 0"],answer:0,explain:"−4x + 12 = 0 ⇔ x = 3 (maximum)."}]}]},{id:"p1-math-c5",name:"Chapitre 5 — Statistiques à une variable",short:"Statistiques",keywords:"moyenne médiane quartiles étendue écart interquartile écart-type boîte à moustaches dispersion",intro:"On résume une série de données par des **indicateurs** de position et de dispersion.",cours:[{h:"Position et dispersion",blocks:[{t:"list",c:["**Position** : la **moyenne** (somme / effectif), la **médiane** (partage la série en deux), les **quartiles** Q1 et Q3.","**Dispersion** : l’**étendue** (max − min), l’**écart interquartile** (Q3 − Q1), l’**écart-type** (dispersion autour de la moyenne)."]},{t:"p",c:"Le **diagramme en boîte** (boîte à moustaches) visualise min, Q1, médiane, Q3, max. Deux séries de même moyenne mais d’écarts-types différents n’ont pas la même **homogénéité**."}]}],essentiel:["Position : **moyenne**, **médiane**, **quartiles** Q1/Q3.","Dispersion : **étendue**, **écart interquartile** (Q3 − Q1), **écart-type**.","La **boîte à moustaches** visualise min, Q1, médiane, Q3, max."],resources:[{kind:"video",label:"Statistiques : médiane, quartiles, écart-type",note:"Vidéos — recherche YouTube",url:M("statistiques médiane quartiles écart type boîte à moustaches première STMG")}],games:[{id:"p1-math-c5-qcm",type:"qcm",title:"QCM — Statistiques",icon:"❓",questions:[{q:"La valeur qui partage une série en deux moitiés est…",choices:["la médiane","la moyenne","l’étendue","le maximum"],answer:0,explain:"50 % des valeurs sont en dessous de la médiane."},{q:"L’écart interquartile est…",choices:["Q3 − Q1","max − min","la moyenne","Q1 + Q3"],answer:0,explain:"Il mesure la dispersion des 50 % centraux."},{q:"Plus l’écart-type est grand, plus les valeurs sont…",choices:["dispersées","égales","proches","nulles"],answer:0,explain:"L’écart-type mesure la dispersion autour de la moyenne."},{q:"La boîte à moustaches visualise…",choices:["min, Q1, médiane, Q3, max","seulement la moyenne","l’écart-type seul","la somme"],answer:0,explain:"Ce sont ses cinq repères."}]},{id:"p1-math-c5-flash",type:"flashcard",title:"Flashcards — Statistiques",icon:"🃏",cards:[{front:"Médiane",back:"Valeur qui partage la série en deux moitiés."},{front:"Écart interquartile",back:"Q3 − Q1 (dispersion des 50 % centraux)."},{front:"Écart-type",back:"Mesure la dispersion autour de la moyenne."}]}]},{id:"p1-math-c6",name:"Chapitre 6 — Probabilités",short:"Probabilités",keywords:"probabilité conditionnelle arbre pondéré indépendance variable aléatoire espérance",intro:"Les probabilités mesurent le **hasard**. Outils clés : la probabilité conditionnelle et l’espérance.",cours:[{h:"Conditionnelle, indépendance, espérance",blocks:[{t:"formula",c:"P_A(B) = P(A ∩ B) / P(A) · A et B indépendants ⇔ P(A ∩ B) = P(A) × P(B)"},{t:"p",c:"On visualise avec un **arbre pondéré** (on multiplie le long des branches ; la somme des branches d’un nœud vaut 1). Une **variable aléatoire** prend des valeurs selon le hasard ; son **espérance** E(X) = somme des (valeur × probabilité) est la « moyenne » attendue."},{t:"example",h:"Exemple",c:"60 % font anglais, dont 30 % font aussi espagnol → P(anglais ∩ espagnol) = 0,60 × 0,30 = **0,18**."}]}],essentiel:["**P_A(B) = P(A ∩ B) / P(A)** ; sur un arbre, on multiplie le long des branches.","Indépendance : **P(A ∩ B) = P(A) × P(B)**.","**E(X)** = somme des (valeur × probabilité) : la moyenne attendue."],resources:[{kind:"video",label:"Probabilités conditionnelles",note:"Vidéos — recherche YouTube",url:M("probabilités conditionnelles arbre espérance première STMG")}],games:[{id:"p1-math-c6-calc",type:"calcul",title:"Calcul express — Probabilités totales",icon:"⚡",gen:"proba_totale",count:5},{id:"p1-math-c6-qcm",type:"qcm",title:"QCM — Probabilités",icon:"❓",questions:[{q:"La probabilité conditionnelle P_A(B) vaut…",choices:["P(A ∩ B) / P(A)","P(A) × P(B)","P(A) + P(B)","P(B) − P(A)"],answer:0,explain:"Probabilité de B sachant A."},{q:"60 % font anglais, dont 30 % font espagnol. P(anglais et espagnol) ?",choices:["0,18","0,90","0,30","0,50"],answer:0,explain:"0,60 × 0,30 = 0,18."},{q:"A et B sont indépendants si…",choices:["P(A ∩ B) = P(A) × P(B)","P(A) = P(B)","P(A ∩ B) = 0","P(A) + P(B) = 1"],answer:0,explain:"Définition de l’indépendance."}]}]},{id:"p1-math-c7",name:"Chapitre 7 — Algorithmique et Python",short:"Python",keywords:"algorithme Python variable condition if else boucle for while fonction liste",intro:"On consolide les bases de la **programmation** en Python, pour automatiser des calculs et simuler le hasard.",cours:[{h:"Les briques de base",blocks:[{t:"list",c:["Les **variables** (stocker une valeur),","les **conditions** (`if / else`, pour faire des choix),","les **boucles** (`for`, `while`, pour répéter),","les **fonctions** (regrouper des instructions), les **listes** (stocker plusieurs valeurs)."]},{t:"p",c:"Applications : **simuler** une expérience aléatoire, calculer les termes d’une suite, automatiser un calcul répétitif."}]}],essentiel:["**Variables**, **conditions** (if/else), **boucles** (for/while), **fonctions**, **listes**.","Applications : simuler le hasard, calculer des suites, automatiser."],resources:[{kind:"video",label:"Python : bases (variables, boucles, conditions)",note:"Vidéos — recherche YouTube",url:M("python bases variables boucles conditions première STMG maths")}],games:[{id:"p1-math-c7-qcm",type:"qcm",title:"QCM — Python",icon:"❓",questions:[{q:"Pour répéter des instructions un nombre connu de fois, on utilise…",choices:["une boucle for","un if","une variable","une liste"],answer:0,explain:"La boucle for répète ; while répète tant qu’une condition est vraie."},{q:"`if / else` sert à…",choices:["faire un choix selon une condition","répéter à l’infini","stocker plusieurs valeurs","afficher une image"],answer:0,explain:"C’est l’instruction conditionnelle."},{q:"Une **liste** permet de…",choices:["stocker plusieurs valeurs","faire un seul calcul","créer une condition","arrêter le programme"],answer:0,explain:"La liste regroupe plusieurs valeurs."}]},{id:"p1-math-c7-flash",type:"flashcard",title:"Flashcards — Python",icon:"🃏",cards:[{front:"Variable",back:"Stocke une valeur."},{front:"Boucle (for / while)",back:"Répète des instructions."},{front:"Condition (if / else)",back:"Fait un choix selon une condition."},{front:"Liste",back:"Stocke plusieurs valeurs."}]}]}]},Rh={id:"p1-francais",name:"Français (EAF)",short:"Français",icon:"📚",color:"#7c3aed",niveau:"premiere",tagline:"La seule épreuve du bac dès la première (écrit + oral).",chapters:[{id:"p1-fr-1",name:"Objets d’étude & figures de style",short:"Objets d’étude",keywords:"poésie littérature d’idées roman théâtre figures de style métaphore personnification hyperbole anaphore ironie",intro:"Le programme repose sur **4 objets d’étude**, chacun associé à une **œuvre** et à un **parcours**. Pour analyser un texte, il faut repérer et **nommer** les procédés, puis expliquer leur **effet**.",cours:[{h:"Les 4 objets d’étude",blocks:[{t:"list",c:["**La poésie** (XIXe-XXIe) : travail du langage (images, sonorités, rythme).","**La littérature d’idées** (XVIe-XVIIIe) : textes qui défendent des idées, argumentent (humanisme, Lumières).","**Le roman et le récit** (Moyen Âge-XXIe) : l’art de raconter (personnages, intrigue, point de vue).","**Le théâtre** (XVIIe-XXIe) : le texte **et** sa représentation (dialogue, monologue, didascalies)."]},{t:"warning",c:"Un **programme national d’œuvres** est fixé chaque année et renouvelé par quart : **vérifie toujours la liste donnée par ton professeur** (elle change selon l’année)."}]},{h:"Les figures de style (boîte à outils)",blocks:[{t:"table",head:["Figure","Définition"],rows:[["Comparaison","Rapproche deux éléments avec un outil (« comme »)"],["Métaphore","Rapprochement sans outil (« une mer de larmes »)"],["Personnification","Donne des traits humains à une chose (« le vent murmure »)"],["Hyperbole","Exagération (« mourir de faim »)"],["Anaphore","Répétition en début de vers/phrase (insistance)"],["Antithèse / oxymore","Opposition d’idées / deux mots contradictoires (« soleil noir »)"],["Ironie","Dire le contraire de ce qu’on pense pour critiquer"]]},{t:"tip",c:"Toujours associer **le procédé + son effet** : « la personnification rend la nature vivante et crée une atmosphère mélancolique »."}]}],essentiel:["4 objets d’étude : **poésie, littérature d’idées, roman, théâtre** (chacun = 1 œuvre + 1 parcours).","La liste des **œuvres change chaque année** : se fier au professeur.","Analyser = **nommer le procédé + expliquer son effet**."],resources:[{kind:"video",label:"Les figures de style",note:"Vidéos — recherche YouTube",url:M("figures de style métaphore personnification hyperbole première français")}],games:[{id:"p1-fr-1-qcm",type:"qcm",title:"QCM — Figures de style",icon:"❓",questions:[{q:"« Le vent murmure » est une…",choices:["personnification","hyperbole","litote","anaphore"],answer:0,explain:"On donne un trait humain (murmurer) au vent."},{q:"« Une mer de larmes » est une…",choices:["métaphore","comparaison","ironie","antithèse"],answer:0,explain:"Rapprochement sans outil de comparaison → métaphore."},{q:"Dire le contraire de ce qu’on pense pour critiquer, c’est…",choices:["l’ironie","la métaphore","l’anaphore","l’hyperbole"],answer:0,explain:"L’ironie critique en disant l’inverse."},{q:"Combien d’objets d’étude au programme ?",choices:["4","3","6","8"],answer:0,explain:"Poésie, littérature d’idées, roman, théâtre."}]},{id:"p1-fr-1-assoc",type:"association",title:"Association — Figure ↔ définition",icon:"🔗",pairs:[{left:"Comparaison",right:"Rapprochement avec « comme »"},{left:"Hyperbole",right:"Exagération"},{left:"Anaphore",right:"Répétition en début de vers"},{left:"Oxymore",right:"Deux mots contradictoires côte à côte"}]},{id:"p1-fr-1-flash",type:"flashcard",title:"Flashcards — Objets d’étude",icon:"🃏",cards:[{front:"Poésie",back:"Travail du langage : images, sonorités, rythme."},{front:"Littérature d’idées",back:"Argumenter, défendre des idées (humanisme, Lumières)."},{front:"Roman et récit",back:"L’art de raconter (personnages, intrigue, point de vue)."},{front:"Théâtre",back:"Le texte et sa représentation (dialogue, didascalies)."}]}]},{id:"p1-fr-2",name:"Les épreuves & la méthode",short:"Épreuves & méthode",keywords:"EAF écrit commentaire contraction essai oral explication linéaire question de grammaire entretien",intro:"Le français se joue au bac **dès la première** : un **écrit (coef. 5)** et un **oral (coef. 5)**. La note récompense la **méthode**.",cours:[{h:"L’écrit (4 h, coef. 5) — voie technologique",blocks:[{t:"p",c:"Au **choix** entre deux sujets :"},{t:"list",c:["un **commentaire** de texte littéraire, OU","une **contraction de texte** (résumer au **¼**, fidèlement) **suivie d’un essai** (réflexion argumentée)."]},{t:"tip",c:"**Contraction** : respecter le sens et l’ordre des idées, garder le « je » de l’auteur, ne rien commenter. **Essai** : intro (reformuler la question), 2 parties argumentées, conclusion nuancée."}]},{h:"L’oral (coef. 5)",blocks:[{t:"list",c:["**Partie 1 (12 min)** : **explication linéaire** d’un texte du descriptif + une **question de grammaire**.","**Partie 2 (8 min)** : **présentation d’une œuvre** choisie + **entretien**."]},{t:"p",c:"**Explication linéaire** : expliquer le texte **dans l’ordre**, en analysant les procédés au fil de la lecture (sans plaquer un plan thématique)."}]}],essentiel:["Écrit (coef. 5) : **commentaire** OU **contraction (¼) + essai**.","Oral (coef. 5) : **explication linéaire** + question de grammaire, puis **présentation d’œuvre** + entretien.","Contraction : fidèle, ¼ du texte, garder le « je », ne pas commenter."],resources:[{kind:"video",label:"Méthode du commentaire et de la contraction",note:"Vidéos — recherche YouTube",url:M("méthode commentaire contraction essai EAF première voie technologique")}],games:[{id:"p1-fr-2-qcm",type:"qcm",title:"QCM — Les épreuves",icon:"❓",questions:[{q:"À l’écrit techno, la contraction est suivie…",choices:["d’un essai","d’un commentaire","d’une dictée","d’un exposé oral"],answer:0,explain:"Contraction + essai est l’un des deux sujets au choix."},{q:"La contraction réduit le texte à environ…",choices:["un quart","la moitié","un dixième","trois quarts"],answer:0,explain:"Environ ¼, fidèlement."},{q:"La première partie de l’oral est…",choices:["l’explication linéaire + une question de grammaire","une dissertation","une dictée","un débat"],answer:0,explain:"Puis présentation d’œuvre + entretien."},{q:"L’explication linéaire consiste à expliquer le texte…",choices:["dans l’ordre, au fil de la lecture","en le résumant","par un plan thématique","sans le lire"],answer:0,explain:"On suit le texte pas à pas."}]},{id:"p1-fr-2-flash",type:"flashcard",title:"Flashcards — Épreuves",icon:"🃏",cards:[{front:"Écrit EAF (techno)",back:"Commentaire OU contraction (¼) + essai."},{front:"Oral EAF",back:"Explication linéaire + question de grammaire, puis œuvre + entretien."},{front:"Contraction",back:"Résumer fidèlement au quart, sans commenter."},{front:"Explication linéaire",back:"Expliquer le texte dans l’ordre, au fil de la lecture."}]}]}]},Mh={id:"p1-histoire-geo",name:"Histoire-Géographie",short:"Histoire-Géo",icon:"🗺️",color:"#0891b2",niveau:"premiere",tagline:"Le long XIXe siècle · les recompositions du territoire.",chapters:[{id:"p1-hg-h1",name:"Histoire — La Révolution française et l’Empire (1789-1815)",short:"Révolution & Empire",keywords:"Révolution française 1789 monarchie absolue DDHC République Napoléon Empire 1804 1815 Code civil",intro:"En 1789, la Révolution met fin à la **monarchie absolue** et proclame des principes nouveaux qui bouleversent l’Europe.",cours:[{h:"La Révolution puis l’Empire",blocks:[{t:"p",c:"La **Révolution française (1789)** proclame **liberté, égalité, souveraineté de la nation** (Déclaration des droits de l’homme et du citoyen). Elle passe par plusieurs phases (monarchie constitutionnelle, République, Terreur)."},{t:"p",c:"**Napoléon Bonaparte** bâtit ensuite un **Empire (1804-1815)** qui réorganise la France (**Code civil**, administration) et diffuse — par la guerre — certains principes révolutionnaires en Europe."},{t:"table",head:["Date","Repère"],rows:[["1789","Révolution française (DDHC)"],["1792","Proclamation de la Ire République"],["1804","Napoléon empereur (Empire)"],["1815","Chute de Napoléon"]]}]}],essentiel:["**1789** : Révolution, DDHC (liberté, égalité, souveraineté de la nation).","**Napoléon** : Empire **1804-1815**, Code civil.","Repères : 1789 · 1792 · 1804 · 1815."],resources:[{kind:"video",label:"Révolution française et Empire",note:"Vidéos — recherche YouTube",url:M("Révolution française Empire Napoléon 1789 1815 première histoire")}],games:[{id:"p1-hg-h1-qcm",type:"qcm",title:"QCM — Révolution & Empire",icon:"❓",questions:[{q:"La Révolution française éclate en…",choices:["1789","1815","1848","1870"],answer:0,explain:"1789 : fin de la monarchie absolue, DDHC."},{q:"Le texte proclamant liberté et égalité en 1789 est…",choices:["la Déclaration des droits de l’homme et du citoyen","le Code civil","la Constitution de 1958","le traité de Rome"],answer:0,explain:"La DDHC de 1789."},{q:"Napoléon devient empereur en…",choices:["1804","1789","1848","1815"],answer:0,explain:"L’Empire : 1804-1815."},{q:"Le grand code juridique napoléonien est…",choices:["le Code civil","le Code du travail","le Code pénal européen","le RGPD"],answer:0,explain:"Le Code civil (1804) réorganise le droit."}]},{id:"p1-hg-h1-flash",type:"flashcard",title:"Flashcards — Repères",icon:"🃏",cards:[{front:"1789",back:"Révolution française, DDHC."},{front:"1792",back:"Ire République."},{front:"1804-1815",back:"Empire de Napoléon (Code civil)."}]}]},{id:"p1-hg-h2",name:"Histoire — La France au XIXe siècle",short:"La France au XIXe",keywords:"instabilité révolutions 1830 1848 IIe République suffrage universel masculin abolition esclavage industrialisation urbanisation",intro:"Après 1815, la France connaît une grande **instabilité politique** et une profonde **transformation sociale** liée à l’industrialisation.",cours:[{h:"Instabilité et transformations",blocks:[{t:"p",c:"Retour de la monarchie, puis **révolutions (1830, 1848)**. En **1848**, la **IIe République** instaure le **suffrage universel masculin** et **abolit l’esclavage**."},{t:"p",c:"Parallèlement, l’**industrialisation** transforme la société : **urbanisation**, essor de la **bourgeoisie** et d’une **classe ouvrière**, nouvelles **tensions sociales**."}]}],essentiel:["Après 1815 : **instabilité** (révolutions de 1830 et 1848).","**1848** : suffrage universel **masculin** + **abolition de l’esclavage**.","**Industrialisation** → urbanisation, bourgeoisie, classe ouvrière, tensions sociales."],resources:[{kind:"video",label:"La France au XIXe siècle",note:"Vidéos — recherche YouTube",url:M("France XIXe siècle 1848 industrialisation première histoire")}],games:[{id:"p1-hg-h2-qcm",type:"qcm",title:"QCM — La France au XIXe",icon:"❓",questions:[{q:"En 1848, la IIe République instaure…",choices:["le suffrage universel masculin","le suffrage des femmes","la monarchie absolue","l’Empire"],answer:0,explain:"1848 : suffrage universel masculin et abolition de l’esclavage."},{q:"Quel événement de 1848 concerne l’esclavage ?",choices:["son abolition","son rétablissement","son extension","aucun"],answer:0,explain:"L’esclavage est aboli en 1848."},{q:"L’industrialisation entraîne notamment…",choices:["l’urbanisation et une classe ouvrière","un retour à la campagne","la fin des villes","la disparition de la bourgeoisie"],answer:0,explain:"Urbanisation, bourgeoisie, ouvriers, tensions sociales."}]},{id:"p1-hg-h2-vf",type:"vraifaux",title:"Vrai / Faux rapide",icon:"⚡",questions:[{statement:"Le suffrage universel de 1848 incluait les femmes.",answer:!1,explain:"Faux : il était masculin."},{statement:"L’industrialisation a favorisé l’urbanisation.",answer:!0,explain:"Vrai : afflux vers les villes industrielles."}]}]},{id:"p1-hg-h3",name:"Histoire — La IIIe République et la Grande Guerre",short:"IIIe République & 1914-1918",keywords:"Troisième République laïcité école Ferry 1905 séparation empire colonial Première Guerre mondiale guerre totale",intro:"À partir de **1870**, la IIIe République s’enracine et associe la République à des valeurs concrètes, avant l’épreuve de la **Grande Guerre**.",cours:[{h:"La IIIe République puis la guerre totale",blocks:[{t:"p",c:"La **IIIe République** (à partir de **1870**) installe la **laïcité**, l’**école gratuite et obligatoire** (lois Ferry) et les libertés fondamentales (presse, syndicats). La France se dote aussi d’un vaste **empire colonial**."},{t:"p",c:"La **Première Guerre mondiale (1914-1918)** est une **guerre totale** : elle mobilise les sociétés entières (soldats, économie de guerre, civils, propagande)."},{t:"table",head:["Date","Repère"],rows:[["1870-1871","Début de la IIIe République"],["1905","Séparation des Églises et de l’État"],["1914-1918","Première Guerre mondiale"]]}]}],essentiel:["**IIIe République** (dès 1870) : laïcité, école gratuite/obligatoire (**lois Ferry**), empire colonial.","**1905** : séparation des Églises et de l’État.","**1914-1918** : Première Guerre mondiale, une **guerre totale**."],resources:[{kind:"video",label:"IIIe République et Première Guerre mondiale",note:"Vidéos — recherche YouTube",url:M("IIIe République Première Guerre mondiale guerre totale première histoire")}],games:[{id:"p1-hg-h3-qcm",type:"qcm",title:"QCM — IIIe République & Grande Guerre",icon:"❓",questions:[{q:"Les lois Ferry instaurent…",choices:["l’école gratuite et obligatoire","le suffrage des femmes","l’Empire","la monarchie"],answer:0,explain:"Laïcité et école gratuite/obligatoire sous la IIIe République."},{q:"La séparation des Églises et de l’État date de…",choices:["1905","1789","1870","1918"],answer:0,explain:"1905, un pilier de la laïcité."},{q:"La Première Guerre mondiale est qualifiée de guerre…",choices:["totale","éclair","froide","civile"],answer:0,explain:"Elle mobilise les sociétés entières (militaire, économique, morale)."}]},{id:"p1-hg-h3-flash",type:"flashcard",title:"Flashcards — Repères",icon:"🃏",cards:[{front:"Lois Ferry",back:"École gratuite, laïque et obligatoire (IIIe République)."},{front:"1905",back:"Séparation des Églises et de l’État."},{front:"Guerre totale",back:"Mobilisation militaire, économique et des esprits (1914-1918)."}]}]},{id:"p1-hg-g1",name:"Géographie — La métropolisation",short:"La métropolisation",keywords:"métropolisation métropoles fonctions de commandement inégalités processus différencié",intro:"La **métropolisation** est la concentration croissante des populations, des activités et des pouvoirs dans les grandes villes.",cours:[{h:"Un processus mondial différencié",blocks:[{t:"p",c:"Plus de la moitié de l’humanité vit en ville. Quelques **métropoles mondiales** (New York, Londres, Tokyo, Paris) concentrent richesse et **fonctions de commandement**, tandis que d’autres espaces restent en marge : le processus est **différencié** et accentue les **inégalités** entre territoires."}]}],essentiel:["**Métropolisation** = concentration des populations, activités et pouvoirs dans les métropoles.","Processus **différencié** : quelques métropoles dominent, d’autres espaces restent en marge.","Il accentue les **inégalités** territoriales (mondiale, nationale, locale)."],resources:[{kind:"video",label:"La métropolisation",note:"Vidéos — recherche YouTube",url:M("métropolisation processus mondial différencié première géographie")}],games:[{id:"p1-hg-g1-qcm",type:"qcm",title:"QCM — La métropolisation",icon:"❓",questions:[{q:"La métropolisation désigne…",choices:["la concentration des populations et activités dans les grandes villes","l’exode vers les campagnes","la disparition des villes","la fin de la mondialisation"],answer:0,explain:"Concentration des hommes, activités et fonctions de commandement."},{q:"On dit ce processus « différencié » car…",choices:["il ne touche pas tous les territoires de la même façon","il est identique partout","il concerne seulement Paris","il ne crée aucune inégalité"],answer:0,explain:"Certaines métropoles dominent, d’autres espaces sont en marge."},{q:"La métropolisation tend à…",choices:["accentuer les inégalités entre territoires","égaliser tous les territoires","vider les métropoles","supprimer les fonctions de commandement"],answer:0,explain:"Elle renforce les inégalités à toutes les échelles."}]},{id:"p1-hg-g1-flash",type:"flashcard",title:"Flashcards — Métropolisation",icon:"🃏",cards:[{front:"Métropolisation",back:"Concentration des populations, activités et pouvoirs dans les métropoles."},{front:"Fonctions de commandement",back:"Sièges, bourses, universités, aéroports internationaux."},{front:"Processus différencié",back:"Touche inégalement les territoires → inégalités."}]}]},{id:"p1-hg-g2",name:"Géographie — Espaces et acteurs de la production",short:"Espaces productifs",keywords:"espaces productifs mondialisation industrie services agriculture acteurs firmes multinationales État collectivités",intro:"Les **espaces productifs** se recomposent sous l’effet de la **mondialisation** et du numérique.",cours:[{h:"Une diversification des espaces et des acteurs",blocks:[{t:"p",c:"L’industrie se réorganise (délocalisations, **technopôles**), les **services** prennent une place croissante, l’agriculture se modernise. De nombreux **acteurs** interviennent : entreprises (dont les **firmes multinationales**), État, collectivités, acteurs locaux."}]}],essentiel:["Les **espaces productifs** se recomposent (mondialisation, numérique).","Montée des **services**, réorganisation de l’industrie (délocalisations, technopôles).","Acteurs multiples : **FMN**, État, collectivités, acteurs locaux."],resources:[{kind:"video",label:"Les espaces productifs",note:"Vidéos — recherche YouTube",url:M("espaces productifs acteurs mondialisation première géographie")}],games:[{id:"p1-hg-g2-qcm",type:"qcm",title:"QCM — Espaces productifs",icon:"❓",questions:[{q:"Les espaces productifs se recomposent surtout sous l’effet de…",choices:["la mondialisation et du numérique","la météo","la monarchie","la démographie seule"],answer:0,explain:"Mondialisation et numérique réorganisent la production."},{q:"Parmi les acteurs de la production :",choices:["les firmes multinationales et l’État","uniquement les touristes","seulement les agriculteurs","aucun acteur"],answer:0,explain:"FMN, État, collectivités, acteurs locaux."},{q:"Le secteur qui prend une place croissante est celui…",choices:["des services","de la chasse","de l’artisanat médiéval","de la monarchie"],answer:0,explain:"Tertiarisation : montée des services."}]},{id:"p1-hg-g2-flash",type:"flashcard",title:"Flashcards — Production",icon:"🃏",cards:[{front:"Espaces productifs",back:"Espaces où l’on produit biens et services."},{front:"Technopôle",back:"Concentration d’activités de haute technologie et de recherche."},{front:"FMN",back:"Firme multinationale, acteur clé de la production mondialisée."}]}]},{id:"p1-hg-g3",name:"Géographie — Les espaces ruraux",short:"Espaces ruraux",keywords:"espaces ruraux multifonctionnalité périurbanisation résidentielle touristique tensions",intro:"Les **espaces ruraux** ne sont plus seulement agricoles : ils remplissent désormais **plusieurs fonctions**.",cours:[{h:"Une multifonctionnalité croissante",blocks:[{t:"p",c:"Les espaces ruraux ont des fonctions **résidentielle, touristique, écologique, économique**. Certains, proches des villes, se **périurbanisent** (habitat pavillonnaire) ; d’autres, isolés, déclinent ou se tournent vers le tourisme. Cette **multifonctionnalité** crée des **tensions** (usage des sols, cohabitation d’activités)."}]}],essentiel:["Les espaces ruraux sont **multifonctionnels** (résidentiel, tourisme, écologie, économie).","**Périurbanisation** près des villes ; déclin ou tourisme dans les espaces isolés.","La multifonctionnalité crée des **tensions** (usage des sols)."],resources:[{kind:"video",label:"Les espaces ruraux",note:"Vidéos — recherche YouTube",url:M("espaces ruraux multifonctionnalité périurbanisation première géographie")}],games:[{id:"p1-hg-g3-qcm",type:"qcm",title:"QCM — Espaces ruraux",icon:"❓",questions:[{q:"Les espaces ruraux aujourd’hui sont…",choices:["multifonctionnels","uniquement agricoles","tous abandonnés","sans habitants"],answer:0,explain:"Résidentiel, touristique, écologique, économique."},{q:"Le développement de l’habitat pavillonnaire autour des villes s’appelle…",choices:["la périurbanisation","la métropolisation","la désertification","la littoralisation"],answer:0,explain:"La périurbanisation touche les espaces ruraux proches des villes."},{q:"La multifonctionnalité des espaces ruraux crée…",choices:["des tensions (usage des sols)","aucune difficulté","la fin de l’agriculture","la disparition du tourisme"],answer:0,explain:"Cohabitation d’activités → tensions."}]},{id:"p1-hg-g3-flash",type:"flashcard",title:"Flashcards — Ruralité",icon:"🃏",cards:[{front:"Multifonctionnalité",back:"Plusieurs fonctions : résidentielle, touristique, écologique, économique."},{front:"Périurbanisation",back:"Extension de l’habitat autour des villes."}]}]}]},Ah={id:"p1-langues",name:"Langues (Anglais / Espagnol)",short:"Langues",icon:"🗣️",color:"#db2777",niveau:"premiere",tagline:"Consolider les bases grammaticales (contrôle continu).",chapters:[{id:"p1-lng-en",name:"Anglais — Grammaire essentielle",short:"Anglais",keywords:"present simple continuous preterit present perfect futur modaux conditionnels comparatifs connecteurs",intro:"Quelques temps et structures reviennent sans cesse. La distinction **preterit / present perfect** est la difficulté majeure.",cours:[{h:"Les temps",blocks:[{t:"table",head:["Temps","Emploi","Exemple"],rows:[["Present simple","Habitude, vérité générale (+ -s à la 3e pers.)","She works in Paris"],["Present continuous (be + -ing)","Action en cours","They are working now"],["Preterit","Action passée datée et terminée","We went to London in 2019"],["Present perfect (have/has + PP)","Lien passé-présent (for, since, ever…)","I have visited London"]]},{t:"tip",c:"Une **date précise** (in 2019, yesterday) impose le **preterit** ; *for/since/ever/already/yet* appellent le **present perfect**."}]},{h:"Modaux, conditionnels, comparatifs",blocks:[{t:"list",c:["**Modaux** (+ base verbale) : can/could, may/might, must, have to, should.","**Conditionnels** : Type 1 *If + present, will + BV* ; Type 2 *If + preterit, would + BV*.","**Comparatifs** : cheaper / more expensive ; irréguliers good→better→best.","**Connecteurs** : however, therefore, because, although, moreover, for instance."]}]}],essentiel:["**Preterit** (daté) vs **present perfect** (lien passé-présent, for/since).","Modaux + **base verbale** ; conditionnel 2 : *If + preterit, would + BV*.","Comparatifs : -er / more… ; good → better → the best."],resources:[{kind:"video",label:"Present perfect vs preterit",note:"Vidéos — recherche YouTube",url:M("present perfect preterit anglais explication lycée")}],games:[{id:"p1-lng-en-trou",type:"trou",title:"Texte à trous — Conjugaison",icon:"✏️",questions:[{text:"She ____ (work) here since 2020.",answer:"has worked",explain:"Present perfect + since : « has worked »."},{text:"They ____ (watch) TV when I arrived.",answer:"were watching",explain:"Past continuous : action en cours interrompue."},{text:"If it ____ (rain), we will cancel.",answer:"rains",explain:"Conditionnel type 1 : If + present."}]},{id:"p1-lng-en-qcm",type:"qcm",title:"QCM — Grammaire anglaise",icon:"❓",questions:[{q:"« We ___ to London in 2019 » (date précise) :",choices:["went","have gone","go","are going"],answer:0,explain:"Date précise → preterit."},{q:"Conditionnel type 2 : « If I ___ rich, I would travel » :",choices:["were","am","will be","have been"],answer:0,explain:"If + preterit → would + BV."},{q:"Comparatif irrégulier de « good » :",choices:["better","gooder","more good","best"],answer:0,explain:"good → better → the best."}]},{id:"p1-lng-en-flash",type:"flashcard",title:"Flashcards — Temps",icon:"🃏",cards:[{front:"Present perfect",back:"have/has + PP : lien passé-présent (for, since)."},{front:"Preterit",back:"Action passée datée et terminée."},{front:"Conditionnel type 2",back:"If + preterit, would + base verbale."}]}]},{id:"p1-lng-es",name:"Espagnol — Grammaire essentielle",short:"Espagnol",keywords:"ser estar indefinido imperfecto perfecto futuro subjonctif gérondif gustar obligación a personnel",intro:"Deux difficultés majeures : **ser vs estar** et **indefinido vs imperfecto**.",cours:[{h:"Ser / Estar et les passés",blocks:[{t:"table",head:["SER","ESTAR"],rows:[["Caractéristique permanente, identité, profession, heure","État passager, lieu, situation"],["Soy estudiante · Es alto","Estoy cansado · Madrid está en España"]]},{t:"p",c:"**Indefinido** = action passée **datée** (« Ayer comí ») ; **imperfecto** = **description/habitude** (« Cuando era niño, jugaba ») ; **pretérito perfecto** (he/has/ha + participe) = passé récent lié au présent (« Hoy he comido »)."}]},{h:"Autres points clés",blocks:[{t:"list",c:["**Futur** : infinitif + -é, -ás, -á, -emos, -éis, -án (hablaré). Irréguliers : tener→tendré.","**Gustar** : « Me gusta el cine » / « Me gustan los libros » (accord avec la chose aimée).","**Obligation** : *tener que* + inf. (personnelle) ; *hay que* + inf. (impersonnelle).","Le **« a » personnel** devant un COD de personne (« Veo a María »)."]}]}],essentiel:["**Ser** = permanent ; **Estar** = état/lieu passager.","**Indefinido** = action datée ; **imperfecto** = décor/habitude.","**Gustar** : accord avec la chose aimée (gusta / gustan)."],resources:[{kind:"video",label:"Ser vs Estar ; indefinido vs imperfecto",note:"Vidéos — recherche YouTube",url:M("espagnol ser estar indefinido imperfecto lycée")}],games:[{id:"p1-lng-es-tri",type:"tri",title:"Tri — Ser ou Estar ?",icon:"🗂️",instruction:"Classe chaque phrase.",categories:[{id:"ser",label:"SER"},{id:"estar",label:"ESTAR"}],items:[{text:"Soy ___ estudiante (profession)",cat:"ser"},{text:"Estoy ___ cansado (état)",cat:"estar"},{text:"Madrid ___ en España (lieu)",cat:"estar"},{text:"Es ___ alto (caractéristique)",cat:"ser"},{text:"Son ___ las tres (heure)",cat:"ser"}]},{id:"p1-lng-es-trou",type:"trou",title:"Texte à trous — Passés & gustar",icon:"✏️",questions:[{text:"Ayer nosotros ____ (ir) al cine.",answer:"fuimos",alt:["fuímos"],explain:"Indefinido (action datée) : « fuimos »."},{text:"Cuando era niño, ____ (jugar) mucho.",answer:"jugaba",explain:"Imperfecto (habitude passée) : « jugaba »."},{text:"Me ____ (gustar) las películas de acción.",answer:"gustan",explain:"Accord avec le pluriel : « gustan »."}]},{id:"p1-lng-es-qcm",type:"qcm",title:"QCM — Grammaire espagnole",icon:"❓",questions:[{q:"« Madrid ___ en España » :",choices:["está","es","son","estar"],answer:0,explain:"Lieu → estar."},{q:"« Il faut étudier » se dit…",choices:["Hay que estudiar","Tengo estudiar","Es estudiar","Estar estudiar"],answer:0,explain:"Obligation impersonnelle : hay que + infinitif."},{q:"« Ayer ___ (comer) » se met à l’…",choices:["indefinido (comí)","imperfecto (comía)","futuro","présent"],answer:0,explain:"Action datée « ayer » → indefinido."}]}]},{id:"p1-lng-axes",name:"Les 8 axes culturels",short:"8 axes culturels",keywords:"axes culturels identités échanges espace privé public art pouvoir citoyenneté fictions innovations diversité mémoire médiation",intro:"Le programme s’organise autour de **8 axes culturels** (« Gestes fondateurs et mondes en mouvement ») et de **6 activités langagières**.",cours:[{h:"Les 8 axes",blocks:[{t:"list",c:["1. Identités et échanges — 2. Espace privé et espace public","3. Art et pouvoir — 4. Citoyenneté et mondes virtuels","5. Fictions et réalités — 6. Innovations scientifiques et responsabilité","7. Diversité et inclusion — 8. Territoire et mémoire"]},{t:"p",c:"**6 activités langagières** : compréhension orale/écrite, expression orale (continu et interaction), expression écrite, et **médiation** (reformuler, traduire ou expliquer un document)."}]}],essentiel:["**8 axes culturels** (thématique « Gestes fondateurs et mondes en mouvement »).","6 activités langagières, dont la **médiation**."],resources:[{kind:"video",label:"Les axes du programme de langues",note:"Vidéos — recherche YouTube",url:M("axes programme langues lycée gestes fondateurs mondes en mouvement")}],games:[{id:"p1-lng-axes-qcm",type:"qcm",title:"QCM — Les 8 axes",icon:"❓",questions:[{q:"Combien d’axes culturels au programme ?",choices:["8","6","4","10"],answer:0,explain:"Le programme compte 8 axes culturels."},{q:"La « médiation » consiste à…",choices:["reformuler / traduire / expliquer un document","apprendre par cœur","passer un test de grammaire","faire une dictée"],answer:0,explain:"Médiation = expliquer/traduire un document à quelqu’un."},{q:"« Citoyenneté et mondes virtuels » couvre notamment…",choices:["réseaux sociaux, fake news","la Guerre de Cent Ans","la TVA","la dérivation"],answer:0,explain:"C’est l’axe du numérique et de la citoyenneté."}]},{id:"p1-lng-axes-ordre",type:"ordre",title:"Remise en ordre — Les 4 premiers axes",icon:"🔢",instruction:"Remets les 4 premiers axes dans l’ordre officiel.",steps:["Identités et échanges","Espace privé et espace public","Art et pouvoir","Citoyenneté et mondes virtuels"],explain:"Les axes 1 à 4 dans l’ordre du programme."}]}]},Fh=[Sh,Eh,Nh,Ph,Th,Rh,Mh,Ah],P=e=>"https://www.youtube.com/results?search_query="+encodeURIComponent(e),Vh={"gf-t1":{essentiel:["La comptabilité en **partie double** : tout enregistrement respecte **débit = crédit**.","**TVA à décaisser = TVA collectée − TVA déductible** ; si déductible > collectée → **crédit de TVA**.","**Amortissement** (perte définitive) ≠ **dépréciation** (réversible) ; **VNC = valeur d’origine − amortissements cumulés**.","Les **4 principes** comptables : prudence · indépendance des exercices · continuité · permanence des méthodes."],intro:"Tout part d'une idée simple : une entreprise doit **garder la trace de tout ce qu'elle achète, vend, possède et doit**. La comptabilité est le langage qui traduit chaque opération en chiffres, pour savoir si l'entreprise gagne de l'argent et si elle est en bonne santé. Ce premier thème pose les **règles du jeu** : comment enregistrer une opération, comment fonctionne la TVA, comment tenir compte de l'usure du matériel (l'amortissement) et quels grands principes garantissent une information honnête.",cours:[{h:"À quoi sert la comptabilité ? Le système d'information comptable (SIC)",blocks:[{t:"p",c:"Chaque jour, une entreprise réalise des dizaines d'opérations : elle achète des matières, paie ses salariés, vend ses produits, règle des factures. Le **système d'information comptable (SIC)** est l'ensemble des outils et procédures qui **saisissent, classent et enregistrent** ces opérations afin d'en donner une **image fidèle** du patrimoine, de la situation financière et du résultat (article 120-1 du PCG)."},{t:"p",c:"Cette information a **deux usages**. *En interne*, elle aide les dirigeants à piloter et décider (Faut-il investir ? Embaucher ? Baisser les prix ?). *En externe*, elle sert de **preuve** vis-à-vis de l'administration fiscale, des banques et des associés, et de **base au calcul des impôts**."},{t:"list",c:["**PGI / ERP** : un progiciel de gestion intégré est un logiciel unique reposant sur une **base de données unique**. Une information saisie une seule fois circule partout (compta, stocks, paie) → moins d'erreurs, plus de fiabilité.","**Dématérialisation** : les factures deviennent électroniques, les traitements s'automatisent. L'humain ne disparaît pas : il **contrôle et valide**.","**Sécurité du SI** : quatre exigences — **D**isponibilité, **I**ntégrité, **C**onfidentialité, traçabilité.","**Cadre normatif** : l'**ANC** (Autorité des Normes Comptables) fixe les règles, réunies dans le **PCG** (Plan Comptable Général)."]},{t:"tip",c:"La comptabilité n'est pas qu'une contrainte administrative : c'est un **outil de décision**. Derrière chaque chiffre se cache une opération réelle."}]},{h:"La partie double et la chaîne comptable",blocks:[{t:"p",c:"Règle d'or de la comptabilité : la **partie double**. Toute opération est enregistrée sur **au moins deux comptes**, une fois au **débit**, une fois au **crédit**, pour un **montant total égal**. Autrement dit : **débit = crédit**, toujours."},{t:"example",h:"Un achat payé par banque",c:`Boisdéco achète du bois pour 1 000 € réglé par virement.
→ Le compte **Achats (601)** augmente de 1 000 € au **débit**.
→ Le compte **Banque (512)** diminue de 1 000 € au **crédit**.
Débit = crédit : l'équilibre est respecté.`},{t:"p",c:"Quelques comptes à connaître : **Achats (classe 6)**, **Ventes (classe 7)**, **Clients (411)**, **Fournisseurs (401)**, **Banque (512)**, **immobilisations (classe 2)**."},{t:"p",c:"Une opération suit une **chaîne** jusqu'aux comptes annuels :"},{t:"formula",c:"Pièce justificative → Journal → Grand livre → Balance → Documents de synthèse (bilan, compte de résultat, annexe)"},{t:"list",c:["**Lettrage** : on relie une facture à son règlement pour vérifier que les clients ont bien payé.","**Rapprochement bancaire** : on compare le compte « Banque » de l'entreprise au **relevé** envoyé par la banque."]}]},{h:"La TVA : l'entreprise, simple collecteur pour l'État",blocks:[{t:"p",c:"La **TVA** (taxe sur la valeur ajoutée) est un impôt payé par le **consommateur final**. L'entreprise ne fait que la **collecter** sur ses ventes puis la **reverser** à l'État, après avoir déduit la TVA qu'elle a elle-même payée sur ses achats."},{t:"formula",c:"TVA à décaisser = TVA collectée (sur ventes) − TVA déductible (sur achats + immobilisations)"},{t:"figure",name:"tva"},{t:"example",h:"Mois de mars (Boisdéco, taux 20 %)",c:`Ventes HT = 90 000 € ; achats de matières HT = 40 000 € ; achat d'une machine HT = 15 000 €.
• TVA collectée = 90 000 × 20 % = **18 000 €**
• TVA déductible = (40 000 + 15 000) × 20 % = **11 000 €**
• TVA à décaisser = 18 000 − 11 000 = **7 000 €**
→ L'entreprise **doit 7 000 €** à l'État.`},{t:"warning",c:"La TVA n'est **ni une charge ni un produit** : elle ne fait que transiter par l'entreprise, ce n'est pas un bénéfice. Si la TVA déductible **dépasse** la collectée, on obtient un **crédit de TVA** : c'est l'État qui doit de l'argent à l'entreprise."},{t:"p",c:"Sur une **facture de doit**, on applique les **réductions commerciales** (rabais, remise, ristourne) puis on ajoute la TVA. Une **facture d'avoir** corrige ou annule une facture (retour de marchandise, geste commercial)."}]},{h:"Investir et amortir : le coût de l'usure",blocks:[{t:"p",c:"Quand l'entreprise achète un bien **durable** (machine, véhicule, ordinateur), ce n'est pas une charge de l'année mais une **immobilisation** (classe 2), inscrite à l'**actif**. Une dépense **consommée** dans l'année (électricité, fournitures) est au contraire une **charge** (classe 6)."},{t:"p",c:"L'**amortissement** répartit le coût de l'immobilisation sur sa **durée d'utilisation**, pour refléter sa perte de valeur (usure, obsolescence)."},{t:"formula",c:"Taux linéaire = 1 / durée · Annuité = valeur × taux · VNC = valeur d'origine − amortissements cumulés"},{t:"example",h:"Une machine amortie en linéaire",c:`Machine : 15 000 € HT, durée 5 ans, mise en service le **01/04/N**.
• Taux = 1/5 = **20 %** → annuité pleine = 15 000 × 20 % = **3 000 €**
• 1re année, **prorata temporis** (9 mois sur 12) : 3 000 × 9/12 = **2 250 €**
• VNC au 31/12/N = 15 000 − 2 250 = **12 750 €**`},{t:"tip",c:"La 1re année, n'oublie jamais le **prorata temporis** : on ne compte que les mois d'utilisation, à partir de la **date de mise en service**."}]},{h:"Communiquer une information fidèle : principes et inventaire",blocks:[{t:"p",c:"À la clôture de l'exercice (12 mois), on réalise l'**inventaire** : on recense et valorise ce que possède l'entreprise, ce qui donne lieu à des **écritures d'ajustement** (stocks, amortissements, dépréciations, cessions)."},{t:"p",c:"Quatre **principes comptables** garantissent une information honnête :"},{t:"table",head:["Principe","Ce qu'il impose"],rows:[["Prudence","Ne pas surévaluer l'actif ni le résultat ; anticiper les pertes probables."],["Indépendance des exercices","Rattacher chaque charge et produit au bon exercice."],["Continuité de l'exploitation","Comptabiliser en supposant que l'entreprise poursuivra son activité."],["Permanence des méthodes","Garder les mêmes méthodes d'un exercice à l'autre pour pouvoir comparer."]]},{t:"warning",c:"Ne confonds pas **amortissement** (perte de valeur **définitive**, ex. l'usure d'une machine) et **dépréciation** (perte de valeur **réversible**, ex. un stock qui pourrait se revendre plus tard)."},{t:"p",c:"Enfin, l'**annexe** est un document de synthèse qui **explicite** le bilan et le compte de résultat (méthodes retenues, détails utiles à la compréhension)."}]}],resources:[{kind:"video",label:"Le mécanisme de la TVA expliqué",note:"Vidéos — recherche YouTube",url:P("mécanisme TVA collectée déductible à décaisser terminale STMG")},{kind:"video",label:"L'amortissement linéaire (méthode + calcul)",note:"Vidéos — recherche YouTube",url:P("amortissement linéaire annuité VNC prorata temporis STMG")},{kind:"video",label:"La partie double et la chaîne comptable",note:"Vidéos — recherche YouTube",url:P("partie double débit crédit journal grand livre STMG gestion finance")}]},"gf-t2":{essentiel:["Cascade des SIG : **Marge → VA → EBE → Résultat d’exploitation → RCAI → Résultat net**.","**EBE = VA + subventions d’exploitation − impôts et taxes − charges de personnel**.","**FRNG = ressources stables − emplois stables** ; **BFR = actif circ. − passif circ. d’exploitation** ; **Trésorerie nette = FRNG − BFR**.","Rentabilité **économique** (Rés. expl. / capitaux investis) ≠ **financière** (Rés. net / capitaux propres) ; **effet de levier** favorable si rentabilité éco. > coût de la dette."],intro:"Après avoir enregistré les opérations, on passe à l'**analyse** : l'entreprise est-elle **performante** ? est-elle **solide** ? Ce thème, le plus fréquent au bac, apprend à lire les résultats (les SIG, l'EBE, la CAF), à mesurer la **rentabilité** et à diagnostiquer la **structure financière** grâce au bilan fonctionnel (FRNG, BFR, trésorerie). L'objectif n'est pas de calculer pour calculer, mais d'**interpréter** ce que disent les chiffres.",cours:[{h:"Mesurer la performance : les Soldes Intermédiaires de Gestion (SIG)",blocks:[{t:"p",c:"Le compte de résultat peut être « découpé » en plusieurs **paliers** : les **SIG**. On part du chiffre d'affaires et, étage par étage, on retire des charges pour comprendre **d'où vient le résultat**."},{t:"formula",c:"Marge commerciale → Valeur ajoutée → EBE → Résultat d'exploitation → RCAI → Résultat net"},{t:"figure",name:"sig-cascade"},{t:"list",c:["**Valeur ajoutée (VA)** = ce que l'entreprise crée réellement = marge commerciale + production − consommations en provenance des tiers.","**EBE (excédent brut d'exploitation)** = VA + subventions d'exploitation − impôts et taxes − charges de personnel. C'est la **richesse dégagée par l'activité seule**, avant amortissements et financement.","**Résultat d'exploitation** = EBE − dotations (+ autres produits/charges).","**Résultat net** = ce qui reste vraiment, après le financier, l'exceptionnel et l'impôt."]},{t:"example",h:"De la VA au résultat net",c:`Production vendue 520 000 € ; consommations 210 000 € ; subventions 5 000 € ; impôts et taxes 8 000 € ; charges de personnel 190 000 € ; dotations 40 000 € ; résultat financier −6 000 € ; IS 15 000 €.
• VA = 520 000 − 210 000 = **310 000 €**
• EBE = 310 000 + 5 000 − 8 000 − 190 000 = **117 000 €**
• Résultat d'exploitation = 117 000 − 40 000 = **77 000 €**
• Résultat net = 77 000 − 6 000 − 15 000 = **56 000 €**`}]},{h:"La CAF : la ressource dégagée par l'activité",blocks:[{t:"p",c:"La **capacité d'autofinancement (CAF)** mesure l'argent que l'entreprise **génère par son activité** et qu'elle pourra utiliser pour **investir, rembourser ses emprunts ou verser des dividendes**."},{t:"formula",c:"CAF (méthode additive) = Résultat net + dotations − reprises + VNC des éléments cédés − produits de cession"},{t:"example",h:"Calcul rapide",c:`Résultat net = 56 000 € ; dotations = 40 000 € ; pas de reprise ni de cession.
CAF = 56 000 + 40 000 = **96 000 €**.`},{t:"tip",c:"Les **dotations aux amortissements** sont des charges **calculées** (pas de sortie d'argent) : on les **rajoute** au résultat pour retrouver la trésorerie potentielle générée."}]},{h:"Profitabilité, rentabilité et effet de levier",blocks:[{t:"p",c:"Attention à ne pas tout mélanger : **profitabilité** et **rentabilité** ne mesurent pas la même chose."},{t:"table",head:["Indicateur","Formule","Ce qu'il mesure"],rows:[["Profitabilité","Résultat / Chiffre d'affaires","Combien rapporte 1 € de vente"],["Rentabilité économique","Résultat d'exploitation / capitaux investis","L'efficacité de l'outil (vision du dirigeant)"],["Rentabilité financière","Résultat net / capitaux propres","Le rendement pour l'associé"]]},{t:"p",c:"**L'effet de levier** explique l'intérêt de s'endetter. Si la **rentabilité économique** est **supérieure au coût de la dette**, emprunter **augmente** la rentabilité financière : l'argent emprunté rapporte plus qu'il ne coûte."},{t:"warning",c:"L'effet peut se retourner : si la rentabilité économique passe **sous** le taux d'intérêt, la dette **détruit** de la rentabilité — c'est l'**effet de massue**."}]},{h:"La structure financière : le bilan fonctionnel",blocks:[{t:"p",c:"Le bilan fonctionnel classe les ressources et les emplois selon qu'ils sont **stables** (long terme) ou liés au **cycle d'exploitation** (court terme). Trois indicateurs clés en découlent."},{t:"formula",c:"FRNG = Ressources stables − Emplois stables"},{t:"formula",c:"BFR = Actif circulant d'exploitation − Passif circulant d'exploitation"},{t:"formula",c:"Trésorerie nette = FRNG − BFR = Trésorerie active − Trésorerie passive"},{t:"figure",name:"bilan"},{t:"example",h:"Lire l'équilibre financier",c:`Ressources stables 380 000 ; emplois stables 300 000 ; actif circ. d'exploit. 160 000 ; passif circ. d'exploit. 70 000.
• FRNG = 380 000 − 300 000 = **80 000 €**
• BFR = 160 000 − 70 000 = **90 000 €**
• Trésorerie nette = 80 000 − 90 000 = **− 10 000 €**
→ Le FRNG ne couvre pas tout le BFR : la trésorerie est **négative** (découvert). Il faudrait **réduire le BFR** ou **augmenter le FRNG**.`},{t:"tip",c:"Bonne santé = **FRNG > BFR** → trésorerie positive. Le **BFR** représente l'argent « immobilisé » dans les stocks et les créances clients, en attendant d'être encaissé."}]},{h:"Les ratios et leurs limites",blocks:[{t:"list",c:["**Rotation des stocks** = (stock moyen / coût d'achat des marchandises vendues) × 360.","**Délai clients** = (créances clients TTC / CA TTC) × 360 — combien de jours pour être payé.","**Délai fournisseurs** = (dettes fournisseurs TTC / achats TTC) × 360.","**Indépendance financière** = dettes financières / capitaux propres.","**Capacité de remboursement** = dettes financières / CAF (idéalement < 3-4 ans)."]},{t:"warning",c:"Un ratio seul ne veut rien dire : l'analyse est **statique** et sensible aux choix comptables. Il faut **comparer dans le temps** (évolution) et **dans l'espace** (concurrents, secteur)."}]}],resources:[{kind:"video",label:"Les SIG, l'EBE et la CAF",note:"Vidéos — recherche YouTube",url:P("SIG EBE CAF soldes intermédiaires de gestion terminale STMG")},{kind:"video",label:"Bilan fonctionnel : FRNG, BFR, trésorerie",note:"Vidéos — recherche YouTube",url:P("bilan fonctionnel FRNG BFR trésorerie nette STMG")},{kind:"video",label:"Rentabilité et effet de levier",note:"Vidéos — recherche YouTube",url:P("rentabilité économique financière effet de levier STMG")}]},"gf-t3":{essentiel:["Financements **internes** (autofinancement/CAF) vs **externes** (emprunt, augmentation de capital, subventions).","**MCV = CA − charges variables** ; **taux de MCV = MCV / CA**.","**Seuil de rentabilité = charges fixes / taux de MCV** ; au seuil, le résultat est **nul** ; le **point mort** en est la date.","**Réserve légale** : 5 % du bénéfice jusqu’à 10 % du capital."],intro:"Dernière étape : la comptabilité au service de la **décision**. Comment **financer** un projet ? Comment garder une **trésorerie** saine ? Que faire du **bénéfice** ? Et surtout, à partir de quel niveau de ventes l'entreprise devient-elle **rentable** ? Ce thème mobilise les **coûts** et le célèbre **seuil de rentabilité**.",cours:[{h:"Financer l'activité et les investissements",blocks:[{t:"p",c:"Pour investir, une entreprise dispose de deux grandes sources de financement."},{t:"table",head:["Financements internes","Financements externes"],rows:[["Autofinancement (la CAF)","Emprunt bancaire"],["Apports en compte courant d'associés","Augmentation de capital"],["—","Crowdfunding, subventions"]]},{t:"p",c:"Le choix se fait selon plusieurs **critères** : le coût, le niveau d'endettement déjà atteint, le **pouvoir** laissé aux associés (une augmentation de capital dilue le contrôle) et l'attractivité du projet."}]},{h:"Optimiser la trésorerie",blocks:[{t:"p",c:"La **trésorerie** est le nerf de la guerre : une entreprise rentable peut faire faillite si elle manque de liquidités au mauvais moment."},{t:"list",c:["Le **budget de trésorerie** prévoit, **mois par mois**, les encaissements et les décaissements.","Pour l'améliorer : **réduire le BFR** (encaisser plus vite, négocier les délais fournisseurs, alléger les stocks), recourir au découvert, **placer les excédents**."]}]},{h:"Affecter le résultat",blocks:[{t:"p",c:"Quand l'exercice dégage un bénéfice, les associés décident de sa **répartition**."},{t:"list",c:["**Réserve légale** : obligatoire, 5 % du bénéfice jusqu'à atteindre 10 % du capital.","**Réserves** statutaires ou facultatives (mises de côté pour l'entreprise).","**Dividendes** : la part distribuée aux associés.","**Report à nouveau** : la part non affectée, reportée sur l'exercice suivant."]},{t:"tip",c:"Tout l'arbitrage tient en une phrase : **garder** pour financer l'entreprise (réserves = autofinancement) ou **distribuer** pour rémunérer les associés (dividendes)."}]},{h:"Analyser les coûts et trouver le seuil de rentabilité",blocks:[{t:"p",c:"On distingue les **charges variables** (qui dépendent de l'activité : matières, énergie de production) des **charges fixes** (indépendantes du volume : loyer, assurance)."},{t:"formula",c:"MCV (marge sur coût variable) = CA − charges variables · Taux de MCV = MCV / CA"},{t:"formula",c:"Seuil de rentabilité = charges fixes / taux de MCV"},{t:"figure",name:"seuil"},{t:"example",h:"Le seuil de rentabilité de Boisdéco",c:`CA = 300 000 € ; charges variables = 180 000 € ; charges fixes = 96 000 €.
• MCV = 300 000 − 180 000 = **120 000 €** ; taux de MCV = 120 000 / 300 000 = **0,40**
• Seuil = 96 000 / 0,40 = **240 000 €** de CA
